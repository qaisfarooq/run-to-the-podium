    for (let k = 0; k <= n; k++) {
      const i = k % M;
      const d = angDiff(pts[(i + W2) % M].ang, pts[(i - W2 + M) % M].ang) * side;
      if (d <= 1e-5) continue;                    // bends away from this side, or not at all
      worst = Math.min(worst, (2 * W2 * step) / d);
    }
    return worst;
  };


  /* Not folding comes FIRST, ahead of how much room the lane has — which is the
     opposite of what the score alone would say, and deliberately so. Brazil's
     inside-of-the-hairpin lane measured seventy-five units of clearance against
     the thirty-three of the sensible side, and won on that number every time
     while being a road that turned inside out. Room is worth having; being a
     road at all is worth more.

     Candidates are ranked on five things in strict order, because they are not
     worth trading against one another:

       1. does it fold          a lane that turns inside out is not a road
       2. is it on the tarmac   the pit lane may never share the racing surface
       3. is it in the runoff   nor inside another part of the lap's corridor
       4. how long it is        the garages have to fit down it
       5. how far out it sits   the tie-break, as before

     Three and four sit in that order and still give full length wherever it is
     available, because a breach is measured as how far PAST clear it is and so
     every clear candidate ties at zero — at which point the longest wins.
     Shortening is only what happens when nothing at full length is clear, which
     is the escape hatch a circuit like Brazil needs to stop its garages running
     on through the corner after next.

     Australia is the case none of it can save: its road plus runoff is already
     as wide as the tightest bend's radius there, so every candidate folds and
     the reshaping below is what makes a road of it. */
  const onTarmacAt = laneHalf + o.halfWidth;
  let pitSide = 1, pitOffMul = 1, pitLenMul = 1, best = null;
  for (const sgn of [1, -1]) {
    for (const lenMul of [1, 0.85, 0.7]) {
      const radius = bendRadius(sgn, lenMul);
      for (const mul of [1, 0.85, 0.7, CONFIG.pitMinOffMul]) {
        const clear = laneClearance(sgn, mul, lenMul);
        if (clear == null) continue;              // would hang outside the world
        const off = o.halfWidth + o.runoff + CONFIG.pitLaneOffset * pitK * mul;
        const cand = { folds: radius < off * 1.05,
                       tarmac: Math.min(0, clear - onTarmacAt),
                       runoff: Math.min(0, clear - needClear),
                       lenMul, mul, sgn };
        const better = !best
          ? true
          : best.folds  !== cand.folds  ? best.folds
          : best.tarmac !== cand.tarmac ? cand.tarmac > best.tarmac
          : best.runoff !== cand.runoff ? cand.runoff > best.runoff
          : best.lenMul !== cand.lenMul ? cand.lenMul > best.lenMul
          : cand.mul > best.mul;
        if (better) best = cand;
      }
    }
  }
  if (best) { pitSide = best.sgn; pitOffMul = best.mul; pitLenMul = best.lenMul; }
  const laneN = laneNFor(pitLenMul);
  const ramp  = rampFor(laneN);

  // 8. the pit lane: a real ribbon running alongside the start/finish straight.
  //    It shares the centreline's samples, so a car in the lane still has the
  //    same nearest sample as one on track and lap counting needs no special
  //    case. The offset eases in and out rather than stepping sideways.
  const laneOff = (o.halfWidth + o.runoff + CONFIG.pitLaneOffset * pitK * pitOffMul) * pitSide;
  const lane = [];
  for (let k = 0; k <= laneN; k++) {
    const i = k % M;
    const t = k < ramp ? k / ramp : k > laneN - ramp ? (laneN - k) / ramp : 1;
    const e = t * t * (3 - 2 * t);                 // smoothstep in and out
    const s0 = pts[i];
    lane.push({ x: s0.x + s0.nx * laneOff * e, y: s0.y + s0.ny * laneOff * e,
                srcIdx: i, off: laneOff * e, e,
                // where the plain offset wanted this point, to spring back to
                ix: s0.x + s0.nx * laneOff * e, iy: s0.y + s0.ny * laneOff * e });
  }

  /* Sideways is not far enough.

     A curve pushed sideways by more than its own radius of curvature turns
     inside out. The lane above is exactly that push, and the start line sits at
     the end of the longest straight — which means the lane runs FORWARD off that
     straight and into whatever the circuit does next. Where that was a corner
     turning toward the pits tighter than the lane is far out, the offset folded
     back through itself: the road crossed its own path, the garages behind it
     piled into a fan, and a car driving the lane was walked backwards through
     the wall for a few frames before carrying on. Australia doubled back three
     times. Eight circuits did it at all.

     There is no offset distance that fixes it, because the fault is the offset
     itself. So the lane is relaxed into shape instead, under three forces:

       smoothing   pulls the ribbon taut, which is what takes the folds out and
                   is also what a real pit lane looks like — it cuts the chord
                   of a corner complex rather than tracing every bend of it
       the spring  holds each point near where the plain offset put it, so the
                   lane still runs ALONGSIDE the circuit instead of taking the
                   short way across the infield
       clearance   pushes any point that has come too near the racing surface
                   back out, hard below the floor and gently above it

     The two ends are pinned. They sit on the centreline, where the lane is
     welded to the track, and moving them would move the pit entry and exit. */
  const laneFloor = o.halfWidth + o.runoff + laneHalf + 2 * pitK;  // never nearer than this
  const laneWant  = Math.abs(laneOff);                             // and ideally this far out
  for (let iter = 0; iter < 60; iter++) {
    for (let k = 1; k < lane.length - 1; k++) {
      const p = lane[k], a = lane[k - 1], b = lane[k + 1];
      p.x += ((a.x + b.x) / 2 - p.x) * 0.55 + (p.ix - p.x) * 0.03;
      p.y += ((a.y + b.y) / 2 - p.y) * 0.55 + (p.iy - p.y) * 0.03;
    }
    for (let k = 1; k < lane.length - 1; k++) {
      const p = lane[k];
      /* Every sample of the lap gets a say, not just the closest one. Pushing
         away from the nearest piece of road is what you want in open ground and
         exactly wrong in a corridor: Brazil's lane, shoved clear of the bend it
         runs beside, went straight through the tarmac on the far side of it.
         Answering to all of them at once leaves a point squeezed between two
         parts of the lap sitting in the gap, which is where it belongs.

         The stretch the lane is drawn from is asked for the full offset, eased
         at the ends where the lane is deliberately welded to the racing line.
         Anywhere else on the lap is a different piece of road that the lane
         must simply not touch, ramp or no ramp. */
      let dx = 0, dy = 0;
      for (let j = 0; j < M; j++) {
        const d = Math.hypot(pts[j].x - p.x, pts[j].y - p.y);
        if (d < 1e-6) continue;
        const along = Math.min(Math.abs(j - p.srcIdx), M - Math.abs(j - p.srcIdx));
        const near = along < ignoreAlong;
        const want = near ? laneWant * p.e : needClear;
        if (d >= want) continue;
        const floor = near ? laneFloor * p.e : needClear;
        const push = (want - d) * (d < floor ? 1 : 0.25);
        dx += (p.x - pts[j].x) / d * push;
        dy += (p.y - pts[j].y) / d * push;
      }
      /* The garages stand off the far edge of the lane, and they are the widest
         part of the complex — a lane with room to spare can still have its back
         wall standing in the middle of another straight. So the wall is carried
         through the same test and its trouble handed back to the lane, which is
         the only thing here that can move. */
      const a = lane[k - 1], b = lane[k + 1];
      const tl = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const nx = -(b.y - a.y) / tl * pitSide, ny = (b.x - a.x) / tl * pitSide;
      const reach = (laneHalf + wallOut) * p.e;
      const wx2 = p.x + nx * reach, wy2 = p.y + ny * reach;
      for (let j = 0; j < M; j++) {
        const along = Math.min(Math.abs(j - p.srcIdx), M - Math.abs(j - p.srcIdx));
        if (along < ignoreAlong) continue;      // the stretch it deliberately runs beside
        const d = Math.hypot(pts[j].x - wx2, pts[j].y - wy2);
        if (d >= needClear || d < 1e-6) continue;
        const push = needClear - d;
        dx += (wx2 - pts[j].x) / d * push;
        dy += (wy2 - pts[j].y) / d * push;
      }
      p.x += dx; p.y += dy;
    }
  }

  // Where the lane ENDED UP, measured out from the sample it was drawn from.
  // It was set to where the plain offset asked for it, and the reshaping above
  // has moved it since; anything reading the lane's distance off the racing
  // line wants the truth rather than the request.
  for (const p of lane) {
    const s0 = pts[p.srcIdx];
    p.off = (p.x - s0.x) * s0.nx + (p.y - s0.y) * s0.ny;
  }

  /* Taut is shorter than the road it was drawn from, so the points arrive
     bunched — and a run of points a hundredth of a unit apart has no reliable
     direction in it, which is a heading that spins on the spot and a car that
     spins with it. Drop anything that has piled up or turned back, then lay the
     survivors out again at even spacing: one clean pass and the lane has a
     usable tangent everywhere along it. `srcIdx` is carried across because lap
     counting reads it — a car in the lane is still somewhere on the lap. */
  const keep = [lane[0]];
  for (let k = 1; k < lane.length; k++) {
    const p = lane[k], q = keep[keep.length - 1];
    const d = Math.hypot(p.x - q.x, p.y - q.y);
    if (k < lane.length - 1 && d < step * 0.35) continue;    // piled up
    if (keep.length > 1) {
      const r = keep[keep.length - 2];
      const ax = q.x - r.x, ay = q.y - r.y, bx = p.x - q.x, by = p.y - q.y;
      if (ax * bx + ay * by < 0) continue;                   // turned back
    }
    keep.push(p);
  }
  let tautLen = 0;
  for (let k = 1; k < keep.length; k++) tautLen += Math.hypot(keep[k].x - keep[k - 1].x, keep[k].y - keep[k - 1].y);
  const laneSteps = Math.max(8, Math.round(tautLen / (step * 0.9)));
  lane.length = 0;
  let walk = 0, seg = 0, segLen = Math.hypot(keep[1].x - keep[0].x, keep[1].y - keep[0].y);
  for (let n = 0; n <= laneSteps; n++) {
    const at = (tautLen * n) / laneSteps;
    while (seg < keep.length - 2 && walk + segLen < at) {
      walk += segLen; seg++;
      segLen = Math.hypot(keep[seg + 1].x - keep[seg].x, keep[seg + 1].y - keep[seg].y);
    }
    const a = keep[seg], b = keep[seg + 1];
    const t = clamp((at - walk) / (segLen || 1), 0, 1);
    lane.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t,
                srcIdx: t < 0.5 ? a.srcIdx : b.srcIdx, off: a.off + (b.off - a.off) * t });
  }

  let laneLen = 0;
  for (let k = 0; k < lane.length; k++) {
    if (k) laneLen += Math.hypot(lane[k].x - lane[k - 1].x, lane[k].y - lane[k - 1].y);
    lane[k].d = laneLen;
  }
  for (let k = 0; k < lane.length; k++) {
    const a = lane[Math.max(0, k - 1)], b = lane[Math.min(lane.length - 1, k + 1)];
    lane[k].ang = Math.atan2(b.y - a.y, b.x - a.x);
  }
  /* One box per TEAM, not per car — a garage belongs to a constructor and both
     its drivers stop in it, which is both how it really works and the only way
     eleven boxes fit down a lane that would have to hold twenty-two.

     The garage was drawn twenty-two units long and the boxes were spaced along
     two thirds of the lane, which on a lane of the length these circuits
     actually get works out at very nearly twenty-two apart. So they touched
     everywhere and overlapped anywhere the lane bent, and on the shortest lanes
     they simply sat on top of one another — Brazil's eleven were laid out over
     a span shorter than eight of them.

     A garage is now sized from the room there is for it rather than from a
     constant, and the row is put where that room is. */
  const nBox = Math.max(1, TEAMS.length);
  const boxWide  = laneHalf * 1.4;                // the box on the lane, as drawn
  const boxWallOff = (laneHalf + 15 * pitK) * pitSide;   // where the garage stands
  const boxHouse = 13 / 11;                       // the garage overhangs its box by this
  const boxDeep  = 18 * pitK;                     // and is this deep
  const stub = { pit: { lane, length: laneLen } };

  /* Lay eleven garages out over a given stretch of the lane and see what size
     they come out.

     Spacing them along it is most of the job but not all of it. Each garage is
     square to the lane where it stands, so on a bend consecutive ones are
     turned against each other and their corners swing into the gap that
     separated their centres — which is how boxes with room to spare still ended
     up clipping. Two rectangles turned by an angle need
     length x cos(half the angle) + width x sin(half the angle) between their
     centres to stay apart, so that is solved for the length instead.

     Twice over, because the complex is two rows of rectangles and not one: the
     box marked on the lane, and the garage behind it, which is longer than its
     box and stands off the far edge of the road. Where the lane bends toward
     the garages the back row closes up faster than the front one, so it is the
     row that sets the size there — and depth is spent before length is, since a
     garage that gives up a little depth at a kink still reads as a garage.

     Each garage is measured against its OWN neighbours rather than all of them
     taking the tightest pair's answer: one kink in an otherwise open lane
     should cost the two boxes standing in it and nothing else. */
  const layOut = (first, span) => {
    const pitch = span / Math.max(1, nBox - 1);
    const boxes = [];
    for (let n = 0; n < nBox; n++) boxes.push(first + pitch * n);
    const lens   = new Array(nBox).fill(Math.min(22 * pitK, pitch * 0.80));
    const depths = new Array(nBox).fill(boxDeep);
    const pairs = [];
    for (let n = 1; n < nBox; n++) {
      const a = laneAt(stub, boxes[n - 1]), b = laneAt(stub, boxes[n]);
      const half = Math.abs(angDiff(b.ang, a.ang)) / 2;
      const p = { n, cos: Math.max(0.2, Math.cos(half)), sin: Math.sin(half),
                  chord: Math.hypot(b.x - a.x, b.y - a.y) };
      const an = { x: a.x - Math.sin(a.ang) * boxWallOff, y: a.y + Math.cos(a.ang) * boxWallOff };
      const bn = { x: b.x - Math.sin(b.ang) * boxWallOff, y: b.y + Math.cos(b.ang) * boxWallOff };
      p.wallChord = Math.hypot(bn.x - an.x, bn.y - an.y);
      pairs.push(p);
    }
    for (const p of pairs) {
      const room = p.sin > 1e-4 ? (p.wallChord - lens[p.n] * boxHouse * p.cos) / p.sin : Infinity;
      const allow = Math.max(6 * pitK, Math.min(boxDeep, room));
      depths[p.n - 1] = Math.min(depths[p.n - 1], allow);
      depths[p.n]     = Math.min(depths[p.n],     allow);
    }
    // Length takes whatever depth could not, for both rows at once. This is the
    // pass that has to succeed, so its floor is small enough to be reachable.
    for (const p of pairs) {
      const deep = Math.max(depths[p.n - 1], depths[p.n]);
      const allow = Math.max(2 * pitK, Math.min(
        (p.chord     - boxWide * p.sin) / p.cos,
        (p.wallChord - deep * p.sin) / (boxHouse * p.cos)));
      lens[p.n - 1] = Math.min(lens[p.n - 1], allow);
      lens[p.n]     = Math.min(lens[p.n],     allow);
    }
    return { boxes, lens, depths, worst: Math.min(...lens) };
  };

  /* WHERE down the lane the row goes, and how much of it to use. Garages line
     the straight part of a pit lane because that is the only part of it you can
     line, and both ends of that are worth choosing: sliding the row moves it
     clear of a kink, and shortening it packs the row into the straight rather
     than reaching past it.

     Both are chosen at once, on the size of the SMALLEST garage. Australia is
     why it has to be the smallest rather than the average — spread over its
     full lane, nine of its garages came out at nineteen units and the last two
     at four, which is not a pit lane with two small garages in it, it is a pit
     lane with two teams missing. Packed into the straight, all eleven come out
     the same size, smaller than nineteen and much larger than four. */
  let bestBoxes = null;
  for (const spanFrac of [0.72, 0.64, 0.56, 0.48, 0.40]) {
    const span = laneLen * spanFrac;
    for (let t = 0; t <= 16; t++) {
      const first = laneLen * 0.06 + (laneLen * (0.94 - spanFrac) - laneLen * 0.06) * (t / 16);
      const got = layOut(first, span);
      if (!bestBoxes || got.worst > bestBoxes.worst) bestBoxes = got;
    }
  }
  const boxes = bestBoxes.boxes, boxLens = bestBoxes.lens, boxDepths = bestBoxes.depths;

  return { pts, step, length, M, vmax, drs, pitSide, halfWidth: o.halfWidth,
           runoff: o.runoff, carScale: o.carScale, pace: o.pace,
           lookTime: o.lookTime, circuit, scale: o.scale,
           // world extent and the zoom that puts this circuit on screen at the
           // reference track width
           W: worldW, H: worldH, border,
           zoom: CONFIG.refHalfWidth / o.halfWidth,
           pit: { lane, length: laneLen, boxes, boxLens, boxDepths, wallOff: boxWallOff,
                  side: pitSide, off: laneOff,
                  k: pitK, half: laneHalf, wall: wallOut, lenMul: pitLenMul } };
}

/* The world a circuit occupies at a given layout scale, without building it.
   Only the replay warp needs this — a clip recorded before a circuit was
   magnified holds world coordinates from the smaller world, and mapping them
   onto the bigger one needs both worlds' centres. Kept next to buildTrack, and
   deriving the box and border exactly as it does, so the two cannot drift. */
function worldFor(circuit, scale) {
  const o = trackOpts(circuit);
  const pad = o.margin + o.halfWidth + o.runoff;
  const border = Math.round(CONFIG.pitBorder * o.halfWidth / CONFIG.refHalfWidth);
  const box = layoutBox(pad, scale);
  return { W: box.w + border * 2, H: box.h + border * 2 };
}

// Position and heading a given distance along the pit lane.
function laneAt(tr, d) {
  const L = tr.pit.lane;
  const dist = clamp(d, 0, tr.pit.length);
  let i = 1;
  while (i < L.length - 1 && L[i].d < dist) i++;
  const a = L[i - 1], b = L[i];
  const t = (dist - a.d) / ((b.d - a.d) || 1);
  return {
    x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t,
    ang: a.ang + angDiff(b.ang, a.ang) * t,
    srcIdx: t < 0.5 ? a.srcIdx : b.srcIdx,
  };
}

/* =========================================================================
   Track pre-render (drawn once per race, blitted every frame)
   ========================================================================= */
let trackCanvas = null, marksCanvas = null, marksCtx = null, marksSS = 1, miniCanvas = null;

/* Supersampling is quoted as a multiple of world units, so the cost of it grows
   with the SQUARE of the world — and a magnified layout is a bigger world. Left
   alone, the tightest circuit at its new size would ask for a sixty-megapixel
   bitmap and get a blank one from the browser instead of a track.

   So the factor is a request, not a promise: it is honoured until the bitmap
   would pass its budget, then reduced to fit. The budgets are set so that even
   the largest circuit still holds at least one bitmap pixel per screen pixel at
   full camera zoom, which is the point at which more of them stops showing. */
function fitSS(want, W, H, budget) {
  return Math.min(want, Math.sqrt(budget / (W * H)));
}
const SS_BUDGET = 16e6, MARKS_BUDGET = 8e6;

function tracePath(g, pts) {
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  g.closePath();
}

function renderTrack(tr) {
  // A tight circuit is drawn small in the world and magnified by the camera, so
  // it needs proportionally more supersampling to stay crisp on screen. Every
  // painted detail below is likewise scaled by `k`, which makes all 24 circuits
  // scaled copies of one another and so identical once the camera has zoomed.
  const k  = tr.pit.k;
  const SS = fitSS(clamp(tr.zoom * CONFIG.camZoom * 1.2, 1.8, 3.2), tr.W, tr.H, SS_BUDGET);
  const off = document.createElement("canvas");
  off.width = Math.round(tr.W * SS); off.height = Math.round(tr.H * SS);
  const g = off.getContext("2d");
  g.scale(SS, SS);
  g.lineJoin = "round"; g.lineCap = "round";

  const c = tr.circuit;
  const hw = tr.halfWidth;

  // grass, with a bit of scatter so it isn't a flat slab
  g.fillStyle = c.grass;
  g.fillRect(0, 0, tr.W, tr.H);
  for (let i = 0; i < 900; i++) {
    g.globalAlpha = 0.05 + Math.random() * 0.09;
    g.fillStyle = i % 2 ? "#ffffff" : "#000000";
    const r = (3 + Math.random() * 22) * k;
    g.beginPath(); g.arc(Math.random() * tr.W, Math.random() * tr.H, r, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;

  // kerbs: white base, red dashes over it
  tracePath(g, tr.pts);
  g.strokeStyle = "#f2f4f8"; g.lineWidth = (hw + tr.runoff * 0.42) * 2; g.stroke();
  g.save();
  g.setLineDash([18 * k, 18 * k]);
  g.strokeStyle = "#e2483f"; g.lineWidth = (hw + tr.runoff * 0.42) * 2; g.stroke();
  g.restore();

  // tarmac
  tracePath(g, tr.pts);
  g.strokeStyle = "#33393f"; g.lineWidth = hw * 2; g.stroke();
  tracePath(g, tr.pts);
  g.strokeStyle = "#3c434a"; g.lineWidth = hw * 2 - 7 * k; g.stroke();

  // faint racing-line hint
  g.save();
  g.globalAlpha = 0.16; g.setLineDash([14 * k, 22 * k]);
  tracePath(g, tr.pts);
  g.strokeStyle = "#ffffff"; g.lineWidth = 2 * k; g.stroke();
  g.restore();

  // start/finish: a checkered band across the track at sample 0
  const s0 = tr.pts[0];
  g.save();
  g.translate(s0.x, s0.y); g.rotate(s0.ang);
  const cell = 7 * k, cols = 3, rows = Math.ceil((hw * 2) / cell);
  for (let cx = 0; cx < cols; cx++) for (let cy = 0; cy < rows; cy++) {
    g.fillStyle = (cx + cy) % 2 ? "#ffffff" : "#14181d";
    g.fillRect(cx * cell - cols * cell / 2, cy * cell - hw, cell, cell);
  }
  g.restore();

  // ---- DRS zones: detection line, activation line, and the road between ----
  //      Painted before the pit lane so the lane still covers anything of this
  //      that runs beside it. Signage sits on the far side from the pit for the
  //      same reason. All of it is quoted in `k` like the rest of the circuit,
  //      so it reads the same size on every layout once the camera has zoomed.
  const drs = tr.drs;
  if (drs && drs.zones.length) {
    const P = tr.pts, M2 = tr.M;
    const across = (i, colour, width, dash) => {
      const s = P[i];
      g.save();
      g.translate(s.x, s.y); g.rotate(s.ang);
      g.setLineDash(dash || []);
      g.strokeStyle = colour; g.lineWidth = width;
      g.beginPath(); g.moveTo(0, -hw); g.lineTo(0, hw); g.stroke();
      g.restore();
    };
    const sign = (i, text, colour, size) => {
      const s = P[i];
      // Signage lies along the road, but the camera never rotates — so on any
      // part of the lap running right to left it would be printed upside down.
      // Turn it through 180° there and put it back on the same side of the road.
      const flip = Math.cos(s.ang) < 0;
      g.save();
      g.translate(s.x, s.y); g.rotate(s.ang + (flip ? Math.PI : 0));
      g.fillStyle = colour;
      g.font = `800 ${size * k}px ${UI_FONT}`;
      g.textAlign = "left"; g.textBaseline = "middle";
      g.fillText(text, 5 * k, (flip ? tr.pitSide : -tr.pitSide) * (hw + 9 * k));
      g.restore();
    };
    for (let n = 0; n < drs.zones.length; n++) {
      const z = drs.zones[n];
      const span = ((z.end - z.start) % M2 + M2) % M2;

      // the road inside the zone: a wash of green, and a line down each edge
      g.save();
      g.beginPath();
      g.moveTo(P[z.start].x, P[z.start].y);
      for (let t = 1; t <= span; t++) { const p = P[(z.start + t) % M2]; g.lineTo(p.x, p.y); }
      g.globalAlpha = 0.13; g.strokeStyle = "#3ddc84"; g.lineWidth = hw * 2 - 9 * k; g.stroke();
      g.globalAlpha = 1;
      for (const sgn of [1, -1]) {
        g.beginPath();
        for (let t = 0; t <= span; t++) {
          const p = P[(z.start + t) % M2];
          const x = p.x + p.nx * (hw - 3 * k) * sgn, y = p.y + p.ny * (hw - 3 * k) * sgn;
          if (t) g.lineTo(x, y); else g.moveTo(x, y);
        }
        g.strokeStyle = "rgba(61,220,132,.50)"; g.lineWidth = 1.8 * k; g.stroke();
      }
      g.restore();

      across(z.detect, "rgba(122,190,255,.85)", 2 * k, [6 * k, 6 * k]);
      sign(z.detect, "DRS DETECTION", "rgba(122,190,255,.75)", 8);
      across(z.start, "#3ddc84", 3 * k);
      sign(z.start, `DRS ZONE ${n + 1}`, "rgba(61,220,132,.85)", 10);
      across(z.end, "rgba(240,244,250,.55)", 2 * k, [5 * k, 5 * k]);
      sign(z.end, "DRS ENDS", "rgba(240,244,250,.45)", 8);
    }
  }

  // ---- the pit lane, drawn as a real road with boxes and a garage wall ----
  const pit = tr.pit, lanePts = pit.lane, laneHalf = pit.half;
  const traceLane = () => {
    g.beginPath();
    g.moveTo(lanePts[0].x, lanePts[0].y);
    for (let i = 1; i < lanePts.length; i++) g.lineTo(lanePts[i].x, lanePts[i].y);
  };
  // white boundary line, then tarmac over it, so the lane reads as separate
  traceLane();
  g.strokeStyle = "rgba(240,244,250,.55)"; g.lineWidth = (laneHalf + 3 * k) * 2; g.lineCap = "round"; g.stroke();
  traceLane();
  g.strokeStyle = "#2e343b"; g.lineWidth = laneHalf * 2; g.stroke();

  /* Boxes and the garage wall behind them, both offset further out again. Every
     measurement along the lane comes from the length buildTrack worked out
     there is room for, rather than from a constant that assumed a lane longer
     than most of these circuits can give — the garage building keeps its old
     proportion of the box it belongs to, so a narrow pit lane reads as a row of
     small garages rather than a row of overlapping ones. */
  const wallOff = pit.wallOff;
  for (let n = 0; n < pit.boxes.length; n++) {
    const lp = laneAt(tr, pit.boxes[n]);
    const bl = pit.boxLens[n], bh = bl / 2, house = bl * (13 / 11);
    const deep = pit.boxDepths[n];
    g.save();
    g.translate(lp.x, lp.y); g.rotate(lp.ang);
    g.fillStyle = "rgba(255,255,255,.10)";
    g.fillRect(-bh, Math.min(0, wallOff), bl, Math.abs(wallOff));
    g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 1.4 * k;
    g.strokeRect(-bh, -laneHalf * 0.7, bl, laneHalf * 1.4);
    g.fillStyle = "#20262d";
    g.fillRect(-house / 2, wallOff - deep / 2 * tr.pitSide, house, deep);
    g.fillStyle = "rgba(255,255,255,.5)";
    // The number has to live inside the garage it names, and on a tight lane
    // that garage is a small one.
    g.font = `700 ${Math.min(10 * k, house * 0.40)}px ${UI_FONT}`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(n + 1), 0, wallOff);
    g.restore();
  }

  // speed-limit line at the lane entry, and the lane's name along it
  const lim = laneAt(tr, Math.min(pit.length * 0.16, 60 * k));
  g.save();
  g.translate(lim.x, lim.y); g.rotate(lim.ang);
  g.strokeStyle = "#f2c14e"; g.lineWidth = 2.5 * k;
  g.beginPath(); g.moveTo(0, -laneHalf); g.lineTo(0, laneHalf); g.stroke();
  g.fillStyle = "rgba(255,255,255,.40)";
  g.font = `700 ${9 * k}px ${UI_FONT}`;
  g.textAlign = "left"; g.textBaseline = "middle";
  g.fillText("PIT LANE", 6 * k, -laneHalf - 6 * k);
  g.restore();

  // Venue printed on the infield, in the circuit's own accent. A championship
  // round is a country and carries no `loc` at all, so the second line belongs
  // to the elite one-offs, which are the only entries that still name a place.
  g.save();
  g.textAlign = "center"; g.textBaseline = "middle";
  g.globalAlpha = 0.13;
  g.fillStyle = c.sky;
  g.font = `800 ${46 * k}px ${UI_FONT}`;
  g.fillText(c.name.toUpperCase(), tr.W / 2, tr.H / 2 - (c.loc ? 12 : 0) * k);
  if (c.loc) {
    g.globalAlpha = 0.09;
    g.fillStyle = "#ffffff";
    g.font = `700 ${17 * k}px ${UI_FONT}`;
    g.fillText(c.loc.toUpperCase(), tr.W / 2, tr.H / 2 + 22 * k);
  }
  g.restore();

  trackCanvas = off;

  // Skid marks are laid down in world units, so this layer needs its own
  // supersample to stay sharp once the camera magnifies a tight circuit.
  marksSS = fitSS(clamp(tr.zoom * CONFIG.camZoom, 1, 2.4), tr.W, tr.H, MARKS_BUDGET);
  marksCanvas = document.createElement("canvas");
  marksCanvas.width = Math.round(tr.W * marksSS);
  marksCanvas.height = Math.round(tr.H * marksSS);
  marksCtx = marksCanvas.getContext("2d");
  marksCtx.scale(marksSS, marksSS);

  buildMinimap(tr);
}

/* =========================================================================
   Audio — everything synthesised, nothing loaded
   ========================================================================= */
let actx = null, muted = false, engine = null;

function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return; } }
  if (actx.state === "suspended") actx.resume();
}

function beep(freq = 440, dur = 0.09, type = "square", gain = 0.05, toFreq = null) {
  if (!actx || muted || simRun) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator(), amp = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (toFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, toFreq), t + dur);
  amp.gain.setValueAtTime(gain, t);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(amp).connect(actx.destination);
  osc.start(); osc.stop(t + dur);
}

function noiseHit(dur = 0.22, gain = 0.09, cut = 1400) {
  if (!actx || muted || simRun) return;
  const t = actx.currentTime;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut;
  const amp = actx.createGain(); amp.gain.setValueAtTime(gain, t);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(amp).connect(actx.destination);
  src.start();
}

function startEngine() {
  if (!actx) return;
  stopEngine();
  const o1 = actx.createOscillator(), o2 = actx.createOscillator();
  const f = actx.createBiquadFilter(), g = actx.createGain();
  o1.type = "sawtooth"; o2.type = "square";
  f.type = "lowpass"; f.frequency.value = 700;
  g.gain.value = 0;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(actx.destination);
  o1.start(); o2.start();
  engine = { o1, o2, f, g };
}
function stopEngine() {
  if (!engine) return;
  try { engine.o1.stop(); engine.o2.stop(); } catch (_) {}
  engine = null;
}
function engineUpdate(speed, boosting) {
  if (!engine || !actx) return;
  const t = actx.currentTime;
  const base = 52 + speed * 0.52 + (boosting ? 22 : 0);
  engine.o1.frequency.setTargetAtTime(base, t, 0.05);
  engine.o2.frequency.setTargetAtTime(base * 1.5, t, 0.05);
  engine.f.frequency.setTargetAtTime(420 + speed * 3.0, t, 0.08);
  engine.g.gain.setTargetAtTime(muted ? 0 : 0.032, t, 0.12);
}

/* =========================================================================
   Pit-wall voice — Web Speech, so nothing is downloaded and nothing is stored.
   Voices arrive asynchronously in Chrome, hence the voiceschanged listener.
   ========================================================================= */
let voiceOn = true, pitVoice = null, localVoice = null, voicesTried = false;

// A British male engineer if one exists, then any en-GB, then any English at
// all. Falls through to null, which just means the browser default voice.
// localVoice is the offline understudy: the best voices in Chrome (the Google
// ones) are synthesised server-side, so they go silent with the network.
function pickPitVoice() {
  if (!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices();
  if (!all.length) return;
  voicesTried = true;
  const en = all.filter(v => /^en(-|_|$)/i.test(v.lang || ""));
  const gb = en.filter(v => /^en(-|_)GB/i.test(v.lang));
  // "Female" contains "male", so the negative test has to come first.
  const male = n => !/female|woman/i.test(n) && /\bmale\b|daniel|george|arthur|ryan|guy|brian|oliver|david|mark/i.test(n);
  pitVoice = gb.find(v => male(v.name)) || gb[0] || en.find(v => male(v.name)) || en[0] || null;
  const loc = en.filter(v => v.localService);
  localVoice = loc.find(v => male(v.name)) || loc[0] || null;
}
if ("speechSynthesis" in window) {
  pickPitVoice();
  speechSynthesis.addEventListener("voiceschanged", pickPitVoice);
}

// Each new call cancels the one in flight: the pill has already replaced the
// old message on screen, so a queue would leave the voice lagging the race.
function speak(text) {
  if (!voiceOn || muted || simRun || !text || !("speechSynthesis" in window)) return;
  if (!voicesTried) pickPitVoice();
  const line = stripForSpeech(text);
  if (!line) return;
  const say = (voice, isRetry) => {
    try {
      const u = new SpeechSynthesisUtterance(line);
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      u.rate = 1.16;   // clipped, urgent — pit radio, not an audiobook
      u.pitch = 0.92;
      u.volume = 0.95;
      // A network voice that fails offline errors instead of speaking, so the
      // line is served again by the offline voice. "interrupted"/"canceled"
      // are our own cancel() and must not be retried, and "not-allowed" means
      // the page has had no user gesture yet — retrying cannot fix either.
      u.onerror = (e) => {
        const why = e && e.error;
        if (isRetry || !localVoice || voice === localVoice) return;
        if (why === "interrupted" || why === "canceled" || why === "not-allowed") return;
        pitVoice = localVoice;
        say(localVoice, true);
      };
      speechSynthesis.speak(u);
    } catch (_) {}
  };
  try {
    // Chrome drops an utterance queued in the same tick as a cancel(), so the
    // replacement waits a beat rather than being swallowed silently.
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      speechSynthesis.cancel();
      setTimeout(() => say(pitVoice, false), 60);
    } else say(pitVoice, false);
  } catch (_) {}
}

function shutUp() { try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (_) {} }

// Em-dashes read as a stumble and emoji get spelled out by some voices; both
// become plain pauses instead.
function stripForSpeech(t) {
  return String(t)
    .replace(/[—–]/g, ", ")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "")
    .replace(/\s+/g, " ")
    .trim();
}

function toggleVoice() {
  voiceOn = !voiceOn;
  store.set(K_VOICE, voiceOn);
  if (!voiceOn) shutUp();
  beep(voiceOn ? 760 : 400, 0.09, "sine", 0.045);
  if (state === State.RACING) hud.classList.add("on");
  updateVoiceBadge();
  drawScreen();
}

function updateVoiceBadge() {
  if (!el.radioLbl) return;
  el.radioLbl.textContent = (voiceOn && !muted) ? "Pit wall 🔊 (V)" : "Pit wall 🔇 (V)";
}

/* =========================================================================
   Storage
   ========================================================================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
  del(k)    { try { localStorage.removeItem(k); } catch (_) {} },
};
const K_SEASON = KP + "season";
const K_LAPS   = KP + "bestlaps";
const K_MODE   = KP + "mode";
const K_VOICE  = KP + "voice";
const K_LEN    = KP + "racelen";
const K_TYRE   = KP + "starttyre";
const K_QMODE  = KP + "qualimode";
const K_QSECS  = KP + "qualisecs";
const K_FORM   = KP + "formation";
const K_AI     = KP + "ailevel";
const K_CAREERS = KP + "careers";
/* The honours board lives in its own key, deliberately OUTSIDE the six career
   slots. A slot gets reused, overwritten and deleted; twenty years of somebody
   driving should not go with it. Anything that finishes a career writes one
   record here and it stays for good. */
const K_HALL   = KP + "hall";
/* Saved highlight reels, likewise outside the career slots — a race worth
   keeping is worth keeping after the championship it belonged to has been
   deleted, and a reel carries its own copy of who was driving so it can still
   name them once the roster has moved on. */
const K_REELS  = KP + "reels";

/* --- The 2026-08-09 rename -------------------------------------------------
   The game was Emoji Grand Prix, its storage keys were prefixed `emoji-gp:`
   and its circuits were named for their tracks. A save written before that
   would read as a fresh install — no careers, no lap records, no reels — so
   it is copied across once and stamped, and the old keys are LEFT IN PLACE
   as a fallback rather than deleted.

   Lap records and saved reels are keyed by circuit NAME, and every name
   changed, so both are remapped through the calendar order. Elite circuits
   are absent from the map on purpose: they were not renamed. ------------- */
const RENAMED_FROM = {
  "Albert Park": 0, "Shanghai": 1, "Suzuka": 2, "Sakhir": 3, "Jeddah": 4, "Miami": 5,
  "Montréal": 6, "Monaco": 7, "Catalunya": 8, "Red Bull Ring": 9, "Silverstone": 10,
  "Spa": 11, "Hungaroring": 12, "Zandvoort": 13, "Monza": 14, "Madring": 15, "Baku": 16,
  "Marina Bay": 17, "Austin": 18, "Mexico City": 19, "Interlagos": 20, "Las Vegas": 21,
  "Lusail": 22, "Yas Marina": 23,
};
(function migrateRename() {
  // Nothing to migrate into a demo: the `rttp-demo:` prefix is new with this
  // build, so there is no Emoji Grand Prix save that was ever meant for it.
  if (DEMO) return;
  const STAMP = "rttp:renamed";
  if (store.get(STAMP, false)) return;
  for (const k of ["season", "bestlaps", "mode", "voice", "racelen", "starttyre", "qualimode",
                   "qualisecs", "formation", "ailevel", "careers", "hall", "reels", "livery"]) {
    try {
      const old = localStorage.getItem("emoji-gp:" + k);
      if (old !== null && localStorage.getItem("rttp:" + k) === null) localStorage.setItem("rttp:" + k, old);
    } catch (_) {}
  }
  const laps = store.get(K_LAPS, null);
  if (laps && typeof laps === "object") {
    const out = {};
    for (const key of Object.keys(laps)) {
      const c = CIRCUITS[RENAMED_FROM[key]];
      const to = c ? c.name : key;
      if (out[to] == null || laps[key] < out[to]) out[to] = laps[key];
    }
    store.set(K_LAPS, out);
  }
  const reels = store.get(K_REELS, null);
  if (Array.isArray(reels)) {
    for (const r of reels) {
      const c = !r.elite && CIRCUITS[RENAMED_FROM[r.ck]];
      // `loc` goes rather than moves — a championship round has no venue now,
      // and an old reel carries the city it was recorded at.
      if (c) { r.ck = c.name; r.gp = c.gp; delete r.loc; }
    }
    store.set(K_REELS, reels);
  }
  store.set(STAMP, true);
})();

/* A second pass under its own stamp, because the first shipped a few hours
   earlier and moved the CITY onto old reels before venues were dropped from
   championship rounds altogether. Anything saved in between still carries one,
   and the block above will not run again. Elite reels keep theirs — those four
   events still name a place. */
(function migrateVenue() {
  if (DEMO) return;                      // same reasoning as migrateRename above
  const STAMP = "rttp:noVenue";
  if (store.get(STAMP, false)) return;
  const reels = store.get(K_REELS, null);
  if (Array.isArray(reels)) {
    let n = 0;
    for (const r of reels) if (!r.elite && r.loc) { delete r.loc; n++; }
    if (n) store.set(K_REELS, reels);
  }
  store.set(STAMP, true);
})();

/* --- The 2026-08-13 rescale -----------------------------------------------
   Nine rounds are now built larger than the frame they are fitted to, so the
   cars have more of everything to share. A bigger lap takes longer to drive,
   which means every lap record set on one of them belongs to a circuit that no
   longer exists and can never be beaten — so those records go, and the rest
   stay. Which circuits changed is read from the data rather than listed here,
   so this cannot fall out of step with it; the stamp is what stops it running
   a second time on a record set since.

   This one runs on the demo too. Unlike the rename, the demo ships the same
   geometry as the full game, so it has the same stale records to clear.
   Saved reels are NOT touched: a clip is mapped onto the new layout when it is
   watched, which keeps the recording itself intact. ---------------------- */
(function migrateRescale() {
  const STAMP = KP + "rescaled";
  if (store.get(STAMP, false)) return;
  const laps = store.get(K_LAPS, null);
  if (laps && typeof laps === "object") {
    let n = 0;
    for (const c of CIRCUITS) if ((c.layoutScale ?? 1) !== 1 && laps[c.name] != null) { delete laps[c.name]; n++; }
    if (n) store.set(K_LAPS, laps);
  }
  store.set(STAMP, true);
})();

/* =========================================================================
   A save that can leave this browser

   Everything above is kept in localStorage, which is the right place for it
   and is also the one part of this game not under its own control. Played
   from inside an iframe — which is how a browser game is served on a portal
   — that store is third-party, and a browser told to partition or block
   third-party storage hands the game an empty one instead. `store` swallows
   that failure by design, so the game plays on perfectly well and the career
   quietly never saves. Twenty years is far too much to lose to a setting
   nobody knew was switched on.

   So a save can be written out to a file and read back in. Two decisions make
   it durable:

   Every rttp: key travels, found by sweeping the prefix rather than by
   listing the constants. The liveries are declared two thousand lines above
   the careers, the honours board sits deliberately outside the six slots, and
   the migration stamps matter as much as the data they guard — a list would
   be one more thing to keep in step, and the first key left off it is the one
   somebody loses.

   Values are copied as the raw strings localStorage holds them as. Parsing
   them into objects and back would gain nothing and stakes a round trip on
   landing exactly where it started; this way a value too corrupt to parse
   still travels home intact, where repairCareer can have a go at it.
   ========================================================================= */
const SAVE_FORMAT = 1;
/* Follows the build's own prefix, which quietly does something useful: the two
   prefixes are disjoint strings, so a full-game save file offered to the demo
   matches nothing and is refused, and a demo save offered to the full game
   likewise. Neither build can be talked into eating the other's careers. */
const SAVE_PREFIX = KP;

function collectSave() {
  const out = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(SAVE_PREFIX)) out[k] = localStorage.getItem(k);
    }
  } catch (_) {}
  return out;
}

/* What a bundle of keys actually holds, in the terms the careers screen talks
   in — so that both ends of the journey can be described to the player, and
   loading one can say what it is about to overwrite.

   Read defensively throughout. On the way out this is the game's own storage,
   but on the way in it is a FILE, and a file is whatever somebody hands over. */
function describeSave(keys) {
  const bits = [];
  let slots = 0, titles = 0;
  try {
    const cs = JSON.parse(keys[K_CAREERS] || "null");
    if (Array.isArray(cs)) for (const c of cs) {
      if (!c) continue;
      slots++;
      if (typeof c.titles === "number" && c.titles > 0) titles += Math.floor(c.titles);
    }
  } catch (_) {}
  try {
    const h = JSON.parse(keys[K_HALL] || "null");
    if (Array.isArray(h) && h.length) bits.push(`${h.length} on the honours board`);
  } catch (_) {}
  try {
    const r = JSON.parse(keys[K_REELS] || "null");
    if (Array.isArray(r) && r.length) bits.push(`${r.length} saved reel${r.length === 1 ? "" : "s"}`);
  } catch (_) {}
  bits.unshift(`${slots} career${slots === 1 ? "" : "s"}${
    titles ? ` · ${titles} title${titles === 1 ? "" : "s"}` : ""}`);
  return { slots, text: bits.join(" · ") };
}

/* --- Out -----------------------------------------------------------------
   A Blob and a link nobody sees. The object URL is released on a timer rather
   than immediately: revoking it in the same tick can beat the download to it
   in some browsers, and a leaked URL for a few seconds costs nothing. ----- */
function exportSave() {
  const keys = collectSave();
  if (!Object.keys(keys).length)
    return { bad: true, text: "Nothing to export — this browser has no saved game in it yet." };

  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  const name = `run-to-the-podium-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.json`;

  try {
    const blob = new Blob([JSON.stringify(
      { game: "Run to the Podium", format: SAVE_FORMAT, saved: Date.now(), keys }, null, 2)],
      { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (_) {
    return { bad: true, text: "This browser would not write the file. Try the downloadable copy of the game." };
  }
  return { text: `📤 ${name} — ${describeSave(keys).text}. Keep it somewhere you will find it again.` };
}

/* --- In ------------------------------------------------------------------
   Reading the file is the easy half. The hard half is that loading one
   REPLACES what is in this browser, all six slots at once, so it is armed and
   confirmed exactly the way deleting a career is: the file is read and held,
   what it contains is put on screen, and it takes a second deliberate press
   to let it overwrite anything. Any other key drops it.

   Only rttp: keys with string values are ever written. A save file is
   untrusted input — it has been round a mail client and a hard disc and
   whatever else since the game last saw it — and nothing in it is allowed to
   name a key this game does not own. What it does hold is left to
   repairCareer and repairSeason, which already exist to rebuild a career out
   of whatever survived and are better at it than a validator here would be.
   ------------------------------------------------------------------------ */
function readSaveFile(text) {
  let doc;
  try { doc = JSON.parse(text); }
  catch (_) { return { bad: true, text: "That file is not a save — it is not readable as JSON." }; }

  const keys = doc && typeof doc === "object" ? doc.keys : null;
  if (!keys || typeof keys !== "object" || Array.isArray(keys))
    return { bad: true, text: "That file is readable, but there is no saved game inside it." };

  const clean = {};
  for (const k of Object.keys(keys))
    if (k.startsWith(SAVE_PREFIX) && typeof keys[k] === "string") clean[k] = keys[k];
  if (!Object.keys(clean).length)
    return { bad: true, text: "That save file is empty — there is nothing in it to load." };

  // A file from a later version of the game may hold keys this one has never
  // heard of. They are carried in rather than dropped: they cost nothing here
  // and are the difference between a save that survives going back a version
  // and one that quietly loses whatever was added since.
  return { keys: clean, later: typeof doc.format === "number" && doc.format > SAVE_FORMAT };
}

/* The one destructive step. Existing rttp: keys go FIRST — merging instead
   would leave a career in a slot the incoming save has empty, and the player
   would be looking at a grid half from the file and half from this browser
   with nothing to say which was which.

   Then the page is reloaded, deliberately. Every piece of state above is read
   out of storage as the script evaluates — bestLaps, the reels, the liveries,
   the weekend settings, the careers themselves — and putting a save into play
   by hand would mean re-running half this file in the right order. A reload
   does it properly and cannot half-apply. */
function applySave(keys) {
  try {
    for (const k of Object.keys(collectSave())) localStorage.removeItem(k);
    for (const k of Object.keys(keys)) localStorage.setItem(k, keys[k]);
  } catch (_) {
    return { bad: true, text: "This browser would not let the game write to its storage, so nothing was loaded." };
  }
  location.reload();
  return { text: "Loading…" };
}

// The file picker. Never added to the document: it does not need to be there
// to be clicked, and an input that is there is an input the keyboard handler
// has to know about.
function pickSaveFile(then) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload  = () => then(readSaveFile(String(fr.result)));
    fr.onerror = () => then({ bad: true, text: "That file could not be read off the disc." });
    fr.readAsText(file);
  });
  input.click();
}

/* --- Does this browser keep anything at all? ------------------------------
   `store` swallows every failure, and that is the right behaviour: a game
   that throws because a browser will not remember a lap record is worse than
   one that forgets the lap record. But it makes a dead store INVISIBLE. The
   careers screen fills in, the season saves, the honours board updates, and
   none of it is there tomorrow — the game cannot tell "nothing saved yet"
   from "nothing will ever save", because both read back as the default.

   Inside an iframe that is not a rare edge, it is a setting, and a common
   one. So it is measured once, at boot, by writing something and reading it
   back — the case that matters is a store that is PRESENT and refusing,
   which no amount of feature-detecting `window.localStorage` will catch.

   A full store is told apart from a blocked one, because they are different
   problems with different answers: one is somebody's privacy setting and
   costs them the browser, the other is a few too many highlight reels and
   costs them one keystroke. ---------------------------------------------- */
const storage = (() => {
  const probe = SAVE_PREFIX + "probe";
  try {
    localStorage.setItem(probe, "1");
    const back = localStorage.getItem(probe);
    localStorage.removeItem(probe);
    return { ok: back === "1", full: false };
  } catch (err) {
    const full = !!err && (err.name === "QuotaExceededError" ||
                           err.name === "NS_ERROR_DOM_QUOTA_REACHED" || err.code === 22);
    return { ok: false, full };
  }
})();

/* Said on the menu and again on the careers screen — the two places somebody
   is looking at work they believe is being kept. Deliberately not a modal:
   the game is still perfectly playable, it is the REMEMBERING that is broken,
   and an alert on every load would be its own punishment. */
function storageWarning() {
  if (storage.ok) return "";
  return storage.full
    ? `<p class="c" style="margin-top:14px;font-weight:700;color:#e2483f">⚠️ This browser's storage is full,
         so nothing more can be saved — including your career.<br>
         <span style="font-weight:400">Deleting a highlight reel or two frees it up:
         <span class="key">L</span> opens them. Reels are far and away the biggest thing kept here.</span></p>`
    : `<p class="c" style="margin-top:14px;font-weight:700;color:#e2483f">⚠️ This browser is not letting the game
         save anything, so nothing you do will still be here next time.<br>
         <span style="font-weight:400">A private window does this, and so does blocking site data — the game
         is fine, the storage is not. You can still play, and
         <span class="key">E</span> on the careers screen (<span class="key">C</span>) writes a save
         file you can keep and load back somewhere that does remember.</span></p>`;
}

let bestLaps = store.get(K_LAPS, {});
voiceOn = store.get(K_VOICE, true) !== false;

/* --- Weekend settings ------------------------------------------------------
   Race length, the qualifying format and the formation lap. All four are kept
   outside the season for the same reason the difficulty is: they describe how
   you want to play rather than what has happened, so they survive a save from
   before they existed and can be changed between rounds without touching the
   championship. Anything unrecognised falls back to the default. ---------- */
const QUALI_MODES = [
  { key: "full", label: "Drive it",  blurb: "You run Q1, Q2 and Q3 yourself" },
  { key: "sim",  label: "Simulate",  blurb: "The session is run for you and the times reported" },
  { key: "off",  label: "Off",       blurb: "No qualifying — the grid is reverse championship order" },
];
const lengthIdx = () => {
  const i = CONFIG.raceLengths.findIndex(l => l.key === store.get(K_LEN, "standard"));
  return i < 0 ? 2 : i;
};
let raceLen  = CONFIG.raceLengths[lengthIdx()];

/* --- Tyre choice ---------------------------------------------------------
   `startTyre` is what the player rolls out on and it is remembered between
   sessions, because it is a preference as much as a decision. `nextTyre` is
   what the crew has ready for the next stop and it is NOT remembered — it is
   a call made during a race, on a race that is happening, and carrying it
   into the next one would be answering a question nobody asked yet. It is
   reset to the starting choice whenever a race is set up. -------------- */
const compoundBy = k => CONFIG.compounds.find(c => c.key === k) || CONFIG.compounds[1];
let startTyre = compoundBy(store.get(K_TYRE, "medium")).key;
let nextTyre  = startTyre;

function cycleStartTyre(d = 1) {
  const n = CONFIG.compounds.length;
  const i = CONFIG.compounds.findIndex(c => c.key === startTyre);
  startTyre = CONFIG.compounds[(i + d + n) % n].key;
  store.set(K_TYRE, startTyre);
}
function cycleNextTyre(d = 1) {
  const n = CONFIG.compounds.length;
  const i = CONFIG.compounds.findIndex(c => c.key === nextTyre);
  nextTyre = CONFIG.compounds[(i + d + n) % n].key;
}

/* What the rest of the grid rolls out on. Scatter is the entire point: a field
   that all reasons its way onto the same tyre is a field with no undercut in
   it, so the bias moves with the distance but never becomes unanimous. */
function aiStartCompound(laps) {
  const r = Math.random();
  if (laps <= 6)  return r < 0.62 ? "soft" : "medium";
  if (laps <= 11) return r < 0.34 ? "soft" : r < 0.85 ? "medium" : "hard";
  if (laps <= 18) return r < 0.16 ? "soft" : r < 0.66 ? "medium" : "hard";
  return r < 0.30 ? "medium" : "hard";
}

/* What to bolt on at a stop, worked out from what the last set ACTUALLY
   managed rather than from a table — a set that was good for five laps here
   will be good for about five again, and a harder compound stretches that in
   proportion to its wear rate. Take the softest that still reaches the flag:
   anything harder is paying lap time for life the race will never use. */
function aiPitCompound(car) {
  const done = Math.max(1, car.lapsDone - car.stintStart);
  const on   = compoundBy(car.compound);
  const left = raceLaps() - car.lapsDone;
  for (const c of CONFIG.compounds) {        // ordered soft → hard, so this is softest-first
    if (done * (on.wear / c.wear) >= left) return c.key;
  }
  return "hard";
}

/* Qualifying is one lap on low fuel with nothing to manage, so the whole field
   runs softs and the choice simply does not arise there. */
function startCompound(isPlayer) {
  if (session !== "race") return "soft";
  return isPlayer ? startTyre : aiStartCompound(raceLaps());
}
let qualiMode = QUALI_MODES.some(m => m.key === store.get(K_QMODE, "full"))
              ? store.get(K_QMODE, "full") : "full";
let qualiSecs = CONFIG.quali.times.includes(store.get(K_QSECS, CONFIG.quali.defaultTime))
              ? store.get(K_QSECS, CONFIG.quali.defaultTime) : CONFIG.quali.defaultTime;
let formationOn = store.get(K_FORM, true) !== false;
let aiLevel = CONFIG.aiLevels.find(l => l.key === store.get(K_AI, "pro"))
           || CONFIG.aiLevels.find(l => l.key === "pro");

function cycleAiLevel(d = 1) {
  const i = CONFIG.aiLevels.indexOf(aiLevel);
  aiLevel = CONFIG.aiLevels[clamp(i + d, 0, CONFIG.aiLevels.length - 1)];
  store.set(K_AI, aiLevel.key);
}

// The lap count this weekend is run over. Every finish check, every "laps
// remaining" the AI reasons about and every label reads this rather than the
// circuit's own number, so the length setting is honoured in one place.
function raceLaps() {
  const base = (track ? track.circuit : CIRCUITS[season ? season.round : 0]).laps;
  return Math.max(2, Math.round(base * raceLen.mul));
}
function lapsFor(circuit) { return Math.max(2, Math.round(circuit.laps * raceLen.mul)); }

function cycleLength(d = 1) {
  const i = (CONFIG.raceLengths.indexOf(raceLen) + d + CONFIG.raceLengths.length) % CONFIG.raceLengths.length;
  raceLen = CONFIG.raceLengths[i];
  store.set(K_LEN, raceLen.key);
}
function cycleQualiMode(d = 1) {
  const i = QUALI_MODES.findIndex(m => m.key === qualiMode);
  qualiMode = QUALI_MODES[(i + d + QUALI_MODES.length) % QUALI_MODES.length].key;
  store.set(K_QMODE, qualiMode);
}
function cycleQualiTime(d = 1) {
  const T = CONFIG.quali.times;
  qualiSecs = T[(T.indexOf(qualiSecs) + d + T.length) % T.length];
  store.set(K_QSECS, qualiSecs);
}
function toggleFormation() { formationOn = !formationOn; store.set(K_FORM, formationOn); }

/* Failures are rolled per car per second, so a race three and a half times as
   long used to be three and a half times as much attrition — eleven cars out of
   twenty-two at Full distance, which is not a grand prix, it is a scrapyard.
   The intent stands: a longer race IS more dangerous. It just should not be
   proportionally more dangerous. Scaling the rate by mul^-0.75 leaves a Full
   race about a third likelier to break your car than a Short one rather than
   three and a half times, which lands the field back on the two or three
   retirements a race the base rate was tuned for. */
function lengthReliability() { return Math.pow(raceLen.mul, -0.75); }

/* --- Difficulty mode -------------------------------------------------------
   Kept in its own key rather than inside the season, so it survives a save
   from before modes existed, can be switched between rounds without touching
   the championship, and is already known on the title screen before a season
   is loaded. Anything unrecognised falls back to Semi-Pro. ---------------- */
let mode = store.get(K_MODE, "semi") === "pro" ? "pro" : "semi";
const assisted = () => mode === "semi";
function setMode(m) { mode = m === "pro" ? "pro" : "semi"; store.set(K_MODE, mode); }
// Semi-Pro slows the field proportionally, so a circuit with its own aiPace
// override keeps its character instead of being flattened to a global number.
// The difficulty level multiplies the same figure, so the two compose: Semi-Pro
// eases the field a little on top of whatever level is set. Every consumer of
// AI pace goes through here — the cars themselves and the qualifying simulator
// alike — so a simulated timesheet is always the pace you are actually racing.
const paceMul = () => (assisted() ? CONFIG.assist.aiPace / CONFIG.aiPace : 1) * aiLevel.mul;

/* How much car the opposition is given, above Legend and nowhere else. It is a
   pair, and it only works as a pair: it multiplies the speed the AI asks for AND
   the grip and yaw rate it is given in stepCar to hold that speed. Apply one
   without the other and the setting either does nothing (more car, same request)
   or turns into understeer (more request, same car).

   The player never sees it — stepCar reads it only for cars that are not theirs —
   which is the point: at this end of the range the field is not driving better,
   it is driving something better, because Legend is already the standard machine
   driven perfectly. Levels at or below Legend carry hand: 1, so this is inert for
   the whole of the range that existed before it, saves included. */
const handMul = () => aiLevel.hand || 1;

const State = { MENU: "menu", GRID: "grid", COUNT: "count", RACING: "racing", PAUSED: "paused",
                COOLDOWN: "cooldown", RESULT: "result", DEV: "dev", CHAMPION: "champion",
                GARAGE: "garage", SETTINGS: "settings", CAREERS: "careers",
                QUALI: "quali", QUALIRES: "qualires", FORMATION: "formation",
                // The twenty-year career
                REVIEW: "review",       // the six-race verdict, and who lost a seat
                MARKET: "market",       // the winter, and what is on the table
                INVITE: "invite",       // an elite one-off, offered
                OVER: "over",           // the career summary, once it has ended
                HALL: "hall",           // the honours board
                // Highlights
                REELS: "reels",         // the saved reels, listed
                REPLAY: "replay",       // ...and one of them playing
                // The demo build, and only the demo build, can reach this one.
                DEMOEND: "demoend" };   // six races, a review and a factory, and stop

// Losing a championship somebody is twenty rounds into should take more than one
// keystroke. SHIFT+slot arms it, and an armed slot offers the two destructive
// things you might want: the same combination again deletes it, N starts a fresh
// championship over the top of it. Anything else changes its mind.
let armedSlot = -1;

/* Moving a save in or out of this browser, on the careers screen. `transferMsg`
   is whatever the last attempt has to say for itself — { text, bad } — and
   clears on the next keystroke the way an armed slot does. `pendingSave` is a
   file that has been read and understood but NOT yet let near storage; loading
   it replaces all six slots, so it waits for a second press first. */
let transferMsg = null;
let pendingSave = null;

/* Simulating a race you don't want to drive.

   There is no second model of a grand prix here and there deliberately isn't
   one: a simulated race is the REAL race, stepped as fast as the machine will
   go with nobody watching and your car handed to the AI. Every failure roll,
   pit stop, team order and points calculation is the one that would have
   happened had you sat through it, because it is literally the same code.

   It runs in slices inside the frame loop rather than one blocking gulp, so a
   twenty-one lap race does not freeze the tab for a second and a half. */
let simRun = null;              // { steps, cap } while a race is being simulated
let lastRaceSimulated = false;  // for the result screen to own up about it
let state = State.MENU;

// Which kind of session the cars on track are running. Lap counting, pit stops,
// failures and the finish line all behave differently in qualifying, and this
// is the single flag they branch on rather than each inventing its own test.
let session = "race";   // "race" | "quali"

/* The qualifying weekend. Rebuilt from scratch by startQuali(); `grid` is the
   only part the race itself reads. */
let qual = null;
function freshQuali() {
  return {
    seg: 0,                 // 0 = Q1, 1 = Q2, 2 = Q3
    clock: 0,               // seconds of running left
    flagged: false,         // chequered shown; cars may finish the lap they're on
    grace: 0,
    entrants: [],           // driver ids out in this segment
    times: [{}, {}, {}],    // per segment: id -> best lap
    knocked: [[], []],      // ids eliminated after Q1 and after Q2, quickest first
    grid: null,             // the finished starting order, once all three are run
    live: false,            // is the player driving this segment
    /* How well each car is working THIS WEEKEND — a lap-time multiplier rolled
       once, here, and held for all three segments. Rolled for the whole grid
       including seat 0: a simulated player car is modelled like any other, and
       a driven one never reads this at all, exactly as it never reads
       CONFIG.quali.pace. See qualiForm. */
    form: DRIVERS.map(() => 1 + gauss() * CONFIG.quali.formSd),
  };
}

/* A car's weekend form, safe to ask for at any time. Answers 1 — no effect —
   when there is no qualifying session, which covers an elite one-off (its grid
   comes off pace in gridOrder and it never runs a session) and any entry list
   longer than the one the form was rolled for. */
function qualiForm(id) {
  const f = qual && qual.form ? qual.form[id] : null;
  return f > 0 ? f : 1;
}

// The formation lap: one parametric walk of the field round the lap and back
// onto the grid. Nothing here is simulated physics — see updateFormation.
let formation = null;
let paceCar = null;
/* The safety car period, or null when the race is green. Shared with the
   formation lap only in what it DRAWS — a formation lap is a scripted walk
   round with no physics in it, and this is the opposite: every car is still
   being driven, still wearing tyres and still able to pit. The one thing it
   takes away is the ability to pass. */
let safety = null;
let safetyUsed = false;   // one a race, however messy the race gets

let season = null;   // see freshSeason() for the shape

/* An elite one-off in progress. Set for the duration of the invitation race
   and cleared the moment its result has been read — everything that must NOT
   treat the race as a championship round (the log, the points, the calendar,
   the objectives) branches on this one flag rather than each working it out. */
let eliteRun = null;      // { ev, circuit } while an invitation is being raced
let eliteResult = null;   // the finished one, for its result screen
let pendingInvite = null; // an invitation on the table, awaiting an answer

// The verdicts from the six-race review just run, kept so the screen shows
// what actually happened rather than re-deriving it and possibly disagreeing.
let lastReview = null;

/* =========================================================================
   THE HONOURS BOARD

   Every career that ends — the player's, and the notable ones the AI have —
   leaves a line here. It is the only thing in the game that outlives a save
   slot, which is the point of it: the six slots are where championships are
   played, and this is where they are remembered.
   ========================================================================= */
function loadHall() {
  const h = store.get(K_HALL, null);
  return Array.isArray(h) ? h.filter(r => r && typeof r === "object") : [];
}
let hall = [];

// One finished career, flattened to the numbers worth keeping. Written the
// moment a career ends and never edited afterwards.
function recordCareer(p) {
  if (!p) return;
  const st = p.stats;
  const rec = {
    name: p.name,
    player: !!p.isPlayer,
    seasons: st.seasons,
    from: p.debut,
    to: career ? career.year : p.debut,
    age: p.age,
    starts: st.starts, wins: st.wins, podiums: st.podiums, poles: st.poles,
    points: Math.round(st.points), fl: st.fl, dnf: st.dnf,
    titles: st.titles, cTitles: st.cTitles, best: st.best,
    elite: (st.elite || []).slice(),
    endedBy: p.endedBy || CAREER_END.age.key,
    when: Date.now(),
  };
  hall.unshift(rec);
  hall.length = Math.min(hall.length, 60);
  store.set(K_HALL, hall);
  return rec;
}

// Ranked for the board: titles first, then wins, then podiums. A career is
// remembered for what it won, not for how long it lasted.
function hallOrder() {
  return hall.slice().sort((a, b) =>
    (b.titles - a.titles) || (b.wins - a.wins) || (b.podiums - a.podiums) || (b.points - a.points));
}

// Pit-wall radio. `prio` stops a rival's retirement stomping on the message
// telling the player their own car is about to expire.
let radioText = "", radioTimer = 0, radioPrio = 0;
function radio(text, secs = 4.5, prio = 1) {
  if (radioTimer > 0 && prio < radioPrio) return;
  radioText = text;
  radioTimer = secs;
  radioPrio = prio;
  beep(880, 0.06, "sine", 0.035);
  setTimeout(() => beep(1320, 0.07, "sine", 0.03), 70);
  // After the two-tone click, so the voice lands behind the radio blip.
  setTimeout(() => speak(text), 150);
}

// The on-canvas car, redrawn as inline SVG so the tables and the track agree.
// Nose points right, same proportions as drawF1Car.
// The same car as drawF1Car, at the same 2.8:1 proportions — nose right, rear
// wing narrow, front wing wide, fat rear tyres. Drawn in a 24 x 9 box so a row
// of them in a table reads as a grid of cars rather than a row of bricks.
function carGlyph(colour, accent, w, cam) {
  const s = w || 26;
  const camFill = cam === "dark" ? "rgba(10,14,20,.66)" : "rgba(255,255,255,.46)";
  return `<svg viewBox="0 0 24 9" width="${s}" height="${(s * 9 / 24).toFixed(2)}" ` +
    `style="vertical-align:-1px;flex:none;overflow:visible">` +
    // tyres — rears (left) deliberately fatter than fronts (right)
    `<rect x="2.1" y="0.15" width="3.1" height="1.8" fill="#15181d"/>` +
    `<rect x="2.1" y="7.05" width="3.1" height="1.8" fill="#15181d"/>` +
    `<rect x="17.9" y="0.35" width="3.1" height="1.4" fill="#15181d"/>` +
    `<rect x="17.9" y="7.25" width="3.1" height="1.4" fill="#15181d"/>` +
    // rear wing: narrow
    `<rect x="0.2" y="2.2" width="1.9" height="4.6" fill="${colour}"/>` +
    `<rect x="0.2" y="2.2" width="0.7" height="4.6" fill="rgba(255,255,255,.22)"/>` +
    // body: wide sidepods, waisted to the rear, long narrow nose
    `<path d="M2.6 4.5 L3.5 3.2 L6.3 2.6 L8.6 1.15 L12.6 1.0 L14.4 1.95` +
    ` L16.6 2.9 L21.4 3.75 L22.9 3.85 L22.9 5.15 L21.4 5.25 L16.6 6.1` +
    ` L14.4 7.05 L12.6 8.0 L8.6 7.85 L6.3 6.4 L3.5 5.8 Z" fill="${colour}"/>` +
    // front wing: the widest part of the car
    `<rect x="20.9" y="0.5" width="1.6" height="8" fill="${colour}"/>` +
    `<rect x="21.7" y="0.5" width="0.8" height="8" fill="rgba(255,255,255,.20)"/>` +
    // camera pod down the spine — light on the lead car, dark on the second
    `<rect x="2.9" y="4.0" width="8.4" height="1.0" fill="${camFill}"/>` +
    // cockpit and helmet
    `<ellipse cx="13.6" cy="4.5" rx="2.0" ry="1.35" fill="#10131a"/>` +
    `<ellipse cx="13.4" cy="4.5" rx="1.1" ry="0.95" fill="${accent}"/>` +
    `</svg>`;
}

// Glyph for a driver by index — the tables all want the same three fields.
function glyph(id, w) {
  const d = DRIVERS[id];
  return carGlyph(d.colour, d.accent, w, d.cam);
}

function fmtTime(t) {
  if (t == null || !isFinite(t)) return "—";
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s < 10 ? "0" : ""}${s.toFixed(2)}`;
}

/* =========================================================================
   Season
   ========================================================================= */
// One shape, one place. Both a new season and the fallback the boot code needs
// come from here, so a field can never be added to one and forgotten in the
// other — which is exactly how the banks would end up undefined on first run.
function freshSeason() {
  return {
    round: 0,
    points: DRIVERS.map(() => 0),        // per CAR — this is the constructors' table
    bank:   TEAMS.map(t => t.funding),   // $m in hand
    earned: TEAMS.map(() => 0),          // prize money won so far, for the finance table
    dev:    TEAMS.map(() => newDev()),
    devLog: [],                          // one entry per development window, in order
    // Every round's finishing order, kept per PERSON. Objectives, form, the
    // record books and the hall of fame are all counted off this rather than
    // off running totals, so reloading a save can never change a verdict.
    log: [],                             // { round, results: [{pid, seat, pos, pts, dnf, pole}] }
    objectives: null,                    // the block currently being judged
    block: 0,                            // which six-race block that is
    news: [],                            // silly-season and objective headlines, newest first
    elite: [],                           // elite invitations offered this season
  };
}
/* =========================================================================
   CAREERS — several championships on the go at once.

   A career is a season plus the settings it is being played under, so loading
   one puts back the difficulty, the race length and the qualifying format it
   was started with rather than whatever was last used somewhere else. Saving
   is automatic: every race result and every development window writes to the
   slot that is loaded.
   ========================================================================= */
const CAREER_SLOTS = 6;
let careers = [];
let activeCareer = 0;
// The career currently loaded — the twenty-year run the season in play belongs
// to. Every people lookup goes through this, so it is set before `season` is.
let career = null;

// Only resume a save that is actually resumable — a finished or malformed one
// would index CIRCUITS out of range and take the whole game down. Anything
// merely INCOMPLETE is repaired rather than refused: money and development
// arrived after seasons were already being saved, and a championship somebody
// is halfway through is not worth throwing away over a missing field.
//
// The grid and the calendar are both edited between versions, and a season that
// no longer matched them used to be REFUSED here — which deleted the career on
// the next load with nothing on screen to say why. A season that has outgrown
// its calendar is now resized to fit, exactly as the roster is further down:
// the player loses a stale detail rather than the whole championship.
function repairSeason(s) {
  if (!s || typeof s !== "object") return null;
  // Still refuse an object that is not a season at all, or the legacy
  // single-slot path in loadCareers would mint a career out of anything.
  if (typeof s.round !== "number" && !Array.isArray(s.points)) return null;

  if (typeof s.round !== "number" || !isFinite(s.round)) s.round = 0;
  /* A season saved against a longer calendar sits at the last round it can
     still race, rather than being thrown away for pointing past the end.

     The ceiling is seasonRounds, NOT seasonRounds - 1. `round === seasonRounds`
     is a legal, meaningful state — it is what "every race has been run" is, and
     it is the state the game sits in while the champion screen is waiting to be
     read. Clamping it down by one silently rewound a completed season to its
     last grand prix, so closing the tab on that screen and coming back made you
     drive the final round twice. The demo turned a rare annoyance into the
     normal path: it deliberately ends with the season on its last flag, so
     every player who closed the tab after their sixth race was handed a
     seventh. resumeCareer() is what decides where that state leads. */
  s.round = Math.max(0, Math.min(Math.floor(s.round), CONFIG.seasonRounds));
  // Points are per SEAT, so the index is the identity: a seat that still exists
  // keeps its tally, and one the grid has just gained starts on nothing.
  if (!Array.isArray(s.points) || s.points.length !== DRIVERS.length) {
    const had = Array.isArray(s.points) ? s.points : [];
    s.points = DRIVERS.map((_, i) =>
      (typeof had[i] === "number" && isFinite(had[i])) ? had[i] : 0);
  }
  if (!Array.isArray(s.bank)   || s.bank.length   !== TEAMS.length) s.bank   = TEAMS.map(t => t.funding);
  if (!Array.isArray(s.earned) || s.earned.length !== TEAMS.length) s.earned = TEAMS.map(() => 0);
  if (!Array.isArray(s.dev)    || s.dev.length    !== TEAMS.length) s.dev    = TEAMS.map(() => newDev());
  // ...and fill in any single stat a future version might add, per team.
  s.dev = s.dev.map(d => Object.assign(newDev(), (d && typeof d === "object") ? d : {}));
  s.bank = s.bank.map(v => (typeof v === "number" && isFinite(v)) ? v : 0);
  if (!Array.isArray(s.devLog)) s.devLog = [];
  // Fields the twenty-year career added. A championship somebody is halfway
  // through predates all of them and is worth more than a clean shape.
  if (!Array.isArray(s.log))     s.log = [];
  // A result recorded at a round the calendar no longer has would be counted by
  // the record books against a race that does not exist.
  s.log = s.log.filter(e => e && typeof e.round === "number" &&
                            e.round >= 0 && e.round < CONFIG.seasonRounds);
  if (!Array.isArray(s.news))    s.news = [];
  if (!Array.isArray(s.elite))   s.elite = [];
  if (typeof s.block !== "number") s.block = Math.floor(s.round / CONFIG.devEvery);
  if (!Array.isArray(s.objectives)) s.objectives = null;
  return s;
}

// The settings a career remembers, read off whatever is current.
function currentSettings() {
  return { mode, ai: aiLevel.key, len: raceLen.key,
           quali: qualiMode, qsecs: qualiSecs, formation: formationOn };
}

/* --- A career -------------------------------------------------------------
   Twenty seasons, one driver, one record. `seasons` counts COMPLETED years, so
   a brand new career is year 1 with a seasons count of zero. Unlike the old
   single-season save, almost everything now survives the winter: the roster
   and its ages, who drives for whom, what everyone has won, and the twenty-year
   clock itself. What does NOT survive is the car — every team still starts
   each year on its own budget with no development carried over, because that
   is what made the arms race worth running in the first place. ------------ */
function makeCareer(name) {
  const { people, nextPid } = freshRoster();
  return Object.assign({
    name, season: freshSeason(), started: Date.now(), saved: Date.now(),
    seasons: 0, titles: 0, cTitles: 0,
    year: 1,                       // 1 .. CONFIG.career.years
    roster: people,
    nextPid,
    // The car identity of each of the twenty-two seats, so a career remembers
    // its transfers. Dealt from the factory plan rather than from whatever the
    // last career left lying around — but keeping whatever the garage has been
    // repainted to, since that is the player's and not the career's.
    seats: factorySeats(),
    history: [],                   // one entry per completed season
    // Dealt from the factory table, which already starts the player at the
    // back — so the one-time move in migrateStartTeam must never touch this.
    startTeamSet: true,
    offers: null,                  // seats on the table for the player, if any
    ended: null,                   // { year, age, reason, at } once it is over
    eliteDone: 0,                  // invitations taken this season
  }, currentSettings());
}

/* A career read off storage might predate any of this. Rather than refuse it —
   which would silently delete somebody's championship — it is rebuilt into the
   new shape around whatever survived, and the roster is dealt fresh from the
   grid as it stands. They lose the ages they never had; they keep the season. */
function repairCareer(c) {
  if (!c || typeof c !== "object") return null;
  // A season too far gone to rebuild costs the player the year in progress, not
  // the twenty-year record: the titles, the history and the roster outlive it.
