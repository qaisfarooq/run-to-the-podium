  const s = repairSeason(c.season) || freshSeason();
  const out = Object.assign({}, c, { season: s,
    seasons: tally(c.seasons), titles: tally(c.titles), cTitles: tally(c.cTitles) });
  out.year = (typeof c.year === "number" && c.year >= 1) ? Math.floor(c.year) : tally(c.seasons) + 1;
  if (!Array.isArray(out.history)) out.history = [];
  if (typeof out.eliteDone !== "number") out.eliteDone = 0;
  if (!Array.isArray(out.seats) || out.seats.length !== DRIVERS.length) {
    out.seats = SEAT_STOCK.map(x => Object.assign({}, x));
  }
  // A roster is only usable if it actually seats a full grid and contains the
  // player. Anything less is a save from before people existed.
  const ok = Array.isArray(out.roster) && out.roster.length >= DRIVERS.length &&
             out.roster.some(p => p && p.isPlayer) &&
             DRIVERS.every((d, i) => out.roster.some(p => p && p.seat === i));
  if (!ok) {
    const fresh = freshRoster();
    out.roster = fresh.people;
    out.nextPid = fresh.nextPid;
  } else {
    // Fill in any per-person field a later version added, without touching
    // what is already there.
    out.roster = out.roster.map(p => Object.assign(makePerson({}), p, {
      stats: Object.assign(makePerson({}).stats, p.stats || {}),
      year:  Object.assign(blankYear(), p.year || {}),
      form:  Array.isArray(p.form) ? p.form : [],
    }));
    if (typeof out.nextPid !== "number")
      out.nextPid = out.roster.reduce((m, p) => Math.max(m, p.pid), 0) + 1;
  }
  return out;
}

// A count read off a save that might predate it, or have been hand-edited.
const tally = v => (typeof v === "number" && isFinite(v) && v > 0) ? Math.floor(v) : 0;

// Put a career's settings back into play. Anything unrecognised — a level
// renamed in a later version, say — falls back to what is already loaded
// rather than leaving the game in a state with no difficulty at all.
function applyCareerSettings(c) {
  setMode(c.mode === "pro" ? "pro" : "semi");
  aiLevel = CONFIG.aiLevels.find(l => l.key === c.ai) || aiLevel;
  raceLen = CONFIG.raceLengths.find(l => l.key === c.len) || raceLen;
  if (QUALI_MODES.some(m => m.key === c.quali)) qualiMode = c.quali;
  if (CONFIG.quali.times.includes(c.qsecs)) qualiSecs = c.qsecs;
  if (typeof c.formation === "boolean") formationOn = c.formation;
}

function loadCareers() {
  let list = store.get(K_CAREERS, null);
  if (!Array.isArray(list)) {
    // First run under the new scheme. A single-slot save from before careers
    // existed is not discarded — it becomes career one.
    list = new Array(CAREER_SLOTS).fill(null);
    const old = repairSeason(store.get(K_SEASON, null));
    if (old) list[0] = Object.assign(makeCareer("Career 1"), { season: old });
  }
  list.length = CAREER_SLOTS;
  // Saves written before the honours board existed simply start from zero —
  // there is no record of what they won, and a wrong number is worse than none.
  return Array.from(list, c => repairCareer(c));
}

function saveCareers() { store.set(K_CAREERS, careers); }

const firstFreeSlot = () => careers.findIndex(c => !c);

function newSeason(slot) {
  const i = slot != null ? slot : (firstFreeSlot() >= 0 ? firstFreeSlot() : activeCareer);
  careers[i] = makeCareer(`Career ${i + 1}`);
  activeCareer = i;
  career = careers[i];
  season = career.season;
  applyCareerSeats(career);
  syncSeats();
  // Before openBlock, which sets the objectives: a rookie in a backmarker must
  // be judged against the team he is actually in, not the one he started the
  // function in. saveSeason below captures the swapped seats into the career.
  seatTheRookie();
  openBlock();
  saveSeason();
}

/* --- Seats, in and out of storage -----------------------------------------
   Which team each of the twenty-two cars belongs to is career state, not
   global state: two careers five years apart have entirely different grids.
   These two put that on and take it off again. ---------------------------- */
function applyCareerSeats(c) {
  if (!c || !Array.isArray(c.seats)) return;
  c.seats.forEach((s, i) => {
    if (!DRIVERS[i] || !s) return;
    if (typeof s.team === "number" && TEAMS[s.team]) DRIVERS[i].team = s.team;
    if (isHex(s.colour)) DRIVERS[i].colour = s.colour;
    if (isHex(s.accent)) DRIVERS[i].accent = s.accent;
    if (s.cam === "light" || s.cam === "dark") DRIVERS[i].cam = s.cam;
  });
  reseatTeams();
}
function captureSeats() {
  return DRIVERS.map(d => ({ team: d.team, colour: d.colour, accent: d.accent, cam: d.cam }));
}

/* The seating plan a NEW career starts from: the factory's team allocation and
   camera pods, with whatever colours the garage has been repainted to. The two
   halves come from different places on purpose — which team a car belongs to
   is the career's business and resets, what colour it is painted is the
   player's and does not. */
/* --- Starting at the back, for a career that did not ----------------------
   The grid was rebuilt to put the player at Umbra. A NEW career picks that up
   for free, because factorySeats() below deals from the factory table — but a
   career saved before the change carries its own seating plan, and
   applyCareerSeats writes that straight back over the top. Left alone, an
   existing championship would keep its old drive for ever and the change would
   look like it had simply not worked.

   So it is moved across once. The player and whoever holds the Umbra seat swap
   cars outright rather than one displacing the other, which keeps twenty-two
   drivers in twenty-two seats and leaves no ghost for the market to tidy up
   mid-season. Points, history and age all belong to the PERSON, so they come
   with the player; only the car changes hands.

   `startTeamSet` is stamped whatever happens, including on the careers this
   does nothing to, so it can never run twice. makeCareer stamps it too — a new
   career already starts here, and without the stamp this would drag the player
   back to Umbra every time they loaded a save after earning a better drive.
   Which is the one thing it must not do: after round one, where you drive is
   the market's business. ------------------------------------------------- */
const START_TEAM = 10;   // Umbra — smallest budget on the grid, and fragile with it

function migrateStartTeam(c) {
  if (!c || c.startTeamSet) return;
  c.startTeamSet = true;
  const me = playerPerson();
  // Nothing to do for a career already there, or one the player has no seat in
  // — a driver between drives gets their next one from the market, not here.
  if (!me || me.seat !== 0 || DRIVERS[0].team === START_TEAM) return;
  const target = TEAMS[START_TEAM].drivers.find(i => i !== 0);
  if (target === undefined) return;
  // Empty both seats before swapping, for the reason movePlayerToSeat spells
  // out: personAt finds the player first, so asking who sits in the target
  // while the player still points at it loses the driver being moved.
  const other = personAt(target);
  me.seat = -1;
  if (other) other.seat = -1;
  swapSeatIdentity(0, target);
  me.seat = 0; me.status = "racing";
  if (other) { other.seat = target; other.status = "racing"; }
  syncSeats();
  rerollObjectives([0, target]);
  c.seats = captureSeats();
  saveCareers();
}

function factorySeats() {
  const L = store.get(K_LIVERY, null);
  return SEAT_STOCK.map((s, i) => {
    const liv = (L && Array.isArray(L.drivers)) ? L.drivers[i] : null;
    return { team: s.team, cam: s.cam, accent: s.accent,
             colour: (liv && isHex(liv.colour)) ? liv.colour : s.colour };
  });
}

// Autosave. Everything the career is playing under is captured alongside the
// season, so a setting changed mid-championship is remembered by THAT career
// and does not follow you into another one.
function saveSeason() {
  const c = careers[activeCareer];
  if (!c) return;
  Object.assign(c, currentSettings(), { season, saved: Date.now() });
  /* NOT during an elite event. DRIVERS is holding thirty-three stock car
     entries at that moment, and capturing it would write them into the career
     as its permanent grid — which is the sort of save corruption you only
     find out about two seasons later. */
  if (!eliteRun) c.seats = captureSeats();
  saveCareers();
}

/* =========================================================================
   THE MARKET — who drives what, and who decides.

   A seat comes free for one of four reasons: the driver was released on
   results, he was hurt, he retired, or his team stopped existing. All four
   land here, and the seat is filled the same way each time — the team looks at
   who is available and takes the best of them, where "best" is REPUTATION and
   not ability, because a team cannot see ability any more than we can.

   That gap is the whole drama of the thing. A rookie whose reputation has not
   caught up with him is the bargain of the decade. A former champion coasting
   on a name is the signing that ends a team principal's year. Neither is
   knowable in advance, by them or by the player.
   ========================================================================= */

function newsAdd(text, kind) {
  if (!season) return;
  season.news.unshift({ round: season.round, year: career ? career.year : 1, text, kind: kind || "market" });
  season.news.length = Math.min(season.news.length, 40);
}

// What a team sees when it looks at a driver. Reputation dominates; a little
// noise stands in for everything a paddock argues about and cannot measure.
function candidateScore(p, ti) {
  const young = p.age <= 24 ? 0.05 : 0;
  const old   = p.age >= AGE.oldAge ? -0.10 - (p.age - AGE.oldAge) * 0.03 : 0;
  // A team near the front can afford to want a proven name; one at the back
  // takes a punt on youth because that is all that will sign for them.
  const tier = teamTier(ti);
  const punt = tier === "back" ? young * 2 : young;
  return p.rep + punt + old + (Math.random() - 0.5) * 0.12;
}

// Everyone who could take a seat right now, best first as the team sees it.
function marketFor(ti, exclude) {
  return freeAgents()
    .filter(p => !p.isPlayer && p !== exclude && p.age < AGE.hardStop)
    .map(p => ({ p, s: candidateScore(p, ti) }))
    .sort((a, b) => b.s - a.s)
    .map(x => x.p);
}

/* Fill one empty seat. A team at the sharp end will look at a driver already
   under contract somewhere slower and simply take him, which opens THAT seat —
   so the call recurses, with a depth guard, and one retirement at the front of
   the grid can move four drivers. Which is exactly how a silly season goes. */
/* `exclude` is the driver who has just been put out of THIS seat, and the one
   person who cannot have it back. Without it a sacking undid itself on the
   spot: the released driver lands in the free-agent pool a line before the
   seat is refilled, he is by some distance the best man available to a team
   that has just lost a driver, and so the team announces it has released him
   and then signs him back into the same car. It read as the review doing
   nothing, because for everyone except the player that is exactly what it did.

   Barred from this seat only. Another team taking on a driver dropped
   mid-season is a real thing that happens and is left alone. */
function fillSeat(seat, depth, exclude) {
  if (personAt(seat)) return null;
  const ti = DRIVERS[seat].team;
  const free = marketFor(ti, exclude);
  let pick = free[0] || null;

  // Poaching: only downward, only by a team meaningfully better placed, and
  // only if the target is clearly better than the best free agent going.
  if ((depth || 0) < 3) {
    const mine = teamRank(ti);
    const poachable = racingDrivers()
      .filter(p => !p.isPlayer && p.seat !== seat && teamRank(DRIVERS[p.seat].team) > mine + 2)
      .map(p => ({ p, s: candidateScore(p, ti) }))
      .sort((a, b) => b.s - a.s)[0];
    if (poachable && (!pick || poachable.s > candidateScore(pick, ti) + 0.10)) {
      const from = poachable.p.seat;
      const fromTeam = TEAMS[DRIVERS[from].team].name;
      poachable.p.seat = -1;
      seatPerson(poachable.p, seat);
      newsAdd(`${poachable.p.name} leaves ${fromTeam} for ${TEAMS[ti].name}.`, "move");
      fillSeat(from, (depth || 0) + 1);
      return poachable.p;
    }
  }

  if (!pick) {
    // Nobody left on the market at all — the career has run the pool dry, so a
    // rookie is promoted out of nowhere rather than leaving a car unentered.
    pick = makeRookie(career.year, career.nextPid++, roster());
    career.roster.push(pick);
    newsAdd(`${TEAMS[ti].name} hand a debut to ${pick.name} — there was nobody else.`, "rookie");
  } else {
    newsAdd(`${TEAMS[ti].name} sign ${pick.name}${pick.rookie ? " for his first season" : ""}.`, "sign");
  }
  seatPerson(pick, seat);
  return pick;
}

// Every empty seat on the grid, filled. Run after any batch of departures.
function fillAllSeats() {
  DRIVERS.forEach((d, i) => { if (!personAt(i)) fillSeat(i, 0); });
  syncSeats();
}

/* --- Ending a driving career ---------------------------------------------
   One place, so a driver who stops always stops the same way: the seat is
   given up, the season's numbers are folded into the lifetime record, and the
   reason is written down. Retiring the PLAYER additionally stops the game and
   sends it to the summary, which is the only branch that differs. --------- */
function endDriverCareer(p, reason) {
  if (!p || p.status === "retired") return;
  bankSeason(p);
  // The car is still entered whoever stops driving it — the player's included.
  // Leaving seat 0 empty because the player walked away would put twenty-one
  // cars on the grid for every remaining race.
  if (p.seat >= 0) { const s = p.seat; p.seat = -1; fillSeat(s, 0); }
  p.status = "retired";
  p.retiredIn = career.year;
  p.endedBy = reason.key;
  if (p.isPlayer) {
    career.ended = { year: career.year, age: p.age, reason: reason.key, round: season.round };
    recordCareer(p);
  } else {
    newsAdd(`${p.name} — ${reason.label.toLowerCase()} after ${p.stats.seasons} season${p.stats.seasons === 1 ? "" : "s"}.`, "retire");
    /* A driver worth remembering goes on the board beside the player. Not
       everybody does: a career of two seasons and no points is not history,
       it is a footnote, and a board with sixty of them on it tells you nothing
       about the ones that mattered. */
    const st = p.stats;
    if (st.titles > 0 || st.wins >= 3 || (st.seasons >= 8 && st.podiums >= 5)) recordCareer(p);
  }
  syncSeats();
}

// Fold a season's numbers into a lifetime record. Called once per driver per
// season, from the winter or from the moment they stop, never from both.
function bankSeason(p) {
  if (!p || p.banked === career.year) return;
  p.banked = career.year;
  const y = p.year, st = p.stats;
  if (y.starts) st.seasons += 1;
  st.starts  += y.starts;  st.wins    += y.wins;
  st.podiums += y.podiums; st.poles   += y.poles;
  st.points  += y.points;  st.fl      += y.fl;
  st.dnf     += y.dnf;
  const pos = championshipOrder().indexOf(p.seat) + 1;
  if (p.seat >= 0 && pos > 0) st.best = st.best ? Math.min(st.best, pos) : pos;
}

/* --- Reputation -----------------------------------------------------------
   What the paddock thinks, updated once a year off what actually happened.
   It moves slowly in both directions: one good season does not make a name and
   one bad one does not destroy it, which is why an ageing driver can hold a
   seat two years longer than his lap times deserve. ---------------------- */
function updateReputation(p) {
  if (!p) return;
  const y = p.year;
  if (!y.starts) { p.rep = clamp(p.rep - 0.04, 0.05, 1); return; }   // a year on the bench costs you
  const scoring = CONFIG.points[0] * CONFIG.seasonRounds;
  const share = clamp(y.points / (scoring * 0.35), 0, 1.4);
  const target = clamp(0.18 + share * 0.6 + y.wins * 0.035 + y.podiums * 0.012, 0.05, 1);
  p.rep = clamp(p.rep + (target - p.rep) * 0.45, 0.05, 1);
}

/* =========================================================================
   THE WINTER — one season ends, the next one is dealt.

   Order matters here and is worth stating, because every one of these steps
   can move a driver and several of them can move the same driver twice:
   bank the year, hand out the titles, age everybody, let the hurt recover,
   retire whoever is finished, fold whoever is broke, sack whoever is not
   wanted, bring in the intake, then fill what is left. Only after all of that
   is the player asked what they want to do, because only then is the grid
   they are choosing from actually true.
   ========================================================================= */
function rolloverSeason() {
  const c = careers[activeCareer];
  if (!c || !season) { newSeason(activeCareer); return; }
  const me = playerPerson();

  // --- 1. the year that just finished, written down -----------------------
  const champSeat = championshipOrder()[0];
  const champ = personAt(champSeat);
  const cOrder = constructorOrder();
  racingDrivers().forEach(p => bankSeason(p));
  roster().forEach(p => { if (p.status !== "retired") bankSeason(p); });
  if (champ) champ.stats.titles += 1;
  cOrder[0] != null && TEAMS[cOrder[0]].drivers.forEach(s => {
    const p = personAt(s); if (p) p.stats.cTitles += 1;
  });
  c.seasons = tally(c.seasons) + 1;
  if (me && champ === me)                 c.titles  = tally(c.titles) + 1;
  if (me && me.seat >= 0 && cOrder[0] === myTeam()) c.cTitles = tally(c.cTitles) + 1;

  c.history.push({
    year: c.year,
    champion: champ ? champ.pid : null,
    championName: champ ? champ.name : "—",
    constructors: cOrder.slice(),
    player: me ? { pos: championshipOrder().indexOf(me.seat) + 1, points: me.year.points,
                   wins: me.year.wins, podiums: me.year.podiums,
                   team: me.seat >= 0 ? DRIVERS[me.seat].team : -1 } : null,
  });

  // --- 2. reputations, then a year on everyone ----------------------------
  roster().forEach(p => { if (p.status !== "retired") updateReputation(p); });
  roster().forEach(p => {
    if (p.status === "retired") return;
    p.age += 1;
    p.rookie = false;
    p.year = blankYear();
    p.form = [];
    p.warnings = 0;
    if (p.hurt > 0) p.hurt -= 1;
  });

  // --- 3. who stops ------------------------------------------------------
  roster().slice().forEach(p => {
    if (p.status === "retired" || p.isPlayer) return;
    if (p.age >= AGE.hardStop) { endDriverCareer(p, CAREER_END.age); return; }
    // Past the age teams look away, a driver with nothing to show for the year
    // is finished. A reputation still worth having buys another season.
    if (p.age >= AGE.oldAge && p.rep < 0.34 + (p.age - AGE.oldAge) * 0.06) {
      endDriverCareer(p, CAREER_END.age); return;
    }
    // A reserve nobody has called in two years gives up.
    if (p.seat < 0 && p.age >= 28 && Math.random() < 0.35) endDriverCareer(p, CAREER_END.dropped);
  });

  // --- 4. who runs out of money ------------------------------------------
  foldBrokeTeams();

  // --- 5. contracts not renewed ------------------------------------------
  // A driver who ended the year on a warning and delivered nothing after it is
  // let go over the winter rather than mid-season, which is how it usually
  // happens and gives the player a season to save themselves.
  racingDrivers().slice().forEach(p => {
    if (p.isPlayer || p.status === "retired") return;
    const t = DRIVERS[p.seat] ? DRIVERS[p.seat].team : -1;
    if (t < 0) return;
    const expectation = teamTier(t) === "front" ? 0.52 : teamTier(t) === "mid" ? 0.34 : 0.18;
    if (p.rep < expectation && Math.random() < 0.55) {
      const seat = p.seat, name = TEAMS[t].name;
      p.seat = -1; p.status = "reserve";
      newsAdd(`${name} do not renew ${p.name}.`, "drop");
      syncSeats();
      fillSeat(seat, 0);
    }
  });

  // --- 6. the intake -----------------------------------------------------
  const K = CONFIG.career;
  const n = K.intake[0] + Math.floor(Math.random() * (K.intake[1] - K.intake[0] + 1));
  for (let i = 0; i < n; i++) {
    const r = makeRookie(c.year + 1, c.nextPid++, roster());
    c.roster.push(r);
  }
  // Keep a usable bench, so a mid-season vacancy always has somebody to fill it.
  while (freeAgents().length < K.benchMin) {
    const r = makeRookie(c.year + 1, c.nextPid++, roster());
    r.rookie = false;
    c.roster.push(r);
  }

  // --- 7. the grid, filled ------------------------------------------------
  fillAllSeats();

  // --- 8. and only now, the player ---------------------------------------
  c.year += 1;
  c.season = freshSeason();
  season = c.season;
  c.eliteDone = 0;
  season.news = [];

  if (me && me.status !== "retired") {
    if (c.year > K.years) { endDriverCareer(me, CAREER_END.full); saveSeason(); return; }
    c.offers = buildOffers(me);
  }
  openBlock();
  saveSeason();
}

/* --- Teams that stop existing --------------------------------------------
   Broke AND going nowhere, and even then only sometimes. Both cars are put on
   the market at once, which is the single biggest thing that can happen to a
   silly season — and if it is the player's team, the player is in it. ------ */
function foldBrokeTeams() {
  const K = CONFIG.career;
  const order = constructorOrder();
  TEAMS.forEach((t, ti) => {
    if (TEAMS.length <= 6) return;                    // never shrink below a grid
    if (t.folded) return;
    const rank = order.indexOf(ti);
    if (bank(ti) > K.foldBank || rank < K.foldRank) return;
    if (Math.random() > K.foldOdds) return;
    newsAdd(`${t.badge} ${t.name} run out of money — both seats on the market.`, "fold");
    /* Both drivers are out of a job on the same morning, which is the single
       most disruptive thing that can happen to a silly season. A driver young
       enough to be worth a punt goes back on the market; one already at the
       age teams look past does not get another call, and that is his career.

       The entry itself survives: the team is bought out and runs on under the
       same name. Losing a constructor outright would leave twenty cars on a
       grid the whole game is built around being twenty-two of. */
    t.drivers.slice().forEach(seat => {
      const p = personAt(seat);
      if (!p) return;
      p.seat = -1;
      p.status = "reserve";
      if (!p.isPlayer && p.age >= AGE.oldAge) endDriverCareer(p, CAREER_END.folded);
    });
    syncSeats();
  });
}

/* --- What is on the table for the player ---------------------------------
   Offers are the market's verdict on the player expressed as seats. A driver
   the paddock rates gets offered a better car than the one he is in; one it
   does not gets offered whatever is left, or nothing at all. -------------- */
function buildOffers(me) {
  const out = [];
  const held = me.seat;
  DRIVERS.forEach((d, seat) => {
    const sitting = personAt(seat);
    if (seat === held) return;
    const ti = d.team;
    const rank = teamRank(ti);
    // A team will only talk to a driver it rates above the man it has.
    const theirs = sitting ? candidateScore(sitting, ti) : -1;
    const mine   = me.rep + (Math.random() - 0.5) * 0.06;
    const wants  = !sitting || mine > theirs + 0.08;
    if (!wants) return;
    out.push({ seat, team: ti, rank, replacing: sitting ? sitting.name : null });
  });
  // Best three, so the choice is a decision rather than a list of twenty-one.
  out.sort((a, b) => a.rank - b.rank);
  return out.slice(0, 3);
}

function useCareer(i) {
  const c = careers[i];
  if (!c) return false;
  activeCareer = i;
  career = c;
  season = c.season;
  applyCareerSettings(c);
  applyCareerSeats(c);
  syncSeats();
  // Before openBlock, which reads the team to set the objectives.
  migrateStartTeam(c);
  openBlock();
  // After openBlock, which is what decides whether this block's objectives are
  // the ones being repaired or a fresh set that never needed it.
  healStaleObjectives();
  return true;
}

function deleteCareer(i) {
  careers[i] = null;
  saveCareers();
}

// The most recently played career, for the menu's one-key "carry on".
function lastPlayed() {
  let best = -1;
  careers.forEach((c, i) => { if (c && (best < 0 || c.saved > careers[best].saved)) best = i; });
  return best;
}

function loadSeason() { return careers[activeCareer] ? careers[activeCareer].season : null; }

/* =========================================================================
   THE SIX-RACE REVIEW

   Four times a year, on the same rounds the factory opens on, every team looks
   at what it asked its two drivers for and decides whether it got it. A miss
   is a warning. A second miss, or one bad enough on its own, is the seat.

   The player is judged by exactly the same code as the other twenty-one, off
   exactly the same log, which is the only way a sacking is ever going to feel
   like a verdict rather than a scripted event.
   ========================================================================= */

// Open the block the calendar is currently in, if it is not open already.
// Idempotent, because it is called from three places — a new career, a loaded
// one, and the winter — and must not re-roll objectives somebody is mid-way
// through when a save is reopened.
function openBlock() {
  if (!season || !career) return;
  const b = Math.floor(season.round / CONFIG.devEvery);
  if (season.objectives && season.block === b) return;
  /* A block the calendar has walked out of but nobody has judged is not
     finished with — the review is still owed on it, and rolling the objectives
     forward here throws away the very things it was owed on. The old guard
     only covered reopening a save MID-block; crossing a boundary and then
     reloading, which is exactly what closing the tab after race six looks
     like, wiped the block and left the review judging six races nobody had
     driven yet. Every verdict came back "skip", so nobody was ever warned and
     nobody was ever sacked.

     Left standing, closeReview() opens the next block once the verdicts have
     actually been read. A new season is not caught by this: the winter hands
     over a fresh season whose objectives are null. */
  if (season.objectives && season.objectives.length &&
      season.objectives[0].block < b && !season.objectives.some(o => o.judged)) return;
  season.block = b;
  season.objectives = setObjectives(b);
}

// Has the calendar passed a block this season has not yet judged? Asked the
// same way the development window asks it, and for the same reason: closing
// the tab between the flag and the review must not skip the review.
function reviewOwed() {
  if (!season || !season.objectives || !season.objectives.length) return false;
  if (season.objectives.some(o => o.judged)) return false;
  /* Owed from the moment the calendar leaves the block, and STAYS owed until
     it is run. Asked on `round % devEvery === 0` before, which meant a review
     that was missed once — a tab closed on the flag, a career resumed past the
     boundary — was not late, it was gone, and could not come back until the
     next multiple of six happened to line up. A debt does not expire because
     nobody collected it on the day. */
  return season.round >= (season.objectives[0].block + 1) * CONFIG.devEvery;
}

/* Run the review. Every objective is judged, every verdict is acted on, and
   the whole thing is returned so the screen can show what happened rather than
   working it out a second time and possibly disagreeing. */
function runReview() {
  const K = CONFIG.career;
  const verdicts = [];
  season.objectives.forEach(o => judgeObjective(o));

  /* No team sacks both its drivers on the same morning. Whatever else is true
     of a bad six races, somebody has to be in the other car on Sunday and the
     team cannot run two debutants at once — so a team that has already let one
     driver go this review keeps the second, who gets a warning instead.

     Without this the whole grid turns over in a single review the first time
     the midfield has a quiet block, which reads as a bug even when the
     arithmetic behind it is right. */
  const sackedByTeam = new Set();

  season.objectives.forEach(o => {
    const p = personById(o.pid);
    // The driver who set out on this objective may not be in the seat any more.
    if (!p || p.seat !== o.seat || p.status === "retired") { verdicts.push({ o, gone: true }); return; }
    const team = DRIVERS[o.seat].team;
    if (o.met === null) { verdicts.push({ o, p, team, action: "skip" }); return; }
    if (o.met) {
      p.warnings = 0;
      p.rep = clamp(p.rep + 0.03, 0.05, 1);
      verdicts.push({ o, p, team, action: "met" });
      return;
    }
    p.rep = clamp(p.rep - 0.05, 0.05, 1);
    p.warnings += 1;
    const sacked = (o.severity >= K.sackAt || p.warnings > K.warningsAllowed) &&
                   !sackedByTeam.has(team);
    if (!sacked) { verdicts.push({ o, p, team, action: "warned" }); return; }
    sackedByTeam.add(team);

    // The seat is gone. The player is left as a free agent rather than being
    // retired outright — the season is still running, seats still open, and a
    // phone call is still possible.
    const seat = o.seat;
    p.seat = -1;
    p.status = "reserve";
    p.warnings = 0;
    syncSeats();
    const replacement = fillSeat(seat, 0, p);
    if (!p.isPlayer)
      newsAdd(`${TEAMS[team].name} release ${p.name} — ${objectiveText(o).toLowerCase()}, ${objectiveProgress(o)}.`, "drop");
    verdicts.push({ o, p, team, action: "sacked", replacement });
  });

  // Whatever the review moved, the grid still has to be full.
  fillAllSeats();
  saveSeason();
  return verdicts;
}

/* Where a resumed career actually lands. A review or a development window that
   fell due on the last lap of the last session is still due now, and going
   straight to the grid is how a block ends up never being judged at all — the
   review was checked after a race and nowhere else, so stopping for the night
   on the flag of round six stepped over it on the way back in. Both ways back
   into a career come through here so neither can drift from the other. */
function resumeCareer() {
  // A demo career picked up after its last race owes the same three screens in
  // the same order, and for the same reason this function exists at all.
  if (DEMO && season.round >= DEMO_ROUNDS) { goDemoEnding(); return; }
  /* A season with no rounds left goes where the flag of the last one would
     have sent it. Same test, same answer, same order as advanceAfterRace —
     which is the whole point of both routes coming through here. Without it a
     completed season resumed off disk falls through to the grid and asks the
     renderer for a circuit one past the end of the calendar. */
  if (season.round >= CONFIG.seasonRounds) { go(State.CHAMPION); return; }
  if (reviewOwed()) { lastReview = runReview(); go(State.REVIEW); return; }
  if (devWindowOwed()) { openDevWindow(); return; }
  go(State.GRID);
}

// Start the next block once the review has been read.
function closeReview() {
  season.block = Math.floor(season.round / CONFIG.devEvery);
  season.objectives = setObjectives(season.block);
  saveSeason();
}

/* =========================================================================
   INVITATIONS

   Other paddocks watch. Drive a six-race block well enough — a real haul of
   points, or two wins — and somebody asks you to come and race something else
   for a weekend. It is worth nothing to your championship and everything to
   your record, which is exactly the trade a real one-off is.

   Capped at two a season so a dominant year does not become a tour, and each
   event can only be won once per career, so there is always somewhere new to
   be invited to.
   ========================================================================= */
/* Is one of these due, and who is going?

   The events run to their own calendar — twice a season, after the blocks
   named in CONFIG — rather than only when the player has been good. They
   happen whether or not the player is in them, because the paddock does not
   revolve around one driver, and the invitations go to whoever has been
   quickest over the last six races. Very often that is somebody else. */
function eliteDue() {
  if (!career || !season) return null;
  const K = CONFIG.career;
  if (!K.eliteBlocks.includes(season.block)) return null;
  if (season.elite.some(x => x.block === season.block)) return null;   // already run
  if (career.eliteDone >= K.eliteMax) return null;
  // An event nobody on this grid has been to recently, so a career sees all four.
  const seen = new Set(season.elite.map(x => x.key));
  const open = ELITE.filter(e => !seen.has(e.key));
  if (!open.length) return null;
  const ev = open[Math.floor(Math.random() * open.length)];
  const F = ELITE_FIELDS[ev.key];
  const invited = eliteCrossover(F.crossover, season.block - 1);
  if (!invited.length) return null;
  return { ev, invited, playerIn: invited.some(p => p.isPlayer) };
}

// Offered once, recorded either way, so declining an invitation does not leave
// it hanging about to be offered again after the next race.
function offerElite(inv) {
  season.elite.push({ key: inv.ev.key, block: season.block, round: season.round,
                      invited: inv.invited.map(p => p.pid), taken: null });
  saveSeason();
}
function answerElite(accept) {
  const rec = season.elite[season.elite.length - 1];
  if (rec) rec.taken = !!accept;
  if (accept) career.eliteDone += 1;
  saveSeason();
}

/* Throwing away the geometry has to throw away everything standing on it.
   `cars`, `particles`, `paceCar` and `safety` are all sized and positioned off
   the track that has just been discarded, and draw() runs every frame whatever
   screen is showing — so a safety car left over from the last race is a safety
   car being drawn against a track that no longer exists. */
function clearTrackWorld() {
  track = null;
  cars = [];
  particles = [];
  paceCar = null;
  safety = null;
}

function startElite(inv) {
  eliteRun = { ev: inv.ev, invited: inv.invited, playerIn: inv.playerIn };
  eliteResult = null;
  qual = null;
  clearTrackWorld();         // force a rebuild; this is not a calendar circuit
  enterEliteField(inv.ev, inv.invited);
  beginRace();
}
function endElite() {
  leaveEliteField();
  eliteRun = null;
  eliteResult = null;
  clearTrackWorld();         // and back to the championship's own geometry
}

/* --- Where the game goes when a result has been read ----------------------
   One place, in strict order, because almost everything the career mode does
   happens in the gap between two races and getting the order wrong is how a
   player ends up being sacked by a team they had already left.

   An invitation result comes first and leads nowhere — it is not a round. A
   career-ending injury outranks everything after it. Then the season's end,
   then the six-race review, then the factory, then an invitation, then simply
   the next grand prix. ---------------------------------------------------- */
function advanceAfterRace() {
  if (eliteRun) { endElite(); go(State.GRID); return; }

  // A crash at the last round that ends a driving career ends it here, before
  // any of the machinery that would otherwise hand them a seat for next year.
  if (career.pendingEnd) {
    const reason = career.pendingEnd;
    career.pendingEnd = null;
    endDriverCareer(playerPerson(), reason);
    go(State.OVER);
    return;
  }
  /* The demo's ending, decided in the one place the game already decides where
     a result leads. It has to be tested BEFORE the season-end line below: the
     demo calendar is itself six rounds long, so `round >= seasonRounds` goes
     true the instant the last demo race finishes and the full game's next move
     would be the champion screen. What the demo owes the player at that moment
     is the review those six races earned and the factory session they paid for. */
  if (DEMO && season.round >= DEMO_ROUNDS) { goDemoEnding(); return; }

  if (season.round >= CONFIG.seasonRounds) { go(State.CHAMPION); return; }
  if (reviewOwed()) { lastReview = runReview(); go(State.REVIEW); return; }
  if (devWindowOwed()) { openDevWindow(); return; }
  // A demo build has no elite events to offer — build-demo.js empties ELITE —
  // so it does not ask. Guarding the CALL rather than the answer is what lets
  // the invitation machinery be deleted from that build entirely.
  if (!DEMO && offerInviteIfEarned()) return;
  go(State.GRID);
}

/* --- The last three screens of the demo, in order -------------------------
   Every route into the end of the demo comes through here — the flag of round
   six, the review being read, the factory being read, and a career resumed
   from storage at any of those points. Written as "what has not happened yet"
   rather than as a step counter so all four routes cannot drift apart, which
   is the same reasoning resumeCareer() is built on.

   Only ever called when DEMO is true. ------------------------------------- */
function goDemoEnding() {
  if (reviewOwed()) { lastReview = runReview(); go(State.REVIEW); return; }
  /* Note this is NOT devWindowOwed(). That guards on `round < seasonRounds` to
     stop the full game opening a window after the last race of a season, and
     the demo's last race IS the last race of its season — so it answers "not
     owed" for the one window the whole demo exists to show. The demo asks the
     question it actually means: has the factory run yet. */
  if (!season.devLog.length) { openDevWindow(); return; }
  go(State.DEMOEND);
}

// Put an invitation on the table if this block earned one. Returns true if it
// took over the screen, so callers can fall through when it did not.
function offerInviteIfEarned() {
  const inv = eliteDue();
  if (!inv) return false;
  pendingInvite = inv;
  offerElite(inv);
  go(State.INVITE);
  return true;
}

// Signing for one of the seats the winter put on the table.
function signOffer(i) {
  const o = career.offers && career.offers[i];
  const me = playerPerson();
  if (!o || !me) return;
  const from = me.seat >= 0 ? TEAMS[DRIVERS[me.seat].team].name : null;
  // One path for both cases — coming back from nothing and moving up from a
  // seat you already hold are the same operation once the seats are emptied.
  movePlayerToSeat(o.seat);
  career.offers = null;
  fillAllSeats();
  // Both cars have changed hands, so both want their own objectives. After
  // fillAllSeats, because the seat the player has left is empty until then.
  rerollObjectives([0, o.seat]);
  newsAdd(from ? `You leave ${from} for ${TEAMS[myTeam()].name}.`
               : `You are back on the grid with ${TEAMS[myTeam()].name}.`, "sign");
  beep(660, 0.12, "square", 0.05, 880);
  saveSeason();
  go(State.GRID);
}

// The player's own objective this block, for the HUD and the round preview.
function myObjective() {
  const me = playerPerson();
  if (!me || me.seat < 0 || !season.objectives) return null;
  return season.objectives.find(o => o.pid === me.pid && o.seat === me.seat) || null;
}

/* --- When a development window is due -------------------------------------
   Asked as "has the calendar passed a window this season has not yet run?"
   rather than "did we just finish round 6?", so closing the tab between the
   chequered flag and the window does not quietly cost the player their
   development budget — the window is still owed when the save is resumed.
   -------------------------------------------------------------------------*/
function devWindowOwed() {
  return season.round < CONFIG.seasonRounds &&
         Math.floor(season.round / CONFIG.devEvery) > season.devLog.length;
}

/* --- Running a development window ---------------------------------------- */
function openDevWindow() {
  devPicks = new Set();
  devPhase = "choose";
  go(State.DEV);
}

// What the player has committed so far, and what is left to commit with.
function devSpend() {
  let s = 0;
  devPicks.forEach(k => { const p = PROJECTS.find(x => x.key === k); if (p) s += p.cost; });
  return s;
}
function devLeft() { return bank(myTeam()) - devSpend(); }

// Toggle a project on or off. A project you cannot afford simply refuses to go
// on — there is no debt in this game, and nothing to undo later.
function devToggle(i) {
  const p = PROJECTS[i];
  if (!p) return;
  if (devPicks.has(p.key)) { devPicks.delete(p.key); beep(360, 0.06, "sine", 0.04); }
  else if (p.cost <= devLeft()) { devPicks.add(p.key); beep(680, 0.07, "sine", 0.045); }
  else { beep(180, 0.14, "square", 0.035); return; }   // can't afford it
  drawScreen();
}

// Commit: the player's projects are funded first, then every rival spends its
// own money the same way through the same dice. Saved immediately, because the
// window is not something anyone should be able to re-roll by refreshing.
function commitDevWindow() {
  const entries = [];
  entries.push(...fundProjects(myTeam(), [...devPicks]));
  TEAMS.forEach((t, ti) => {
    if (ti !== myTeam()) entries.push(...fundProjects(ti, aiChoose(ti)));
  });
  season.devLog.push({ afterRound: season.round, entries });
  saveSeason();
  devPhase = "results";
  const mine = entries.filter(e => e.team === myTeam());
  if (mine.some(e => e.outcome === "breakthrough")) beep(523, 0.14, "square", 0.05, 784);
  else if (mine.length) beep(392, 0.2, "triangle", 0.04);
  drawScreen();
}

/* Championship order: points desc, then seat index asc.

   The points counted are the PERSON'S, not the car's. A driver who changes
   seats mid-season carries his score with him and the man who replaces him
   starts from nothing — which is both how it works and the only way a sacking
   at round twelve does not hand a rookie somebody else's championship. The
   order itself is still returned as seat indices, because every consumer of it
   — the grid, the pit wall, the board — is talking about cars. */
function championshipOrder() {
  return DRIVERS.map((d, i) => i).sort((a, b) => (driverPoints(b) - driverPoints(a)) || (a - b));
}

/* --- Constructors' championship -------------------------------------------
   A team's score is simply both of its cars added together, so it is derived
   from season.points rather than stored beside them. That keeps one source of
   truth — and means a season saved before teams existed still loads and still
   totals up correctly. --------------------------------------------------- */
function teamPoints(ti) { return TEAMS[ti].drivers.reduce((s, i) => s + season.points[i], 0); }
function teamGain(ti)   { return TEAMS[ti].drivers.reduce((s, i) => s + (lastPoints[i] || 0), 0); }
function myTeam()       { return DRIVERS[0].team; }

// Level on points, the team with the higher-placed driver in the drivers'
// championship comes first — a countback the player can actually follow.
function constructorOrder() {
  const rank = [];
  championshipOrder().forEach((id, i) => { rank[id] = i; });
  const best = ti => Math.min(...TEAMS[ti].drivers.map(i => rank[i]));
  return TEAMS.map((t, i) => i)
    .sort((a, b) => (teamPoints(b) - teamPoints(a)) || (best(a) - best(b)) || (a - b));
}
// Grid is the reverse of that — lead the championship, start at the back.
function gridOrder() {
  // A qualifying session that ran this weekend outranks everything below it —
  // that is the whole point of having run it.
  if (qual && qual.grid && qual.grid.length === DRIVERS.length) return qual.grid.slice();
  /* An invitation has no championship to order and no qualifying to run. The
     field lines up on pace with a good deal of noise, because half of it has
     never seen the place either — and the player starts wherever that puts
     them rather than being handed the front row for turning up. */
  if (eliteRun) {
    return DRIVERS.map((d, i) => i)
      .sort((a, b) => (DRIVERS[b].skill + (Math.random() - 0.5) * 0.09) -
                      (DRIVERS[a].skill + (Math.random() - 0.5) * 0.09));
  }
  // Round 1 has no championship to reverse. Seeding it slowest-first with the
  // player 4th gives a real first race — three cars to catch, four chasing —
  // rather than dumping a new player on the back row.
  if (season.points.every(p => p === 0)) {
    const order = DRIVERS.map((d, i) => i).filter(i => i !== 0)
      .sort((a, b) => DRIVERS[a].skill - DRIVERS[b].skill);
    // Mid-grid, so the opening race has as many cars to catch as it has
    // chasing — starting a 22-car field on the back row is a long afternoon.
    order.splice(Math.floor(DRIVERS.length / 2), 0, 0);
    return order;
  }
  return championshipOrder().slice().reverse();
}

/* =========================================================================
   The starting grid

   Eleven rows of two, staggered, laid out along the start/finish straight the
   way a real grid is painted — rather than the old arrangement, which spread
   the field over a third of the lap and hung the back row round the last
   corner because that was the only way twenty-two cars fitted.

   How much straight there is to play with is measured rather than assumed:
   every circuit here is a traced layout, and the run to the line at Monaco is
   nothing like the one at Silverstone. Walk backwards from the line while the
   road is still straight, and if the field will not fit in what is there,
   squeeze the rows together until it does.
   ========================================================================= */
// How much genuinely straight road there is behind the start line. Measured off
// the geometry rather than off track.vmax: vmax carries a backward braking pass,
// so it is already falling well before the corner it is falling FOR, and using
// it reported nought metres of straight on nineteen of the twenty-four circuits.
// Corner radius at a sample, from the same windowed heading difference the
// speed profile is built from — so "tight" means the same thing to the grid as
// it does to the cars.
function radiusAt(tr, i) {
  const W = 3, M = tr.M, at = j => ((j % M) + M) % M;
  const d = Math.abs(angDiff(tr.pts[at(i + W)].ang, tr.pts[at(i - W)].ang));
  return (2 * W * tr.step) / Math.max(d, 1e-5);
}

function straightBehindLine(tr) {
  let n = 0;
  const cap = Math.floor(tr.M * 0.4);
  while (n < cap && radiusAt(tr, -n - 1) >= CONFIG.grid.straightR) n++;
  return n * tr.step;
}

// The tightest daylight between any two cars sitting on this layout. Uses the
// same capsule the collision resolver does, so "they fit" here means exactly
// what it means once the race starts.
function gridClearance(tr, layout) {
  const M = tr.M, r = CONFIG.carHalfW * tr.carScale;
  const pos = layout.map(g => {
    const s = tr.pts[((-Math.round(g.back / tr.step)) % M + M) % M];
    return { x: s.x + s.nx * g.lat, y: s.y + s.ny * g.lat, a: s.ang };
  });
  let worst = Infinity;
  for (let i = 0; i < pos.length; i++) {
    for (let j = i + 1; j < pos.length; j++) {
      const A = carNodes(pos[i], tr.carScale), B = carNodes(pos[j], tr.carScale);
      for (let p = 0; p < 4; p += 2) {
        for (let q = 0; q < 4; q += 2) {
          worst = Math.min(worst, Math.hypot(B[q] - A[p], B[q + 1] - A[p + 1]) - 2 * r);
        }
      }
    }
  }
  return worst;
}

/* Where slot `i` of `n` sits: how far back from the line, and how far to the
   side. Shared by the grid itself and by the formation lap, so the field forms
   up in exactly the arrangement it will start in.

   Spacing wants to be the painted ideal, will settle for whatever the straight
   holds, and is then widened until nobody is starting inside anybody. That last
   step is not belt and braces: the road behind the line curves on most of these
   layouts, and boxes laid out along a curve converge on the inside however
   carefully the flat-road arithmetic is done. */
function gridLayout(tr, n) {
  const G = CONFIG.grid;
  /* How many abreast. Two, everywhere in the world, except the Speedway —
     which lines thirty-three cars up eleven rows of three and is the only
     reason this is a variable at all. */
  const per = (eliteRun && ELITE_FIELDS[eliteRun.ev.key] && ELITE_FIELDS[eliteRun.ev.key].perRow) || 2;
  const rows = Math.ceil(n / per);
  const spans = Math.max(1, rows - 1 + G.stagger);
  const side = tr.halfWidth * G.lateral;
  const build = (gap) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / per);
      const col = i % per;                  // 0 = pole side, then across the road
      // Spread the row evenly across the width rather than to the two edges,
      // so a three-wide row sits centred with a car on the racing line.
      const off = per === 1 ? 0 : (col / (per - 1)) * 2 - 1;   // -1 .. +1
      out.push({
        back: G.lineGap + row * gap + (col % 2) * gap * G.stagger,
        lat:  off * side,
      });
    }
    return out;
  };

  // Spacing is SEARCHED, not stepped up until it works. Clearance is not
  // monotonic in the gap: widening walks every row back into a different part
  // of the corner behind the line, so a grid that fits at 30 units can foul at
  // 38 and come good again at 50. Stepping up from the floor therefore stops at
  // the first gap that happens to clear rather than the smallest one that does,
  // and on the twistier layouts that was half a lap of grid. Scanning the whole
  // range and taking the tightest that clears is both correct and, at one
  // sweep per race, free.
  const tail = CONFIG.carHalfL * tr.carScale;
  const floor = CONFIG.carHalfL * 2 * tr.carScale * G.minCarGaps;
  // The gap that would put the last car exactly on the end of the straight.
  // Preferred over anything wider, so a circuit with room uses it.
  const wanted = clamp((straightBehindLine(tr) - G.lineGap - tail) / spans, floor, G.rowGap);
  const need = G.clearance * tr.carScale;

  // The spacing that lands the last car exactly on the end of the straight is
  // tried first and on its own terms. Reaching it by stepping up from the floor
  // overshoots it by up to one step, which is a whole car's length across
  // eleven rows — and on eight of these circuits that was the entire difference
  // between the grid fitting the straight and hanging off the end of it.
  const exact = build(wanted);
  if (gridClearance(tr, exact) >= need) return exact;

  let bestFit = null, fallback = null, fallbackClear = -Infinity;
  const step = Math.max(0.5, floor * 0.02);
  for (let gap = floor; gap <= G.rowGap * 1.8; gap += step) {
    const layout = build(gap);
    const clear = gridClearance(tr, layout);
    if (clear > fallbackClear) { fallbackClear = clear; fallback = layout; }
    if (clear < need) continue;
    // Clears. Keep the tightest that does, and stop as soon as one also reaches
    // the straight-fitting spacing — nothing wider can be an improvement.
    if (!bestFit) bestFit = layout;
    if (gap >= wanted) return bestFit;
  }
  return bestFit || fallback;
}

// Put a car exactly on its box, stationary and pointing down the road.
function placeOnGrid(car, slot, layout) {
  const M = track.M;
  const g = layout[slot];
  const backSamples = g.back / track.step;
  const idx = ((-Math.round(backSamples)) % M + M) % M;
  const s = track.pts[idx];
  car.x = s.x + s.nx * g.lat;
  car.y = s.y + s.ny * g.lat;
  car.a = s.ang;
  car.vx = 0; car.vy = 0; car.steer = 0;
  car.si = idx;
  car.prog = -backSamples;
  car.progF = -backSamples;
  car.line = g.lat * 0.55;
  car.gridSlot = slot;
}

/* =========================================================================
   Cars — the ONLY place a car object is created, for a race or a qualifying
   session alike. Placement is the caller's business.
   ========================================================================= */
function makeCar(di, slot) {
  const d = DRIVERS[di];
  // A driver programme is the one upgrade that is baked in at lights-out
  // rather than read every frame: skill and sloppiness are copied onto the
  // car here, so this is the only place they can be improved.
  const dp = dev(d.team);
  /* Who each team is backing. At an elite event there is no championship to
     read it off — and reading it anyway would score guest entries against the
     seat numbers of championship drivers who are not even here — so a one-off
     simply backs the car that qualified higher, which is what a team fielding
     three cars for one afternoon actually does. */
  const rank = [];
  if (eliteRun) DRIVERS.forEach((x, i) => { rank[i] = i; });
  else championshipOrder().forEach((id, i) => { rank[id] = i; });
  const leadFor = TEAMS.map(t => t.drivers.slice().sort((a, b) => rank[a] - rank[b])[0]);
  // Seat 0 is the player's, and only while they actually hold it. A driver
  // who has been released still has his old car on the grid — somebody else
  // is in it, and it is driven by the AI like any other. At an elite event
  // the same is true of an invitation that went to somebody else: entry zero
  // is the player only if the player was one of the drivers invited.
  //
  // Read into a local because the tyre choice below needs the same answer:
  // the player runs what they picked, everyone else is given one.
  const isPlayer = di === 0 && (eliteRun ? eliteRun.playerIn : playerSeated());
  return {
    id: di, name: d.name, colour: d.colour, accent: d.accent, cam: d.cam, team: d.team,
    skill: d.skill * dp.driverSkill, mistake: d.mistake * dp.driverMistake, aggro: d.aggro,
    isPlayer,
    priority: leadFor[d.team] === di,
    heldUp: 0, behindMate: 0, yieldTimer: 0, yieldSide: 1,
    /* Blue flags. `blueTimer` counts DOWN like yieldTimer so the flag fades out
       on its own if the car showing it drops back or retires; `blueHeld` is how
       long the lapping car has been inside the window, which is what decides
       whether the flag has actually been shown yet; `blueFor` is the id it is
       being shown for, and is what the stewards read to know whose contact
       this is. `blueSeen` keeps the radio from saying it twice for one pass.

       `blueAlso` is every OTHER car the same flag covers. A car being caught by
       a train of three is shown one flag and moves one way, so the nearest of
       them is the one `blueFor` names — but it is in all three of their ways,
       and the stewards have to know that or the second and third car in the
       queue lose the protection the first one has. */
    blueTimer: 0, blueHeld: 0, blueFor: -1, blueAlso: [], blueSeen: -1, blueIgnored: 0,
    // When this car last rejoined from the pit lane. Blue flags read it; see
    // CONFIG.blue.pitGrace. -Infinity so a car that has never pitted is never
    // fresh out of the lane, whatever raceTime is.
    leftPit: -Infinity,
    /* Seconds left on "this car braked for something the road did not ask for".
       Counts down like the two above, and for the same reason: every cause that
       sets it is transient, so nothing has to remember to clear it. The
       stewards read it off the car IN FRONT — see CONFIG.stewards.brakeCheck. */
    oddBrake: 0, oddCause: null, followBound: false,
    // Measurement only, read by tools/stewards.js off a finished race — the
    // signals the brake-check rule is drawn on, and every contact it waved
    // away. Kept for the same reason penaltyLog keeps `rel`.
    bcDecel: 0, bcRatio: 1, bcExcused: [],
    ordersLeft: CONFIG.ordersPerRace, toldOnce: false,
    fail: null, failLeft: 0, out: false, gone: false,
    outFail: null, outTime: 0, outSide: 1, recover: 0,
    x: 0, y: 0, a: 0,
    vx: 0, vy: 0, steer: 0,
    si: 0, prog: 0, progF: 0,
    lapsDone: -1, lapStart: 0, lastLap: null, bestLap: null,
    flagLap: null,                    // qualifying: the lap they were on at the flag
    // Qualifying: flying laps completed, and this lap's roll of the dice. Both
    // are inert in a race — rollQualiLap is the only thing that writes qPace and
    // it is only ever called from a qualifying segment.
    qFly: 0, qPace: 1,
    boost: CONFIG.boostMax, boosting: false, drsArmed: false, drsGap: Infinity,
    drsZone: 0, drsAppr: 0, drsDetected: false,   // zone, detection window, latched at the line
    tyre: 1, damage: 0, pitArmed: false, pitsDone: 0,
    /* What the stewards have on this car. `timePenalty` is seconds bolted on at
       the flag and is invisible until then, exactly as it is invisible to a
       driver on the road. `stopGo` is a debt that has to be paid in the pit
       lane, `stopGoLap` the lap it was handed out on — the deadline is that
       plus stewards.serveLaps. `offences` counts judged calls for the third-
       strike rule, `lastJudged` is the one-incident-one-penalty guard, and
       `penaltyLog` is what the results screen reads back. */
    timePenalty: 0, stopGo: false, stopGoLap: 0, servingStopGo: false,
    offences: 0, lastJudged: -99, penaltyLog: [],
    // What it is on, what is waiting in the box, and the lap the current set
    // went on — that last one is how the AI works out what to fit next.
    compound: startCompound(isPlayer), nextCompound: null, stintStart: 0,
    inPit: false, pitS: 0, pitSpeed: 0, pitPhase: null, pitBox: 0,
    pitStopTime: 0, pitStopLeft: 0, pitFumble: false, parking: false,
    slowestStop: 0,
    pitTyre: CONFIG.aiPitTyre + (Math.random() - 0.5) * 0.14,
    // ...and how tempted this one is by a cheap stop, which is a separate
    // question with a much wider spread — see CONFIG.safety.pitSpread.
    scPitTyre: CONFIG.safety.pitTyre + (Math.random() - 0.5) * CONFIG.safety.pitSpread,
    errTimer: 0, errType: null, errCool: 2 + Math.random() * 5, errLine: 0, errDir: 1,
    lockup: false, pressured: false, errors: 0,
    /* Reversing out of a barrier — see CONFIG.unstick. `stillFor` is the age of
       the last real movement, measured from an anchor that only moves when the
       car does; a car going nowhere is the one thing that separates wedged from
       merely spun. The anchor starts at the origin, which every grid slot is a
       long way from, so the first frame resets it rather than reading a car
       that has not moved yet as stuck. */
    revTimer: 0, revCool: 0, stillX: 0, stillY: 0, stillFor: 0,
    line: 0, lineTarget: 0, wobblePhase: Math.random() * TAU,
    slipTimer: 0, offTrack: false, gridSlot: slot,
    finished: false, finishTime: 0, place: slot + 1,
  };
}

// Everything a session resets whether it is a race or a qualifying segment.
function resetSessionState() {
  particles = [];
  finishOrder = [];
  retireOrder = [];
  classification = [];
  fastestLap = null;
  raceTime = 0;
  radioText = ""; radioTimer = 0; shutUp();
  shake = 0; hitstop = 0; goFlashTimer = 0;
  flagTime = 0; coolTimer = 0;
  keys.clear();
  /* A race can END under the safety car — the flag falls, or the player parks
     it — and nothing in the finishing code puts the flags back to green. Left
     alone, that neutralised race was still running when the next session began:
     qualifying opened behind a pace car it had never deployed, capped to
     safety-car pace, and stuck there, because updateSafety only ticks the clock
     down while State.RACING. Cleared here rather than in setupRace so a
     qualifying segment gets the same clean sheet a race does. */
  paceCar = null;
  safety = null;
  safetyUsed = false;   // a new session, and with it a new one-per-race allowance
}

/* =========================================================================
   Race setup — the ONLY place race state is created. Restart calls this too.
   ========================================================================= */
function setupRace() {
  // An invitation is raced on its own circuit and is not a round of anything.
  const circuit = eliteRun ? eliteRun.ev : CIRCUITS[season.round];
  session = "race";
  if (!track || track.circuit !== circuit) { track = buildTrack(circuit); renderTrack(track); }

  const grid = gridOrder();
  const layout = gridLayout(track, grid.length);
  cars = grid.map((di, slot) => {
    const car = makeCar(di, slot);
    placeOnGrid(car, slot, layout);
    return car;
  });

  // The crew starts the race with a set of what you rolled out on ready to go.
  // Anything else would carry a call made in the last race into this one.
  nextTyre = startTyre;

  resetSessionState();
  lastPoints = DRIVERS.map(() => 0);
  lastPrize  = TEAMS.map(() => 0);
  lastRaceSimulated = false;   // simulateRace() sets it back if that is where we are headed
  racePace = track.pace;
  countdown = 4.2; lightsLit = 0;
  formation = null;   // the pace car and the safety car go with resetSessionState

  el.circ.textContent = `${circuit.flag} ${circuit.name}`;
  el.round.textContent = eliteRun ? "ONE-OFF" : `${season.round + 1}/${CONFIG.seasonRounds}`;
  el.lap.innerHTML = `1<span style="font-size:13px;color:var(--muted)">/${raceLaps()}</span>`;
  el.best.textContent = fmtTime(bestLaps[circuit.name]);
  buildBoard();
  updateHud();             // the bands are visible from the countdown on
  updateCamera(0, true);   // start looking at the grid, not at the origin
  // Every race is recorded, driven or simulated. Last race's reel is dropped
  // here rather than at the flag, so it stays watchable from the result screen
  // right up until the next race actually starts.
  reelBegin();
}

// The race proper begins either with a lap behind the pace car or with the
// lights. Both end in State.COUNT, so only this function knows the difference.
function beginRace() {
  setupRace();
  if (formationOn) startFormation(); else go(State.COUNT);
}

/* =========================================================================
   QUALIFYING

   Three knockout segments — 22 cars, then 16, then 10 — with six eliminated
   at the end of each of the first two. The grid is Q3's order, then Q2's six
   in the order they were knocked out, then Q1's six.

   A segment the player is entered in is DRIVEN, on a clock, with everyone else
   circulating for real. A segment they have already been knocked out of is
   SIMULATED, because there is nothing to watch and nothing to do. The whole
   weekend can also be simulated, or turned off entirely — with qualifying off
   the grid falls back to reverse championship order, as it always was.
   ========================================================================= */

// The lap time a perfect car would set here: every sample driven at exactly the
// corner-speed ceiling the AI drives to. Optimistic in absolute terms — nothing
// accelerates instantly — so it is scaled by simCal, which is calibrated once
// against laps the AI actually drives. What matters is that it responds to the
// circuit and to the difficulty in exactly the way the cars themselves do.
function idealLap(tr) {
  let t = 0;
  for (let i = 0; i < tr.M; i++) {
    t += tr.step / Math.max(20, tr.vmax[i] * tr.pace * paceMul() * handMul());
  }
  return t * CONFIG.quali.simCal;
}

// Two uniforms make a passable bell without a library, and lap times really do
// cluster: most laps are within a couple of tenths, a few are scruffy.
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 0.5; }

// One driver's best lap of a simulated segment. A longer session is worth a
// little time to everyone, because it is more rolls of the same dice.
function simBestLap(id, ideal, secs) {
  const d = DRIVERS[id], dp = dev(d.team);
  const pace = Math.max(0.5, d.skill * dp.driverSkill * dp.aero * CONFIG.quali.pace);
  const base = ideal / pace;
  // An out lap, then whatever fits. Never fewer than one flying lap: a session
  // too short to complete a lap would otherwise knock the whole field out.
  const runs = Math.max(1, Math.floor((secs - base * 0.55) / base));
  // Someone always throws it away and comes back with nothing.
  if (Math.random() < CONFIG.quali.simNoTime) return null;
  let best = Infinity;
  // Form scales the laps, not the run count: a car that is off this weekend
  // should be slower, not also get fewer attempts at being slower.
  const form = qualiForm(id);
  for (let n = 0; n < runs; n++) {
    let t = base * form * (1 + gauss() * CONFIG.quali.simScatter + d.mistake * 0.012);
    if (Math.random() < CONFIG.quali.simScruffy) t *= 1 + Math.random() * CONFIG.quali.simScruffyCost;
    best = Math.min(best, t);
  }
  return best;
}

/* The same dice as simBestLap, rolled one lap at a time for a car the player
   can actually see out of the window.

   simBestLap rolls every lap of a segment at once and keeps the best. An AI car
   in a DRIVEN segment cannot do that — it is being physically driven round, and
   its pace comes from a target speed read every frame — so the roll is made when
   it crosses the line and held for the lap it has just begun. Same scatter, same
   scruffy laps, same build-up towards the driver's limit; the difference is only
   where the number is applied.

   Returned as a multiplier on SPEED, so a lap-time factor has to be inverted:
   a lap 2% slower is a car going 1/1.02 as fast, not 0.98.

   The driver's own `mistake` rate is deliberately NOT in here. simBestLap folds
   it in because a simulated car has no other way to be scruffy; a driven one has
   the real mistake system in aiControls throwing it off line, and counting it
   twice would leave the sloppy drivers slower on a timesheet than they are on
   the road. */
function rollQualiLap(car) {
  const Q = CONFIG.quali;
  // The same weekend form the simulator reads, so a car the player watches go
  // quicker in Q1 is the same car that is still there in Q3. Only ever called
  // for AI entries — the player's pace is their own driving.
  let t = qualiForm(car.id) * (1 + gauss() * Q.simScatter);
  if (Math.random() < Q.simScruffy) t *= 1 + Math.random() * Q.simScruffyCost;
  t *= 1 + Q.buildUp * Math.pow(Q.buildFade, Math.max(0, car.qFly));
  car.qPace = 1 / Math.max(0.5, t);
}

function simulateSegment() {
  const ideal = idealLap(track);
  for (const id of qual.entrants) qual.times[qual.seg][id] = simBestLap(id, ideal, qualiSecs);
}

// No time is last, and no time behind every other no time. Ordering the
// timeless by skill rather than leaving them in entry order stops the same
// driver being permanently 22nd every time a session goes wrong for them.
function bySegmentTime(ids, T) {
  return ids.slice().sort((a, b) => {
    const ta = T[a], tb = T[b];
    if (ta == null && tb == null) return (DRIVERS[b].skill - DRIVERS[a].skill) || (a - b);
    if (ta == null) return 1;
    if (tb == null) return -1;
    return ta - tb;
  });
}

// Rank the segment, take the six, and either hand the survivors on or — after
// Q3 — assemble the grid out of the three sets of results.
function closeSegment() {
  const seg = qual.seg;
  qual.order = bySegmentTime(qual.entrants, qual.times[seg]);
  if (seg < 2) {
    const keep = Math.max(1, qual.order.length - CONFIG.quali.cut);
    qual.knocked[seg] = qual.order.slice(keep);
    qual.next = qual.order.slice(0, keep);
    qual.cutAt = keep;
  } else {
    qual.cutAt = qual.order.length;
    qual.grid = qual.order.concat(qual.knocked[1], qual.knocked[0]);
  }
}

// All three segments at once, no screens in between: there is nothing to decide
// between sessions you are not driving in.
function simulateWholeQuali() {
  const ideal = idealLap(track);
  qual.entrants = DRIVERS.map((d, i) => i);
  for (let s = 0; s < 3; s++) {
    qual.seg = s;
    for (const id of qual.entrants) qual.times[s][id] = simBestLap(id, ideal, qualiSecs);
    closeSegment();
    if (s < 2) qual.entrants = qual.next;
  }
}

function startQuali() {
  const circuit = CIRCUITS[season.round];
  qual = freshQuali();
  session = "quali";
  if (!track || track.circuit !== circuit) { track = buildTrack(circuit); renderTrack(track); }
  racePace = track.pace;
  qual.entrants = DRIVERS.map((d, i) => i);

  if (qualiMode === "sim") { simulateWholeQuali(); go(State.QUALIRES); return; }
  startSegment();
}

function startSegment() {
  qual.flagged = false;
  qual.grace = 0;
  qual.clock = qualiSecs;
  qual.order = null;
  qual.live = qual.entrants.includes(0);

  // Knocked out already — the rest of the session happens without you.
  if (!qual.live) { simulateSegment(); closeSegment(); go(State.QUALIRES); return; }

  session = "quali";
  cars = qual.entrants.map((id, i) => makeCar(id, i));
  placeAroundLap(cars);
  resetSessionState();
  // NOT track.pace. It was tempting — a car in qualifying is on low fuel and
  // one-lap tyres, so it ought to be quicker — but track.pace multiplies the
  // AI's target speed and nothing else. The player's car is driven by the
  // physics and cannot be handed the same three percent, so raising it here
  // does not model low fuel at all: it hands the entire field a pace advantage
  // over the human, in the one session where the human is being measured
  // against them. CONFIG.quali.pace belongs in simBestLap, where it applies to
  // every car equally because every car is being simulated.

  el.circ.textContent = `${track.circuit.flag} ${track.circuit.name}`;
  el.round.textContent = `${season.round + 1}/${CONFIG.seasonRounds}`;
  el.best.textContent = fmtTime(bestLaps[track.circuit.name]);
  buildBoard();
  updateCamera(0, true);
  go(State.QUALI);
  radio(`${segName(qual.seg)} — ${qual.entrants.length} cars out, ${CONFIG.quali.cut} of you go home.`, 5, 2);
}

const segName = s => ["Q1", "Q2", "Q3"][s] || "Q";

// Qualifying starts with everyone already circulating, spread evenly round the
// lap so the session opens with clear track rather than a queue off the grid.
// prog is set a full lap negative so the first crossing of the line is an out
// lap and does not count as a time.
function placeAroundLap(list) {
  const M = track.M;
  const spread = M / Math.max(1, list.length);
  list.forEach((car, i) => {
    const idx = Math.round(i * spread) % M;
    const s = track.pts[idx];
    const lat = ((i % 2) ? 1 : -1) * track.halfWidth * 0.22;
    const v = track.vmax[idx] * track.pace * 0.8;
    car.x = s.x + s.nx * lat; car.y = s.y + s.ny * lat; car.a = s.ang;
    car.vx = Math.cos(s.ang) * v; car.vy = Math.sin(s.ang) * v;
    car.si = idx;
    car.prog = idx - M; car.progF = idx - M;
    car.lapsDone = -1; car.lapStart = 0;
    car.line = lat;
  });
}

function updateQuali(dt) {
  raceTime += dt;
  if (radioTimer > 0) radioTimer -= dt;

  if (!qual.flagged) {
    qual.clock -= dt;
    if (qual.clock <= 0) {
      qual.clock = 0;
      qual.flagged = true;
      qual.grace = CONFIG.quali.flagGrace;
      // As in the real thing: cross the line before the flag and you may finish
      // the lap. Everyone's current lap is recorded so we know which one that is.
      for (const c of cars) c.flagLap = c.lapsDone;
      beep(880, 0.18, "square", 0.05);
      radio("Chequered flag — finish the lap you're on.", 4, 2);
    }
  } else {
    qual.grace -= dt;
  }

  updateDrs();
  // No failures, no stops and no team orders in qualifying: a car that broke
  // would need a grid slot it never earned, and nobody is racing anybody.
  for (const car of cars) {
    if (car.inPit) { updatePitLane(car, dt); continue; }
    const ctrl = (car.isPlayer && !simRun) ? playerControls(car) : aiControls(car, dt);
    stepCar(car, ctrl, dt);
    barriers(car);
  }
  carCollisions();
  for (const car of cars) updateProgress(car);
  updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.6);

  const you = cars.find(c => c.isPlayer);
  if (you) engineUpdate(Math.abs(forwardSpeed(you)), you.boosting);

  // Everyone who was on a lap when the flag fell has now finished it.
  const home = cars.every(c => c.flagLap == null || c.lapsDone > c.flagLap);
  if (qual.flagged && (home || qual.grace <= 0)) { endSegment(); return; }
  updateQualiHud();
}

function endSegment() {
  stopEngine();
  for (const c of cars) if (c.bestLap != null) qual.times[qual.seg][c.id] = c.bestLap;
  closeSegment();
  go(State.QUALIRES);
}

// SPACE on the results screen: the next segment, or the race.
function advanceQuali() {
  if (qual.grid) { beginRace(); return; }
  qual.seg += 1;
  qual.entrants = qual.next;
  startSegment();
}

// SPACE during a live segment ends your running early and simulates what the
// clock had left for everyone still out there, so skipping does not simply
// hand the session to whoever happened to be on a quick lap.
function skipSegment() {
  const ideal = idealLap(track);
  const left = Math.max(0, qual.clock);
  for (const c of cars) {
    if (c.bestLap != null) qual.times[qual.seg][c.id] = c.bestLap;
    if (c.isPlayer || left < 1) continue;
    const sim = simBestLap(c.id, ideal, left);
    const have = qual.times[qual.seg][c.id];
    if (sim != null && (have == null || sim < have)) qual.times[qual.seg][c.id] = sim;
  }
  stopEngine();
  closeSegment();
  go(State.QUALIRES);
}

/* =========================================================================
   SIMULATING A RACE

   Three ways in, one mechanism:
     from the round preview  — the whole weekend, qualifying included
     from the qualifying result — you qualified, now skip the race
     from the pause screen   — hand over from wherever you have got to

   State is left exactly as it is (RACING, or COUNT if the lights have not gone
   out yet); only the frame loop changes, running as many physics steps as fit
   in a slice instead of one per frame. The race ends the way it always does —
   the player crossing the line, or retiring — so there is no separate finishing
   condition to keep in step with the real one, and no way for the two to drift.
   ========================================================================= */
// How long each slice may spend on physics. Frames arrive every ~16.7ms, so a
// slice SHORTER than that idles for the remainder and the simulation runs at a
// fraction of the speed it could: at 11ms a six-lap race took three seconds of
// which one was spent waiting. Overrunning the frame instead simply lowers the
// refresh rate, and the only thing on screen is a progress bar.
const SIM_SLICE_MS = 28;
const SIM_REDRAW_EVERY = 3;               // ...and the progress panel need not keep up
const SIM_STEP_CAP = 60 * 60 * 60;        // an hour of race time, then something is wrong

function simulateRace() {
  simRun = { steps: 0, cap: SIM_STEP_CAP, slices: 0 };
  lastRaceSimulated = true;
  stopEngine();
  shutUp();
  hud.classList.remove("on");
  overlay.classList.remove("hidden");
  drawSimScreen();
}

// Simulate the whole weekend from the round preview: qualifying (however the
// settings would have run it) and then the race.
function simulateWeekend() {
  const circuit = CIRCUITS[season.round];
  if (!track || track.circuit !== circuit) { track = buildTrack(circuit); renderTrack(track); }
  racePace = track.pace;
  if (qualiMode !== "off") { qual = freshQuali(); session = "quali"; simulateWholeQuali(); }
  setupRace();
  state = State.RACING;          // no lights, no formation lap — nobody is watching
  simulateRace();
}

function runSimSlice() {
  const t0 = performance.now();
  while (performance.now() - t0 < SIM_SLICE_MS) {
    // The in-lap is twenty seconds of cars driving home. Not when nobody is
    // watching it.
    if (state === State.COOLDOWN) { endCooldown(); }
    if (state === State.RESULT || state === State.CHAMPION || state === State.DEV) break;
    if (state === State.COUNT) { countdown = 0; lightsLit = 5; }
    update(1 / 60);
    if (++simRun.steps > simRun.cap) break;   // a race that will not end: take what we have
  }
  if (state === State.RESULT || state === State.CHAMPION || state === State.DEV ||
      simRun.steps > simRun.cap) {
    if (state !== State.RESULT && state !== State.CHAMPION && state !== State.DEV) finishRace();
    simRun = null;
    return;
  }
  if (simRun.slices++ % SIM_REDRAW_EVERY === 0) drawSimScreen();
}

function drawSimScreen() {
  const circuit = track.circuit;
  const lead = cars.reduce((a, c) => (c.progF > (a ? a.progF : -1e9) ? c : a), null);
  const laps = raceLaps();
  const done = clamp(lead ? lead.lapsDone + 1 : 0, 0, laps);
  const pct = clamp((lead ? lead.progF / track.M : 0) / laps, 0, 1) * 100;
  const order = raceOrder().slice(0, 6);
  overlay.innerHTML = `
    <div class="stack">
      <h2>${circuit.flag} ${circuit.gp}</h2>
      <h1>Simulating…</h1>
      <p class="sub">Lap ${done} of ${laps} · ${cars.filter(c => c.out).length} out</p>
      <div class="simbar"><div class="simfill" style="width:${pct.toFixed(1)}%"></div></div>
      <table style="max-width:var(--col);margin:14px auto 0">
        <tbody>${order.map((c, i) => `<tr class="${c.isPlayer ? "me" : ""}">
          <td class="num">${i + 1}</td><td>${glyph(c.id, 22)}</td>
          <td>${nameCell(c.id, c)}</td>
          <td class="qgap">${c.out ? "OUT" : c.finished ? "FIN" : ""}</td></tr>`).join("")}</tbody>
      </table>
      <p class="modeLine" style="margin-top:14px">The race is being run in full — same physics,
        same failures, same pit stops. Your car is in the AI's hands.</p>
    </div>`;
}

/* =========================================================================
   FORMATION LAP

   One lap behind the pace car and back onto the grid. It is driven for you —
   for everybody, in fact. Nothing here runs through the physics: the field is
   walked round the centreline in its grid arrangement and arrives, by
   construction, exactly on its boxes. A lap nobody can gain anything on is not
   worth being able to get wrong, and a simulated one would just be the field
   piling into the back of a pace car doing half speed.
   ========================================================================= */
function startFormation() {
  const n = cars.length;
  formation = { t: 0, dur: CONFIG.formation.secs, layout: gridLayout(track, n), done: false };
  paceCar = { x: 0, y: 0, a: 0, arc: 0, gone: false };
  updateFormationPositions(0);
  updateCamera(0, true);
  go(State.FORMATION);
  radio("Formation lap — warm the tyres, and no overtaking.", 4.5, 2);
}

// Where the field is at u = 0..1 of the lap. Distance follows a raised cosine,
// so the field pulls away from a standstill and comes to rest on the grid
// without either end being a jolt.
//
// Velocity is taken from the DERIVATIVE of that curve, not from differencing
// this frame's position against last frame's. Finite differences of a weaving
// car are dominated by the weave, and the camera leads the player by a third of
// a second of its own velocity — so a car nudging sideways threw the view a car
// length ahead and back again every frame, and the whole screen shook.
function updateFormationPositions(u) {
  const L = track.length, M = track.M;
  const uu = clamp(u, 0, 1);
  const travelled = L * (1 - Math.cos(Math.PI * uu)) / 2;
  // d(travelled)/dt: zero at both ends, so the field eases away and settles.
  const speed = (L * Math.PI * Math.sin(Math.PI * uu)) / (2 * formation.dur);
  const room = laneRoom(track);
  // Weaving to warm the tyres, faded in at the start and out over the last
  // quarter so everyone is straight and square by the time they reach a box.
  const weaveAmp = room * CONFIG.formation.weave
                 * clamp((1 - uu) * 4, 0, 1) * clamp(uu * 6, 0, 1);
  const w = uu * Math.PI * 2 * CONFIG.formation.weaveCycles;

  for (const car of cars) {
    const g = formation.layout[car.gridSlot];
    const arc = travelled - g.back;
    const idx = ((Math.round(arc / track.step) % M) + M) % M;
    const s = track.pts[idx];
    const weave = Math.sin(w + car.gridSlot * 1.7) * weaveAmp;
    const lat = g.lat + weave;
    car.x = s.x + s.nx * lat;
    car.y = s.y + s.ny * lat;
    // Along the road at the speed the field is doing. The weave is deliberately
    // left out: it is a few units of paint, and the camera reads this.
    car.vx = Math.cos(s.ang) * speed;
    car.vy = Math.sin(s.ang) * speed;
