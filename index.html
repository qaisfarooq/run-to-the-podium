<style>
  :root {
    /* Two column widths for the whole game, and only two. A reading column for
       prose, controls and the difficulty cards; a wide one for the grids and
       tables. Four different max-widths stacked down a screen is what reads as
       untidy — two that repeat read as deliberate. */
    --col:  560px;
    --wide: 800px;

    --bg:      #0b1016;
    --panel:   #121a24;
    --ink:     #eef3fa;
    --muted:   #8fa0b8;
    --accent:  #ffd23f;
    --good:    #4ade80;
    --danger:  #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #16202c 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body { display: grid; place-items: center; }

  #wrap {
    position: relative;
    width: min(100vw, 100vh * var(--cw, 1000) / var(--ch, 790));
    max-height: 100vh;
    aspect-ratio: var(--cw, 1000) / var(--ch, 790);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #1d3a24;
    border-radius: 12px;
  }

  /* ---------- HUD ---------- */
  /* The HUD is laid out in canvas units and scaled to match, so every panel
     lands in the band the renderer reserved for it at any window size. */
  #hud {
    position: absolute; top: 0; left: 0;
    width: calc(var(--cw, 1000) * 1px); height: calc(var(--ch, 790) * 1px);
    transform-origin: top left;
    transform: scale(var(--hs, 1));
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    transition: opacity .25s;
  }
  #hud.on { opacity: 1; }

  .pill {
    position: absolute;
    background: rgba(9,13,19,.72);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 7px 11px;
    backdrop-filter: blur(4px);
    line-height: 1.25;
  }
  .lbl { font-size: 10px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .big { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .mid { font-size: 15px; font-weight: 700; }

  /* ---- top band: the live numbers, and the pit wall when it calls ---- */
  #posBox  { top: 6px; left: 12px; display: flex; gap: 18px; }
  #timeBox { top: 6px; left: 152px; min-width: 148px; }
  #circBox { top: 6px; right: 12px; text-align: right; }

  /* ---- bottom band: your car, the map, the order ---- */
  #boardBox { top: 676px; right: 12px; padding: 8px 10px; width: 272px; }
  #board { display: grid; grid-template-rows: repeat(4, auto); grid-auto-flow: column;
           gap: 2px 14px; font-size: 11px; }
  #board .bl { display: grid; grid-template-columns: 12px 18px 1fr auto; gap: 0 5px; align-items: center; }
  #board .r { color: var(--muted); text-align: right; }
  #board .g { color: var(--muted); font-variant-numeric: tabular-nums; }
  #board .me { color: var(--accent); font-weight: 800; }
  #board .fin { color: var(--good); }
  /* below the points cut-off: still racing, just not scoring */
  #board .nopts { opacity: .5; }
  #board .cut { border-top: 1px dashed rgba(255,255,255,.28); margin-top: 3px; padding-top: 3px; }
  /* positions the board has skipped over — the field does not run P3, P14 */
  #board .gapAbove { border-top: 1px dotted rgba(255,255,255,.2); margin-top: 3px; padding-top: 3px; }
  #board .out  { color: var(--danger); font-weight: 800; }
  #board .sick { color: #fb923c; }

  /* a fault developing on the player's own car */
  #faultLbl { margin-top: 3px; color: var(--danger); font-weight: 800; letter-spacing: .06em; }
  #faultLbl.fixable { color: #fb923c; }
  #faultLbl:empty { display: none; }
  /* A blue flag is a live instruction, so it pulses rather than sitting there —
     and it is the one blue thing on a HUD that is otherwise amber and red. */
  #blueLbl { margin-top: 3px; color: #60a5fa; font-weight: 800; letter-spacing: .06em;
             animation: bluePulse 1s ease-in-out infinite; }
  #blueLbl:empty { display: none; animation: none; }
  #blueLbl.passing { color: var(--good); animation: none; }
  @keyframes bluePulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { #blueLbl { animation: none; } }

  /* the pit wall, on the radio */
  #radio {
    top: 6px; left: 50%; transform: translateX(-50%);
    text-align: center; width: 340px;
    border-color: rgba(255,210,63,.45);
    opacity: 0; transition: opacity .28s;
  }
  #radio.show { opacity: 1; }
  #radio .mid { color: var(--accent); font-size: 13.5px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #statusBox { top: 676px; left: 12px; width: 250px; }
  .barRow { display: grid; grid-template-columns: 86px 1fr; gap: 8px; align-items: center; margin-bottom: 5px; }
  .bLbl { font-size: 9.5px; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .bTrack { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bFill { height: 100%; width: 100%; transition: background .18s; }
  #boostFill { background: #5a6376; }
  #boostFill.armed { background: linear-gradient(90deg,#ffd23f,#ff8a3d); }
  #boostFill.on    { background: linear-gradient(90deg,#7dd3fc,#ffffff); }
  #drsLbl.armed { color: var(--accent); font-weight: 800; }
  #tyreFill { background: linear-gradient(90deg,#4ade80,#a3e635); }
  #tyreFill.worn { background: linear-gradient(90deg,#fbbf24,#f59e0b); }
  #tyreFill.gone { background: linear-gradient(90deg,#f87171,#ef4444); }
  #dmgFill { background: #2f3640; }
  #dmgFill.hurt { background: linear-gradient(90deg,#fb923c,#ef4444); }
  #pitLbl { margin-top: 2px; }
  #pitLbl.armed { color: var(--accent); font-weight: 800; }

  /* ---------- Overlay screens ---------- */
  /* The recording indicator. Deliberately a DOM element sitting OVER the
     canvas rather than something drawn on it: the video being written is the
     canvas, so anything painted there to say "recording" ends up in the file
     it is describing. Outside the canvas it is visible to the player and
     invisible to the recorder, which is the whole point. */
  #rec {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px; z-index: 6;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(8,12,17,.9); border: 1px solid rgba(226,72,63,.55);
    font: 800 12px var(--ui, system-ui, sans-serif); letter-spacing: .04em;
    color: #ffd9d6; white-space: nowrap; pointer-events: none;
  }
  #rec.on { display: flex; }
  #rec i { width: 9px; height: 9px; border-radius: 50%; background: #e2483f;
           animation: recBlink 1s steps(1, end) infinite; }
  #rec b { color: #8fa0b8; font-weight: 700; }
  @keyframes recBlink { 50% { opacity: .15; } }

  #overlay {
    position: absolute; inset: 0;
    /* `safe` matters now the screens carry two championship tables: when the
       content is taller than the canvas, plain centring pushes the top out of
       the scroll container where it can never be reached. */
    /* A single column that is exactly the frame's width. Left as `auto` the
       column sizes to the widest child, so the stack could never be told to
       stay inside the frame — 100% would just resolve against the oversized
       column and everything would hang off the right-hand edge. */
    display: grid; grid-template-columns: minmax(0, 1fr);
    align-content: safe center; justify-items: center;
    text-align: center; padding: 22px;
    background: rgba(8,12,17,.86);
    border-radius: 12px;
    backdrop-filter: blur(5px);
    overflow: auto;
  }
  #overlay.hidden { display: none; }
  /* Headings are short enough to centre, but let the browser even out the
     line lengths rather than orphaning a single word on the last line. */
  #overlay h1 { font-size: clamp(26px, 4.6vw, 46px); letter-spacing: -.025em; line-height: 1.05;
                text-wrap: balance; }
  #overlay h2 { font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
                color: var(--muted); margin-bottom: 8px; text-wrap: balance; }

  /* Body copy reads left-aligned in a fixed measure, centred as a block.
     Centring the text itself leaves every paragraph ragged on BOTH edges,
     which is what made the screens look unsettled — the eye has no straight
     edge to return to at the start of each line. Short prompt and status
     lines are the exception and opt back in with .c, .sub or .modeLine. */
  #overlay p  { color: var(--muted); max-width: var(--col); line-height: 1.62; font-size: 14px;
                text-align: left; margin-inline: auto; }
  #overlay p.c, #overlay p.modeLine {
                text-align: center; max-width: var(--col); text-wrap: balance; }
  /* The subtitle is a single short line of tracked capitals — never squeeze it
     into the reading column, or it breaks a place name across two lines. */
  #overlay p.sub { text-align: center; max-width: none; text-wrap: balance; }
  .key { color: var(--accent); font-weight: 800; }
  .sub { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  /* Attribution is small print and should read like it: the tracked capitals
     used for subtitles turn a licence notice into a headline. Sentence case,
     a size down, and left-aligned so it reads as a footnote to the page. */
  /* The author's byline sits directly under the title, so it reads as part of
     the masthead rather than as another line of blurb. Accent-coloured and
     tracked, one size up from the stat line it precedes. */
  #overlay p.byline {
    text-align: center; max-width: none; color: var(--accent);
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 700; margin: 10px auto 2px;
  }
  /* Attribution is small print and should look like it. This has to out-rank
     `#overlay p`, which sets 14px and the reading column — a bare `.credits`
     loses to it on specificity and silently renders at body size. Small enough
     that dimming it too would tip it past readable, so opacity comes back up
     as the size comes down. */
  #overlay p.credits {
    font-size: 9px; line-height: 1.5; letter-spacing: 0; text-transform: none;
    text-align: left; color: var(--muted); max-width: var(--wide);
    margin: 5px auto 0; opacity: .85;
  }
  #overlay p.credits b { font-weight: 700; }
  /* The demo's closing note. Deliberately a panel and not a button: there is
     nothing to click and nowhere to go, because the full version is not for
     sale yet. Anything shaped like a call to action here would be promising a
     page that does not exist. */
  #overlay .demoNote {
    max-width: var(--col); margin: 6px auto 0;
    padding: 14px 20px; border-radius: 10px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.12);
    border-left: 3px solid var(--accent);
    text-align: left;
  }
  #overlay .demoNote p { margin: 0; max-width: none; }
  #overlay .demoNote p + p { margin-top: 7px; }
  /* The stack owns the width of every screen. Without this it shrink-wraps to
     its widest child, so one long line — the subtitle, a wide table — drags the
     whole column past the edge of the frame and the page scrolls sideways. */
  .stack { width: 100%; max-width: var(--wide); margin-inline: auto; }
  .stack > * + * { margin-top: 12px; }
  /* Consecutive paragraphs of prose sit closer together than a paragraph does
     to the heading or table above it. */
  .stack > p + p { margin-top: 9px; }
  /* Anything genuinely too wide to fit scrolls inside itself rather than
     taking the page with it. */
  .scrollx { max-width: 100%; overflow-x: auto; }
  .row { display: flex; gap: 26px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }

  table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700;
       text-align: left; padding: 0 9px 6px; border-bottom: 1px solid rgba(255,255,255,.12); }
  td { padding: 4px 9px; border-bottom: 1px solid rgba(255,255,255,.055); }
  tr.me td { color: var(--accent); font-weight: 800; background: rgba(255,210,63,.07); }
  td.num { text-align: right; }
  .gain { color: var(--good); font-size: 11px; }
  td .tm { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .1em;
           text-transform: uppercase; color: var(--muted); margin-top: 1px; }
  tr.me td .tm { color: rgba(255,210,63,.72) !important; }
  .dnf { color: var(--danger); font-weight: 800; }
  td .tm.dnf, tr.me td .tm.dnf { color: var(--danger) !important; }
  /* A penalty is not a retirement and must not read as one — amber, not red. */
  td .tm.pen, tr.me td .tm.pen { color: #fb923c !important; }

  /* ---------- Teams ---------- */
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 8px;
           max-width: var(--wide); margin-inline: auto; text-align: left; }
  .teams .tc { padding: 7px 10px; border-radius: 7px; background: rgba(255,255,255,.045);
               border-left: 3px solid var(--muted); }
  .teams .tc b { display: block; font-size: 12.5px; color: var(--ink); margin-bottom: 3px; }
  .teams .tc b .yours { font-style: normal; font-size: 9.5px; letter-spacing: .1em;
                        text-transform: uppercase; color: var(--accent); }
  .teams .tc span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  /* The budget line is prose, not a driver row — it must wrap as a block
     rather than as a flex line that hangs its second line under the glyph. */
  .teams .tc .fund { display: block; margin-top: 5px; padding-top: 5px; font-size: 10.5px;
                     line-height: 1.45; border-top: 1px solid rgba(255,255,255,.07); }
  .teams .tc .fund b { display: inline; color: var(--good); font-weight: 800; }

  .ctrls { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-size: 13px; text-align: left;
           color: var(--muted); max-width: var(--col); margin-inline: auto; }
  .ctrls b { color: var(--ink); font-weight: 700; }

  /* ---------- Difficulty mode ---------- */
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px;
           max-width: var(--col); margin-inline: auto; text-align: left; }
  .modes .md { padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,.04);
               border: 1px solid rgba(255,255,255,.09); opacity: .5; }
  .modes .md.on { opacity: 1; background: rgba(255,210,63,.09); border-color: rgba(255,210,63,.5); }
  .modes .md b { display: block; font-size: 13px; color: var(--ink); margin-bottom: 3px; }
  .modes .md.on b { color: var(--accent); }
  .modes .md span { display: block; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
  .modeLine { font-size: 12.5px; color: var(--muted); }
  .modeLine b { color: var(--accent); }

  /* ---------- Weekend settings ---------- */
  .opts { display: grid; gap: 7px; max-width: var(--col); margin: 14px auto 0; text-align: left; }
  .opt { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline;
         padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,.04);
         border: 1px solid rgba(255,255,255,.09); }
  .opt > i { font-style: normal; font-weight: 800; font-size: 11px; color: var(--accent);
             background: rgba(255,210,63,.14); border-radius: 4px; text-align: center; padding: 2px 0; }
  .opt b { display: block; font-size: 13px; color: var(--ink); }
  .opt span { display: block; font-size: 11.5px; line-height: 1.5; color: var(--muted); margin-top: 2px; }
  /* the row heading is a block; a <b> marking the live option inside the
     description text is not, or every option list breaks onto its own line */
  .opt span b, .opt span .key { display: inline; font-size: inherit; }
  .opt em { font-style: normal; font-weight: 800; font-size: 13px; color: var(--accent);
            white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- Careers ---------- */
  .careers { display: grid; gap: 7px; max-width: var(--col); margin: 14px auto 0; text-align: left; }
  .career { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center;
            padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09); }
  .career.on   { background: rgba(255,210,63,.09); border-color: rgba(255,210,63,.5); }
  .career.arm  { background: rgba(226,72,63,.14); border-color: rgba(226,72,63,.7); }
  .career.empty { opacity: .5; }
  .career > i { font-style: normal; font-weight: 800; font-size: 11px; color: var(--accent);
                background: rgba(255,210,63,.14); border-radius: 4px; text-align: center; padding: 2px 0; }
  .career b { display: block; font-size: 13px; color: var(--ink); }
  .career span { display: block; font-size: 11.5px; line-height: 1.5; color: var(--muted); margin-top: 2px; }
  /* the description lines are blocks; a key cap or a highlight INSIDE one is
     not, or "press 3 to start" arrives on three separate lines */
  .career span b, .career span .key { display: inline; font-size: inherit; }
  .career em { font-style: normal; font-weight: 800; font-size: 13px; color: var(--accent); white-space: nowrap; }
  .career.arm em { color: #e2483f; }

  /* ---------- Difficulty slider ---------- */
  .slider { display: flex; gap: 4px; align-items: center; margin: 7px 0 3px; }
  .slider span { flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,.10); }
  .slider span.lit { background: rgba(255,210,63,.45); }
  .slider span.on  { background: var(--accent); box-shadow: 0 0 0 2px rgba(255,210,63,.25); }
  /* The stretch past Legend, where the field stops being better drivers and
     starts being a better car. A different colour because it is a different
     kind of setting, not just more of the same one. */
  .slider span.over     { background: rgba(226,72,63,.16); }
  .slider span.over.lit { background: rgba(226,72,63,.45); }
  .slider span.over.on  { background: #e2483f; box-shadow: 0 0 0 2px rgba(226,72,63,.28); }
  .sliderEnds { display: flex; justify-content: space-between; font-size: 10px;
                letter-spacing: .08em; text-transform: uppercase; opacity: .55; }

  /* ---------- Simulating a race ---------- */
  .simbar { max-width: var(--col); margin: 14px auto 0; height: 8px; border-radius: 999px;
            background: rgba(255,255,255,.09); overflow: hidden; }
  .simfill { height: 100%; background: var(--accent); border-radius: 999px;
             transition: width .12s linear; }

  /* ---------- Qualifying ---------- */
  .qsegs { display: flex; gap: 6px; justify-content: center; margin: 10px 0 4px; flex-wrap: wrap; }
  .qsegs .qs { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 4px 12px;
               border-radius: 999px; border: 1px solid rgba(255,255,255,.12); color: var(--muted); }
  .qsegs .qs.on   { color: #0b0f14; background: var(--accent); border-color: var(--accent); }
  .qsegs .qs.done { color: var(--ink); border-color: rgba(255,255,255,.3); }
  tr.knock td { opacity: .55; }
  tr.cutline td { border-top: 2px dashed rgba(226,72,63,.75); }
  td.qtime { font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
  td.qgap  { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  td.qout  { color: #e2483f; font-weight: 800; text-align: right; font-size: 11px; letter-spacing: .08em; }

  /* ---------- Season calendar ---------- */
  .cal { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 8px;
         max-width: var(--wide); margin-inline: auto; text-align: left; }
  .cal .rd { display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--muted);
             padding: 3px 7px; border-radius: 5px; border-left: 3px solid transparent; }
  .cal .rd i { font-style: normal; font-variant-numeric: tabular-nums; opacity: .55; width: 15px; }
  .cal .rd b { color: var(--ink); font-weight: 600; }
  .cal .rd .dt { margin-left: auto; font-size: 10.5px; opacity: .6; }
  .cal .rd.done { opacity: .42; }
  .cal .rd.now { background: rgba(255,255,255,.07); }
  .cal .rd.now b { color: var(--accent); }
  .vitals { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .vitals div { text-align: center; }
  .vitals dt { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .vitals dd { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* ---------- Money & development ---------- */
  .cash { color: var(--good); font-weight: 800; font-variant-numeric: tabular-nums; }
  .cash.low  { color: #fb923c; }
  .cash.none { color: var(--danger); }

  /* the project cards you spend the budget on */
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(238px, 1fr)); gap: 8px;
              max-width: var(--wide); margin-inline: auto; text-align: left; }
  .pj { position: relative; padding: 9px 11px 9px 32px; border-radius: 8px;
        background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); }
  .pj i.n { position: absolute; left: 9px; top: 10px; font-style: normal; font-size: 10.5px; font-weight: 800;
            color: var(--muted); background: rgba(255,255,255,.09); border-radius: 4px; padding: 1px 5px; }
  .pj b { display: block; font-size: 12.5px; color: var(--ink); }
  .pj b .cost { float: right; font-weight: 800; color: var(--accent); }
  /* Direct children only — the stat readouts inside .lv are inline spans, and
     a blanket rule here would break each one onto its own line. */
  .pj > span { display: block; font-size: 11px; line-height: 1.45; color: var(--muted); margin-top: 3px; }
  .pj .lv { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; margin-top: 5px; }
  .pj.on { background: rgba(255,210,63,.10); border-color: rgba(255,210,63,.55); }
  .pj.on i.n { background: var(--accent); color: #1b2430; }
  .pj.no { opacity: .32; }

  /* the odds, spelled out so a gamble is an informed one */
  .odds { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
          font-size: 11.5px; color: var(--muted); margin-inline: auto; }
  .odds span { padding: 3px 9px; border-radius: 6px; background: rgba(255,255,255,.05); white-space: nowrap; }
  .odds b { color: var(--ink); }

  /* what every team's window actually produced */
  .devlog { display: grid; grid-template-columns: repeat(auto-fit, minmax(258px, 1fr)); gap: 8px;
            max-width: var(--wide); margin-inline: auto; text-align: left; }
  .devlog .tl { padding: 8px 11px; border-radius: 8px; background: rgba(255,255,255,.04);
                border-left: 3px solid var(--muted); }
  .devlog .tl.mine { background: rgba(255,210,63,.08); }
  .devlog .tl > b { display: block; font-size: 12.5px; color: var(--ink); margin-bottom: 5px; }
  .devlog .tl > b .spend { float: right; font-size: 11px; font-weight: 700; color: var(--muted); }
  .devlog .ln { display: grid; grid-template-columns: 15px 1fr; gap: 0 6px;
                font-size: 11px; line-height: 1.5; color: var(--muted); margin-top: 3px; }
  .devlog .ln em { font-style: normal; color: var(--ink); font-weight: 600; }
  .devlog .none { font-size: 11px; color: var(--muted); opacity: .55; }
  .ok { color: var(--good); } .bad { color: var(--danger); } .warn { color: #fb923c; }

  /* ---------- The garage: editing names and liveries ---------- */
  /* The page suppresses text selection so dragging on the track never
     highlights the HUD — form fields have to opt back in or they cannot be
     edited at all. */
  input, textarea { -webkit-user-select: text; user-select: text; }

  .garage { display: grid; grid-template-columns: repeat(auto-fit, minmax(236px, 1fr)); gap: 8px;
            max-width: var(--wide); margin-inline: auto; text-align: left; }
  .gt { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.04);
        border-left: 3px solid var(--muted); }
  .gt.mine { background: rgba(255,210,63,.07); }
  .grow { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .grow.team { margin-top: 0; }
  .grow .gg { flex: none; width: 24px; height: 16px; display: flex; align-items: center; }
  .grow .bdg { flex: none; width: 20px; text-align: center; font-size: 13px; }
  .gt input[type=text] {
    flex: 1 1 auto; min-width: 0; font: inherit; font-size: 12px; color: var(--ink);
    background: rgba(0,0,0,.34); border: 1px solid rgba(255,255,255,.14);
    border-radius: 5px; padding: 3px 7px; }
  .grow.team input[type=text] { font-weight: 800; }
  .gt input[type=text]:focus {
    outline: none; border-color: var(--accent); background: rgba(255,210,63,.09); }
  .gt input[type=color] {
    flex: none; width: 28px; height: 22px; padding: 0; cursor: pointer;
    background: none; border: 1px solid rgba(255,255,255,.18); border-radius: 5px; }
  .gt .yours { flex: none; font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
               color: var(--accent); }

  .btnRow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer;
         background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
         border-radius: 6px; padding: 6px 14px; }
  .btn:hover { background: rgba(255,255,255,.13); }
  .btn.danger { color: var(--danger); border-color: rgba(248,113,113,.38); }
  .btn.danger:hover { background: rgba(248,113,113,.12); }

  /* the arms race at a glance — every team's car, side by side */
  .devgrid { font-size: 12px; }
  .devgrid td.d, .devgrid th.d { text-align: right; font-variant-numeric: tabular-nums; }
  .devgrid .up { color: var(--good); } .devgrid .dn { color: var(--danger); }
  .devgrid .flat { color: var(--muted); opacity: .5; }

  /* --- The same arms race, drawn ------------------------------------------
     Both charts are diverging bars off a centre line, because every number
     they show is a change from where the car started the season and the sign
     is the first thing you want to read. The centre rule is drawn on the
     track, not on the bar, so a row with no development still shows you where
     zero was. ----------------------------------------------------------- */
  .chart { --tn: 118px; --pv: 54px; margin-top: 10px; }
  .chart .hd, .chart .rw {
    display: grid; grid-template-columns: var(--tn) minmax(0, 1fr) var(--pv);
    align-items: center; gap: 8px; }
  .chart .hd { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
               color: var(--muted); padding-bottom: 5px; }
  .chart .hd .ax { display: flex; justify-content: space-between; }
  .chart .rw { padding: 2.5px 0; }
  .chart .rw.me .tn, .chart .rw.me .pv { color: var(--accent); font-weight: 800; }
  .chart .tn { font-size: 11.5px; color: var(--ink); text-align: left;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart .pv { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums;
               color: var(--muted); }
  .chart .pv.up { color: var(--good); } .chart .pv.dn { color: var(--danger); }
  /* The track. The centre rule sits at 50% and is a touch brighter than the
     trough so it reads as an axis rather than as a bar of its own. */
  .chart .tk { position: relative; height: 11px; border-radius: 3px;
               background: rgba(255,255,255,.055); overflow: hidden; }
  .chart .tk::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
                       width: 1px; background: rgba(255,255,255,.22); }
  .chart .tk i { position: absolute; top: 2px; bottom: 2px; border-radius: 2px;
                 min-width: 2px; opacity: .92; }

  /* The per-stat matrix: one row per team, one small track per development. */
  .dmx { font-size: 11px; }
  .dmx table { width: 100%; font-size: 11px; }
  .dmx th.s { text-align: center; padding: 0 4px 6px; }
  .dmx th.s em { display: block; font-style: normal; font-size: 13px; letter-spacing: 0; }
  .dmx td.s { padding: 3px 4px; }
  .dmx td.t { white-space: nowrap; font-size: 11.5px; padding: 3px 8px 3px 0; }
  .dmx .tk { position: relative; height: 9px; min-width: 34px; border-radius: 2px;
             background: rgba(255,255,255,.055); overflow: hidden; }
  .dmx .tk::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
                     width: 1px; background: rgba(255,255,255,.2); }
  .dmx .tk i { position: absolute; top: 1px; bottom: 1px; border-radius: 1px;
               min-width: 2px; opacity: .9; }
  .dmx tr.me td { background: rgba(255,210,63,.07); }
  .dmx tr.me td.t { color: var(--accent); font-weight: 800; }

  /* Position change on the classification: the arrow carries the sign, so the
     number after it is always read as a magnitude. */
  .mv { font-weight: 800; }
  .mv.up { color: var(--good); } .mv.dn { color: var(--danger); }
  .mv.lvl { color: var(--muted); opacity: .55; font-weight: 600; }
  td .gp { color: var(--muted); font-size: 11px; margin-right: 5px; }
  tr.me td .gp { color: rgba(255,210,63,.72); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="pill" id="posBox">
      <div><div class="lbl">Pos</div><div class="big" id="hPos">1<span style="font-size:13px;color:var(--muted)">/8</span></div></div>
      <div><div class="lbl">Lap</div><div class="big" id="hLap">1<span style="font-size:13px;color:var(--muted)">/4</span></div></div>
    </div>
    <div class="pill" id="timeBox">
      <div class="lbl">Lap time · best <span id="hBest" style="color:var(--ink)">—</span></div>
      <div class="big" id="hTime">0:00.00</div>
    </div>
    <div class="pill" id="circBox">
      <div class="lbl">Round <span id="hRound">1/6</span> · <span id="hMode">—</span></div>
      <div class="mid" id="hCirc">—</div>
    </div>
    <div class="pill" id="statusBox">
      <div class="barRow"><span class="bLbl" id="drsLbl">⚡ Between zones</span><div class="bTrack"><div class="bFill" id="boostFill"></div></div></div>
      <div class="barRow"><span class="bLbl" id="tyreLbl">🛞 Tyres</span><div class="bTrack"><div class="bFill" id="tyreFill"></div></div></div>
      <div class="barRow"><span class="bLbl">🔧 Damage</span><div class="bTrack"><div class="bFill" id="dmgFill"></div></div></div>
      <div class="lbl" id="pitLbl">ENTER to pit next lap</div>
      <div class="lbl" id="blueLbl"></div>
      <div class="lbl" id="faultLbl"></div>
    </div>
    <div class="pill" id="boardBox"><div id="board"></div></div>
    <div class="pill" id="radio"><span class="lbl" id="radioLbl">Pit wall 🔊 (V)</span><div class="mid" id="radioMsg">—</div></div>
  </div>

  <div id="rec"><i></i><span id="recTxt">RECORDING</span></div>

  <div id="overlay"></div>
</div>

<script>
"use strict";

/* =========================================================================
   THE DEMO BUILD

   `false` here is the full game, and this file is the only source of truth for
   both builds. `tools/build-demo.js` reads this file, flips the line below to
   `true`, and then physically CUTS everything the demo can never reach —
   rounds 7-24 of the calendar, the elite events, the screens listed as locked
   further down. That second half matters: this is one readable HTML file, so a
   demo that merely set a flag would be the whole paid game with one word to
   change. Stripped, editing the flag back gets you a file with six circuits
   and no invitations, which is not the game anybody would be buying.

   Everything gated on DEMO below is written so the full game reads exactly as
   it did before the flag existed — `if (DEMO)` guards, never `if (!DEMO)`
   wrapped around existing behaviour.

   The demo stops after the FIRST development window has been funded and read.
   That is one complete turn of the loop: six races, the review your team makes
   of them, and the factory session those six races paid for.
   ========================================================================= */
const DEMO = false;

// One block of racing — the calendar boundary the objectives already use, so
// the demo ends where the game itself already draws a line rather than at an
// arbitrary round. Six rounds is roughly eight minutes of driving.
const DEMO_ROUNDS = 6;

/* How long the REAL calendar is, for the demo's closing screen to be honest
   about what it is not showing. It cannot be read off CIRCUITS.length in a
   demo build, because that array is exactly what got cut — so build-demo.js
   counts the circuits in the source and rewrites this line with the true
   figure. Keeping it a plain literal is what makes that rewrite safe. */
const DEMO_FULL_ROUNDS = 24;

/* There is deliberately no store link here. The full version is not for sale
   yet, so the demo's closing screen thanks the player, says the full version
   is in development, and asks for a comment — it does not point anywhere. A
   buy button and a DEMO_BUY_URL constant existed briefly and were removed in
   full rather than left dangling at a placeholder URL, because a dead link on
   the last screen of a demo is worse than no link at all. Restoring them is
   commit 10a11c2 if the release date ever firms up. */

/* Every storage key in this game hangs off one prefix, and the demo gets its
   own. It is declared up here rather than down in the storage section because
   the liveries claim their key two thousand lines earlier than the careers do.

   This is not tidiness. itch.io serves every HTML game from the SAME origin,
   so the demo and the full game would share one localStorage: on a shared
   prefix a player who tries the demo after buying would have its six-round
   career land on top of the twenty-year one they paid for, because the six
   career slots are literally the same six slots. Separate prefixes mean the
   two builds cannot see each other at all — which also means demo progress
   does not carry into the full game, and that is the right side of the trade. */
const KP = DEMO ? "rttp-demo:" : "rttp:";

/* =========================================================================
   CONFIG — every tuning number lives here.
   Want it easier? Lower aiPace. Faster cars? Raise accel and maxSpeed together.
   ========================================================================= */
const CONFIG = {
  // The box every layout is fitted into. The world is this plus a border (see
  // buildTrack) so the pit lane has somewhere to live, and the camera shows a
  // window onto it rather than the whole circuit at once.
  width: 1000, height: 640,

  // --- viewport ---
  // The canvas is the track window with a HUD band above and below it, so no
  // panel is ever drawn over the road.
  viewW: 1000, viewH: 600,
  bandTop: 70, bandBottom: 120,

  // --- camera ---
  // Every circuit is drawn at a zoom of refHalfWidth / its own halfWidth, which
  // puts all 24 on screen at Albert Park's track width — the traced layouts
  // differ so much in density that a fixed view could only fit the tight ones
  // by drawing them thin. camZoom then scales the lot to make up for the room
  // the bands take, so the road ends up exactly as wide as it used to be.
  refHalfWidth: 26,
  camZoom: 1.24,
  camLerp:  6.5,       // how fast the camera settles on the car
  camLook:  0.34,      // seconds of travel to lead the car by
  camEdge:  0.0,       // world units of slack allowed outside the world bounds

  margin: 26,          // keeps the track off the canvas edge
  sampleStep: 6,       // centreline resolution, in world units
  stretchCap: 1.22,    // how much the fit may stretch one axis to fill the canvas
  smoothPasses: 60,    // gentle overall relaxation of the raw spline
  smoothStrength: 0.5,
  minCornerRadius: 72, // no corner may be tighter than this: the spline happily
  curvatureIters: 400, // makes hairpins narrower than the track is wide
  curvWindow: 3,       // must match the window used to build the speed profile
  curvWeight: 0.35,

  // --- car physics (units per second) ---
  maxSpeed:      240,  // used for the AI target ceiling; real terminal is accel/drag
  accel:         210,
  drag:          0.875,// terminal speed = accel / drag  = 240
  brakeForce:    520,
  reverseSpeed:  70,
  turnRate:      4.5,  // rad/s at full lock — traced circuits have real
                       // hairpins, and at 3.0 the cars could not steer them
  turnFalloff:   0.25, // how much steering authority is lost at top speed
  steerLerp:     9,    // how fast steering input ramps (higher = twitchier)

  // --- the human's steering ---
  // The AI steers with a proportional controller and so sits on a few degrees
  // of lock most of the lap. A keyboard offers full lock or nothing, and at
  // racing speed full lock is enough yaw to cross the road in a fifth of a
  // second — which is what made the car feel nervous to drive. The physics is
  // shared and stays shared; it is the player's *input* that gets shaped, on
  // the grounds that a keyboard is not a steering wheel.
  // The ceiling is not free: vmax is built from the yaw limit, so at a slow
  // corner the AI's own pace already needs every degree of lock. Only fast
  // corners are grip-limited and carry spare steering — which is exactly where
  // the twitchiness was. Hence a cap that stays out of the way until 135.
  steerCapLow:  1.00,  // full lock is available below steerCapFrom...
  steerCapHigh: 0.72,  // ...and this much of it at maxSpeed
  steerCapFrom: 135,   // speed at which the cap begins to come in
  steerOnRate:  6.5,   // how fast the player winds lock on (was a flat 9)
  steerOffRate: 13,    // ...and how fast it comes back off again
  gripOn:        9.5,  // lateral velocity kill rate on tarmac
  gripOff:       3.0,  // ...on grass. Lower = slidier.
  offAccelMul:   0.66, // grass penalty
  offDragMul:    1.55, // grass terminal ≈ 102
  boostAccelMul: 1.45,
  boostDragMul:  1.20, // boosted terminal = 290
  boostMax:      100,
  boostDrain:    38,
  boostRegen:    16,   // regen is generous because DRS gates WHEN you may use it

  // --- DRS: designated zones, and a detection point before each of them ---
  // The wing only opens inside a marked zone. In a race it also has to have
  // been earned: the gap to the car ahead is measured once, at the detection
  // line, and whatever it said there is what you get for the whole zone. In
  // qualifying there is nobody to be close to and the zones are simply open,
  // which is how the real thing works and gives a lap something to plan.
  drsGapSeconds:  1.0, // gap to the car ahead AT THE DETECTION POINT (was 0.6
                       // when DRS was available everywhere — the zones are the
                       // restriction now, so the gap can be the real one)
  drsFromLap:     1,   // laps completed before DRS is enabled at all
  drsZoneSpeed:   0.86,// a zone is any run the speed profile lets you take at
                       // this share of maxSpeed — long straights and flat-out
                       // sweeps alike, which is where the real ones live
  drsZoneMin:     150, // world units; a fast run shorter than this is no zone
  drsZoneJoin:    90,  // a dip this short between two fast runs does not split them
  drsZoneDip:     0.72,// ...and only if the speed through the dip stays this high
  drsZoneStartIn: 30,  // activation line sits this far into the fast run...
  drsZoneCap:     0.10,// ...and no zone may be longer than this share of the lap
  drsZoneMax:     3,   // no circuit gets more zones than this, as in the real thing
  drsDetectBack:  110, // detection line sits this far before the activation line

  // --- tyres: wear is driven by how hard you actually slide the car ---
  tyreWearBase:  0.0115, // per second just from running
  tyreWearSlip:  0.00018,// per second per unit of lateral slip
  tyreWearOff:   0.030,  // per second with wheels on the grass
  tyreMin:       0.20,

  /* --- Running the tyres into the ground -----------------------------------
     Wear used to be purely a speed penalty: the tyres bottomed out at tyreMin,
     the car got slow, and that was the whole consequence. Which meant the one
     strategic decision in the game — box for fresh rubber, or stay out and
     hang on — had no downside to staying out beyond lap time.

     Past tyreDangerFrom, a tyre can now let go. It gives you the same warning
     any fixable failure does, so it is a decision and not a coin flip: box and
     lose the position, or gamble that it holds to the flag. Ignore it and you
     are walking home. This applies to every car on the grid and on BOTH
     difficulties — a tyre coming apart is physics, not an assist, and it would
     be a strange game where the easier setting had a failure mode the harder
     one did not. -----------------------------------------------------------*/
  tyreDangerFrom: 0.34,   // wear past this and the tyre starts to be at risk
  /* Per second AT THE FLOOR, falling away as the square of how far past the
     threshold the tyre is — so a tyre a third worn is very nearly safe and one
     run right into the ground is genuinely dangerous.

     Tuned against the numbers rather than by feel, because the first guess was
     an order of magnitude out and made the gamble no gamble at all: running a
     stint to the end on dead rubber came out at a 78% chance of not finishing,
     which is not a decision, it is a rule that says pit. At 0.008 the same
     stint costs you the race about one time in seven, a tyre only a third worn
     is under 2% over half a minute, and staying out is a real bet with a real
     price. -----------------------------------------------------------------*/
  tyreBlowRate:   0.008,
  tyreGripFloor: 0.60,  // grip multiplier when fully worn
  tyreTurnFloor: 0.88,  // steering multiplier when fully worn

  /* --- Compounds -----------------------------------------------------------
     One rubber left the tyre model with nothing to DECIDE. Every car wore out
     at the same rate at the same moment, so there was no undercut, no overcut,
     and never a reason for two cars to be on different plans — the tyres were
     a countdown everybody read off the same clock.

     A compound is deliberately only two numbers, because two is all it takes:
     how fast the set wears, and how much grip it gives. Everything already
     built on top of the wear figure — the blowout roll, the AI's pit booking,
     the pit stop itself — carries on working untouched.

     Life is quoted against the medium. The grip spread is small ON PURPOSE: a
     soft worth a second a lap would make the choice automatic and there would
     be no decision here either. At four per cent it is worth a couple of
     tenths, and the question — whether those tenths outrun the extra stop —
     has a different answer at Sprint than it does at Full, which is exactly
     the answer a strategy layer is supposed to have. --------------------- */
  compounds: [
    { key: "soft",   label: "Soft",   letter: "S", colour: "#f87171",
      wear: 1.45, grip: 1.040, blurb: "Quickest, and gone soonest" },
    { key: "medium", label: "Medium", letter: "M", colour: "#fbbf24",
      wear: 1.00, grip: 1.000, blurb: "Quick enough, and lasts long enough" },
    { key: "hard",   label: "Hard",   letter: "H", colour: "#e5e7eb",
      wear: 0.68, grip: 0.962, blurb: "Slowest, and still there at the flag" },
  ],

  // --- damage: taken from perpendicular impact, not glancing contact ---
  damageMax:       0.50,
  damagePerImpact: 1 / 700,
  damageAccelLoss: 0.35, // at max damage, 17.5% of engine gone

  // --- pit stops ---
  // The lane, its boxes and the garage wall are all quoted at Albert Park's
  // scale and scaled down with the circuit's own track width, so the pit
  // complex is the same size relative to the road everywhere.
  pitLaneLength: 330,  // world units of lane, measured along the centreline
  pitLaneOffset: 20,   // how far outside the runoff the lane sits
  pitLaneHalf:   13,   // half-width of the lane road
  pitWall:       24,   // garage wall, measured out from the lane edge
  pitBorder:     57,   // world border reserved so the complex always fits
  pitMinOffMul:  0.45, // how far the lane may be tucked in on a cramped circuit
  pitLimiter:  118,    // speed limit in the lane
  pitStopBase: 2.0,    // stationary time before any crew variation
  pitStopVary: 0.9,    // ordinary crew scatter, added on top
  pitFumbleOdds: 0.13, // chance the stop goes wrong
  pitFumbleCost: 2.8,  // ...and how much it can cost when it does
  pitPerfectOdds: 0.10,// chance of a really clean stop
  aiPitTyre:   0.52,   // AI books a stop below this (varied per driver per race)

  // --- track geometry ---
  halfWidth: 26,       // tarmac half-width
  runoff:    17,       // grass before the barrier
  // --- the car's footprint, in world units at carScale 1 ------------------
  // A Formula 1 car is 5.6m long and 2.0m wide — very nearly three to one.
  // The old car was 1.5:1, and drawing one anywhere near square is the single
  // thing that makes a top-down racer read as karting rather than motorsport.
  //
  // These two numbers are the whole model: the shape drawn on screen, the
  // collision capsule and the AI's idea of "can I fit alongside" are all built
  // from them, so what you see really is what you hit. One world unit works
  // out at about 0.24m.
  carHalfL: 11.8,      // half the length, front wing to rear wing
  carHalfW:  4.2,      // half the width, across the wheels
  carScale:  1,        // per-circuit: narrow layouts need smaller cars

  // --- AI ---
  aiLatAccel: 520,     // cornering ceiling used to build the speed profile
  aiBrake:    380,     // how early the AI lifts for a corner
  aiPace:     0.955,   // global AI speed multiplier — THE difficulty dial
  aiSteerGain: 2.6,

  // --- AI mistakes: odds per second, scaled by the driver's own sloppiness
  //     and by tyres, damage, corner load and pressure from behind ---
  mistakeRate:   0.10,
  mistakeQuiet:  3.0,   // seconds of calm after the start
  errTyreHeat:   1.5,   // multiplier at fully worn tyres
  errPressHeat:  1.6,   // multiplier with someone in your mirrors
  errCornerHeat: 1.8,   // multiplier mid-corner (vs 0.35 on a straight)
  aiLookBase: 2.0,
  aiLookTime: 0.40,    // seconds of lookahead

  /* --- Getting unstuck ------------------------------------------------------
     A car nosed into a barrier after a shunt has to reverse out of it, or it
     sits there flooring the throttle into the wall until the flag.

     The trouble is that "slow, and pointing the wrong way" also describes a car
     that has merely SPUN — which is a mistake the AI is meant to make and drive
     out of, not something to reverse for. Measured over a race at Brazil, every
     episode of a car reversing down the circuit began with a spin in clear air
     with nothing near it; not one of them was a car against a barrier.

     So the question is not "am I slow and askew" but "am I slow and askew AND
     have I stopped GOING anywhere". A spun car is still travelling, and under
     throttle and full lock it drives itself out in about a second. A wedged one
     covers no ground at all, however much throttle it is given, because
     barriers() takes the speed back off it every frame. `stillFor` is what
     separates them — see the anchor in aiControls.

     The rest is hysteresis. The old test engaged and released on one number, so
     a car reversing away from a wall crossed it, was handed back to the racing
     line, slowed, crossed it again and grabbed reverse — a limit cycle that
     walked it backwards down the road at a steady 17 units/s for two and a half
     seconds. `release` sits well clear of `engage` for that reason, `errClear`
     does the same on the angle, and `maxTime` caps the manoeuvre regardless:
     one back-up, then drive, however wrong the geometry still looks. */
  unstick: {
    engage:    18,    // reverse below this speed...
    release:   38,    // ...and hand back above this one. Never equal.
    err:       1.4,   // radians off the road's own direction to count as askew
    errClear:  1.0,   // ...and back inside this to be pointing somewhere useful
    stillWin:  0.6,   // seconds of going nowhere before a car counts as wedged
    stillDist: 12,    // ...where "nowhere" is less than half a car length
    maxTime:   1.4,   // longest one reverse may last
    cool:      2.5,   // ...and the wait before another may start
  },

  // --- following in traffic ---
  // With eight cars an AI rarely had company. With twenty-two there is almost
  // always somebody directly in front, and the old rule — charge up to within
  // a car's length and then lift ten percent — turned the field into one long
  // train grinding against itself.
  //
  // Instead a car works out the fastest it could be going and still not hit
  // the one ahead: their speed, plus whatever the remaining gap can safely
  // absorb. Approach is quick while there is room and settles as it closes, so
  // the field strings out into a queue with gaps in it, and an overtake starts
  // with pulling out of line rather than with contact.
  // Tuned by racing the full field headlessly and counting contacts: 2.2 cuts
  // hard hits by about ninety percent while keeping four overtakes in five.
  // Closing faster than this buys no extra overtaking, only more contact.
  // Since dropped to 1.75. 2.2 was the point where the *number* of overtakes
  // stopped improving, but not the point where contact stopped falling, and a
  // twenty-two car field spends most of the race nose-to-tail: the last quarter
  // of the closing rate was buying almost nothing but tapped rear wings.
  aiFollowGain: 1.75,  // speed the gap may be closed at, per unit of gap
  aiFollowFloor: 0.35, // backstop: never asked for less than this share of pace
  // How much lateral clearance counts as "there is room to go by", in car
  // widths. Bare 1.0 is the width of the car and nothing else, which has an AI
  // commit to a gap it fits through only if neither driver so much as breathes
  // on the wheel — so it wants rather more than that before it stops lifting.
  // Swept headlessly against the game's own damage counter: 1.6 buys half as
  // much overtaking again as the old wide car with no more damage than it had.
  // 1.9 asks for a little under another half a car width before committing —
  // the same trade again, and the one that stops a move being started from a
  // gap that closes the moment the car ahead takes its normal line.
  aiSideRoom: 1.9,
  aiReachBase:  44,    // how far ahead a car looks for traffic: this...
  aiReachTime:  0.42,  // ...plus this many seconds of its own travel
  aiReachMax:  150,

  // --- team orders ---
  // A team's priority driver is whichever of its two cars is higher in the
  // drivers' championship, decided at the start of the race so it cannot flip
  // mid-lap. If the priority car gets stuck behind its own team-mate, the team
  // asks the team-mate to move over. Orders are given to AI cars only — the
  // player is never driven for, only asked.
  orderGap:      0.9,  // seconds: how close counts as "held up"
  orderHold:     2.2,  // ...and for how long before the pit wall says anything
  orderFromLap:  1,    // never on the opening lap
  orderYieldFor: 4.5,  // seconds the team-mate spends getting out of the way
  orderYieldPace: 0.80,// how much they lift while doing it
  ordersPerRace: 1,    // one favour per car per race, so it stays an event
  mateRespect:   1.45, // extra room an AI leaves its own team-mate

  /* --- blue flags -----------------------------------------------------------
     A car about to be lapped is shown a blue flag and is expected to get out of
     the way. Nothing here is a new physics system: a blue flag arms exactly the
     same `yieldSide` line offset team orders already use, so a car moving aside
     for the leader moves aside the way a car moving aside for its team-mate
     does. What is different is that it is not a favour — there is no
     `ordersLeft` budget, it re-arms for as long as the flag stands, and
     ignoring it is worth a penalty.

     `from` is measured as a TIME rather than a distance because that is what
     the real regulation is and because a fixed distance means something
     different at Monaco than it does at Monza. There is no separate withdrawal
     figure: the moment the pass completes, the lapping car stops being behind
     and fails `within` on its own, and `linger` is what holds the lapped car
     out of the way for the second it takes to get by. */
  blue: {
    fromLap:   1,     // never on the opening lap, as with team orders
    within:    1.6,   // seconds behind: how close the lapping car has to be
    hold:      0.7,   // ...and for how long before the flag actually comes out
    linger:    1.1,   // how long it stands once the car is past or has dropped back
    /* A car rejoining from the pit lane arrives on the road already on the
       gearbox of whatever it came out behind. There is no approach for `hold`
       to watch, and the seven tenths it asks for is exactly the window in which
       that contact happens — so for this long after a rejoin the flag comes out
       at once rather than after the wait. Reported from play: twice, a lapped
       car braking in front of a car leaving the pits, no blue flag shown, and
       the penalty went to the driver who had just rejoined.

       MEASURED with tools/blueflags.js, over eight rounds on identical seeds,
       counting car-frames where a car inside this window is closing on a car a
       lap down and the flag ought therefore to be out. Coverage was 7%. This
       alone takes it to 27% and `queue` alone to 80%; together 97%, which is
       why both are here — they fix different halves of the same complaint and
       the first guess was that this one was the whole of it. */
    pitGrace:  4.0,
    pace:      0.88,  // how much a lapped AI lifts while being passed
    lineFrac:  0.9,   // ...and how far across the road it goes, as a share of room
    blame:     true,  // contact under a blue flag is the lapped car's, always
    /* ...and the flag counts for the whole queue behind it, not only the car it
       is shown for. Off, a lapped car answers to the nearest of the cars lapping
       it and races the rest — which is how a driver who rejoins from the pits
       into the back of a lapping train collects the penalty for a backmarker
       that is already under blue for somebody else. A switch so it can be
       measured against itself — see pitGrace for the coverage it is worth.

       It changes NOTHING in an AI-only field: penalties come out at 1.63 a race
       either way, and not one of them was ever attributed to a blue-flagged car
       over eight rounds, because the AI complies with the flag rather than
       sitting there. The case this fixes needs a driver who arrives at a
       backmarker faster than the AI ever does, which is the case it was
       reported from and the one no headless harness can produce. */
    queue:     true,
  },

  // --- reliability: things break, and they break at random ---
  // The roll is per car per second, so a long race is genuinely more dangerous
  // than a short one. Everything below multiplies that one base rate.
  //
  // The base rate was set when the grid was eight cars and never revisited when
  // it became twenty-two, so the number of retirements quietly grew with the
  // field: three or four a race, and worse over distance. That is more than a
  // real grand prix sees and much more than is any fun to be on the end of —
  // losing an afternoon to a die roll you had no part in is the one way this
  // game can waste your time. Cut to a third, with the multipliers that stack
  // on top of it pulled in as well, since it was the STACK that produced the
  // outliers: a damaged car on ruined tyres late in a race using the boost was
  // carrying eight times the base risk, and being the quickest car on track was
  // most of how it got there.
  failBase:     0.00062,
  failQuiet:    8,      // seconds of grace at the start
  failLateHeat: 1.15,   // extra risk by the end of the race, as parts tire
  failBoostHeat: 1.5,   // thrashing it on the boost hurts
  failDamageHeat: 2.0,  // multiplier at maximum damage
  failWornHeat: 0.45,   // extra risk on ruined tyres

  // Impacts that end a race outright, on top of the random rolls. Both raised:
  // contact is much gentler than it was, so a hit hard enough to end a race
  // should now be a genuine shunt rather than a firm nudge into a barrier.
  wreckImpact:  140,    // a hit this hard with the car already maxed out
  injuryImpact: 210,    // a hit this hard can hurt the driver...
  injuryOdds:   0.05,   // ...but usually doesn't
  fixTime:      2.6,    // extra seconds in the box to cure a fixable problem
  aiFixPitLaps: 1,      // AI only bothers pitting for a fix with laps left

  // --- Semi-Pro: assisted driving ---------------------------------------
  // Two difficulty modes, and only one of them changes anything: Pro is the
  // game exactly as it was. Semi-Pro leaves the physics alone — the car has
  // the same grip, the same brakes and the same terminal speed — and instead
  // shapes what the *player asks for* before it reaches stepCar, on the same
  // grounds as the steering cap above: a keyboard is not a steering wheel.
  //
  // Everything it needs already exists for the AI. track.vmax is a per-sample
  // grip-limited speed ceiling and the centreline carries normals, so the
  // assist reuses the AI's own targeting rather than inventing a second
  // driving model that could disagree with the first.
  assist: {
    aiPace:      0.90,  // the field eases off (Pro is CONFIG.aiPace)
    steerBlend:  0.30,  // fraction of the AI's correction added to your input
    steerGiveUp: 1.35,  // rad of heading error past which assist lets go, so
                        // a spin or a wrong-way recovery is yours to drive out
    steerRateMin: 9,    // floor on the input ramp rate while assisting
    liftFrom:    0.92,  // lift off above this multiple of the safe entry speed
    liftTo:      0.35,  // ...down to this much throttle
    brakeFrom:   1.00,  // and actually brake above it. There is no grace here on
                        // purpose: the safe speed is already a braking-distance
                        // calculation, so any grace is spent arriving too fast.
    brakeSafety: 0.85,  // ...and the calculation only banks this much of the
                        // car's stopping power, so it commits early, not late
    damageMul:   0.50,  // impacts bend the car half as much...
    /* ...but a bent car is still a bent car. Semi-Pro used to be unable to
       lose a race to damage at all, which made the damage bar decoration: it
       filled up, and then nothing happened. It can now end your afternoon,
       just later than it would in Pro — half the damage per hit means twice
       the abuse to reach the limit, and the hit that finally does it has to be
       harder. What Semi-Pro still protects is the DRIVER: no trip to the
       medical centre, because on the assisted difficulty a twenty-year career
       should not end on a barrier. */
    crashOutMul: 1.6,   // a wreck needs a hit this much harder than in Pro
    noInjury:    true,  // and never hurts the driver
  },

  // --- contact -----------------------------------------------------------
  // Cars touching is motor racing; cars bouncing off each other every corner
  // is dodgems. Everything that happens WHEN two cars are already overlapping
  // lives here, so the severity of contact can be tuned without touching how
  // willing the AI is to go for a gap (aiSideRoom / aiFollowGain, above).
  //
  // The old numbers were an 0.65 restitution on the closing speed with damage
  // from 70 up. On a twenty-two car grid that made every train down a straight
  // a slow-motion pile-up: each tap threw both cars sideways hard enough to
  // start the next one.
  contact: {
    restitution: 0.40,  // share of closing speed handed back (was 0.65)
    separate:    1.35,  // overlap is pushed apart this much harder than 50/50,
                        // so cars stop resting inside each other and grinding
    slide:       0.55,  // of the push, this much is redirected ACROSS the cars
                        // rather than along the contact normal — two cars side
                        // by side peel apart instead of trading speed
    damageFrom:  95,    // closing speed before contact bends anything (was 70)
    damageMul:   0.28,  // ...and how much it bends it (was 0.45)
    // The opening lap is where a twenty-two car field is closest together and
    // has the least idea where anyone else is. Everyone leaves more room for
    // this long after the lights, easing back to normal.
    openingSecs: 7,
    openingRoom: 1.5,   // multiplier on aiSideRoom while that lasts
    openingPace: 0.94,  // ...and on the speed they'll chase the car ahead at
  },

  /* --- the stewards ---------------------------------------------------------
     Until now contact had exactly one consequence: damage, split evenly between
     both cars. That made a shunt a MECHANICAL trade — is the bodywork worth the
     place — and never a decision about whether the move was on. Barging a car
     wide cost the same whether you were alongside or three car-lengths back and
     hopeful. This is what puts a cost on the second one.

     Two things have to be true for it to be worth having, and both are harder
     than the penalties themselves:

     1. FAULT HAS TO BE ONE-SIDED. Damage is symmetric because physics is; blame
        is not. `judgeContact` decides who caused it and penalises that car
        alone. Get this wrong and the feature is worse than nothing, because a
        player punished for being hit will switch it off and be right to.
     2. RACING INCIDENTS HAVE TO SURVIVE. Two cars that touch while genuinely
        side by side are motor racing, and the stewards must return "nobody" for
        those. `sideTol` is what buys that — though see its own note, because
        the measurement showed it doing far less work than this was written
        expecting, for a reason that turned out to be reassuring.

     Applies to the whole field, the player included — an AI that barges is
     judged by the same rule and serves the same penalty. That is not decoration:
     in a twenty-year career most races that decide a championship are ones the
     player is not even on the same lap as.

     Every figure below was MEASURED with tools/stewards.js over the full
     calendar rather than guessed, for the reason the safety car block gives.  */
  stewards: {
    /* Contact softer than this is never looked at, quoted in the same closing
       speed the damage model uses so the two are directly comparable.

       MEASURED over six rounds of full-field AI racing (tools/stewards.js
       sweep), and the measurement moved every number here a long way. Fault-
       attributed contact runs 0 to 134 and is heavily bottom-weighted: the
       median is 18, p90 is 57, p99 is 86, and there are FOUR contacts above 90
       in six races. Nothing like the 200-plus the ladder was first drawn for.

       82 yielded 4.8 calls a race across twenty-two cars when it was chosen —
       about one car in five hearing from the stewards, which is a busy Sunday
       and not a farce. 62 — which looked reasonable from the source, sitting
       just under contact.damageFrom — gives FIFTEEN a race, a stewards' room
       busier than the race.

       WHERE IT STANDS TODAY, and the 4.8 above is NOT it. Everything built
       after that number moved it and none of it was re-measured here until
       2026-08-09: blue flags took it down about a fifth by making backmarkers
       move rather than get run into, and the brake-check excuse took roughly a
       third more. Re-measured over the full calendar (tools/stewards.js verify,
       ROUNDS=24, Pro, AI-only, full distance):

           2.83 calls a race, ladder 3s 52 : 5s 15 : stop-go 1, no black flags

       A CAREER season measures lower still — 1.8 to 2.0, and the same in both
       modes (tools/season.js). Two reasons, both structural: the race ends when
       the player's car does, and a developing field is a faster, tidier one.
       Quote 2.83 for a full AI race and about 1.9 for a season; the historical
       figures in this block are labelled with what they were measuring.

       ONE LADDER SERVES BOTH MODES. Semi-Pro eases the field to assist.aiPace,
       6% off Pro, and since everything here is calibrated on closing speed the
       expectation was that Semi-Pro would need its own softer thresholds.
       Measured on identical seeded races (tools/stewards.js modes) it does not:
       5.69 calls a race in Pro against 4.94 in Semi-Pro AT THE TIME, with the
       contact distribution all but unchanged — median 90 against 89, p90 102
       against 102. The reason is that closing speed is a RELATIVE velocity, set
       by the speed differential between two cars in traffic, and slowing the
       whole field barely moves that. Do not add a per-mode threshold on the
       strength of the pace difference alone; it was checked — and checked
       again on 2026-08-09 over four career seasons, where the two modes come
       out at 1.9 apiece and the gap has closed rather than opened.

       The count is a floor rather than a forecast, for two reasons: the sample
       is AI-only, and the AI is explicitly tuned to avoid contact (see
       aiSideRoom), while a player diving up the inside is not.

       ONE CIRCUIT DOES RUN HOT, and the size of it was overstated here for
       three days. This said "the Red Bull Ring returns 19 calls against a median
       of 4" — one race, at the top of that circuit's range, against a median
       drawn from one race at each of the others. Ranking single races ranks the
       noise: on three seed bases the busiest circuit came out Austria 15,
       Austria 8, and Australia 9. Settled by racing one circuit repeatedly
       (tools/stewards.js circuit N):

           Austria    12 races   mean 9.00   median 8   range 5-19
           Italy      12 races   mean 4.83   median 4   range 2-8
           Australia  12 races   mean 4.75   median 5   range 2-8

       So Austria — the short lap that keeps the whole field permanently in
       traffic — is worth about DOUBLE an ordinary circuit, not five times it,
       and its quietest race is an ordinary circuit's average. Real, reproducible
       and smaller than advertised. Unfixed: the options are a per-circuit
       allowance on reviewFrom or a cap on calls per car per race. */
    reviewFrom:  82,
    /* ...and the ladder above it. Note how close the rungs are: that is the
       distribution, not timidity. There is no room for a wider spread because
       there is nothing above 134 to spread into, and a stopGoFrom set where it
       "ought" to be would simply never fire once. */
    tenFrom:     95,   // the heavier time penalty — a hit hard enough to move
                       // the other car off line
    stopGoFrom:  112,  // stop-go — the top fraction of a percent of all contact
    /* What the two rungs are worth. Both were cut — 5s/10s to 3s/5s — because
       ten seconds is most of a pit stop and it landed on contact the ladder
       itself calls the middle of the distribution, not a shunt. The severity
       of a hit decides WHICH rung, and the rungs are close together on purpose:
       what is meant to hurt is collecting them, which is what thirdOffence is
       for. The gap between a penalty and a stop-go does the heavy lifting.
       Nothing about the thresholds moves with this — the same contact is judged
       the same way, it just costs less. */
    secsLow:     3,
    secsHigh:    5,
    /* A driver who keeps doing it stops being unlucky. The third judged offence
       in one race is a stop-go whatever it was worth on the ladder — and this
       matters more than it looks, because the severity route to a stop-go is so
       rare. When this went in, a full calendar produced three stop-gos in
       twenty-four races and this rule produced one of them; re-measured
       2026-08-09 it is ONE in twenty-four AI-only races, and 0 to 4 across a
       career season. Rare either way, and rare on purpose. It is what stops a
       driver collecting time penalties as a cost of doing business — which
       matters more now the rungs are 3s and 5s than it did at 5s and 10s.

       Nothing here has ever been tested against a human, and a human is the
       only driver likely to reach the third offence often. Treat every count in
       this block as a floor. */
    thirdOffence: 3,
    stopGoSecs:  8,    // stationary, no work done on the car
    // ...to be served inside this many laps of the offence. Miss it and it is a
    // black flag. Three is enough to take the penalty at a moment of your
    // choosing and not so many that it stops mattering.
    serveLaps:   3,
    // A stop-go the race ends before you can serve converts to this instead —
    // the flag falling is not a way out of it, but nor is it a black flag for
    // something you were never given the laps to do.
    unservedSecs: 20,
    /* THE OPENING-LAPS RULE. Nothing that happens in a driver's first two laps
       is called, however hard it was.

       Twenty-two cars start within a few lengths of each other on a road built
       for six abreast, and for the first corner or two they are closer together
       than they will be again all afternoon. Contact there is the START, not
       driving worth a penalty: everyone arrives at turn one at once, somebody
       gets squeezed, and the car it happens to is as often the victim of the
       geometry as the cause of it. Judging that stretch by the same closing
       speed the rest of the race is judged by hands out penalties for being in
       a queue — and it lands hardest on whoever qualified in the middle of the
       grid, which is nobody's idea of a fair race.

       Counted per CAR rather than off the leader, so a driver who has his own
       first-lap moment is covered by it wherever the rest of the field has got
       to. `lapsDone` is 0 through the opening lap and 1 through the second, so
       this is a car on its third lap onwards being judged.

       It is a grace period, not an amnesty: nothing about the ladder changes,
       and a driver still carrying a stop-go into lap three still has to serve
       it. Only what happens inside the window goes unjudged. */
    graceLaps:   2,
    /* One incident, one penalty. Two cars grinding down a barrier resolve a
       fresh overlap every frame at 60Hz, and without this a single scrape is
       forty offences and an instant black flag. Held per CAR rather than per
       pair, so a first-corner pinball is also one call. */
    incidentGap: 2.5,
    /* THE RACING-INCIDENT RULE. When neither car is simply driving into the
       back of the other, fault goes to whoever is moving ACROSS the circuit
       into the other one — measured against the track normal, not the cars'
       own headings, because two cars in a corner are both turning and neither
       is at fault for that. If the two are closing across the track within
       this much of each other, nobody is blamed: they both went for the same
       piece of road, which is a racing incident.

       MEASURED, and the measurement was humbling: this barely matters. On
       paired seeded races (tools/stewards.js incidents) the whole range 0 to 26
       gave an identical 4.38 calls a race, and even 90 only took it to 4.13.
       Those are the rates as they stood before blue flags and the brake-check
       excuse; the calendar now runs at 2.83 and the INSENSITIVITY is the
       finding, not the absolute number.
       The reason is in the `paths` run — the rear-end test alone accounts for
       4.13 of those 4.38, so side-by-side contributes about a quarter of a call
       a race and this dismisses a fraction of that. Hard contact between AI
       cars is nearly always one car driving into another roughly head-on.

       It is kept, at a value inside the range measured to change nothing,
       because the sample it was measured on cannot see the case it exists for:
       every race here is AI-only, and the AI is explicitly tuned to avoid
       contact (aiSideRoom). A human going two abreast into a corner generates
       exactly the contact this protects, and there is no headless way to
       produce that. Insurance, priced at zero. */
    sideTol:     26,
    /* ...and how head-on the contact has to be before it is read as a plain
       rear-end and blamed on the car behind without looking at anything else.
       The dot product of the chasing car's heading with the direction to the
       car it hit: 1.0 is dead ahead, 0 is directly alongside. 0.62 is about 52
       degrees. MEASURED as insensitive between 0.4 and 0.75 — identical counts
       — because a contact the cone rejects is usually caught by the
       side-by-side test and blamed on the same car anyway. */
    noseCone:    0.62,
    // A car whose brakes have failed cannot avoid anything, and blaming the
    // driver for the car is the one call that would feel cheapest.
    excuseFailed: true,
    /* THE BRAKE-CHECK RULE. Nobody is penalised for running into a car that
       slowed for something the road did not ask for.

       The rear-end test above is one dot product, and it was the whole of the
       question: are you pointed at the car you hit? If so it is your penalty.
       That is right almost always and badly wrong in the case a player meets
       most — the car in front slowing for a reason that is nothing to do with
       him. There are SEVEN of those and they are not exotic: a lock-up, the
       `slow` mistake, a blue-flag lift, a team order, the safety-car ceiling, a
       failure taking a car's legs, or the car in front simply concertinaing off
       one in front of IT.

       And the game goes out of its way to produce the first one right where it
       hurts. errPressHeat is 1.6 — an AI is sixty per cent more likely to make
       a mistake with somebody in its mirrors — and 40% of mistakes are the
       lock-up. So the car ahead is at its most likely to stand on the brakes
       precisely when the player is close enough to be unable to do anything
       about it, and then the player got the penalty for it. That is the
       "punished for being hit" case the note at the top of this block says is
       worse than having no stewards at all.

       ONE TEST, NOT SEVEN. Rather than special-case every cause — which would
       need each one plumbed through to here and would miss the eighth — this
       asks the cause-free question: was the car in front slowing for the ROAD?
       A car braking for a corner is going FASTER than the corner needs; that is
       why it is braking. A car that brake-checks is already slow enough for
       everything ahead of it and is braking anyway. So:

           decelerating hard   AND   already slower than the road requires

       is braking the circuit does not explain, whatever caused it. It reads the
       same for a human, so a player who brake-checks an AI is not excused
       either — the field is judged alike here as everywhere else in this block.

       The verdict is NOBODY, not the car in front. Two reasons. Most of the
       seven causes are mistakes or are forced, and a lock-up is not an offence
       — the file already excuses a car for its own mechanical failures on
       exactly that reasoning. And the failure mode of getting this wrong is
       asymmetric: an excuse that fires when it should not costs a penalty that
       would have been correct, while a penalty that fires when it should not is
       the thing that makes a player switch the feature off.

       It is UNCONDITIONAL — there is no closing speed above which it stops
       applying. The argument for a cap is that burying it at 130 means you had
       room and time; the argument against is that the hits which make a driver
       angriest are the hardest ones, so a cap preserves precisely the case this
       exists to fix. The `hold` window is what keeps it honest instead: the
       excuse covers contact in the moment after the lift, not a hit that
       happens long enough later to have been avoided. */
    brakeCheck: {
      on: true,
      /* Deceleration, in speed units per second, that counts as "hard". Read
         from the physics step alone and NOT from the change in velocity across
         the frame, which would include the collision impulse and let a car earn
         the excuse from the shunt it is being judged for.

         MEASURED (tools/stewards.js brakecheck dist), and the signal turned out
         to be cleanly bimodal, which is why this number is not delicate: a car
         that is not braking decelerates by at most about 84 (p90 of a million
         samples, drag and a lifted throttle), and a car that IS braking is at
         585 or more. Nothing lives in between. Anything from 150 to 560 selects
         the identical set of frames — swept, and the penalty count does not
         move by one call across that whole range. 300 is the middle of the gap.
         The cliff is at 620, which starts cutting into real braking. */
      decel: 300,
      /* ...and how far below its own target the car has to already be, where
         the target is paceWant — the speed it is steering to.

         MEASURED, and this is the delicate one. The field normally sits at 0.87
         of target (median) and 0.97 at p75, so the tolerance has to clear that
         band or ordinary driving trips it. There is a sharp cliff: at 0.85 and
         below, every single contact this rule waves away has a nameable cause
         behind it — a mistake, a failure, a car off the road. At 0.90 that
         breaks down and 18% of dismissals are cars with nothing wrong at all,
         and at 0.95 it is 32%. Those are the false positives, and they are the
         ones that would quietly switch the rear-end test off. 0.85 sits on the
         safe side of the cliff and loses almost nothing for it: 43% of
         penalties dismissed at 0.90 against 43% at 0.85. */
      slack: 0.85,
      /* How long the excuse lasts after the odd braking stops, in seconds — the
         reaction window, and the only limit on a rule that is otherwise
         unconditional.

         MEASURED and it SATURATES, which is what picked the number. 0.15s
         dismisses 4% of penalties, 0.40s dismisses 32%, 0.60s dismisses 39% —
         and then it flattens out, with 1.20s reaching only 43%. Nearly every
         contact caused by a car braking oddly happens inside six tenths of a
         second of it. Doubling the window past that buys four points of drop
         and doubles the share of the race the field spends holding an excuse
         (6.1% of car-frames to 10.4%), which is pure exposure to waving away
         some later contact that had nothing to do with it. */
      hold: 0.6,
