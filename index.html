    </p>`;
}

/* --- Difficulty mode, as shown on the screens ---------------------------- */
// The full picker, for the title and grid screens where there is room to read.
function modePicker() {
  const semi = assisted();
  return `<div class="modes">
      <div class="md${semi ? " on" : ""}">
        <b>🛟 Semi-Pro${semi ? " — active" : ""}</b>
        <span>The car helps you steer through the corners and brakes for you if you
        arrive too fast, and impacts bend it half as much. The field runs a little
        slower. Same car, same grip — just a hand on the wheel. It will not protect
        you from a car you have already wrecked, or from tyres you have run into
        the ground: both can still end your race. What it does protect is
        <b>you</b> — no shunt on Semi-Pro sends the driver to the medical centre.</span>
      </div>
      <div class="md${semi ? "" : " on"}">
        <b>🏎️ Pro${semi ? "" : " — active"}</b>
        <span>No assists. You brake for every corner yourself, a heavy enough
        crash on a car already at maximum damage ends your afternoon, and a big
        enough one can put you in the medical centre — which, in a career, can
        cost you more than the race. The field runs at full pace.</span>
      </div>
    </div>
    <p class="modeLine">Press <span class="key">T</span> to switch — at any time, including mid-race.</p>`;
}
/* =========================================================================
   Weekend settings — race length, the qualifying format and the formation lap.
   Same idiom as the development window: the number picks the row.
   ========================================================================= */
function settingsScreen() {
  const qm = QUALI_MODES.find(m => m.key === qualiMode);
  // Only ever used to quote a representative lap count, so a season that has
  // run out of rounds can safely be shown the last circuit on the calendar.
  const circuit = circuitAt(season ? season.round : 0);
  const row = (n, title, value, blurb) =>
    `<div class="opt"><i>${n}</i><div><b>${title}</b><span>${blurb}</span></div><em>${value}</em></div>`;
  return `
    <div class="stack">
      <h1>⚙️ Weekend settings</h1>
      <p class="sub">Press the number to change a row · SHIFT to go back · SPACE to close</p>
      <p class="modeLine" style="margin-bottom:2px">Opponent skill also takes <span class="key">←</span> <span class="key">→</span></p>
      <div class="opts">
        ${row(1, "Race length", raceLen.label,
              `${raceLen.blurb}. <b style="color:var(--ink)">${lapsFor(circuit)} laps</b> at ${circuit.name}.<br>` +
              CONFIG.raceLengths.map(l => `${l === raceLen ? "<b style=\"color:var(--ink)\">" : ""}${l.label} ${lapsFor(circuit) && Math.max(2, Math.round(circuit.laps * l.mul))}${l === raceLen ? "</b>" : ""}`).join(" · "))}
        ${row(2, "Qualifying", qm.label, qm.blurb + ".<br>" + (qualiMode === "off"
              ? "The better you did last time out, the further back you line up."
              : `Q1 runs all ${DRIVERS.length} and drops ${CONFIG.quali.cut}, Q2 runs ${DRIVERS.length - CONFIG.quali.cut} and drops ${CONFIG.quali.cut}, ` +
                `Q3 is a ${DRIVERS.length - CONFIG.quali.cut * 2}-car shoot-out for pole.`))}
        ${row(3, "Session length", qualiMode === "off" ? "—" : `${qualiSecs}s`,
              qualiMode === "off"
                ? "Nothing to time while qualifying is off."
                : `Running time in each of Q1, Q2 and Q3 — roughly ${Math.max(1, Math.floor(qualiSecs / 22))} flying laps apiece.<br>` +
                  CONFIG.quali.times.map(t => t === qualiSecs ? `<b style="color:var(--ink)">${t}s</b>` : `${t}s`).join(" · "))}
        ${row(4, "Formation lap", formationOn ? "On" : "Off",
              "A lap behind the safety car before the lights, driven for you. Skippable with SPACE while it runs.")}
        ${row(5, "Opponent skill", aiLevel.label,
              `${aiLevel.blurb}. They run at <b>${Math.round(aiLevel.mul * 100)}%</b> of the standard pace and make ` +
              `<b>${Math.round(aiLevel.err * 100)}%</b> as many mistakes.` +
              // Above Legend the field is also given a better car, and saying so
              // is the point — a setting that quietly hands the opposition grip
              // you do not have should be quiet about nothing.
              (handMul() > 1
                ? ` Above Legend they also carry <b>${Math.round((handMul() - 1) * 100)}%</b> more grip than your car does.`
                : "") +
              (assisted() ? " Semi-Pro eases them a little further on top of this." : "") +
              `<div class="slider">${CONFIG.aiLevels.map(l =>
                `<span class="${l === aiLevel ? "on" : ""}${CONFIG.aiLevels.indexOf(l) < CONFIG.aiLevels.indexOf(aiLevel) ? " lit" : ""}${(l.hand || 1) > 1 ? " over" : ""}"></span>`).join("")}</div>` +
              `<div class="sliderEnds"><span>${CONFIG.aiLevels[0].label}</span><span>${CONFIG.aiLevels[CONFIG.aiLevels.length - 1].label}</span></div>`)}
      </div>
      <p class="modeLine" style="margin-top:14px">Difficulty is separate — <span class="key">T</span> switches it at any time,
        including mid-race. Currently <b>${assisted() ? "🛟 Semi-Pro" : "🏎️ Pro"}</b>.</p>
    </div>`;
}

/* =========================================================================
   The career browser — six championships, any of which can be picked up.
   ========================================================================= */
function agoText(t) {
  if (!t) return "";
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} hour${h > 1 ? "s" : ""} ago`;
  const d = Math.floor(h / 24);
  return `${d} day${d > 1 ? "s" : ""} ago`;
}

// What a slot has actually won, for the career browser. Seasons counted here are
// the finished ones — the one being raced is named on the line above, so a career
// three rounds into its third year reads "2 seasons completed".
function honours(c) {
  const done = tally(c.seasons), t = tally(c.titles), ct = tally(c.cTitles);
  const n = (v, one) => `${v} ${one}${v === 1 ? "" : "s"}`;
  if (!done) return "First season under way · nothing won yet";
  const won = [];
  if (t)  won.push(`🏆 ${n(t, "drivers' title")}`);
  if (ct) won.push(`🏭 ${n(ct, "constructors' title")}`);
  return `${n(done, "season")} completed · ${won.length ? won.join(" · ") : "no titles yet"}`;
}

function careersScreen() {
  const rows = careers.map((c, i) => {
    if (!c) {
      return `<div class="career empty"><i>${i + 1}</i>
        <div><b>Empty slot</b><span>Press <span class="key">${i + 1}</span> to start a championship here</span></div>
        <em></em></div>`;
    }
    // Standings computed from THIS career's points, not the loaded season.
    const pts = c.season.points;
    const order = pts.map((p, id) => id).sort((a, b) => (pts[b] - pts[a]) || (a - b));
    const pos = order.indexOf(0) + 1;
    // Genuinely absent, not clamped: a save sitting on the last flag of its
    // season has no next round, and naming the one it just drove would be a
    // lie about where it would resume.
    const next = CIRCUITS[c.season.round] || null;
    const lvl = CONFIG.aiLevels.find(l => l.key === c.ai);
    const len = CONFIG.raceLengths.find(l => l.key === c.len);
    const arm = armedSlot === i;
    return `<div class="career${activeCareer === i ? " on" : ""}${arm ? " arm" : ""}"><i>${i + 1}</i>
      <div>
        <b>${c.name} — ${c.ended ? `career over, year ${c.ended.year}` :
            `year ${c.year || 1} of ${CONFIG.career.years}, round ${c.season.round + 1} of ${CONFIG.seasonRounds}`}</b>
        <span>${next ? `Next up ${next.flag} ${next.gp}` : "Season complete"} · you are <b style="color:var(--ink)">P${pos}</b>
          on ${pts[0]} point${pts[0] === 1 ? "" : "s"} · saved ${agoText(c.saved)}</span>
        <span>${honours(c)}</span>
        <span>${c.mode === "pro" ? "🏎️ Pro" : "🛟 Semi-Pro"} ·
          opponents ${lvl ? lvl.label : c.ai} ·
          ${len ? len.label : c.len} races ·
          qualifying ${(QUALI_MODES.find(m => m.key === c.quali) || {}).label || c.quali}</span>
      </div>
      <em>${arm ? "ARMED" : "P" + pos}</em></div>`;
  }).join("");

  return `
    <div class="stack">
      <h1>🗂️ Careers</h1>
      <p class="sub">Press a number to play that slot · SHIFT + number to delete or replace one ·
        E save to a file · I load one · ESC back</p>
      ${storageWarning()}
      <div class="careers">${rows}</div>
      ${pendingSave
        ? `<p class="c" style="color:#e2483f;font-weight:700;margin-top:12px">
             That save holds ${describeSave(pendingSave.keys).text}${
               pendingSave.later ? ", and was written by a later version of the game" : ""} —
             <span class="key">I</span> again loads it, which replaces
             ${careers.filter(Boolean).length === 0 ? "nothing, since this browser has no careers in it"
               : `all ${CAREER_SLOTS} slots in this browser and everything in them`}.
             Any other key cancels.</p>`
        : transferMsg
        ? `<p class="c" style="margin-top:12px;font-weight:600;color:${transferMsg.bad ? "#e2483f" : "var(--ink)"}">
             ${transferMsg.text}</p>`
        : ""}
      ${armedSlot >= 0
        ? `<p class="c" style="color:#e2483f;font-weight:700;margin-top:12px">
             ${careers[armedSlot].name} is armed —
             <span class="key">SHIFT</span>+<span class="key">${armedSlot + 1}</span> again deletes it for good,
             <span class="key">N</span> starts a new championship over the top of it.
             Any other key cancels.</p>`
        : `<p class="modeLine" style="margin-top:12px">Each career remembers its own difficulty, race length
             and qualifying format, and keeps a running count of the seasons it has finished and the
             titles won in them. Liveries are shared across all of them. A slot with a championship in it
             can be raced over without emptying it first — <span class="key">SHIFT</span>+its number, then
             <span class="key">N</span>.</p>
           <p class="modeLine" style="margin-top:10px">💾
             <b style="color:var(--ink)">Your careers live in this browser</b>, and a browser can be told to
             forget them — clearing site data does it, and so does playing somewhere that blocks storage.
             <span class="key">E</span> writes everything above out to a file you keep, and
             <span class="key">I</span> loads one back. Worth doing after a season you would be sorry to
             lose, and the only way to carry a career to another computer.</p>`}
    </div>`;
}

/* =========================================================================
   Highlights — the reel browser. What has been kept, plus the race just run
   if it has not been kept yet.
   ========================================================================= */

// What is on a reel, in the order a commentator would list it.
function reelSummary(r) {
  const n = {};
  for (const c of r.clips) n[c.kind] = (n[c.kind] || 0) + 1;
  const bits = [];
  if (n.start) bits.push("🚦 the start");
  if (n.pass)  bits.push(`⚔️ ${n.pass} overtake${n.pass > 1 ? "s" : ""}`);
  if (n.lead)  bits.push(`👑 ${n.lead} lead change${n.lead > 1 ? "s" : ""}`);
  if (n.flag)  bits.push("🏁 the flag");
  if (n.yours) bits.push("🏆 your race");
  return bits.join(" · ") || "nothing worth keeping";
}

// Everything on offer: the race just run first, if it is still only in memory.
function reelList() {
  const live = reelWatchable(reel) && !reelIsSaved(reel) ? reel : null;
  return (live ? [live] : []).concat(reels);
}

function reelsScreen() {
  const list = reelList();
  const live = reelWatchable(reel) && !reelIsSaved(reel) ? reel : null;
  const used = reels.reduce((s, x) => s + reelSize(x), 0);
  const kept = reels.filter(x => !x.auto).length;

  const rows = list.map((r, i) => {
    const isLive = live && r === live;
    const arm = armedSlot === i;
    const win = r.cars.find(c => c.id === (r.clips.find(c2 => c2.kind === "flag") || {}).subject);
    return `<div class="career${isLive ? " on" : ""}${arm ? " arm" : ""}"><i>${i + 1}</i>
      <div>
        <b>${r.flag} ${r.gp}${isLive ? " — just now, not kept" : ""}</b>
        <span>${r.loc ? `${r.loc} · ` : ""}${r.laps} laps · ${r.clips.length} moment${r.clips.length === 1 ? "" : "s"}${
          r.who ? ` · ${r.who}, year ${r.year}` : ""}${r.round ? `, round ${r.round}` : ""}
          <br>${reelSummary(r)}${win ? ` &nbsp;·&nbsp; won by <b style="color:${win.colour}">${win.name}</b>` : ""}</span>
      </div>
      <em>${isLive
        ? `<span class="key">${i + 1}</span> watch<br><span class="key">S</span> save it`
        : `<span class="key">${i + 1}</span> watch<br>${agoText(r.when)}${
            r.auto ? "" : `<br><b style="color:var(--accent)">kept</b>`}`}</em></div>`;
  }).join("");

  return `
    <div class="stack">
      <h1>🎞️ Highlights</h1>
      <p class="sub">Every race is recorded as it is run — the start, every overtake, every change of
        leader and the flag, for the whole field rather than just for your car — and every race is
        saved here by itself at the chequered flag. Press <span class="key">S</span> on one to keep it
        for good, and it will not be dropped to make room for a later race.</p>
      ${list.length ? `<div class="careers" style="margin-top:16px">${rows}</div>` : `
        <p class="modeLine" style="margin-top:18px">Nothing recorded yet. Run a race — driven or
          simulated, it makes no difference to the reel — and it will be here when you get back.</p>`}
      <p class="c" style="margin-top:16px;font-size:12px">
        ${reels.length} of ${CONFIG.highlights.keep} saved${kept ? ` · ${kept} kept for good` : ""} ·
        ${Math.round(used / 1024)} KB of a
        ${Math.round(CONFIG.highlights.budget / 1024)} KB budget — when either runs out the oldest
        <i>automatic</i> reel goes first, and a kept one only once there are none of those left
        ${live ? `&nbsp;·&nbsp; <span class="key">S</span> save the race just run` : ""}
        <br><span class="key">SHIFT</span>+number twice deletes a reel &nbsp;·&nbsp;
        <span class="key">ESC</span> back</p>
      <p class="c" style="margin-top:10px;font-size:12px">In a replay:
        <span class="key">SPACE</span> pause &nbsp;·&nbsp; <span class="key">←</span> <span class="key">→</span> moment
        &nbsp;·&nbsp; <span class="key">F</span> which car the camera is on
        &nbsp;·&nbsp; <span class="key">X</span> slow motion &nbsp;·&nbsp; <span class="key">R</span> watch that one again
        &nbsp;·&nbsp; <span class="key">D</span> download it &nbsp;·&nbsp; <span class="key">ESC</span> out</p>
      <p class="c" style="margin-top:10px;font-size:12px">📥 <b style="color:var(--ink)">Downloading one.</b>
        Open a reel and press <span class="key">D</span>. It plays from the first moment to the last
        while the screen is recorded, and saves as a <b style="color:var(--ink)">.webm</b> video file —
        so it takes as long as the reel does to watch, and you get something you can play or send
        anywhere. <span class="key">ESC</span> stops early and still keeps what has been filmed.
        No sound: a replay has no engines running to record.</p>
    </div>`;
}

/* =========================================================================
   The qualifying timesheet — one segment, or the finished grid after Q3.
   ========================================================================= */
function qualiTable(ids, times, cutAt, ref) {
  const lead = ref != null ? ref : times[ids[0]];
  return ids.map((id, i) => {
    const t = times[id];
    const cls = (i >= cutAt ? "knock" : "") + (i === cutAt ? " cutline" : "");
    const time = t == null
      ? `<td class="qout">NO TIME</td>`
      : i === 0 && ref == null
        ? `<td class="qtime">${fmtTime(t)}</td>`
        : `<td class="qgap">+${(t - lead).toFixed(3)}</td>`;
    return `<tr class="${cls}${id === 0 ? " me" : ""}">
      <td class="num">${i + 1}</td><td>${glyph(id, 22)}</td>
      <td>${nameCell(id)}</td>${time}</tr>`;
  }).join("");
}

/* Which segment a driver fell out of, and the grid slot that earns them. The
   six knocked out of Q2 fill P11-P16 in the order they were ranked, the six
   from Q1 fill P17-P22, so a slot is known the moment the car is eliminated —
   long before the grid itself is assembled. */
function knockedOutIn(id) {
  for (const seg of [1, 0]) {
    const j = qual.knocked[seg].indexOf(id);
    if (j < 0) continue;
    const above = DRIVERS.length - CONFIG.quali.cut * (seg === 1 ? 2 : 1);
    return { seg, slot: above + j + 1 };
  }
  return { seg: 2, slot: null };
}

function qualiScreen() {
  const done = !!qual.grid;
  const circuit = CIRCUITS[season.round];
  const segs = ["Q1", "Q2", "Q3"].map((s, i) => {
    const cls = done ? "done" : i < qual.seg ? "done" : i === qual.seg ? "on" : "";
    return `<div class="qs ${cls}">${s} · ${[DRIVERS.length, DRIVERS.length - CONFIG.quali.cut,
             DRIVERS.length - CONFIG.quali.cut * 2][i]} cars</div>`;
  }).join("");

  if (done) {
    // The grid, with each car labelled by the segment it was knocked out in and
    // the time it was knocked out on — which is the only reading of a
    // qualifying result that explains why P14 is P14.
    const rows = qual.grid.map((id, i) => {
      const seg = i < DRIVERS.length - CONFIG.quali.cut * 2 ? 2
                : i < DRIVERS.length - CONFIG.quali.cut ? 1 : 0;
      const t = qual.times[seg][id];
      return `<tr class="${id === 0 ? "me" : ""}${i === 10 || i === 16 ? " cutline" : ""}">
        <td class="num">P${i + 1}</td><td>${glyph(id, 22)}</td><td>${nameCell(id)}</td>
        <td class="qgap">${segName(seg)}</td>
        <td class="qtime">${t == null ? "—" : fmtTime(t)}</td></tr>`;
    }).join("");
    const pole = qual.grid[0], mine = qual.grid.indexOf(0);
    return `
      <div class="stack">
        <h2>${circuit.flag} ${circuit.gp} · qualifying</h2>
        <h1>${DRIVERS[pole].name} takes pole</h1>
        <p class="sub">${fmtTime(qual.times[2][pole])} · you start P${mine + 1} of ${DRIVERS.length}</p>
        <div class="qsegs">${segs}</div>
        <table style="max-width:var(--col);margin-inline:auto">
          <thead><tr><th></th><th></th><th>Driver</th><th style="text-align:right">Out in</th>
          <th style="text-align:right">Time</th></tr></thead><tbody>${rows}</tbody></table>
        ${tyreChoiceHtml()}
        <p class="c" style="margin-top:16px"><span class="key">SPACE</span> to the grid —
          ${formationOn ? "formation lap, then lights out" : "lights out"} over ${lapsFor(circuit)} laps
          &nbsp;·&nbsp; <span class="key">S</span> simulate the race from this grid</p>
      </div>`;
  }

  const T = qual.times[qual.seg];
  const mine = qual.order.indexOf(0);          // -1 once you have been knocked out
  const survived = mine >= 0 && mine < qual.cutAt;
  const out = knockedOutIn(0);
  return `
    <div class="stack">
      <h2>${circuit.flag} ${circuit.gp}</h2>
      <h1>${segName(qual.seg)} — ${qual.order.length} cars, ${CONFIG.quali.cut} out</h1>
      <p class="sub">${mine < 0
        ? `You went out in ${segName(out.seg)} — you start P${out.slot}`
        : survived
          ? `You were P${mine + 1} — through to ${segName(qual.seg + 1)}`
          : `You were P${mine + 1} — knocked out, and you start there`}</p>
      <div class="qsegs">${segs}</div>
      <table style="max-width:var(--col);margin-inline:auto">
        <thead><tr><th></th><th></th><th>Driver</th><th style="text-align:right">Gap</th></tr></thead>
        <tbody>${qualiTable(qual.order, T, qual.cutAt)}</tbody></table>
      <p class="c" style="margin-top:16px"><span class="key">SPACE</span>
        ${qual.seg < 2 ? `run ${segName(qual.seg + 1)}` : "to the grid"}</p>
    </div>`;
}

// The one-liner, for screens that are already busy.
function modeLine() {
  return `<p class="modeLine">Mode: <b>${assisted() ? "🛟 Semi-Pro — assists on" : "🏎️ Pro — no assists"}</b>
          &nbsp;·&nbsp; <span class="key">T</span> to switch</p>`;
}

/* --- The garage ------------------------------------------------------------
   The only screen in the game with real form controls. Edits land on TEAMS and
   DRIVERS immediately and are saved on every keystroke, so there is no "unsaved
   changes" state to lose — closing the tab mid-rename keeps the rename.
   -------------------------------------------------------------------------*/
function garageScreen() {
  const cards = TEAMS.map((t, ti) => {
    const rows = t.drivers.map(di => `
      <div class="grow">
        <span class="gg" data-driver="${di}">${glyph(di, 22)}</span>
        <input type="color" value="${DRIVERS[di].colour}" data-k="d" data-i="${di}" data-f="colour"
               title="${DRIVERS[di].name}'s car colour" aria-label="Car colour">
        <input type="text" value="${DRIVERS[di].name.replace(/"/g, "&quot;")}" maxlength="14"
               data-k="d" data-i="${di}" data-f="name" spellcheck="false" aria-label="Driver name">
      </div>`).join("");
    return `<div class="gt${ti === myTeam() ? " mine" : ""}" data-team="${ti}"
                 style="border-left-color:${t.colour}">
      <div class="grow team">
        <span class="bdg">${t.badge}</span>
        <input type="color" value="${t.colour}" data-k="t" data-i="${ti}" data-f="colour"
               title="${t.name} team colour" aria-label="Team colour">
        <input type="text" value="${t.name.replace(/"/g, "&quot;")}" maxlength="14"
               data-k="t" data-i="${ti}" data-f="name" spellcheck="false" aria-label="Team name">
        ${ti === myTeam() ? `<span class="yours">yours</span>` : ""}
      </div>
      ${rows}
    </div>`;
  }).join("");

  return `
    <div class="stack">
      <h2>Customise the grid</h2>
      <h1>🎨 THE GARAGE</h1>
      <p class="sub">${TEAMS.length} teams · ${DRIVERS.length} drivers</p>
      <p>Rename anything and repaint anything. The top box is the team, the two
      below it are its cars — the second driver traditionally runs a lighter or
      deeper tone of the same colour so you can tell team-mates apart at speed.
      Changes save as you type and survive closing the game.</p>
      <p><b style="color:var(--ink)">Only names and colours change.</b> Skill, reliability
      and budget stay exactly as they were designed, so renaming a team cannot hand it
      a championship it did not earn.</p>
      ${cards}
      <div class="btnRow" style="margin-top:16px">
        <button class="btn" data-act="back">Done</button>
        <button class="btn danger" data-act="reset">Reset everything to default</button>
      </div>
      <p class="c" style="font-size:12px"><span class="key">SPACE</span> or <span class="key">ESC</span>
        done &nbsp;·&nbsp; <span class="key">R</span> reset all</p>
    </div>`;
}

// Keep the previews honest as you type. Only the pieces that are not already
// an input get repainted, so the field you are typing in never loses focus.
function repaintGarage(kind, i) {
  if (kind === "t") {
    const card = overlay.querySelector(`.gt[data-team="${i}"]`);
    if (card) card.style.borderLeftColor = TEAMS[i].colour;
  } else {
    const g = overlay.querySelector(`.gg[data-driver="${i}"]`);
    if (g) g.innerHTML = glyph(i, 22);
  }
}

// One delegated pair of listeners, attached once. Re-rendering the screen
// replaces its markup wholesale, so per-element handlers would either pile up
// or vanish depending on the order things happened in.
overlay.addEventListener("input", (e) => {
  const t = e.target;
  if (state !== State.GARAGE || !t.dataset || !t.dataset.k) return;
  const i = +t.dataset.i;
  const arr = t.dataset.k === "t" ? TEAMS : DRIVERS;
  if (!arr[i]) return;
  if (t.dataset.f === "colour") { if (isHex(t.value)) arr[i].colour = t.value; }
  else {
    arr[i].name = t.value.slice(0, 14);
    // Renaming a DRIVER has to rename the person in the seat, not just the
    // car. Otherwise the next syncSeats() — which happens after every race —
    // would put the old name straight back.
    if (t.dataset.k !== "t") { const p = personAt(i); if (p) p.name = arr[i].name; }
  }
  saveLivery();
  repaintGarage(t.dataset.k, i);
});

overlay.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest("[data-act]");
  if (!b || state !== State.GARAGE) return;
  if (b.dataset.act === "reset") { resetLivery(); beep(300, 0.09, "sine", 0.04); drawScreen(); }
  else { normaliseLivery(); go(State.MENU); }
});

/* =========================================================================
   THE CAREER SCREENS — the six-race review, the winter, an invitation, and
   the end of it all.
   ========================================================================= */

// A driver, as the career screens want to read them: name, age, and what they
// have done. Used everywhere a person rather than a car is being talked about.
function personLine(p) {
  if (!p) return "—";
  const st = p.stats;
  const bits = [];
  if (st.titles)  bits.push(`${st.titles}× champion`);
  if (st.wins)    bits.push(`${st.wins} win${st.wins > 1 ? "s" : ""}`);
  else if (st.podiums) bits.push(`${st.podiums} podium${st.podiums > 1 ? "s" : ""}`);
  if (p.rookie)   bits.push("rookie");
  return `${p.name} <span class="tm">${p.age} · ${bits.length ? bits.join(" · ") : "no record yet"}</span>`;
}

// The grid as PEOPLE — who is driving what, how old they are, and how safe
// their seat looks. The one screen that makes the whole system legible.
function rosterTable() {
  const rows = constructorOrder().map(ti => {
    const t = TEAMS[ti];
    const cars = t.drivers.map(seat => {
      const p = personAt(seat);
      const o = season.objectives && season.objectives.find(x => x.seat === seat);
      const mine = p && p.isPlayer;
      const heat = p && p.warnings > 0;
      return `<tr class="${mine ? "me" : ""}">
        <td>${glyph(seat, 20)}</td>
        <td>${p ? personLine(p) : "<i>vacant</i>"}</td>
        <td class="num">${p ? Math.round(p.rep * 100) : "—"}</td>
        <td style="font-size:11.5px;color:${heat ? "var(--warn,#ffb454)" : "var(--muted)"}">
          ${o ? objectiveText(o) : "—"}${heat ? " ⚠" : ""}</td>
        <td class="num">${o ? objectiveProgress(o) : "—"}</td></tr>`;
    }).join("");
    return `<tr class="grp"><td colspan="5" style="color:${t.colour};padding-top:8px">
              ${t.badge} ${t.name} <span class="tm">${teamTier(ti)} of the grid</span></td></tr>${cars}`;
  }).join("");
  return `<div class="scrollx"><table><thead><tr><th></th><th>Driver</th>
    <th style="text-align:right">Rep</th><th>This block's objective</th>
    <th style="text-align:right">So far</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Headlines from the silly season, newest first.
function newsList(n) {
  const items = (season.news || []).slice(0, n || 10);
  if (!items.length) return `<p class="modeLine">Nothing has moved.</p>`;
  return `<div class="devlog">${items.map(x => `<div class="tl"><b>${x.text}</b></div>`).join("")}</div>`;
}

function reviewScreen() {
  const v = lastReview || [];
  const me = v.find(x => x.p && x.p.isPlayer);
  const sacked = v.filter(x => x.action === "sacked");
  const head = !me ? "THE REVIEW"
             : me.action === "sacked" ? "YOU HAVE LOST YOUR DRIVE"
             : me.action === "warned" ? "A WARNING"
             : me.action === "met"    ? "OBJECTIVE MET"
             : "THE REVIEW";
  const rows = v.filter(x => x.p).sort((a, b) => (b.p.isPlayer ? 1 : 0) - (a.p.isPlayer ? 1 : 0))
    .map(x => {
      const cls = x.action === "sacked" ? "dn" : x.action === "met" ? "up" : "flat";
      const word = x.action === "sacked" ? "released" : x.action === "warned" ? "warned"
                 : x.action === "met" ? "met" : "not judged";
      return `<tr class="${x.p.isPlayer ? "me" : ""}">
        <td>${x.p.seat >= 0 ? glyph(x.p.seat, 20) : ""}</td>
        <td>${x.p.name}<span class="tm" style="color:${TEAMS[x.team] ? TEAMS[x.team].colour : "inherit"}">
            ${TEAMS[x.team] ? TEAMS[x.team].name : ""}</span></td>
        <td style="font-size:11.5px">${objectiveText(x.o)}</td>
        <td class="num">${objectiveProgress(x.o)}</td>
        <td class="num"><span class="${cls}">${word}</span></td>
        <td style="font-size:11.5px">${x.replacement ? `→ ${x.replacement.name}` : ""}</td></tr>`;
    }).join("");
  return `
    <div class="stack">
      <h2>The six-race review · ${DEMO
        // "after round 6 of 6" is technically true of the demo calendar and
        // says the wrong thing: it reads as the end of a season rather than
        // the end of the first block of one.
        ? `after round ${season.round} · year 1 of ${CONFIG.career.years} in the full game`
        : `after round ${season.round} of ${CONFIG.seasonRounds} · year ${career.year} of ${CONFIG.career.years}`}</h2>
      <h1>${head}</h1>
      ${me ? `<p class="sub">${
        me.action === "sacked"
          ? `${TEAMS[me.team].name} wanted ${objectiveText(me.o).toLowerCase()}. You managed ${objectiveProgress(me.o)}.`
        : me.action === "warned"
          ? `${objectiveText(me.o)} — you managed ${objectiveProgress(me.o)}. One more and the seat goes.`
        : me.action === "met"
          ? `${objectiveText(me.o)} — ${objectiveProgress(me.o)}. Nobody is asking any questions.`
          : `You had not started enough of the block to be judged on it.`}</p>` : ""}
      ${me && me.action === "sacked" ? `
        <p style="font-size:13px;margin-top:10px">You are a free agent. Your car is still on the grid —
        <b style="color:var(--ink)">${me.replacement ? me.replacement.name : "somebody else"}</b> is in it now.
        The remaining rounds run without you, and you take whatever seat comes free. If none does before
        the winter, the market decides whether anyone still wants you.</p>` : ""}
      ${sacked.length ? `<p style="font-size:12.5px">🚪 ${sacked.length} driver${sacked.length > 1 ? "s" : ""} released —
        ${sacked.map(x => `<b style="color:${TEAMS[x.team].colour}">${x.p.name}</b>`).join(", ")}.</p>` : ""}
      <h2 style="margin-top:16px">Every verdict</h2>
      <div class="scrollx"><table><thead><tr><th></th><th>Driver</th><th>Objective</th>
        <th style="text-align:right">Managed</th><th style="text-align:right">Verdict</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${season.news.length ? `<h2 style="margin-top:18px">From the paddock</h2>${newsList(6)}` : ""}
      <p class="c" style="margin-top:16px"><span class="key">SPACE</span> continue</p>
    </div>`;
}

function marketScreen() {
  const me = playerPerson();
  const offers = (career.offers || []);
  const held = me && me.seat >= 0 ? DRIVERS[me.seat].team : -1;
  const cards = offers.map((o, i) => `
    <div class="pj">
      <i class="n">${i + 1}</i>
      <b><span class="cost">P${o.rank + 1} last year</span>${TEAMS[o.team].badge} ${TEAMS[o.team].name}</b>
      <span>${TEAMS[o.team].status}</span>
      <span class="lv">${o.replacing ? `You would replace ${o.replacing}.` : "A seat nobody is in."}
        Reliability ${(TEAMS[o.team].reliability).toFixed(2)} · budget ${money(TEAMS[o.team].funding)}</span>
    </div>`).join("");
  return `
    <div class="stack">
      <h2>The winter · year ${career.year} of ${CONFIG.career.years}</h2>
      <h1>🚪 THE SILLY SEASON</h1>
      <p class="sub">${me && me.seat >= 0
        ? `You are under contract at ${TEAMS[held].badge} ${TEAMS[held].name}${offers.length ? " — but the phone has been ringing" : ""}`
        : offers.length ? "You have no drive. These are the seats on the table."
                        : "You have no drive, and nobody has called."}</p>
      ${offers.length ? `<h2 style="margin-top:16px">On the table</h2>
        <div class="projects">${cards}</div>
        <p class="c" style="margin-top:12px">Press <span class="key">1</span>–<span class="key">${offers.length}</span> to sign${
          me && me.seat >= 0 ? `, or <span class="key">SPACE</span> to stay where you are` : ""}</p>`
        : me && me.seat >= 0
          ? `<p style="margin-top:14px">Nobody has come for you this winter. You start the year where you finished it.</p>
             <p class="c" style="margin-top:14px"><span class="key">SPACE</span> continue</p>`
          : `<p style="margin-top:14px">No team wants you. Unless something changes before the lights go out
             on round one, that is the end of it.</p>
             <p class="c" style="margin-top:14px"><span class="key">SPACE</span> continue</p>`}
      <h2 style="margin-top:20px">The grid, as it now stands</h2>
      ${rosterTable()}
      ${season.news && season.news.length ? `<h2 style="margin-top:18px">What moved</h2>${newsList(12)}` : ""}
    </div>`;
}

function inviteScreen() {
  const inv = pendingInvite;
  if (!inv) return `<div class="stack"><h1>—</h1></div>`;
  const ev = inv.ev, F = ELITE_FIELDS[ev.key];
  const me = inv.invited.find(p => p.isPlayer);
  const others = inv.invited.filter(p => !p.isPlayer);
  return `
    <div class="stack">
      <h2>An invitation · year ${career.year} · after round ${season.round}</h2>
      <h1>${ev.flag} ${ev.gp}</h1>
      <p class="sub">${ev.name} · ${ev.loc} · ${ev.date} · ${F.entries} entries</p>
      <p style="max-width:62ch;margin:14px auto 0;font-size:13.5px">${ev.blurb}</p>
      <div class="vitals" style="margin-top:16px">
        <div><dt>Entries</dt><dd>${F.entries}</dd></div>
        <div><dt>Grid</dt><dd>${Math.ceil(F.entries / F.perRow)} × ${F.perRow}</dd></div>
        <div><dt>Circuit</dt><dd>${ev.km.toFixed(3)} km</dd></div>
        <div><dt>Real distance</dt><dd>${ev.realLaps} laps</dd></div>
        <div><dt>You will run</dt><dd>${lapsFor(ev)} laps</dd></div>
      </div>
      <h2 style="margin-top:18px">Who has been asked</h2>
      <p style="font-size:13px">${F.entries - inv.invited.length} ${F.discipline} regulars who do this for a
        living, and <b style="color:var(--ink)">${inv.invited.length}</b> from our championship —
        the quickest over the last ${CONFIG.devEvery} races.</p>
      <div class="devlog">${inv.invited.map(p => `
        <div class="tl${p.isPlayer ? " mine" : ""}" style="border-left-color:${
            p.seat >= 0 ? TEAMS[DRIVERS[p.seat].team].colour : "#888"}">
          <b>${p.isPlayer ? "You" : p.name}${p.isPlayer
            ? ' <span style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)">invited</span>' : ""}
            <span class="spend">${p.seat >= 0 ? TEAMS[DRIVERS[p.seat].team].name : "—"}</span></b>
        </div>`).join("")}</div>
      ${me ? `
        <p style="margin-top:16px;font-size:13px">This is not a round of your championship.
          <b style="color:var(--ink)">No points, no prize money, no bearing on your seat.</b>
          Your car can still break and you can still hurt yourself. What you get for winning it is
          a line on your record that stays there for the rest of your life.</p>
        <p class="c" style="margin-top:18px"><span class="key">SPACE</span> accept and drive it
          &nbsp;·&nbsp; <span class="key">X</span> decline and get on with the season</p>`
      : `
        <p style="margin-top:16px;font-size:13px">
          <b style="color:var(--accent)">You were not asked.</b> ${others.length === 1
            ? `${others[0].name} was` : `${others.map(p => p.name).join(", ")} were`} —
          on form over the last ${CONFIG.devEvery} races, and you were not in it. The race happens
          anyway, and it goes on ${others.length === 1 ? "his" : "their"} record rather than yours.</p>
        <p class="c" style="margin-top:18px"><span class="key">SPACE</span> watch the result
          &nbsp;·&nbsp; <span class="key">X</span> skip it</p>`}
    </div>`;
}

/* --- The end of a driving career -----------------------------------------
   Every number the player has accumulated over up to twenty seasons, in one
   place, once. This is the screen the whole mode is pointed at. ---------- */
function overScreen() {
  const me = playerPerson();
  const e = career.ended || { year: career.year, age: me ? me.age : 0, reason: "age" };
  const R = Object.values(CAREER_END).find(x => x.key === e.reason) || CAREER_END.age;
  const st = me ? me.stats : makePerson({}).stats;
  const winRate = st.starts ? (st.wins / st.starts * 100) : 0;
  const best = career.history.reduce((a, h) => (h.player && (!a || h.player.pos < a.player.pos) ? h : a), null);
  const cell = (label, value, sub) => `<div><dt>${label}</dt><dd>${value}</dd>${
    sub ? `<span class="tm">${sub}</span>` : ""}</div>`;
  return `
    <div class="stack">
      <h2>${e.year === 1 ? "One season" : `${st.seasons} season${st.seasons === 1 ? "" : "s"}`} ·
          year ${e.year} of ${CONFIG.career.years}</h2>
      <!-- The player's OWN name, not seat 0's — by the time this screen is
           drawn somebody else is already in that car. -->
      <h1>${st.titles ? "🏆".repeat(Math.min(st.titles, 5)) + " " : ""}${(me ? me.name : DRIVERS[0].name).toUpperCase()}</h1>
      <p class="sub">${R.label} at ${e.age} — ${R.blurb}</p>
      <div class="vitals" style="margin-top:18px">
        ${cell("Championships", st.titles, st.cTitles ? `${st.cTitles} with the team` : "")}
        ${cell("Starts", st.starts)}
        ${cell("Wins", st.wins, st.starts ? `${winRate.toFixed(1)}% of starts` : "")}
        ${cell("Podiums", st.podiums)}
        ${cell("Poles", st.poles)}
        ${cell("Points", Math.round(st.points))}
        ${cell("Fastest laps", st.fl)}
        ${cell("Retirements", st.dnf)}
      </div>
      ${st.elite && st.elite.length ? `
        <h2 style="margin-top:20px">Away from the championship</h2>
        <div class="devlog">${st.elite.map(x => `<div class="tl">
          <b>${x.name} · ${x.place} <span class="spend">year ${x.year}</span></b>
          <div class="ln"><span>${x.dnf ? "🏳️" : x.pos === 1 ? "🥇" : x.pos === 2 ? "🥈" : x.pos === 3 ? "🥉" : "🏁"}</span>
          <span>${x.dnf ? "Did not finish" : x.pos === 1 ? "<b>Won it</b>" : `Finished P${x.pos}`}</span></div>
        </div>`).join("")}</div>` : ""}
      <h2 style="margin-top:20px">Season by season</h2>
      <div class="scrollx"><table><thead><tr><th>Year</th><th>Team</th>
        <th style="text-align:right">Pos</th><th style="text-align:right">Pts</th>
        <th style="text-align:right">Wins</th><th style="text-align:right">Podiums</th>
        <th>Champion</th></tr></thead><tbody>
        ${career.history.map(h => `<tr class="${h.player && h.player.pos === 1 ? "me" : ""}">
          <td class="num">${h.year}</td>
          <td>${h.player && h.player.team >= 0 && TEAMS[h.player.team]
                ? `<span style="color:${TEAMS[h.player.team].colour}">${TEAMS[h.player.team].badge} ${TEAMS[h.player.team].name}</span>`
                : "<i>no drive</i>"}</td>
          <td class="num">${h.player ? (h.player.pos || "—") : "—"}</td>
          <td class="num">${h.player ? h.player.points : "—"}</td>
          <td class="num">${h.player ? h.player.wins : "—"}</td>
          <td class="num">${h.player ? h.player.podiums : "—"}</td>
          <td>${h.championName}</td></tr>`).join("")}
      </tbody></table></div>
      ${best && best.player ? `<p style="font-size:12.5px;margin-top:12px">Best year: ${best.year},
        P${best.player.pos} with ${best.player.points} points.</p>` : ""}
      <p class="c" style="margin-top:18px"><span class="key">SPACE</span> the honours board
        &nbsp;·&nbsp; <span class="key">C</span> start another career</p>
    </div>`;
}

function hallScreen() {
  const order = hallOrder();
  const rows = order.map((r, i) => {
    const R = Object.values(CAREER_END).find(x => x.key === r.endedBy) || CAREER_END.age;
    return `<tr class="${r.player ? "me" : ""}">
      <td class="num">${i + 1}</td>
      <!-- The "you" tag would read as "YOU you" for a player who never
           renamed themselves, so it only appears when it adds something. -->
      <td>${r.name}${r.player && r.name.toUpperCase() !== "YOU" ? ' <i class="yours">you</i>' : ""}
          <span class="tm">${r.seasons} season${r.seasons === 1 ? "" : "s"} · ${
            (R.short || R.label).toLowerCase()} at ${r.age}</span></td>
      <td class="num">${r.titles || "—"}</td>
      <td class="num">${r.starts}</td>
      <td class="num">${r.wins}</td>
      <td class="num">${r.podiums}</td>
      <td class="num">${r.poles}</td>
      <td class="num">${r.points}</td>
      <td class="num">${(r.elite || []).filter(e => e.pos === 1).length || "—"}</td></tr>`;
  }).join("");
  return `
    <div class="stack">
      <h2>Every career that has ended here</h2>
      <h1>🏛️ THE HONOURS BOARD</h1>
      <p class="sub">${hall.length
        ? `${hall.length} career${hall.length === 1 ? "" : "s"} on record · ranked by titles, then wins`
        : "Nothing on it yet — finish a career and it goes on here for good"}</p>
      ${hall.length ? `<div class="scrollx"><table><thead><tr><th></th><th>Driver</th>
        <th style="text-align:right">Titles</th><th style="text-align:right">Starts</th>
        <th style="text-align:right">Wins</th><th style="text-align:right">Podiums</th>
        <th style="text-align:right">Poles</th><th style="text-align:right">Points</th>
        <th style="text-align:right">One-offs</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="modeLine" style="margin-top:12px">This board lives outside the six career slots —
        deleting a career does not take its record with it.</p>` : ""}
      <p class="c" style="margin-top:16px"><span class="key">SPACE</span> back</p>
    </div>`;
}

/* The starting-tyre picker. Shown on the grid screen AND on the qualifying
   result, because where you have just qualified is exactly the thing that
   ought to change the answer — a soft is a different proposition from pole
   than it is from P14. Nothing to offer a driver without a seat. */
function tyreChoiceHtml() {
  if (!playerSeated()) return "";
  const cells = CONFIG.compounds.map(c => {
    const on = c.key === startTyre;
    return `<span style="color:${on ? c.colour : "var(--muted)"};font-weight:${on ? 800 : 600}">${
      on ? "▶ " : ""}${c.label}</span>`;
  }).join(" &nbsp;·&nbsp; ");
  return `<p class="modeLine" style="margin-top:10px;font-size:13px">🛞
    <b style="color:var(--ink)">Starting tyre</b> — <span class="key">C</span> to change &nbsp;·&nbsp; ${cells}
    <br><span style="color:var(--muted)">${compoundBy(startTyre).blurb}. A soft wears about half again as
    fast as a medium and a hard about a third slower, and the crew can fit something different at every
    stop — <span class="key">C</span> during the race sets what is waiting in the box.</span></p>`;
}

function drawScreen() {
  const muteHint = `<p class="c" style="margin-top:14px;font-size:12px">${muted ? "🔇 Muted" : "🔊 Sound on"} — press <span class="key">M</span> to toggle` +
    `<br>${voiceOn && !muted ? "📻 Pit wall speaks" : "📻 Pit wall silent"} — press <span class="key">V</span> to toggle</p>`;

  if (state === State.REVIEW) { overlay.innerHTML = reviewScreen(); return; }
  if (state === State.MARKET) { overlay.innerHTML = marketScreen(); return; }
  if (state === State.INVITE) { overlay.innerHTML = inviteScreen(); return; }
  if (state === State.OVER)   { overlay.innerHTML = overScreen();   return; }
  if (state === State.HALL)   { overlay.innerHTML = hallScreen();   return; }

  if (state === State.SETTINGS) { overlay.innerHTML = settingsScreen(); return; }
  if (state === State.CAREERS)  { overlay.innerHTML = careersScreen();  return; }
  if (state === State.REELS)    { overlay.innerHTML = reelsScreen();    return; }
  if (state === State.QUALIRES)  { overlay.innerHTML = qualiScreen();   return; }

  if (state === State.MENU) {
    // The calendar highlights wherever the most recently played career has got
    // to, so the menu reflects the championship the R key would resume.
    const saved = lastPlayed() >= 0 ? careers[lastPlayed()].season : null;
    overlay.innerHTML = `
      <div class="stack">
        <h1>🏁 RUN TO THE PODIUM${DEMO ? `<span style="color:var(--accent)"> · DEMO</span>` : ""}</h1>
        <p class="byline">A game by Qais &amp; Hamdan Farooq</p>
        ${DEMO
          // Say up front exactly how far it goes. A demo that hides its own
          // length reads as a full game that broke when it stopped.
          ? `<p class="sub">${DEMO_ROUNDS} rounds · ${TEAMS.length} teams · ${DRIVERS.length} seats ·
               ends after your first factory session</p>
             <p class="c" style="font-size:12.5px;max-width:var(--col);margin-inline:auto">
               This is the first sixth of one season of a ${CONFIG.career.years}-year career.
               You drive ${DEMO_ROUNDS} grands prix, your team tells you what it made of them, and you
               spend the money on the car — and that is where the demo stops.</p>`
          : `<p class="sub">${CONFIG.career.years}-year career · ${CONFIG.seasonRounds} rounds a season ·
               ${TEAMS.length} teams · ${DRIVERS.length} seats · 2 championships</p>`}
        ${storageWarning()}
        <div class="ctrls" style="margin:18px auto 0">
          <b>↑ / W</b><span>Throttle</span>
          <b>↓ / S</b><span>Brake &amp; reverse</span>
          <b>← → / A D</b><span>Steer</span>
          <b>SPACE</b><span>⚡ DRS — only in the green zones. In a race you must be within
            ${CONFIG.drsGapSeconds}s of the car ahead at the blue detection line before one;
            in qualifying every zone is open</span>
          <b>ENTER</b><span>🔧 Book a pit stop — served next time you cross the line</span>
          <b>C</b><span>🛞 Choose the tyre — on the grid it sets what you start on, during a race it
            sets what the crew has ready for your next stop. SHIFT+C goes back the other way.</span>
          <b>P / ESC</b><span>Pause · <b>M</b> mute · <b>T</b> difficulty · <b>V</b> pit-wall voice · <b>O</b> weekend settings</span>
          <b>S</b><span>⏩ Skip a race — it is simulated in full and you get the result. From the round
            preview, the qualifying result, or the pause screen mid-race.</span>
        </div>
        <h2 style="margin-top:20px">Your weekend</h2>
        <p class="modeLine">Race length <b>${raceLen.label}</b> &nbsp;·&nbsp;
          Qualifying <b>${QUALI_MODES.find(m => m.key === qualiMode).label}${qualiMode === "off" ? "" : ` (${qualiSecs}s a session)`}</b>
          &nbsp;·&nbsp; Formation lap <b>${formationOn ? "on" : "off"}</b>
          &nbsp;·&nbsp; Opponents <b>${aiLevel.label}</b>
          &nbsp;·&nbsp; <span class="key">O</span> to change</p>
        <h2 style="margin-top:20px">Difficulty</h2>
        ${modePicker()}
        <p style="margin-top:16px"><b style="color:var(--ink)">🏁 Qualifying</b> sets the grid: <b style="color:var(--ink)">Q1</b> runs
        all ${DRIVERS.length} cars and the slowest ${CONFIG.quali.cut} are knocked out, <b style="color:var(--ink)">Q2</b> runs
        the surviving ${DRIVERS.length - CONFIG.quali.cut} and drops ${CONFIG.quali.cut} more, and
        <b style="color:var(--ink)">Q3</b> is a ${DRIVERS.length - CONFIG.quali.cut * 2}-car shoot-out for pole. Drive it yourself,
        have it simulated, or turn it off and start from reverse championship order as before.</p>
        <p style="margin-top:16px">Grass costs you most of your speed and the barriers cost you more —
        and hitting them <b style="color:var(--ink)">bends the car</b>, which you carry to the flag unless you pit.</p>
        <p><b style="color:var(--ink)">🛞 Tyres wear from sliding</b>, not from distance. Drive smoothly and they may last the race;
        throw it around and you will be crawling by half distance — and past about a third worn,
        <b style="color:var(--ink)">a tyre can let go altogether</b>. You get a warning and about ten seconds to decide:
        box and lose the position, or gamble it holds to the flag. Ignore it and you are walking home.
        That happens on both difficulties. Booking a stop sends you down the
        <b style="color:var(--ink)">pit lane</b> on the limiter for fresh rubber, repairs and a full boost tank —
        but the crew are human, and about one stop in eight goes wrong.</p>
        <p>There are <b style="color:var(--ink)">three compounds</b>, and the choice is the whole strategy.
        A <b style="color:${CONFIG.compounds[0].colour}">soft</b> is worth a couple of tenths a lap and wears
        about half again as fast; a <b style="color:${CONFIG.compounds[2].colour}">hard</b> gives those tenths
        back and will still be there at the flag; a <b style="color:${CONFIG.compounds[1].colour}">medium</b>
        splits the difference. Nobody has to match anybody — the rest of the grid picks for itself, so the car
        you are racing may well be on something else, and the letter beside each name on the timing board is
        how you tell. Stopping one lap before a rival on fresher rubber is an <b style="color:var(--ink)">undercut</b>;
        staying out while they stop, and using the clear track, is an <b style="color:var(--ink)">overcut</b>.
        Both are only available because you are not on the same tyre.</p>
        <p><b style="color:var(--ink)">🚨 The safety car</b> comes out when a car is abandoned on the road —
        roughly one race in three. The field closes right up behind it and is <b style="color:var(--ink)">held
        in order</b>: you will end up on the gearbox of the car ahead and you will stay there, because nobody
        can gain or lose a place on the road until the green flag. There are no penalties for anything, because
        there is nothing to police. Places <em>can</em> still change in the pit lane, and that is the whole
        point of it — with the field crawling, a stop costs about half what it costs under green. Taking it is
        a gamble, not a free lunch: you rejoin further back in a bunched field and you cannot pass anybody until
        the restart, so the cars who stayed out lead on old rubber while you sit behind them on new.</p>
        <p>With qualifying off, the grid is set in <b style="color:var(--ink)">reverse championship order</b> — the better you do, the further back you start.</p>
        ${(() => {

             cold menu there is no such seat yet — driver zero is still in the
             factory's slot, which is a front-running team nobody has ever
             started a career in — so it says where a career WOULD begin

          const pv = startingSeatPreview();
          if (pv && pv.started) {

            const mate = DRIVERS[TEAMS[t].drivers.find(i => i !== 0)];
            return `<p>You drive for <b style="color:${TEAMS[t].colour}">${TEAMS[t].badge} ${TEAMS[t].name}</b> alongside

          }

             the junior car, so the one still there afterwards is the other. */
          const mate = pv ? DRIVERS[TEAMS[pv.team].drivers.find(i => i !== pv.seat)] : null;
          const where = !pv
            ? `the junior seat of one of the slowest cars on the grid`
            : `the junior seat at <b style="color:${TEAMS[pv.team].colour}">${TEAMS[pv.team].badge} ${TEAMS[pv.team].name}</b>,
               the slowest car on the grid${mate ? `, alongside <b style="color:var(--ink)">${mate.name}</b>` : ""}`;
          return `<p><b style="color:var(--ink)">You start at the back.</b> Nobody hands a rookie a winning car:

            <b style="color:var(--ink)">constructors' championship</b> as well as your own — so there are two titles

        })()}
        <p><b style="color:var(--ink)">Points go to the top ${CONFIG.points.length} of ${DRIVERS.length}</b> — ${CONFIG.points.join(" · ")} —
        plus <b style="color:var(--ink)">one bonus point for the fastest lap</b>, if you finish in the points.
        ${DRIVERS.length - CONFIG.points.length} cars come away with nothing, so the midfield is racing for a single point
        rather than for a placing nobody writes down.</p>
        <p><b style="color:var(--ink)">🏳️ Things break.</b> Engines let go, gearboxes fail, brakes go soft, tyres deflate,
        and a car already at maximum damage may not survive the next wall. Some failures give you twenty seconds of warning
        and a decision — <b style="color:var(--ink)">pit to fix it</b> and lose the position, or gamble it lasts. Others are
        simply a bang and a walk home. <b style="color:var(--ink)">Retire and you score nothing</b>, and the same dice are
        rolled for every car on the grid, including yours. Some teams build a sturdier car — most reliable:
        ${TEAMS.slice().sort((a, b) => b.reliability - a.reliability).slice(0, 3)
          .map(t => `<b style="color:${t.colour}">${t.name}</b>`).join(" · ")} — and most fragile:
        ${TEAMS.slice().sort((a, b) => a.reliability - b.reliability).slice(0, 3)
          .map(t => `<b style="color:${t.colour}">${t.name}</b>`).join(" · ")}.</p>
        <p><b style="color:var(--ink)">💰 Money.</b> Every team starts the year with a budget, and they are not equal — from
        ${(() => { const r = TEAMS.slice().sort((a, b) => b.funding - a.funding), lo = r[r.length - 1];
           return `<b style="color:${r[0].colour}">${r[0].name}</b> on ${money(r[0].funding)} down to
                   <b style="color:${lo.colour}">${lo.name}</b> on ${money(lo.funding)}`; })()},
        ${(() => {
          // Read the seat a career would START in, not the factory seat. This
          // line used to quote the front-running team's budget as the player's
          // — roughly double what you actually get handed.
          const pv = startingSeatPreview();
          if (!pv) return `and the car you are given is near the bottom of that list.`;
          return pv.started
            ? `with you on ${money(TEAMS[pv.team].funding)}.`
            : `and you start on ${money(TEAMS[pv.team].funding)}, the smallest budget on the grid.`;
        })()}
        A <b style="color:var(--ink)">podium pays the team</b>: ${CONFIG.prize.map((p, i) => `${money(p)} for P${i + 1}`).join(", ")},
        so your team-mate's third place is worth something to you even when it costs you a place.</p>
        <p><b style="color:var(--ink)">🏭 The factory.</b> After every ${CONFIG.devEvery} rounds a
        <b style="color:var(--ink)">development window</b> opens and you spend what you have on the car — aerodynamics,
        the engine, brakes, tyre life, fuel efficiency, the pit crew, reliability, driver coaching.
        <b style="color:var(--ink)">Nothing is guaranteed.</b> About ${OUTCOMES[0].weight}% of projects are a real step forward,
        ${OUTCOMES[1].weight}% barely register, ${OUTCOMES[2].weight}% make the car <i>worse</i>, and
        ${OUTCOMES[3].weight}% are thrown out by the governing body for a fee of 60% of what you spent.
        The gains are small and they compound — a season of good calls is worth a few tenths, not a second.
        The other three teams are doing exactly the same thing with their own money, so the car you are chasing
        in November is not the one you raced in March.</p>
        ${DEMO
          /* Everything in this block is either absent from a demo build or cut
             out of it — the twenty seasons, the winter, the elite events. The
             invitations paragraph would also render as an empty list, because
             ELITE is emptied by the build. So the demo gets the one part that
             IS in it, the review, described honestly as the part it is. */
          ? `<p><b style="color:var(--ink)">📋 The review.</b> After your ${DEMO_ROUNDS} races your team tells you
             whether you did what it asked — wins if you are at the front, points if you are in the midfield,
             simply beating your team-mate if you are at the back. In the demo the worst it can be is a warning.
             In the full game a second miss is the seat, and you spend the rest of the year watching your old
             car from the pit wall.</p>
             <p>The full game runs that judgement for ${CONFIG.career.years} seasons, over
             ${DEMO_FULL_ROUNDS} rounds a year, against ${DRIVERS.length - 1} drivers who age, peak, decline,
             get hurt, get sacked and retire around you.</p>`
          : `<p><b style="color:var(--ink)">📋 Twenty years, and a seat you can lose.</b> A career runs up to
             ${CONFIG.career.years} seasons. Every ${CONFIG.devEvery} rounds your team tells you what it expects —

             <p>The same applies to all ${DRIVERS.length - 1} drivers you are racing. They age, they peak somewhere

             comes asking. ${ELITE.map(e => `<b style="color:var(--ink)">${e.gp}</b> at ${e.name}`).join(", ")} —

        <p><b style="color:var(--ink)">📻 Team orders.</b> Each team backs whichever of its cars is higher in the drivers' championship.

        ${DEMO ? "" : `<p><b style="color:var(--ink)">🎞️ Highlights.</b> Every race is recorded while it is run —

    const mt = seated ? TEAMS[myTeam()] : null;
    const mate = mt ? mt.drivers.find(i => i !== 0) : -1;
    const cPos = mt ? constructorOrder().indexOf(myTeam()) + 1 : 0;
    const obj = myObjective();
    overlay.innerHTML = `
      <div class="stack">
        <h2>${eliteRun ? "An invitation" : `Round ${season.round}`} · ${ran.flag} ${ran.gp}${lastRaceSimulated ? " · simulated" : ""}</h2>

          Points, prize money and the championship all count exactly as if you had driven it.</p>` : ""}
        ${retired.length ? `<p style="font-size:12.5px">🏳️ ${retired.length} retirement${retired.length > 1 ? "s" : ""} —
          ${retired.map(c => `<b style="color:${c.colour}">${c.name}</b> (${c.outFail.label.toLowerCase()})`).join(", ")}</p>` : ""}
        ${eliteRun || !mt ? "" : `<p style="font-size:13px"><b style="color:${mt.colour}">${mt.badge} ${mt.name}</b> scored
          <b style="color:var(--ink)">${teamGain(myTeam())}</b> today
          (you ${lastPoints[0]}, ${DRIVERS[mate].name} ${lastPoints[mate]}) —
          <b style="color:var(--ink)">P${cPos}</b> of ${TEAMS.length} in the constructors' on ${teamPoints(myTeam())}.</p>`}
        ${obj && !eliteRun ? `<p style="font-size:12.5px">🎯 <b style="color:var(--ink)">${TEAMS[objectiveTeam(obj)].name} want you to ${objectiveText(obj).toLowerCase()}</b>
          this block — ${objectiveProgress(obj)} with
          ${Math.max(0, (obj.block + 1) * CONFIG.devEvery - season.round)} race${(obj.block + 1) * CONFIG.devEvery - season.round === 1 ? "" : "s"} to run.</p>` : ""}
        ${fastestLap ? `<p style="font-size:12.5px">⏱️ Fastest lap —
          <b style="color:${DRIVERS[fastestLap.id].colour}">${DRIVERS[fastestLap.id].name}</b>
          in ${fmtTime(fastestLap.time)}${eliteRun ? "" : `, worth
          <b style="color:var(--ink)">${CONFIG.fastestLapPoint} point</b>${fastestLap.id === 0 ? " — yours" : ""}`}.</p>` : ""}
        ${eliteRun || !mt ? "" : `<p style="font-size:13px">💰 ${lastPrize[myTeam()]
          ? `Prize money <b class="cash">${money(lastPrize[myTeam()])}</b> to the team —
             the bank is on <b class="cash">${money(bank(myTeam()))}</b>.`
          : `No podium, no prize money. The bank stays on <b class="cash">${money(bank(myTeam()))}</b>.`}
          ${/* devWindowOwed() answers "not owed" on the last round of a season,
                and in a demo build the last round of the season IS the round
                the factory opens after — so the demo asks its own question.
                Before round six it falls through to the countdown below, which
                already reads the right number off devEvery. */
            (DEMO ? season.round >= DEMO_ROUNDS && !season.devLog.length : devWindowOwed())
            ? ` <b style="color:var(--accent)">The factory is waiting</b> — a development window opens next.`
            : ` Next window after round ${(Math.floor(season.round / CONFIG.devEvery) + 1) * CONFIG.devEvery}.`}</p>`}
        ${reviewOwed() ? `<p style="font-size:13px"><b style="color:var(--accent)">🎯 The six-race review is next</b> —
          every team on the grid decides whether it got what it asked for.</p>` : ""}
        <div class="row" style="margin-top:14px">
          <div><h2>Classification</h2>
            <table><thead><tr><th></th><th></th><th>Driver</th><th style="text-align:right">Grid</th><th style="text-align:right">Interval</th><th style="text-align:right">To leader</th><th style="text-align:right">Best lap</th><th style="text-align:right">Stop</th><th style="text-align:right">Pts</th></tr></thead><tbody>${rows}</tbody></table>
          </div>
          ${eliteRun ? "" : `<div><h2>Drivers</h2>${standingsTable()}</div>
          <div><h2>Constructors</h2>${constructorsTable()}</div>`}
        </div>
        ${eliteRun ? "" : devCharts("Where the cars stand")}
        ${DEMO ? "" : reelWatchable(reel) ? `<p class="c" style="margin-top:16px;font-size:13px">🎞️
          <b style="color:var(--ink)">${reel.clips.length} moment${reel.clips.length === 1 ? "" : "s"}</b>
          from that race — ${reelSummary(reel)}.
          <span class="key">V</span> to view them${reelIsSaved(reel)
            ? ` &nbsp;·&nbsp; <b style="color:var(--ink)">saved</b> &nbsp;·&nbsp;
               <span class="key">S</span> to keep this one for good`
            : ` &nbsp;·&nbsp; <span class="key">S</span> to save them — otherwise they go when the next race starts`}
          &nbsp;·&nbsp; <span class="key">L</span> everything saved
          ${reelSaveNote ? `<br><b style="color:var(--accent)">${reelSaveNote}</b>` : ""}</p>`
        : reels.length ? `<p class="c" style="margin-top:16px;font-size:13px">🎞️
          <span class="key">V</span> to view the saved replays — ${reels.length} reel${reels.length === 1 ? "" : "s"} saved</p>` : ""}
        <p class="c" style="margin-top:16px"><span class="key">SPACE</span> ${eliteRun
          ? "back to the championship"
          // `done` is true here in a demo build the moment round six is read —
          // the demo calendar is six long — but "final standings" is the wrong
          // promise: what comes next is the review, and then the factory.
          : DEMO && season.round >= DEMO_ROUNDS ? "your team's verdict on the six"
          : done ? "final standings"
          : `on to round ${season.round + 1} — ${next.flag} ${next.gp}${next.loc ? `, ${next.loc}` : ""}, ${next.date}`}</p>
      </div>`;
    return;
  }

  if (state === State.GARAGE) { overlay.innerHTML = garageScreen(); return; }

  /* --- Where the demo stops -------------------------------------------------
     Only a demo build can reach this. Three jobs in a deliberate order: say
     what they just did, say what it bought, and only then ask for the sale. A
     buy screen that opens with a price is an advert; one that opens with your
     own six races is the end of something you were in the middle of, which is
     the feeling that sells the other eighteen rounds. ---------------------- */
  if (state === State.DEMOEND) {
    const me  = playerPerson();
    const y   = me ? me.year : blankYear();
    const mt  = TEAMS[myTeam()];
    const pos = me && me.seat >= 0 ? championshipOrder().indexOf(me.seat) + 1 : 0;
    // Best finish off the race log rather than off a counter, for the same
    // reason the objectives are counted that way — it survives a reload.
    const best = season.log.reduce((b, r) => {
      const e = me && r.results.find(x => x.pid === me.pid);
      return e && e.pos && (!b || e.pos < b) ? e.pos : b;
    }, 0);
    const win   = season.devLog[season.devLog.length - 1];
    const mine  = win ? win.entries.filter(e => e.team === myTeam()) : [];
    const built = mine.filter(e => e.outcome === "breakthrough").length;

    const head = y.wins   ? "A WINNER, SIX RACES IN"
               : y.podiums ? "ON THE PODIUM ALREADY"
               : y.points  ? "POINTS ON THE BOARD"
               : "SIX RACES DOWN";

    overlay.innerHTML = `
      <div class="stack">
        <h2>The demo ends here · ${DEMO_ROUNDS} rounds of a ${CONFIG.career.years}-year career</h2>
        <h1>${head}</h1>
        <p class="sub">${me ? me.name : "You"} · ${mt.badge} ${mt.name}</p>
        <div class="vitals">
          <div><dt>Points</dt><dd>${y.points}</dd></div>
          <div><dt>Championship</dt><dd>${pos ? "P" + pos : "—"}</dd></div>
          <div><dt>Best finish</dt><dd>${best ? "P" + best : "—"}</dd></div>
          <div><dt>Wins · podiums</dt><dd>${y.wins} · ${y.podiums}</dd></div>
        </div>
        <p>That was one turn of the loop: six grands prix, the review your team made of
        them, and the ${mine.length ? `${money(mine.reduce((s, e) => s + e.spent, 0))} you just put through the factory` : "factory window they paid for"}${
          built ? `, which found ${built} real step${built === 1 ? "" : "s"} forward` : ""}.
        <b style="color:var(--ink)">The full version runs that loop ${Math.round(DEMO_FULL_ROUNDS / DEMO_ROUNDS) - 1} more times
        this season, and then runs the season ${CONFIG.career.years - 1} more times.</b></p>
        <p>What is being built into it: the remaining ${DEMO_FULL_ROUNDS - DEMO_ROUNDS} rounds of the calendar,
        the winter transfer market and a seat you can be sacked out of, invitations to race events
        that belong to nobody's championship, twenty years of a driver ageing, peaking and declining
        around you, the honours board, and saved highlight reels of every race you keep.</p>
        <div class="demoNote">
          <p><b style="color:var(--ink)">Thanks for driving it.</b> Hope you enjoyed the six.</p>
          <p><b style="color:var(--accent)">The full version is in development.</b></p>
          <p style="font-size:13px">If you have a minute, leave your thoughts in the comments — what you liked,
          what annoyed you, what you wanted more of. Feedback from the demo is genuinely shaping what ships.</p>
        </div>
        <p class="c" style="margin-top:16px">
          <span class="key">SPACE</span> drive the demo again from round 1</p>
        <p class="c" style="font-size:12px">Starting again wipes this demo career and deals a new grid.</p>
      </div>`;
    return;
  }

  if (state === State.DEV) {
    const mt = TEAMS[myTeam()];
    const left = CONFIG.seasonRounds - season.round;

    if (devPhase === "choose") {
      const spend = devSpend(), rem = devLeft();
      overlay.innerHTML = `
        <div class="stack">
          <h2>Development window · after round ${season.round}${DEMO ? "" : ` of ${CONFIG.seasonRounds}`}</h2>
          <h1>🏭 THE FACTORY</h1>
          <p class="sub">${mt.badge} ${mt.name} · ${DEMO
            ? "the first development window of the season"
            : `${left} round${left === 1 ? "" : "s"} still to run`}</p>
          <div class="vitals">
            <div><dt>In the bank</dt><dd class="cash">${money(bank(myTeam()))}</dd></div>
            <div><dt>Committed</dt><dd>${money(spend)}</dd></div>
            <div><dt>Left to spend</dt><dd class="cash${rem < 15 ? " low" : ""}">${money(rem)}</dd></div>
            <div><dt>Prize money won</dt><dd>${money(season.earned[myTeam()])}</dd></div>
          </div>
          <p>Fund as many projects as the budget carries. Every one of them is a gamble:
          the factory can produce a genuine step forward, a change nobody can measure,
          a car that is <b style="color:var(--ink)">worse than the one you had</b> —
          or a part the governing body simply <b style="color:var(--ink)">will not let you race</b>,
          which costs you the money and returns 40% of it.</p>
          ${oddsBlock()}
          <p style="font-size:12.5px">Spending nothing is a real option. Money kept now is money
          available at the next window, when you will know more about what the car actually needs.</p>
          <h2 style="margin-top:18px">Projects</h2>
          ${projectCards()}
          <p class="c" style="margin-top:14px">
            <span class="key">1</span>–<span class="key">${PROJECTS.length}</span> fund a project
            &nbsp;·&nbsp; <span class="key">X</span> clear
            &nbsp;·&nbsp; <span class="key">SPACE</span> ${spend
              ? `commit ${money(spend)} and see what it bought`
              : "commit nothing and bank the lot"}</p>
          <h2 style="margin-top:22px">The arms race</h2>
          <p class="c" style="font-size:12px;margin-bottom:8px">Where every car stands against the one it started
          the season as — and what each team still has to spend.</p>
          ${devTable()}
          ${devCharts("The same thing, drawn")}
        </div>`;
      return;
    }

    // ...and the same window, once the dice have been rolled.
    const win  = season.devLog[season.devLog.length - 1];
    const mine = win.entries.filter(e => e.team === myTeam());
    const good = mine.filter(e => e.outcome === "breakthrough").length;
    const bad  = mine.filter(e => e.outcome === "backfire").length;
    const nope = mine.filter(e => e.outcome === "rejected").length;
    const head = !mine.length ? "MONEY IN THE BANK"
               : bad + nope >= mine.length ? "A WINTER TO FORGET"
               : good >= Math.ceil(mine.length / 2) ? "THE CAR IS BETTER"
               : "SOME OF IT STUCK";
    overlay.innerHTML = `
      <div class="stack">
        <h2>Development window · after round ${season.round}${DEMO ? "" : ` of ${CONFIG.seasonRounds}`}</h2>
        <h1>${head}</h1>
        <p class="sub">${mine.length
          ? `${good} breakthrough${good === 1 ? "" : "s"} · ${bad} backfired · ${nope} rejected`
          : `${money(bank(myTeam()))} carried forward`}</p>
        <h2 style="margin-top:16px">What every team got for its money</h2>
        ${devLogPanels(win)}
        <h2 style="margin-top:22px">The arms race</h2>
        ${devTable()}
        <p class="c" style="margin-top:16px">${DEMO
          // There is no CIRCUITS[season.round] to name here: the demo calendar
          // is six long and this screen is being read after round six.
          ? `<span class="key">SPACE</span> that is the end of the demo`
          : `<span class="key">SPACE</span> on to round ${season.round + 1} —
             ${CIRCUITS[season.round].flag} ${CIRCUITS[season.round].gp}`}</p>
      </div>`;
    return;
  }

  if (state === State.CHAMPION) {
    const order = championshipOrder();
    const champ = order[0];
    const youPos = order.indexOf(0) + 1;
    const cOrder = constructorOrder();
    const cChamp = TEAMS[cOrder[0]];
    const mine = cOrder[0] === myTeam();
    const cPos = cOrder.indexOf(myTeam()) + 1;
    const me = playerPerson();
    const seated = playerSeated();
    const yr = career ? career.year : 1;
    const last = yr >= CONFIG.career.years;
    overlay.innerHTML = `
      <div class="stack">
        <h2>Year ${yr} of ${CONFIG.career.years} · season complete</h2>
        <h1>${glyph(champ, 46)} ${champ === 0 && seated ? "YOU ARE WORLD CHAMPION" : DRIVERS[champ].name + " takes the title"}</h1>
        <p class="sub">${champ === 0 && seated ? "🏆🏆🏆"
          : seated ? `You finished P${youPos} with ${driverPoints(0)} points`
          : `You spent the year without a drive`}</p>
        ${me ? `<p style="font-size:12.5px">Career so far — ${me.stats.seasons + 1} season${me.stats.seasons ? "s" : ""},
          ${me.stats.wins + me.year.wins} win${me.stats.wins + me.year.wins === 1 ? "" : "s"},
          ${me.stats.titles + (champ === 0 && seated ? 1 : 0)} title${me.stats.titles + (champ === 0 && seated ? 1 : 0) === 1 ? "" : "s"},
          and you turn ${me.age + 1} over the winter.</p>` : ""}
        <h2 style="margin-top:20px">Constructors' champions</h2>
        <h1 style="font-size:clamp(20px,3.2vw,32px)">
          ${cChamp.drivers.map(di => glyph(di, 34)).join("")}
          <span style="color:${cChamp.colour}">${cChamp.badge} ${cChamp.name}</span>
        </h1>
        <p class="sub">${mine && seated
          ? `🏆 Your team — ${teamPoints(cOrder[0])} points`
          : `${TEAMS[myTeam()].name} finished P${cPos} on ${teamPoints(myTeam())}`}</p>
        <div class="row" style="margin-top:18px">
          <div><h2>Drivers</h2>${standingsTable()}</div>
          <div><h2>Constructors</h2>${constructorsTable()}</div>
        </div>
        <h2 style="margin-top:22px">The car they finished the year with</h2>
        ${devTable()}
        <p style="font-size:12.5px">${TEAMS[myTeam()].name} earned
          <b class="cash">${money(season.earned[myTeam()])}</b> in prize money across the season and
          finish with <b class="cash">${money(bank(myTeam()))}</b> in the bank. A new season starts
          everyone level again — same budgets, same car, no development carried over.</p>
        <h2 style="margin-top:20px">The winter ahead</h2>
        <p style="font-size:13px">Everybody on the grid gets a year older. Some will retire, some will be
          let go, and a new intake arrives looking for a seat. ${last
            ? `<b style="color:var(--accent)">This was year ${CONFIG.career.years} — the end of your career.</b>`
            : `You have <b style="color:var(--ink)">${CONFIG.career.years - yr} season${CONFIG.career.years - yr === 1 ? "" : "s"}</b> left.`}</p>
        <p class="c" style="margin-top:16px"><span class="key">SPACE</span> ${last ? "your career summary" : "into the winter"}
          ${career && career.seasons >= 4 && !last
            ? `&nbsp;·&nbsp; <span class="key">X</span> retire now, on your own terms` : ""}
          &nbsp;·&nbsp; <span class="key">C</span> careers</p>
      </div>`;
    return;
  }
}

/* =========================================================================
   Loop
   ========================================================================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);   // clamp: a backgrounded tab
  last = now;                                       // otherwise teleports everyone

  // A race being simulated runs as many physics steps as fit in a slice and
  // paints a progress screen instead of the track — there is no camera to move
  // and nothing on the road worth drawing behind an overlay.
  if (simRun) {
    // A simulation that throws is abandoned rather than left spinning: simRun
    // stays set otherwise and every later frame retries the same fault.
    try { runSimSlice(); } catch (err) { frameFault(err); simRun = null; }
    requestAnimationFrame(frame);
    return;
  }

  // A replay steps nothing and decides nothing: it reads poses out of a clip
  // and draws them. Kept off the update path entirely so it can never advance
  // a race, a season or a career by accident.
  if (state === State.REPLAY && rep) {
    try { repUpdate(dt); drawReplay(); } catch (err) { frameFault(err); repExit(); }
    requestAnimationFrame(frame);
    return;
  }

  /* One bad frame must not be the end of the game. Without this, anything that
     throws in update() or draw() skips the requestAnimationFrame below and the
     loop never runs again: the canvas freezes on a half-painted frame while the
     HUD and the keyboard carry on working, which reads as "the game stopped"
     rather than as an error. The frame is abandoned, the reason is logged once
     per distinct fault, and the next one is asked for regardless. */
  try {
    update(dt);
    updateCamera(dt);
    draw();
  } catch (err) {
    frameFault(err);
  }

  requestAnimationFrame(frame);
}

const seenFaults = new Set();
function frameFault(err) {
  const sig = String((err && err.stack) || err);
  if (!seenFaults.has(sig)) {
    seenFaults.add(sig);
    console.error("Frame abandoned:", err);
  }
}

/* =========================================================================
   Boot
   ========================================================================= */
resize();
// Liveries first: every screen and every car reads TEAMS/DRIVERS directly, so
// the overlay has to be painted on before anything is drawn or a saved season
// is offered under last season's names.
applyLivery(store.get(K_LIVERY, null));
// Careers next, since the menu counts them and offers to resume one. A stale
// save must not be trusted blindly, and a fresh season must NOT be written to
// storage here — that would wipe a save before the menu had offered it.
careers = loadCareers();
activeCareer = Math.max(0, lastPlayed());
// The honours board is loaded before anything can write to it, and lives in
// its own key so it survives every slot being deleted.
hall = loadHall();
/* A career has to be LOADED, not just pointed at, because the roster is what
   decides who is in every seat — and the menu draws the grid. Without this the
   title screen would list the factory line-up while the save it is offering to
   resume has a completely different one. */
if (careers[activeCareer]) {
  career = careers[activeCareer];
  season = career.season;
  applyCareerSeats(career);
  syncSeats();
  migrateStartTeam(career);
  openBlock();
} else {
  season = freshSeason();
}
updateVoiceBadge();
go(State.MENU);
requestAnimationFrame(frame);
</script>
</body>
</html>
