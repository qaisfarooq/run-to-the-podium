    },
    /* Not policed below this opponent skill. Rookie and Novice are deliberately
       scrappy — they lock up and run into people by design — so judging contact
       there would hand the player penalties the AI earned. This is now the ONLY
       exemption: Semi-Pro was exempt too until it turned out that, being the
       default mode, the exemption hid the whole feature from the default player.

       Semi-Pro runs the field 6% slower (assist.aiPace 0.90 against aiPace
       0.955) and closing speed is what the ladder is calibrated on, so the
       obvious worry was that the same thresholds would catch far less there.
       MEASURED instead of assumed, and the worry was misplaced — see the note
       on reviewFrom. One ladder covers both modes. */
    fromLevel:   "club",
  },

  // --- how good the opposition is ----------------------------------------
  // A multiplier on the pace the whole field drives to, and on how often they
  // throw a lap away. `pro` is 1.00 and is the game exactly as it was, so the
  // default changes nothing for anyone.
  //
  // Slowing them down is only half of an easy race — a slow car driven
  // perfectly is still a car you cannot pass without it letting you. So the
  // easier levels are scrappier too: they lock up, run wide and hand you the
  // place, which is what makes a low setting feel winnable rather than just
  // sluggish. The hard levels tighten the same screw the other way.
  // `hand` is the third column and only the top two levels carry it: see the
  // note below for why pace alone runs out of road.
  aiLevels: [
    { key: "rookie",   label: "Rookie",   mul: 0.72, err: 1.75, hand: 1.00, blurb: "Well off the pace and messy with it" },
    { key: "novice",   label: "Novice",   mul: 0.80, err: 1.45, hand: 1.00, blurb: "Catchable on any lap, and they make mistakes" },
    { key: "club",     label: "Club",     mul: 0.87, err: 1.22, hand: 1.00, blurb: "A midfield you can race with" },
    { key: "national", label: "National", mul: 0.93, err: 1.08, hand: 1.00, blurb: "You will have to drive well to win" },
    { key: "pro",      label: "Pro",      mul: 1.00, err: 1.00, hand: 1.00, blurb: "The default — the field as it has always been" },
    { key: "ace",      label: "Ace",      mul: 1.04, err: 0.62, hand: 1.00, blurb: "At the limit of the car, and tidy with it" },
    { key: "legend",   label: "Legend",   mul: 1.06, err: 0.35, hand: 1.00, blurb: "As quick as the car goes, and they almost never err" },
    { key: "alien",    label: "Alien",    mul: 1.08, err: 0.22, hand: 1.05, blurb: "Carrying speed through corners you have to brake for" },
    { key: "mythic",   label: "Mythic",   mul: 1.10, err: 0.10, hand: 1.10, blurb: "Pole is theirs unless you drive the lap of your life" },
  ],
  // Note on the top of the range. `mul` scales the AI's target speed, but that
  // target is track.vmax — a ceiling built from grip AND from how fast the car
  // can yaw. At Pro the quickest driver is already asking for essentially all of
  // it, so past about 1.05 the request is for a corner speed the car physically
  // cannot hold and the extra is spent understeering rather than on lap time.
  // Measured: median lap 14.93s at Pro, 14.08s at 1.04, and 14.07s at 1.09 —
  // i.e. nothing beyond about 1.05. That is why Ace and Legend are separated by
  // CONSISTENCY instead, which is not capped by anything: Legend's field makes
  // roughly a third as many mistakes as Pro's, and a race where nobody ahead of
  // you puts a wheel wrong is a much harder race than one where they are half a
  // second quicker.
  //
  // Above Legend the wall in front of `mul` is the CAR, not the driver, and
  // consistency has largely run out as well — a field that almost never errs
  // cannot err much less. So Alien and Mythic move the wall instead: `hand`
  // multiplies the AI's grip and its yaw rate in stepCar — the two limits vmax
  // itself is built from — and the same figure multiplies the speed it asks for,
  // exactly the way an aero upgrade already does for both at once. That is
  // openly a better car for the opposition rather than a better driver, which is
  // the honest description of anything above Legend, since Legend is already the
  // standard machine driven perfectly.
  //
  // Measured with tools/ai-pace.js, ten rounds, on the field's tenth-percentile
  // lap (its flying-lap pace — the median is traffic and in-laps and moves
  // several percent between runs of the same setting, so it cannot be compared):
  // Legend 12.62s, Alien 11.92s (-5.5%), Mythic 11.80s (-6.5%).
  //
  // The diminishing return there is real and is the reason the numbers stop
  // where they do. Asking for more than `hand` can hold does NOT buy lap time:
  // 1.18/1.10 measured no quicker than 1.10/1.10, while average damage on
  // Jeddah and Las Vegas — where the mistake is a barrier rather than a runoff —
  // went from 33% of the maximum to 49%. Six or seven percent on Legend is what
  // this lever is worth; past that the field is not quicker, only broken. If a
  // harder setting is ever wanted, it has to come from somewhere else again —
  // the AI still drives close to the centreline, and a real racing line is the
  // headroom nothing here touches.

  // --- race length -------------------------------------------------------
  // Every circuit carries its own `laps`, already scaled down from the real
  // distance to something raceable in a few minutes. This multiplies it, so a
  // long race is long everywhere rather than fixed at a lap count that would be
  // a sprint at Spa and an afternoon at Monaco.
  //
  // Standard is the default, and deliberately not the shortest thing that
  // works. At Short a round is six laps — under two minutes, which is LESS
  // than the qualifying that precedes it, and one stop either way. Standard
  // doubles it to twelve, which comes out at three and a half minutes and
  // about two stops: past the point where one set reaches the flag, so the
  // pit wall has something to decide and the compound choice below has
  // somewhere to express itself.
  //
  // The stop counts in the blurbs are measured, not guessed — a full field
  // simulated at each setting came out at 0.1 / 1.0 / 2.3 / 4.4 stops a car.
  // If the wear rates ever move, re-measure rather than trusting these.
  raceLengths: [
    { key: "sprint",   label: "Sprint",   mul: 0.5, blurb: "One stint, flat out — nobody stops" },
    { key: "short",    label: "Short",    mul: 1.0, blurb: "About one stop, and you can gamble on none" },
    { key: "standard", label: "Standard", mul: 2.0, blurb: "The default — around two stops, and the compound matters" },
    { key: "long",     label: "Full",     mul: 3.5, blurb: "Four or five stops, and about one car in four breaks" },
  ],

  // --- qualifying --------------------------------------------------------
  // Three knockout segments, six cars out of each of the first two. With
  // twenty-two entered that is 22 -> 16 -> 10, which is the real format.
  quali: {
    cut: 6,             // eliminated at the end of Q1 and again at the end of Q2
    // Seconds of running per segment. Short by real standards on purpose: a
    // real Q1 is eighteen minutes because a real lap is ninety seconds, and
    // these laps are twenty.
    times: [45, 60, 90, 120, 180],
    defaultTime: 60,
    // Once the flag falls a car may finish the lap it is on, as in the real
    // thing. This caps how long the session will wait for the stragglers.
    flagGrace: 45,
    // How much a driver's pace varies lap to lap, and how often one is thrown
    // away altogether by a mistake. Used by the simulator AND by the AI in a
    // session the player is driving — see rollQualiLap for why that matters.
    //
    // Raised from 0.011 with formSd below, and both figures were measured, not
    // guessed. At 0.011 with no form the grid was very nearly the skill list
    // read out loud: Spearman 0.93 against skill order, pole to the single
    // quickest driver 71% of the time, pole to one of the top three 99.1%, and
    // in two thousand sessions nobody outside the top six on skill ever took
    // one. The cause was signal against noise — front to back the field is
    // worth 2.08s of lap time and one sd of scatter was 0.14s, about 15:1 —
    // so the order shuffled locally and never globally.
    simScatter: 0.018,
    /* ...and how much a driver's whole WEEKEND varies, rolled once in
       freshQuali and held across all three segments.

       This is the part that scatter alone cannot do. Widening scatter far
       enough to unfix the grid means somebody flukes pole on one lap, which
       reads as the dice showing rather than as a reason: a car eighth in Q1
       and on pole in Q3 has not done anything, it just got a number. Form is
       rolled per driver per weekend, so a car that is ON at a circuit is on in
       Q1 AND in Q3 and the timesheet stays coherent all afternoon.

       Deliberately qualifying only. Carrying it into the race would be more
       realistic and would also invalidate every race-balance figure in this
       file, none of which was measured against a field with weekend form.

       Together, 0.018 and 0.014 measured at Spearman 0.85, pole 47%, top three
       87%, and about one pole in a hundred from outside the top six. Real
       qualifying runs near 30–45% and 70–85% on those middle two. */
    formSd: 0.014,
    simScruffy: 0.18,
    simScruffyCost: 0.035,
    simNoTime: 0.015,   // ...and how often a car comes back with nothing at all
    /* Building up over the session — DRIVEN segments only.
       Without this the AI drives every lap at exactly the same target speed, so
       the quickest car sets its time on its first flying lap and the timesheet
       never moves again: provisional pole on lap one was pole. Real qualifying
       does the opposite — the track rubbers in, the tyres come to it, and the
       last runs are the quick ones.
       buildUp is how much slower than their limit a car's FIRST flying lap is;
       buildFade is what is left of that deficit each lap after. At 0.022/0.45
       a car is 2.2% off on its first flyer, 1.0% on its second, 0.4% on its
       third — worth about four tenths of a twenty-second lap to begin with,
       which is enough to overturn an early pole without making the opening of
       the session pointless.
       The scatter around it is symmetric, as it is in the simulator — a special
       lap beats the driver's nominal limit by up to about 3%, and it should,
       because that is what a lap somebody nails IS. What the driven session
       still does NOT get is `pace` below: the field is quicker than its nominal
       limit only by having a good lap, never by a flat 3% the player's car
       cannot also have. */
    buildUp: 0.022,
    buildFade: 0.45,
    // The one constant that turns idealLap() into a lap somebody could actually
    // set. It lands near 1, and for a reason rather than by luck: idealLap sums
    // step / (vmax x pace), and vmax x pace is precisely the speed aiControls
    // targets, so the figure already IS the lap a skill-1.0 car is being driven
    // to. The two errors left over largely cancel — a real car cannot
    // accelerate out of a corner instantly, and a real car does not drive the
    // centreline it is measured along.
    //
    // Measured rather than assumed: five circuits raced with the full field and
    // the ideal compared against the fastest lap anyone actually set. The ratio
    // ran 0.89 (Silverstone) to 1.06 (Suzuka) and averaged 0.97, hence 1.03.
    // Expect the simulator to be within about a second of a driven lap either
    // way — which is close enough for a timesheet, and does not affect the
    // ORDER at all, since that comes from skill and aero rather than from this.
    simCal: 1.03,
    // A car in qualifying is on low fuel and one-lap tyres, so it is quicker
    // than the same car in the race. SIMULATED laps only — see startSegment for
    // why this must never be applied to a session the player is driving in.
    pace: 1.03,
  },

  // --- formation lap -----------------------------------------------------
  // Driven for you: the field is walked round the lap in grid order behind the
  // pace car and put back exactly on its boxes. Nobody has to drive a lap they
  // cannot gain anything on, and it cannot go wrong.
  formation: {
    secs:        13,   // real seconds for the whole lap, however long the lap is
    leadGap:     46,   // world units the pace car sits ahead of pole
    weave:       0.26, // share of the available room the field weaves through...
    weaveCycles: 4,    // ...and how many times it does it, warming the tyres
  },

  /* --- the safety car -------------------------------------------------------
     A car stops on the road, the field bunches up behind a pace car, and a
     stop taken while it is out costs about half what it costs under green —
     measured, 6.3s of ground against 2.9s.

     What it is NOT is a free lunch, and the tuning notes should say so rather
     than flatter the feature. Paired races run off a seeded RNG — the same
     race twice, boxing and not — came out at a mean of about half a place
     either way, with individual races swinging from six places lost to eleven
     gained. The saving in SECONDS is real; it is mostly eaten by the fact that
     a bunched field turns a small time loss into a large POSITION loss, and by
     the no-overtaking rule leaving you stuck behind the cars you rejoined
     among. Which is the right answer: a genuine gamble with a fat spread, not
     a button that hands the player a place. Nothing else in the game creates a
     moment like that, and that is what makes it worth the complexity.

     The field is HELD IN ORDER while it is out. Nobody gains or loses a place
     ON THE ROAD — which is why there is no penalty system anywhere in here.
     There is nothing to police, because passing is made impossible rather than
     merely forbidden: one speed ceiling, applied in stepCar, which the player
     and the AI both pass through. Places still change in the PIT LANE, which
     is exactly where they are supposed to change under a safety car.

     Tied to a car actually stopping on track rather than a free-floating dice
     roll, so it always has a cause the player watched happen. -------------- */
  safety: {
    /* Odds that a car stopping on the road brings one out. A PER RETIREMENT
       figure, and the target is "about one race in three".

       This was 0.19 for three days, solved on paper from 1-(1-chance)^1.9 and
       "a race averages 1.9 retirements". It delivered a safety car in 21% of
       races, and a career season — where the player's own retirement ends the
       race early — nearer 16%. BOTH HALVES OF THAT ARITHMETIC WERE WRONG.
       Retirements measure 1.5-1.6 a race, not 1.9; and far more importantly,
       considerSafetyCar below refuses four kinds of retirement that the
       equation counted as rolls: a car stopped in the PIT LANE, the PLAYER's
       own car, anything before `fromLap`, and anything inside the last
       `minLeft`+1 laps. Only about 0.94 retirements a race are eligible to roll
       at all — half what the equation assumed — and the largest single
       exclusion is the last-laps one, because three laps of an 8-12 lap race is
       a quarter of it.

       So it was SWEPT rather than solved a second time, over 48 paired seeded
       races a setting at full distance (tools/safety.js sweep). Solving the
       equation again would have repeated the original mistake in any case:
       a deployment changes the race that follows it, so the eligibility rate is
       not independent of the number being set.

           chance    0.19   0.30   0.40   0.50   0.60
           races     21%    27%    33%    42%    50%

       0.40 is a third, measured. `minLeft: 1` was swept alongside it and buys
       about five points of rate at the same chance by allowing a deployment in
       the closing laps — not taken, because it is not needed to reach the
       target and the period would run to the flag with no restart, which is the
       one thing minLeft exists to prevent.

       A CAREER season sees fewer than a standalone race — 24% over twelve
       measured seasons (tools/season.js), against the 32% above — and the
       reason is not the player: Semi-Pro and Pro come out the same, 24% and
       22%. It is that a developing field breaks down less, 1.2-1.6 retirements
       a race against 1.7, so there is less to neutralise. Qais was shown both
       numbers and chose to hold the target against the full-distance race, the
       basis the original figure was set on. Reaching a third inside a career
       needs chance ~0.65 — measured, 31% — which is two roadside retirements in
       three bringing one out, and one race in two outside a career. */
    chance:   0.40,
    /* ...and it stays out for this long. SECONDS, not laps, which is not how a
       real one is called but is the only figure that behaves here: a lap is
       ~17s and a deployment lands at a random point in one, so "one lap" meant
       anything from three seconds to thirty depending on where the leader
       happened to be. A number the player can read off a countdown, and one
       that can be tuned against the length of the race rather than against the
       length of the circuit. */
    secs:     24,
    warnAt:    6,   // ...and the green flag is called this long before it comes
    /* Share of ordinary pace the queue runs at. Has to be LOW to be worth
       anything: measured, a cap at 52% of top speed slowed the field by only
       14%, because most of a lap is cornering-limited well under the cap and
       the ceiling never bound at all. The cheap stop — the entire reason this
       feature exists — only appears once the field is genuinely crawling. */
    pace:     0.16,
    /* Wear is quoted PER SECOND, which is fine at racing speed and badly wrong
       behind a safety car: a set is gone in about four laps, so half a minute
       of trundling was taking a third of a set off every car on the circuit.
       Measured, that sent all 22 cars to the pit lane at once — not because a
       cheap stop tempted them but because the neutralisation itself had ruined
       their tyres, which is the exact opposite of what going slowly does.
       Scaled down here rather than by rewriting wear as distance-based, which
       would change every other thing the model already gets right. */
    wear:     0.22, // share of the ordinary wear rate while neutralised
    /* How much quicker a car may go to close a gap that is too big. Pulls
       against `pace` and both matter: measured, a high catch-up allowance on
       a lightly-loaded queue left the field averaging well ABOVE the ceiling,
       because cars spent most of their time closing rather than settled, and
       the cheap stop evaporated. Low pace with a generous catch-up is the
       combination that both crawls AND bunches inside the period. */
    catchUp:  1.80,
    gap:      42,   // world units from one car to the next in the queue
    leadGap:  46,   // ...and from the safety car itself to the leader
    minPace:  34,   // never so slow that the queue stops moving altogether
    fromLap:  1,    // no deployment before the leader has completed this many
    minLeft:  2,    // ...nor with fewer than this many laps left after it ends
    /* Under a nearly-free stop a car takes one it would otherwise have put off
       — but NOT all of them, or the safety car stops being a decision and
       becomes a scheduled event that happens to everybody equally.

       Tyres here are gone in about four laps, so at any realistic deployment
       most of the field is already past a flat threshold and the whole grid
       dives in at once: measured, a single number sent all 22 cars down a pit
       lane with four boxes in it. The spread is therefore wide on purpose.
       Some cars box, some gamble on track position and lead the restart on old
       rubber, and THAT is the split worth watching — the same reason aiPitTyre
       is varied per driver per race rather than shared. */
    pitTyre:   0.62,
    pitSpread: 0.45,
  },

  // --- the starting grid -------------------------------------------------
  // Eleven rows of two on the start/finish straight, staggered, as drawn on a
  // real grid. Spacing is the ideal; a circuit whose straight is too short to
  // hold the field gets the whole grid compressed to fit rather than having the
  // back row hung round the final corner.
  grid: {
    rowGap:  52,   // world units between one row and the next (~12.5 m)
    stagger: 0.5,  // how far up its row the odd-numbered side sits
    lateral: 0.40, // share of the tarmac half-width each column sits off centre
    lineGap: 26,   // pole sits this far back from the start line
    // The floor on row spacing, in car LENGTHS rather than world units, so a
    // circuit whose cars are drawn at 0.7 scale gets a grid at 0.7 scale too.
    minCarGaps: 1.25,
    clearance: 2.5, // world units of daylight required between any two cars
    // Radius above which the road counts as straight enough to line a grid up
    // on. Generous — a gentle sweep to the line is still somewhere you can put
    // a grid, and demanding a ruler would find no straight at all at Suzuka.
    straightR: 260,
    minStraight: 100, // ...and a "straight" shorter than this is not one
    lineBefore:  36,  // the line sits this far before the end of it
  },

  seasonRounds: 24,  // overwritten below to match the calendar length

  // Points to the top ten of twenty-two, the system the real calendar this
  // game borrows is scored under. Twelve cars come away with nothing, so the
  // midfield is racing for a point rather than for a placing nobody records.
  points: [25, 18, 15, 12, 10, 8, 6, 4, 2, 1],
  // One bonus point for the fastest lap of the race — but only if you finish
  // in the points, so it rewards a quick car having a good day rather than a
  // retired one setting a banzai lap on lap two and going home.
  fastestLapPoint: 1,

  // --- money -------------------------------------------------------------
  // Everything financial is quoted in $m, because that is the unit a real
  // budget is discussed in and it keeps the numbers readable.
  //
  // Only the podium pays, and it pays the team rather than the driver. Across
  // a season that is 24 x $16m = $384m shared between four teams — so a team
  // that never gets on the podium develops out of its starting budget alone,
  // which is exactly the trap a small team is in. Prize money is the reason
  // the constructors' championship is worth caring about beyond the trophy.
  // Raised when the grid went from four teams to eleven: the same pot split
  // eleven ways would have left everyone but the front row unable to develop
  // at all, which is a harsher game than an interesting one.
  prize:     [12, 8, 5], // $m to the team of the driver finishing P1 / P2 / P3
  devEvery:  6,          // a development window opens after every N rounds
  aiReserve: 0.20,       // fraction of its bank an AI team will not spend

  /* --- The twenty-year career ---------------------------------------------
     A driving career is finite, and every number that decides how it ends
     lives here. The defaults are tuned so that a season driven averagely keeps
     your seat, a season driven badly loses it, and a career driven well runs
     the full twenty years and retires on the player's terms rather than the
     game's. ---------------------------------------------------------------*/
  career: {
    years: 20,             // the length of a full career, in seasons

    // Objectives. A first miss is a warning; a second costs the seat. A miss
    // bad enough to score `sackAt` severity on its own skips the warning.
    warningsAllowed: 1,
    sackAt: 2,             // severity that ends a spell immediately

    // Injury. The crash code already parks a driver in the medical centre; a
    // small share of those are the end of the road, and a further share cost
    // the rest of the season. Deliberately rare — a career should usually end
    // for a reason the player could have driven differently.
    endingInjury: 0.04,    // chance a medical-centre trip is career-ending
    seasonInjury: 0.14,    // ...or costs the remainder of the year

    // The rookie intake, and the reserves a career keeps on the books.
    intake: [2, 4],        // rookies arriving each winter, min..max
    benchMin: 3,           // reserves kept available for mid-season vacancies

    // A team folds when it is broke and going nowhere. Both conditions have to
    // hold, so a rich team having a bad year survives and so does a poor team
    // punching above itself.
    foldBank: 8,           // $m — below this counts as broke
    foldRank: 8,           // ...and this far down the constructors' table
    foldOdds: 0.35,        // chance the two together actually finish them off

    // Elite invitations. Earned on a block of six, offered between rounds, and
    // capped so a dominant career does not turn into a tour of other series.
    eliteBlocks: [1, 3],   // the six-race blocks that end with an invitation
    eliteMax:   2,         // events per season
  },

  /* --- Highlights ---------------------------------------------------------
     Every race is recorded, but not all of it. A rolling buffer holds the last
     few seconds of every car's position, and the moment something happens the
     buffer is cut into a clip: the run-up out of the ring behind it, and the
     aftermath as it is still being driven. Nothing is stored between the
     moments, which is what makes a whole race's highlights a tenth of the size
     of the race.

     The recording is of the WHOLE FIELD, not of the player's car. An overtake
     for fourteenth between two drivers you have never raced is still a moment,
     and a reel that only knew about one car would be a dashcam rather than a
     highlights package. ------------------------------------------------- */
  highlights: {
    hz:       10,     // position samples a second — playback interpolates
    pre:      3.0,    // seconds of run-up kept before a moment
    post:     2.5,    // ...and of aftermath after it
    maxLen:   9.0,    // a clip that keeps being extended stops growing here
    startLen: 6.5,    // the start is a fixed clip from lights out, not an event
    maxClips: 12,     // per race, after pruning — see reelPrune()
    live:     28,     // ...and the ceiling on clips held while still recording

    /* Detecting an overtake. Two cars swapping places on the timing screen is
       not enough on its own: the order flickers when two cars are side by side,
       and it changes for reasons that are not passes at all — a pit stop, a
       retirement, a car a lap down being sorted into a different place. So a
       swap has to STICK for `hold` seconds, the two cars have to still be
       within `gap` metres of each other on the road, and the same pair cannot
       be reported twice inside `cool` seconds however many times they trade. */
    hold:     0.9,
    gap:      95,
    cool:     5.0,
    leadHold: 0.6,    // a lead change is worth confirming faster than a pass

    /* ...and the pair that do nearly all the work.

       An order change on its own is worthless. Two cars nose to tail sit within
       centimetres of each other on the road for lap after lap and trade the
       timing screen the whole way — one takes the inside line, gains two
       metres, gives them back at the next corner — and every one of those
       trades holds for a second, because neither car is going anywhere.
       Measured on one race: 606 order changes, of which 306 were taken back
       inside a second and 300 were not. Three hundred overtakes did not happen.

       So a pass is defined the way an instrument would define it, with
       hysteresis on the GAP rather than a test on the order: `look` seconds ago
       the passer was behind by at least `clear`, and after the hold it is ahead
       by at least `clear`. A car oscillating inside its own car length crosses
       neither threshold and is never reported; a car that came through crosses
       both. `clear` was measured at about one car length — see the sweep in
       tools/highlights.js, where it is the only threshold with a knee in it
       once the lookback is in place. */
    clear:    40,     // a bit under two car lengths (CONFIG.carHalfL is 11.8)
    look:     1.6,    // seconds of gap history the "was behind" test reads

    // Storage. A reel is base64 and a race is roughly 140 KB of it, so the cap
    // is on the total as well as on the count: twenty years of careers live in
    // the same localStorage and must never be squeezed out by replays.
    //
    // Every race is saved without being asked (see reelAuto), so the count is
    // really "how far back the library goes" rather than a limit on ambition.
    // Ten is what the budget pays for: a full race measures about 153 KB of
    // base64, so the two run out together and the screen's "n of 10" reads
    // honestly instead of promising room the space cannot supply.
    keep:     10,            // saved reels, automatic ones evicted first
    budget:   1_600_000,     // ...and a hard ceiling on their combined size
  },
};

   seat changes hands. Dealing a NEW career from the live array would hand it

   Every new career is dealt from here instead, which is the only copy that

/* =========================================================================
   PEOPLE — the drivers behind the twenty-two seats.

   Everything above this line describes a CAR. The entries in DRIVERS are
   seats: a team, a livery, a camera pod, a place in the pecking order. WHO is
   sitting in one is a separate question, and across twenty seasons the answer
   changes — drivers are hired, dropped, hurt, and eventually too old to be
   worth a drive.

   So a person is not a seat. A person has an age, a skill that climbs to a
   peak and falls away again, a contract, and a record that follows them from
   team to team and outlives their driving. syncSeats() copies whoever holds a
   seat onto DRIVERS[i], which is precisely why nothing below this line — the
   race, the board, the tables, makeCar — has to know any of it exists.

   The player is ALWAYS seat 0. When they change teams the two seats trade
   their car identity rather than the player moving index, so `id === 0` still
   means the player everywhere it is already written and myTeam() still reads
   DRIVERS[0].team. The one case that needs handling is the player holding no
   seat at all, and playerSeated says so in one place.
   ========================================================================= */

/* --- Ageing ---------------------------------------------------------------
   A driver is not a fixed number. They arrive raw somewhere around twenty,
   improve for the best part of a decade, hold a plateau for three or four
   years, and then go backwards — slowly at first, then not slowly. `peak` is
   the age THIS driver tops out at, rolled per person, so two rookies of the
   same age are not the same bet: one has four good years, the other twelve.

   The curve is deliberately gentle. A driver two years past their best is a
   tenth off, not a passenger — it should take a while to be sure, the same
   way it does in life. ------------------------------------------------------*/
const AGE = {
  debutMin: 18, debutMax: 23,     // how old a rookie is when they arrive
  peakMin:  27, peakMax:  32,     // where a given driver's plateau sits
  plateau:   2,                   // years either side of peak at full ability
  riseRate:  0.016,               // ability lost per year BEFORE the plateau
  fallRate:  0.021,               // ...and per year after it, which is steeper
  oldAge:    36,                  // teams start looking past you here
  hardStop:  42,                  // nobody drives beyond this
};

// Where a driver is on their own curve, as a multiplier on their raw ability.
function ageFactor(p) {
  const lo = p.peak - AGE.plateau, hi = p.peak + AGE.plateau;
  if (p.age >= lo && p.age <= hi) return 1;
  return p.age < lo ? 1 - (lo - p.age) * AGE.riseRate
                    : 1 - (p.age - hi) * AGE.fallRate;
}
// What they are actually worth today. Clamped so neither a prodigy nor a
// veteran ever leaves the range the physics was tuned against.
function abilityOf(p) { return clamp(p.base * ageFactor(p), 0.86, 1.005); }
// Sloppiness runs the other way: the young are quick and wild, the old are
// tidy and slow. Both are read off the same curve so they can never disagree.
function mistakeOf(p) {
  const raw = p.mistakeBase * (p.age < p.peak ? 1 + (p.peak - p.age) * 0.05 : 1);
  return clamp(raw, 0.05, 0.62);
}
