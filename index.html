    // Point where they are actually going. The weave's own rate is small, so
    // the nose swings gently with it rather than snapping to the offset.
    const weaveRate = Math.cos(w + car.gridSlot * 1.7) * weaveAmp
                    * (Math.PI * 2 * CONFIG.formation.weaveCycles) / formation.dur;
    car.a = s.ang + Math.atan2(weaveRate, Math.max(20, speed));
    car.si = idx;
    car.prog = arc / track.step;
    car.progF = car.prog;
    car.line = lat;
    car.steer = 0;
  }

  // The pace car leads, then dives into the pit lane entry in the last stretch
  // so the field is released with a clear road.
  const pArc = travelled + CONFIG.formation.leadGap;
  if (u > 0.88) {
    paceCar.gone = true;
  } else {
    const pi = ((Math.round(pArc / track.step) % M) + M) % M;
    const ps = track.pts[pi];
    // Peeling off: slide out toward the pit side over the last few percent.
    const peel = clamp((u - 0.72) / 0.16, 0, 1);
    const off = peel * (track.halfWidth + track.runoff * 0.8) * track.pitSide;
    paceCar.x = ps.x + ps.nx * off;
    paceCar.y = ps.y + ps.ny * off;
    paceCar.a = ps.ang;
    paceCar.arc = pArc;
  }
}

function updateFormation(dt) {
  formation.t += dt;
  const u = clamp(formation.t / formation.dur, 0, 1);
  updateFormationPositions(u);
  updateParticles(dt);
  const you = cars.find(c => c.isPlayer);
  if (you) engineUpdate(Math.hypot(you.vx, you.vy), false);
  if (radioTimer > 0) radioTimer -= dt;
  updateHud();
  if (u >= 1) endFormation();
}

// Snap the field onto its boxes, stationary, and hand over to the lights.
function endFormation() {
  const layout = gridLayout(track, cars.length);
  for (const car of cars) placeOnGrid(car, car.gridSlot, layout);
  paceCar = null;
  formation = null;
  raceTime = 0;
  countdown = 4.2;
  lightsLit = 0;
  updateCamera(0, true);
  go(State.COUNT);
  // COUNT does not run the HUD — it is a countdown, not a session — so the
  // panels have to be repainted here or "formation lap" is left sitting on the
  // pit board through the lights. After go(), not before: the label is chosen
  // by the current state, and before the switch that state is still FORMATION.
  updateHud();
}

/* =========================================================================
   Input
   ========================================================================= */
const keys = new Set();
const SWALLOW = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Spacebar"]);
const held = (...n) => n.some(k => keys.has(k));
let pausedFrom = State.RACING;   // which session the pause screen came from
let settingsFrom = State.MENU;   // ...and which screen the settings were opened from
let reelsFrom = State.MENU;      // ...and which screen the highlights were opened from

/* Keep the race just run.

   Every race is already in storage by the time this can be pressed — the flag
   put it there. So S is no longer what saves a reel, it is what stops the reel
   being the next one given up when a later race needs the room. Pressed on a
   reel already kept it says so and does nothing, which is more use than the
   beep that used to mean the same thing.

   Reported rather than silent throughout, because a reel that would not fit is
   something the player has to be told about — see reelSave. */
let reelSaveNote = "";
function keepReel() {
  if (!reelWatchable(reel)) { beep(240, 0.08, "sine", 0.04); return; }

  if (reelIsSaved(reel)) {
    if (reelPin(reel)) {
      reelSaveNote = "Kept — this one stays until you delete it, however many races come after it.";
      beep(720, 0.12, "sine", 0.05);
    } else {
      reelSaveNote = "Already kept.";
      beep(240, 0.08, "sine", 0.04);
    }
    return;
  }

  // Only reachable if the automatic save at the flag was refused — a full
  // library of kept reels, or a browser that would not take the write.
  const r = reelSave(reel);
  reelSaveNote = r.ok && r.held
    ? `Kept — ${reels.length} reel${reels.length === 1 ? "" : "s"} saved${r.dropped ? `, ${r.dropped} older one${r.dropped === 1 ? "" : "s"} dropped to make room` : ""}.`
    : "There was no room to save it — delete a reel and try again.";
  beep(r.ok && r.held ? 720 : 240, 0.12, "sine", 0.05);
}

/* The three highlight keys on the result screen — watch, save, browse.

   Returns true when it has taken the key, and the caller returns rather than
   breaks. Those are the same thing here: the switch is the last statement in
   the listener, so nothing runs after it either way.

   It lives in a function purely so a demo build can lose it in one piece. */
function resultReelKeys(k) {
  if (k === "v") {
    if (reelWatchable(reel)) { if (repEnter(reel, 0, State.RESULT)) return true; beep(240, 0.08, "sine", 0.04); }
    else if (reels.length) { armedSlot = -1; reelsFrom = State.RESULT; go(State.REELS); return true; }
    else beep(240, 0.08, "sine", 0.04);
    return true;
  }
  if (k === "s") { keepReel(); drawScreen(); return true; }
  if (k === "l") { armedSlot = -1; reelsFrom = State.RESULT; go(State.REELS); return true; }
  return false;
}

addEventListener("keydown", (e) => {
  // A focused text field owns the keyboard. Without this, naming a team
  // "Pace" pauses the game on the P, "Team" toggles difficulty on the T, and
  // the space bar never reaches the field at all because SWALLOW eats it.
  const tgt = e.target;
  if (tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA")) {
    if (e.key === "Escape" || e.key === "Enter") tgt.blur();
    return;
  }

  if (SWALLOW.has(e.key)) e.preventDefault();
  unlockAudio();
  if (e.repeat) return;
  keys.add(e.key);

  const k = e.key.toLowerCase();
  const confirm = (e.key === " " || e.key === "Enter");

  if (k === "m") { toggleMute(); return; }
  if (k === "t") { toggleMode(); return; }
  // V is the voice toggle everywhere except the result screen, where it is the
  // reel — that screen is the one place a replay is one keystroke away, and the
  // voice hint is not shown there anyway (see muteHint, menu and grid only).
  if (k === "v" && state !== State.RESULT) { toggleVoice(); return; }

  switch (state) {
    case State.CAREERS: {
      // Whatever the last transfer had to say was said about the keystroke
      // before this one, and a save read off a file survives exactly one
      // keystroke — which has to be the I that confirms it. Both are taken
      // down here rather than in the six places below that would otherwise
      // have to remember to, and the handlers that want them put them back.
      transferMsg = null;
      const pending = pendingSave;
      pendingSave = null;

      const d = /^(Digit|Numpad)([1-9])$/.exec(e.code);
      const i = d ? +d[2] - 1 : -1;
      if (i >= 0 && i < CAREER_SLOTS) {
        if (e.shiftKey) {
          // Arm, then confirm. Two presses of the same combination.
          if (armedSlot === i) { deleteCareer(i); armedSlot = -1; beep(200, 0.2, "sawtooth", 0.05); }
          else if (careers[i]) { armedSlot = i; beep(300, 0.09, "square", 0.05); }
        } else {
          armedSlot = -1;
          if (careers[i]) {
            useCareer(i);
            beep(660, 0.1, "sine", 0.05);
            resumeCareer(); return;
          }
          newSeason(i);
          beep(760, 0.12, "sine", 0.05);
          go(State.GRID); return;
        }
      } else if (e.key === "Escape" || confirm) { armedSlot = -1; go(State.MENU); return; }
      // The other half of the arm: race over the top of it rather than empty it.
      // Deliberately not the plain number — that plays the slot, and arming one
      // by accident must never be one careless keystroke away from wiping it.
      else if (k === "n" && armedSlot >= 0) {
        const i = armedSlot;
        armedSlot = -1;
        newSeason(i);
        beep(760, 0.12, "sine", 0.05);
        go(State.GRID); return;
      }
      // Writing the file out is safe and needs no confirming — it reads
      // storage and touches nothing.
      else if (k === "e") {
        armedSlot = -1;
        transferMsg = exportSave();
        beep(transferMsg.bad ? 200 : 720, 0.1, transferMsg.bad ? "sawtooth" : "sine", 0.05);
      }
      // Reading one in is not. The first I picks a file and says what is in
      // it; the second, with that still held, lets it replace all six slots.
      else if (k === "i") {
        armedSlot = -1;
        if (pending) {
          transferMsg = applySave(pending.keys);
          beep(transferMsg.bad ? 200 : 660, 0.12, transferMsg.bad ? "sawtooth" : "sine", 0.05);
        } else {
          pickSaveFile(res => {
            if (res.bad) transferMsg = res;
            else { pendingSave = res; transferMsg = null; beep(300, 0.09, "square", 0.05); }
            drawScreen();
          });
          transferMsg = { text: "Choose a save file…" };
        }
      }
      else armedSlot = -1;          // any other key changes its mind
      drawScreen();
      break;
    }

    case State.SETTINGS: {
      // Same idiom as the development window: the number picks the row, and
      // SHIFT walks the options backwards.
      //
      // Read off e.code, not e.key. Holding shift changes what the key REPORTS
      // — shift+1 arrives as "!" on a US layout and something else again
      // elsewhere — so testing e.key === "1" means the shifted form matches
      // nothing and "SHIFT to go back" silently does nothing at all. e.code is
      // the physical key and is the same on every layout.
      const dir = e.shiftKey ? -1 : 1;
      const digit = /^(Digit|Numpad)([1-9])$/.exec(e.code);
      const n = digit ? +digit[2] : 0;
      if (n === 1) cycleLength(dir);
      else if (n === 2) cycleQualiMode(dir);
      else if (n === 3) cycleQualiTime(dir);
      else if (n === 4) toggleFormation();
      // The slider clamps at both ends rather than wrapping — walking off the
      // top and landing on Rookie is not what anyone pressing it meant.
      else if (n === 5) cycleAiLevel(dir);
      else if (e.key === "ArrowRight") cycleAiLevel(1);
      else if (e.key === "ArrowLeft")  cycleAiLevel(-1);
      else if (confirm || e.key === "Escape") { go(settingsFrom); return; }
      else break;
      beep(560, 0.07, "sine", 0.04);
      drawScreen();
      break;
    }

    case State.QUALI:
      // Not SPACE — that is the DRS key and you need it out there. Not ENTER
      // either, which books a pit stop in a race: ending your session by muscle
      // memory would be a cruel way to lose a lap. X, and it says so on screen.
      if (k === "p" || e.key === "Escape") { pausedFrom = State.QUALI; go(State.PAUSED); }
      else if (k === "x") skipSegment();
      break;

    case State.QUALIRES:
      if (confirm) advanceQuali();
      // Once the grid is set the race can be handed over without driving it.
      else if (k === "s" && qual.grid) { setupRace(); state = State.RACING; simulateRace(); }
      // Offered here as well as on the grid screen, because where you have
      // qualified is exactly the thing that ought to change the answer.
      else if (k === "c" && qual.grid && playerSeated()) {
        cycleStartTyre(e.shiftKey ? -1 : 1);
        beep(520, 0.07, "sine", 0.04);
        drawScreen();
      }
      break;

    case State.FORMATION:
      // Skipping the formation lap puts everyone straight onto the grid it was
      // going to deliver them to, so it cannot be used to gain anything.
      if (confirm || e.key === "Escape") endFormation();
      break;

    case State.MENU:
      // SPACE starts a championship in the first free slot. With all six full it
      // opens the browser instead of quietly overwriting one — which is where you
      // pick the slot to race over, deliberately, behind the arm.
      if (confirm) {
        if (firstFreeSlot() < 0) { armedSlot = -1; go(State.CAREERS); }
        else { newSeason(); go(State.GRID); }
      }
      else if (k === "o") { settingsFrom = State.MENU; go(State.SETTINGS); }
      else if (k === "c") { armedSlot = -1; go(State.CAREERS); }
      // R picks up the most recently played career without a detour through the
      // browser — the common case is carrying on with the one you were on.
      // A season resumed at exactly the point a review or a window fell due
      // gets that, not the next grid — see resumeCareer().
      else if (k === "r") {
        const i = lastPlayed();
        if (i >= 0 && useCareer(i)) resumeCareer();
      }
      else if (k === "g") go(State.GARAGE);
      // The honours board and the reel library are full-game screens. In a demo
      // build the render blocks behind them have been cut out of the file
      // altogether, so these two keys must not be able to reach them — and
      // there is nothing for them to show in any case: no demo career can
      // finish, and the demo does not keep reels.
      else if (k === "h" && !DEMO) go(State.HALL);
      else if (k === "l" && !DEMO) { armedSlot = -1; reelsFrom = State.MENU; go(State.REELS); }
      break;

    case State.GARAGE:
      // Leaving is the only thing that commits: a name left empty while typing
      // falls back to the factory one rather than shipping a blank car.
      if (confirm || e.key === "Escape") { normaliseLivery(); go(State.MENU); }
      else if (k === "r") { resetLivery(); drawScreen(); beep(300, 0.09, "sine", 0.04); }
      break;
    case State.GRID:
      // Qualifying comes first unless it has been turned off, and it is what
      // sets the grid the race then starts from.
      //
      // Unless you are not in it. A driver without a seat still has to sit
      // through the season that carries on without him: the round is run in
      // full by the same code, and he reads the result like everybody else.
      if (confirm) {
        if (!playerSeated()) simulateWeekend();
        else if (qualiMode === "off") beginRace();
        else startQuali();
      }
      else if (k === "s") simulateWeekend();
      else if (k === "o") { settingsFrom = State.GRID; go(State.SETTINGS); }
      // The tyre you start on. Only worth offering to somebody who has a car.
      else if (k === "c" && playerSeated()) {
        cycleStartTyre(e.shiftKey ? -1 : 1);
        beep(520, 0.07, "sine", 0.04);
        drawScreen();
      }
      break;
    case State.RACING:
      // Deliberately not pausable during the countdown — resuming would jump
      // straight to RACING with the start sequence half-run.
      if (k === "p" || e.key === "Escape") { pausedFrom = State.RACING; go(State.PAUSED); }
      else if (e.key === "Enter") {
        const you = cars.find(c => c.isPlayer);
        if (you && !you.finished && !you.inPit) {
          you.pitArmed = !you.pitArmed;
          beep(you.pitArmed ? 620 : 360, 0.08, "sine", 0.045);
        }
      }
      // Which set the crew has ready. Changeable right up to the moment the car
      // turns into the lane, because that is when enterPitLane reads it — so a
      // stop booked three laps ago can still be re-thought on the way in.
      else if (k === "c") {
        const you = cars.find(c => c.isPlayer);
        if (you && !you.finished && !you.inPit) {
          cycleNextTyre(e.shiftKey ? -1 : 1);
          beep(520, 0.07, "sine", 0.04);
        }
      }
      break;
    case State.PAUSED:
      // Back to whichever session was paused — pausing a qualifying segment and
      // resuming into a race that has not started yet would be a fine bug.
      if (k === "p" || e.key === "Escape") go(pausedFrom);
      else if (k === "r") { if (pausedFrom === State.QUALI) startSegment(); else beginRace(); }
      // Hand the rest of the race over from wherever you have got to. Your
      // position, damage, tyres and pit strategy all carry in — it picks up the
      // race you are actually having, not a fresh one.
      else if (k === "s" && pausedFrom === State.RACING) { go(State.RACING); simulateRace(); }
      else if (k === "q") { stopEngine(); qual = null; go(State.MENU); }
      break;
    case State.COOLDOWN:
      if (confirm) endCooldown();
      break;

    case State.RESULT:
      // The reel is watchable here and only here without a detour, because
      // here is where you have just finished the race it is of. With nothing
      // fresh to watch, V falls through to everything saved rather than beeping.
      /* Highlights are a full-game feature. Behind one guard and in their own
         function rather than three `&& !DEMO` conditions inline, because a
         demo build does not merely ignore these keys — build-demo.js deletes
         the reel and replay screens, and then everything left unreferenced
         behind them. An inline condition still counts as a reference and
         would pin the whole replay system into a build that cannot reach it. */
      if (!DEMO && resultReelKeys(k)) return;
      if (confirm) { reelSaveNote = ""; advanceAfterRace(); }
      break;

    case State.REVIEW:
      if (confirm) {
        lastReview = null;
        closeReview();
        // In the demo the review is the second-to-last thing there is, and
        // closeReview() has just rolled the block on — so ask the demo, whose
        // question is "has the factory run", not "is a window due".
        if (DEMO) { goDemoEnding(); return; }
        // The review is where a career can end: a driver with no seat and no
        // season left has nowhere else to go.
        if (devWindowOwed()) openDevWindow();
        else if (offerInviteIfEarned()) { /* the invitation screen has it */ }
        else go(State.GRID);
      }
      break;

    case State.MARKET:
      // 1-3 sign for one of the seats on the table; SPACE stays put, or
      // accepts that nothing is on the table at all.
      if (e.key >= "1" && e.key <= "3" && career.offers && career.offers[+e.key - 1]) {
        signOffer(+e.key - 1);
      } else if (confirm) {
        const me = playerPerson();
        career.offers = null;
        saveSeason();
        // Starting a season with no drive is the end of the career — this is
        // the "sacked and nobody came" ending, and it is checked here because
        // here is the moment it becomes true.
        if (!me || me.seat < 0) { endDriverCareer(me, CAREER_END.dropped); go(State.OVER); }
        else go(State.GRID);
      }
      break;

    case State.INVITE:
      if (confirm) {
        const inv = pendingInvite; pendingInvite = null; answerElite(true);
        startElite(inv);
        // An event the player is not in still gets raced — by the drivers who
        // were invited, with the same code, and the player reads the result.
        if (!inv.playerIn) { go(State.RACING); simulateRace(); }
      }
      else if (k === "x") { pendingInvite = null; answerElite(false); go(State.GRID); }
      break;

    case State.OVER:
      if (confirm) go(State.HALL);
      else if (k === "c") { armedSlot = -1; go(State.CAREERS); }
      break;

    case State.HALL:
      if (confirm || k === "q" || e.key === "Escape") go(career && career.ended ? State.OVER : State.MENU);
      break;

    case State.REELS: {
      // Same idiom as the career browser: the number plays it, SHIFT arms it,
      // SHIFT again deletes it. Read off e.code so a shifted digit still
      // matches — see the settings screen for why.
      const list = reelList();
      const d = /^(Digit|Numpad)([1-9])$/.exec(e.code);
      const i = d ? +d[2] - 1 : -1;
      if (i >= 0 && i < list.length) {
        const live = reelWatchable(reel) && !reelIsSaved(reel) ? reel : null;
        const savedIdx = live ? i - 1 : i;
        if (e.shiftKey) {
          // The reel still only in memory has nothing to delete — it goes when
          // the next race starts whatever anybody presses.
          if (savedIdx < 0) { beep(240, 0.08, "sine", 0.04); }
          else if (armedSlot === i) { reelDelete(savedIdx); armedSlot = -1; beep(200, 0.2, "sawtooth", 0.05); }
          else { armedSlot = i; beep(300, 0.09, "square", 0.05); }
        } else {
          armedSlot = -1;
          reelSaveNote = "";
          if (repEnter(list[i], 0, State.REELS)) return;
          beep(240, 0.08, "sine", 0.04);
        }
      }
      else if (k === "s") { armedSlot = -1; keepReel(); }
      else if (e.key === "Escape" || k === "q" || confirm) { armedSlot = -1; reelSaveNote = ""; go(reelsFrom); return; }
      else armedSlot = -1;
      drawScreen();
      break;
    }

    case State.REPLAY:
      if (!rep) break;
      /* A recording is the reel playing straight through from the top, and
         every key here would change what the film shows — pausing it, skipping
         a moment, moving the camera, running it at half speed. So while one is
         running there are two keys: stop, and stop. Both keep what has been
         filmed so far. */
      if (repRec) {
        if (e.key === "Escape" || k === "q" || k === "d") repRecordStop(true);
        else beep(240, 0.07, "sine", 0.04);
        break;
      }
      if (k === "d") { repRecordStart(); break; }
      if (e.key === " " || e.key === "Spacebar") { rep.playing = !rep.playing; beep(rep.playing ? 620 : 420, 0.05, "sine", 0.035); }
      else if (e.key === "ArrowRight") repStep(1);
      else if (e.key === "ArrowLeft")  repStep(-1);
      else if (k === "f") repCycleFollow();
      else if (k === "x") repCycleSpeed();
      else if (k === "r") { rep.t = 0; rep.playing = true; beep(560, 0.05, "sine", 0.035); }
      else if (e.key === "Escape" || k === "q" || e.key === "Enter") { repExit(); return; }
      break;

    case State.DEV:
      if (devPhase === "choose") {
        // 1-8 fund a project, X clears the board, SPACE commits the lot.
        if (e.key >= "1" && e.key <= String(Math.min(9, PROJECTS.length))) devToggle(Number(e.key) - 1);
        else if (k === "x") { devPicks.clear(); beep(300, 0.07, "sine", 0.04); drawScreen(); }
        else if (confirm) commitDevWindow();
      } else if (confirm) {
        // Reading the factory result is the last thing the demo asks of
        // anybody. There is no round seven to send them to.
        if (DEMO) { go(State.DEMOEND); break; }
        if (!offerInviteIfEarned()) go(State.GRID);
      }
      break;

    /* The demo's last screen, and the only key on it. SPACE deals a fresh demo
       career INTO THE SAME SLOT rather than the first free one: a player who
       replays the demo four times should not find all six career slots used up
       and the next SPACE silently diverting them to the browser.

       Nothing here leaves the game. The full version is not for sale yet, so
       the screen makes no promise a link would have to keep. */
    case State.DEMOEND:
      if (confirm) { newSeason(activeCareer); go(State.GRID); }
      break;

    case State.CHAMPION:
      // A finished season rolls into the next year of the same career: the
      // roster ages, the market moves, and only then does the player choose.
      // A career that has run its twenty years ends here instead.
      if (confirm || k === "r") {
        rolloverSeason();
        if (career.ended) go(State.OVER);
        else go(State.MARKET);
      }
      else if (k === "c") { armedSlot = -1; go(State.CAREERS); }
      // Twenty years is a long time to be told you have to keep going. From
      // five seasons in, walking away is allowed, and it counts as a full
      // career rather than as having been thrown out of one.
      else if (k === "x" && career && career.seasons >= 4) {
        const me = playerPerson();
        endDriverCareer(me, CAREER_END.full);
        go(State.OVER);
      }
      break;
  }
});
addEventListener("keyup", (e) => keys.delete(e.key));

// Switchable anywhere, including mid-race — the circuit you cannot get round
// is the one you need it on, and being sent back to the menu to say so is no
// help. Nothing here touches car state, so a race survives the switch.
function toggleMode() {
  setMode(assisted() ? "pro" : "semi");
  beep(assisted() ? 520 : 700, 0.1, "sine", 0.05);
  if (state === State.RACING || state === State.COOLDOWN) {
    radio(assisted() ? "Assists on — we'll help you through the corners."
                     : "Assists off. It's all yours.", 3.5, 2);
  }
  // Repaint the badge from the countdown on, not just while racing — updateHud
  // does not run every frame during COUNT, so it would otherwise sit stale.
  if (track && cars.length) updateHud();
  if (state === State.RACING) hud.classList.add("on");
  drawScreen();
}

function toggleMute() {
  muted = !muted;
  if (engine && actx) engine.g.gain.setTargetAtTime(muted ? 0 : 0.032, actx.currentTime, 0.05);
  // M is the one kill switch for sound — it takes the pit wall with it, but
  // leaves the V preference alone so unmuting restores whatever it was.
  if (muted) shutUp();
  if (state === State.RACING) hud.classList.add("on");
  updateVoiceBadge();
  drawScreen();
}

/* =========================================================================
   Progress along the lap
   ========================================================================= */
function updateProgress(car) {
  const M = track.M, pts = track.pts;
  let bi = car.si, bd = Infinity;
  // Windowed search: a car covers at most ~15 units per frame, so ±10/+45
  // samples (about 330 units) can never be outrun.
  for (let k = -10; k <= 45; k++) {
    const i = ((car.si + k) % M + M) % M;
    const p = pts[i];
    const d = (p.x - car.x) ** 2 + (p.y - car.y) ** 2;
    if (d < bd) { bd = d; bi = i; }
  }
  let d = bi - car.si;
  if (d >  M / 2) d -= M;
  if (d < -M / 2) d += M;
  car.prog += d;
  car.si = bi;

  const a = pts[bi], b = pts[(bi + 1) % M];
  const abx = b.x - a.x, aby = b.y - a.y;
  const frac = clamp(((car.x - a.x) * abx + (car.y - a.y) * aby) / (abx * abx + aby * aby || 1), 0, 1);
  car.progF = car.prog + frac;

  const laps = Math.floor(car.prog / M);
  if (laps > car.lapsDone) {
    const wasStart = car.lapsDone < 0;
    car.lapsDone = laps;
    if (!wasStart) {
      car.lastLap = raceTime - car.lapStart;
      if (car.bestLap == null || car.lastLap < car.bestLap) car.bestLap = car.lastLap;
      if (car.isPlayer) {
        const cn = track.circuit.name;
        if (bestLaps[cn] == null || car.lastLap < bestLaps[cn]) {
          bestLaps[cn] = car.lastLap;
          store.set(K_LAPS, bestLaps);
          el.best.textContent = fmtTime(car.lastLap);
          beep(880, 0.12, "sine", 0.05, 1320);
        }
      }
    }
    car.lapStart = raceTime;
    if (session !== "race") {         // qualifying: no stops, and no finish line
      // A fresh roll for the lap just begun. wasStart is the out lap crossing —
      // the flying laps start counting from zero there, not from one.
      car.qFly = wasStart ? 0 : car.qFly + 1;
      if (!car.isPlayer) rollQualiLap(car);
      return;
    }
    // A stop-go not served inside its window ends the race here. Checked at the
    // line because the deadline is quoted in laps, and checked BEFORE the stop
    // is taken so the last lap it could have been served on still counts —
    // otherwise a car diving into the lane on the deadline lap is black-flagged
    // on the way in for a penalty it is in the act of serving.
    checkBlackFlag(car);
    if (car.out) return;
    // A booked stop is served the moment you cross the line — never on the last lap.
    if (car.pitArmed && !wasStart && car.lapsDone < raceLaps()) {
      car.pitArmed = false;
      enterPitLane(car);
    }
    if (car.lapsDone >= raceLaps() && !car.finished) {
      car.finished = true;
      car.finishTime = raceTime;
      finishOrder.push(car.id);
      // The winner taking the flag. Not the same moment as the race ending —
      // the race ends when the PLAYER crosses the line, which from eighth is
      // most of a lap later, and both are worth having.
      if (finishOrder.length === 1) reelMoment("flag", car.id, -1, 0);
      if (car.isPlayer) finishRace();
    }
  }
}

/* =========================================================================
   Controls -> {throttle, brake, steer, boost}
   ========================================================================= */
function playerControls(car) {
  let steer = 0;
  if (held("ArrowLeft", "a", "A"))  steer -= 1;
  if (held("ArrowRight", "d", "D")) steer += 1;
  const throttle = held("ArrowUp", "w", "W") ? 1 : 0;
  const brake    = held("ArrowDown", "s", "S") ? 1 : 0;
  const boost    = held(" ") && car.drsArmed && car.boost > 1 && throttle > 0;

  // Less lock the faster you are going, so a held key is a corner rather than a
  // spin. Below steerCapFrom nothing is taken away, which keeps the hairpins
  // and the pit lane exactly as steerable as they were.
  const sp = Math.abs(forwardSpeed(car));
  const t  = clamp((sp - CONFIG.steerCapFrom) / (CONFIG.maxSpeed - CONFIG.steerCapFrom), 0, 1);
  steer *= lerp(CONFIG.steerCapLow, CONFIG.steerCapHigh, t);

  // Winding lock on is deliberate; taking it off is immediate — letting go of
  // the key should straighten the car up at once.
  const rate = steer === 0 ? CONFIG.steerOffRate : CONFIG.steerOnRate;
  const ctrl = { throttle, brake, steer, boost, steerRate: rate };
  return assisted() ? applyAssist(car, ctrl) : ctrl;
}

/* --- Semi-Pro assists ------------------------------------------------------
   Shapes the player's request before it reaches the physics; it never touches
   grip, brakes or engine, so a lap set in Semi-Pro is set in the same car.

   Steering is ADDITIVE, not a blend toward the AI's line. Adding the
   correction means holding the right key already gives you the corner and the
   assist has nothing left to give (the clamp eats it), while holding the wrong
   one still leaves you 70% of full lock to run wide with — you are being
   caught, not driven. A lerp toward the AI's steer would do the opposite: it
   would fight you hardest exactly when you were already correct.
   ------------------------------------------------------------------------ */
/* Everything that stands between the grip-limited ceiling and the speed THIS
   car actually carries: the difficulty, the driver, what the factory has built
   him, how worn the tyres are and what compound they are. Multiply vmax by this
   and you have the speed the car would be doing here with nothing wrong.

   Pulled out of aiControls, which is still its main caller, because the
   stewards need the identical number and the identical number is the point. A
   brake-check test is a comparison against what the car SHOULD be doing, so a
   second opinion about that would convict cars of the difference between two
   formulas. It is defined for the player too — `hand` is the one term that has
   to ask, since the handling bonus above Legend is the AI's alone — because the
   player can brake-check somebody just as easily and is judged for it the same.

   Deliberately NOT included: qualifying's per-lap roll, which is a race-free
   concept and the stewards are race-only; and every transient that the stewards
   are trying to DETECT — the safety-car cap, blue-flag and team-order lifts,
   running off the road, and the mistakes. Those belong to aiControls alone. Put
   any of them in here and the reference would move with the event, so a car
   lifting would look like a car doing exactly what it meant to. */
function paceFactor(car) {
  const hand = car.isPlayer ? 1 : handMul();
  return track.pace * paceMul() * hand * car.skill * dev(car.team).aero
       * (0.84 + 0.16 * car.tyre)                 // worn tyres, slower corners
       * compoundBy(car.compound).grip;           // ...and so does the rubber it chose
}

/* The speed this car is trying to carry right now — vmax a short way up the
   road, at this car's own pace. The AI's target, in other words, and the AI is
   the main caller; the stewards ask the same question of any car, the player
   included, because it is the only honest reference for "slower than it should
   be". Two attempts at the brake-check rule failed on a worse one:

     - track.vmax itself. That is the grip-limited ceiling, and the field runs
       well under it by design, so every car reads as permanently too slow.
     - roadSafeSpeed, the braking-distance scan. That credits the full stopping
       distance to the corner, but the AI brakes off a SHORT lookahead and so
       commits far earlier than the physics demands — which puts a car below
       that reference for the whole of every ordinary braking zone, which is
       precisely the thing that had to be told apart from a brake-check.

   Against the target the car is steering to, the distinction is clean, and it
   is clean for the reason the rule needs: a car braking for a corner is ABOVE
   its target and closing on it — that is what braking is — where a car that
   lifts, locks up or loses an engine drops BELOW it. */
function paceWant(car, fwd) {
  const look = Math.round(CONFIG.aiLookBase + (Math.abs(fwd) * track.lookTime) / track.step);
  const idx = (car.si + Math.max(2, Math.round(look * 0.6))) % track.M;
  return track.vmax[idx] * paceFactor(car);
}

/* The fastest this car may be going right now and still make everything the
   road ahead demands — the brake point, in other words, expressed as a speed.

       allowed(i) = sqrt( vmax(i)^2 + 2 * brake * distance_to(i) )

   and the minimum across the window is the corner that asks for the earliest
   lift. Returns Infinity when nothing ahead needs slowing for at all.

   The driving assist is the only caller: it asks so it knows when to brake FOR
   the player, and `safetyFactor` is how much of the car's real stopping power
   it holds back so it commits early rather than late.

   The stewards' brake-check rule was written against this and it was the wrong
   reference — see paceWant, which is what it uses instead. Recorded here
   because the mistake is an easy one to make twice: this describes what the car
   COULD do, and almost every question about whether a car is driving oddly is a
   question about what it MEANT to do.

   `si` is where the car is, so this is measured from the CENTRELINE. A car
   taking a wide line is on a slightly different corner to the one this
   describes; it is accurate to within the width of the road. */
function roadSafeSpeed(car, fwd, safetyFactor) {
  const M = track.M;
  const bf = CONFIG.brakeForce * (car.fail && car.fail.brakes ? car.fail.brakes : 1)
           * safetyFactor;
  const horizon = Math.min(M - 1, Math.ceil((fwd * fwd) / (2 * bf * track.step)) + 3);
  let safe = Infinity;
  for (let i = 0; i <= horizon; i++) {
    const v = track.vmax[(car.si + i) % M];
    // vmax tops out at CONFIG.maxSpeed, but that is the *cornering* ceiling —
    // on a straight the car may legitimately do 290 on the boost. Treating a
    // straight as a 240 limit would have the assist braking against DRS the
    // whole way down every straight, so straights simply impose nothing.
    if (v >= CONFIG.maxSpeed * 0.99) continue;
    // One sample early on purpose. Credit the full distance to sample i and the
    // car is merely required to be at corner speed by the time it arrives *at*
    // i — which lets it sit a third over vmax all the way through a hairpin,
    // because each sample only ever has to slow down for the next one. Being
    // down to it a sample sooner is what actually holds the corner.
    const d = Math.max(0, (i - 1) * track.step);
    const allowed = Math.sqrt(v * v + 2 * bf * d);
    if (allowed < safe) safe = allowed;
  }
  return safe;
}

function applyAssist(car, ctrl) {
  const M = track.M, pts = track.pts;
  const fwd = forwardSpeed(car);

  // Reversing out of a barrier is a deliberate act — stay out of it.
  if (fwd < 1) return ctrl;

  const look = Math.round(CONFIG.aiLookBase + (Math.abs(fwd) * track.lookTime) / track.step);
  const lp = pts[(car.si + look) % M];
  const err = angDiff(Math.atan2(lp.y - car.y, lp.x - car.x), car.a);

  // Pointing far enough off line that the car is spinning or facing the wrong
  // way: hand it back rather than sawing at the wheel against the driver.
  if (Math.abs(err) < CONFIG.assist.steerGiveUp) {
    const corr = clamp(err * CONFIG.aiSteerGain, -1, 1);
    ctrl.steer = clamp(ctrl.steer + corr * CONFIG.assist.steerBlend, -1, 1);
    // A modest floor on the ramp rate so a save arrives in time, but nothing
    // like the "letting go" rate — winding lock on slowly is what stops the car
    // feeling nervous, and a nervous car is the problem being solved here.
    ctrl.steerRate = Math.max(ctrl.steerRate, CONFIG.assist.steerRateMin);
  }

  // Arrive at the corner at a speed the car can actually take. The scan itself
  // is roadSafeSpeed, which is only ever asked for here. The AI's
  // own lookahead would be no use for this: it is sized for a car already near
  // corner speed that only ever needs to trim a few km/h, where a player
  // arriving at a hairpin flat out needs the brake point, which is much further
  // back.
  //
  // The safety factor is the assist's alone: it holds a little of the car's
  // real stopping power back so it commits early rather than late.
  const safe = roadSafeSpeed(car, fwd, CONFIG.assist.brakeSafety);
  if (safe === Infinity) return ctrl;   // nothing ahead worth lifting for

  if (fwd > safe * CONFIG.assist.brakeFrom) {
    ctrl.throttle = 0;
    ctrl.brake = 1;
    ctrl.boost = false;
  } else if (fwd > safe * CONFIG.assist.liftFrom) {
    ctrl.throttle = Math.min(ctrl.throttle, CONFIG.assist.liftTo);
    ctrl.boost = false;
  }
  return ctrl;
}

function aiControls(car, dt) {
  const M = track.M, pts = track.pts;
  const fwd = forwardSpeed(car);

  /* How long this car has been going nowhere. The anchor moves whenever the car
     travels far enough from it, so `stillFor` is the AGE of the last real
     movement rather than a figure that only refreshes on a window boundary.
     A car that spent the last few seconds in the pit lane — where aiControls is
     not called at all — comes back miles from its anchor and resets on the
     first frame, so the count can never go stale across a stop. */
  const U = CONFIG.unstick;
  if (Math.hypot(car.x - car.stillX, car.y - car.stillY) > U.stillDist) {
    car.stillX = car.x; car.stillY = car.y; car.stillFor = 0;
  } else {
    car.stillFor += dt;
  }

  // --- mistakes ---
  car.errCool -= dt;
  if (car.errTimer > 0) {
    car.errTimer -= dt;
    if (car.errTimer <= 0) {
      car.errType = null; car.lockup = false; car.errLine = 0;
      car.errCool = 2.5 + Math.random() * 4;      // no chaining errors
    }
  } else if (!safety && car.errCool <= 0 && raceTime > CONFIG.mistakeQuiet && Math.abs(fwd) > 60) {
    // Nothing to make a mistake about at safety-car pace, and a car spinning
    // itself out of a queue it is not allowed to overtake in would read as a
    // bug rather than as drama.
    const cornerHeat = track.vmax[car.si] < CONFIG.maxSpeed * 0.8 ? CONFIG.errCornerHeat : 0.35;
    const risk = CONFIG.mistakeRate * car.mistake * aiLevel.err * cornerHeat
               * (1 + (1 - car.tyre) * CONFIG.errTyreHeat)
               * (1 + car.damage)
               * (car.pressured ? CONFIG.errPressHeat : 1);
    if (Math.random() < risk * dt) startMistake(car, fwd);
  }

  // Every sideways magnitude below is calibrated for a wide permanent circuit.
  // On a traced street track the tarmac is half as wide, so they all scale with
  // the room actually available — otherwise a "ran wide" is a guaranteed crash.
  const room = laneRoom(track), lane = room / LANE_REF;

  // occasional wobble, sized by how sloppy this driver is
  car.wobblePhase += dt * 0.8;
  const wobble = Math.sin(car.wobblePhase) * car.mistake * 9 * lane;

  // --- avoid the car in front rather than punting it ---
  // Awareness scales with speed: a fixed radius that is a comfortable warning
  // at 80 is a quarter of a second at 240.
  const reach = clamp(CONFIG.aiReachBase + Math.abs(fwd) * CONFIG.aiReachTime,
                      CONFIG.aiReachBase, CONFIG.aiReachMax);
  const cosA = Math.cos(car.a), sinA = Math.sin(car.a);
  // Width decides whether two cars fit side by side; length decides how close
  // one can sit behind another. On a car three times longer than it is wide
  // those are very different numbers, and using one for both either forbids
  // an overtake there was room for or allows a nose halfway into a gearbox.
  const carW = CONFIG.carHalfW * track.carScale * 2;
  const carL = CONFIG.carHalfL * track.carScale * 2;
  // The opening laps are where twenty-two cars are closest together and know
  // least about each other. Everybody wants more room and closes gaps more
  // gently for the first few seconds, easing back to normal rather than
  // switching, so there is no moment where the field suddenly gets braver.
  const opening = state === State.RACING
    ? clamp(1 - raceTime / CONFIG.contact.openingSecs, 0, 1) : 0;
  const sideRoom = CONFIG.aiSideRoom * lerp(1, CONFIG.contact.openingRoom, opening);
  const followGain = CONFIG.aiFollowGain * lerp(1, CONFIG.contact.openingPace, opening);
  let avoid = 0, blocked = 0, follow = Infinity;
  for (const o of cars) {
    // A car in the pit lane is not on the road. The lane runs alongside the
    // track well inside the new reach, so without this every car on the pit
    // straight would swerve around somebody serving a stop.
    if (o === car || o.gone || o.inPit) continue;
    const dx = o.x - car.x, dy = o.y - car.y;
    const dist = Math.hypot(dx, dy);
    if (dist > reach) continue;
    const ahead = dx * cosA + dy * sinA;
    if (ahead <= 4) continue;
    const side = dx * -sinA + dy * cosA;
    // You race everyone hard except the car painted the same colour: taking out
    // your own team-mate costs the team both scores, so they give each other
    // noticeably more room and back out of a move earlier.
    const mate = o.team === car.team ? CONFIG.mateRespect : 1;

    // Steering away from someone is still judged at close quarters — widening
    // it to the new reach would have twenty-two cars all leaning on each other
    // from half a straight away.
    if (dist <= 68) {
      const urgency = (1 - dist / 68) * mate;
      avoid += (side > 0 ? -1 : 1) * urgency * 26 * lane;
      if (Math.abs(side) < 15 * lane) blocked = Math.max(blocked, urgency);
    }

    // Genuinely in my path — measured against the same footprint the collision
    // capsule uses, so "can I fit alongside" has one answer in this game and
    // not two. Match speed rather than arrive at it.
    if (Math.abs(side) < carW * sideRoom * mate) {
      const theirs = o.vx * cosA + o.vy * sinA;     // their pace along my heading
      const room   = Math.max(0, ahead - carL * mate);
      follow = Math.min(follow, theirs + room * followGain);
    }
  }

  // stay on your own line, drifting toward the middle when clear
  // the error offset sits OUTSIDE the clamp on purpose — running wide has to be
  // able to put them on the grass, or it isn't a mistake
  // Under a team order — or a blue flag — off the racing line, to the side the
  // other car isn't. A blue flag moves a little further over than a favour for
  // a team-mate does, because it is not a favour.
  const yielding = car.blueTimer > 0 ? car.yieldSide * room * CONFIG.blue.lineFrac
                 : car.yieldTimer > 0 ? car.yieldSide * room * 0.8
                 : 0;

  car.lineTarget = clamp(avoid + wobble + yielding, -room, room)
                 + (car.errType === "wide" ? car.errLine : 0);
  car.line += (car.lineTarget - car.line) * (1 - Math.exp((car.errType ? -6 : -3.5) * dt));

  // --- where to point ---
  const look = Math.round(CONFIG.aiLookBase + (Math.abs(fwd) * track.lookTime) / track.step);
  const li = (car.si + look) % M;
  const lp = pts[li];
  const tx = lp.x + lp.nx * car.line, ty = lp.y + lp.ny * car.line;
  const want = Math.atan2(ty - car.y, tx - car.x);
  const err = angDiff(want, car.a);
  let steer = clamp(err * CONFIG.aiSteerGain, -1, 1);

  /* Wedged facing the wrong way — nosed into a barrier after a shunt. Reverse
     out rather than sitting there flooring it into the wall forever.

     Measured against the ROAD's own direction, not against the bearing to the
     aim point the steering uses. At a standstill that aim point sits about a
     car length away — which is to say inside the car — so the bearing to it
     swung between 80 and 105 degrees frame to frame while the car barely moved,
     and a test on it was reading its own noise. A track tangent is a property
     of the road and holds still.

     Everything else here is CONFIG.unstick: a car has to have stopped going
     anywhere before this will touch it, and once it has hold it lets go on a
     speed well clear of the one that engaged it, on the car pointing somewhere
     useful again, or on the clock — whichever comes first. */
  const roadErr = angDiff(pts[car.si].ang, car.a);
  const backOut = { throttle: 0, brake: 1, steer: clamp(-roadErr * 2, -1, 1), boost: false };
  if (car.revTimer > 0) {
    car.revTimer -= dt;
    if (Math.abs(fwd) >= U.release || Math.abs(roadErr) < U.errClear || car.revTimer <= 0) {
      car.revTimer = 0;
      car.revCool = U.cool;
    } else {
      return backOut;
    }
  } else if (car.revCool > 0) {
    car.revCool -= dt;
  } else if (Math.abs(fwd) < U.engage && Math.abs(roadErr) > U.err && car.stillFor >= U.stillWin) {
    car.revTimer = U.maxTime;
    return backOut;
  }

  // --- how fast to be there ---
  // vmax is a grip-limited ceiling, so a car with more downforce may sit above
  // it by exactly as much as its aero has improved — the same factor stepCar
  // is already giving the player through `grip`, applied to the AI's target so
  // the two never disagree about how quick the car is.
  // ...and above Legend, the same again for the extra grip stepCar is giving
  // this car, so the request and the machine stay the one story.
  let target = paceWant(car, fwd);
  // Qualifying: this lap's roll, so the field builds through the session instead
  // of circulating at one fixed speed and freezing the timesheet after lap one.
  if (session === "quali") target *= car.qPace;
  // Under the safety car the ceiling is the whole story. Asked for here as
  // well as enforced in stepCar so the AI drives TO the queue rather than
  // being dragged back to it every frame with the throttle still pinned.
  if (safety) target = Math.min(target, safetyCap(car));
  // Never ask for more speed than the car in front leaves room for. The floor
  // is a backstop only: something stopped dead in the middle of the road would
  // otherwise drag the entire field to a halt behind it rather than have them
  // steer around it, which is what `avoid` is for.
  // Recorded as well as applied: a car slowed by the one in front is slowed for
  // a real reason, and the stewards want to be able to say so.
  car.followBound = follow < target;
  if (follow < target) target = Math.max(follow, target * CONFIG.aiFollowFloor);
  if (car.offTrack) target *= 0.6;
  if (car.yieldTimer > 0) target *= CONFIG.orderYieldPace;   // easing off to be passed
  else if (car.blueTimer > 0) target *= CONFIG.blue.pace;    // ...and the same under blue flags

  let throttle = 0, brake = 0;
  if (fwd < target - 5) throttle = 1;
  else if (fwd > target + 8) brake = 1;
  else throttle = 0.4;

  if (car.errType === "lock")      { throttle = 0; brake = 1; steer *= 0.18; }
  else if (car.errType === "slow")  { if (fwd > target * 0.72) { throttle = 0; brake = 1; } else throttle = 0.3; }
  else if (car.errType === "spin")  { throttle = 0.2; brake = 0; steer = car.errDir; }

  // Same DRS rule as the player — drsArmed already says "in a zone, and
  // detected" — so the only thing left to decide is whether the AI bothers.
  // The throttle test keeps it honest through the quick corners a zone can
  // cover: a car already at its cornering ceiling is not asking for full
  // throttle, so it does not open the wing there either.
  const boost = !safety && !car.errType && car.yieldTimer <= 0 && car.blueTimer <= 0 && car.drsArmed &&
                car.boost > 30 && throttle > 0.9 &&
                Math.random() < 0.55 + car.aggro * 0.45;

  // Book a stop once the tyres are gone, if there is enough race left to profit.
  // Not capped at one stop any more: at Full distance a set of tyres does not
  // come close to lasting, and a field that could only ever stop once would be
  // crawling round on the rims by the flag. The tyres themselves do the
  // limiting — a stop puts a fresh set on, so this cannot fire again until
  // they are worn out all over again.
  // Under the safety car the lane is nearly free, so a car takes a stop it
  // would otherwise have put off for several laps. This is the stampede, and
  // it is the moment a race turns over — half the field diving in at once, and
  // whoever guessed wrong coming out behind cars they were comfortably ahead of.
  const boxAt = safety ? Math.max(car.pitTyre, car.scPitTyre) : car.pitTyre;
  if (session === "race" && !car.pitArmed && car.tyre < boxAt &&
      car.lapsDone >= 0 && (raceLaps() - car.lapsDone) >= 2) {
    car.pitArmed = true;
  }

  // A penalty owed is served at the first opportunity — there is nothing to be
  // won by sitting on it and a black flag to be lost, so the AI never gambles
  // on the deadline the way a player might. It overrides nothing: enterPitLane
  // decides what a visit is for, and a car that wanted tyres gets the penalty
  // instead and works the tyres out again next time round.
  if (session === "race" && car.stopGo && !car.inPit) car.pitArmed = true;

  return { throttle, brake, steer, boost };
}

/* =========================================================================
   Physics — shared by player and AI so nobody is cheating
   ========================================================================= */
function forwardSpeed(car) { return car.vx * Math.cos(car.a) + car.vy * Math.sin(car.a); }

function stepCar(car, ctrl, dt) {
  const s = track.pts[car.si];
  const lateralPos = (car.x - s.x) * s.nx + (car.y - s.y) * s.ny;
  // +3 of grace so clipping a kerb isn't punished like putting two wheels on grass
  car.offTrack = Math.abs(lateralPos) > track.halfWidth + 3;

  // smooth the steering input so a tap isn't a snap. A controller may ask for
  // its own rate — the keyboard does, the AI doesn't.
  const steerRate = ctrl.steerRate || CONFIG.steerLerp;
  car.steer += (ctrl.steer - car.steer) * (1 - Math.exp(-steerRate * dt));

  const ca = Math.cos(car.a), sa = Math.sin(car.a);
  let fwd = car.vx * ca + car.vy * sa;
  let lat = car.vx * -sa + car.vy * ca;
  const fwd0 = fwd;    // speed before the driving — the brake-check test reads it

  // Whatever the factory has managed to do to this car since round one. Every
  // development project lands somewhere in the next forty lines and nowhere
  // else, so an upgrade can only ever change the car the way the simulation
  // already knows how to.
  const D = dev(car.team);
  // The opponent-skill handling bonus, above Legend only, and never the player's.
  // It lands in the two places that decide a corner speed — how fast the car can
  // yaw and how well it holds the line — because those are the two limits vmax
  // itself is built from, and aiControls asks for exactly this much more.
  const hand = car.isPlayer ? 1 : handMul();

  // accelerate / brake
  const boosting = !!ctrl.boost && car.boost > 0;
  car.boosting = boosting;
  let accel = CONFIG.accel * D.power, drag = CONFIG.drag;
  if (boosting) { accel *= CONFIG.boostAccelMul; drag *= CONFIG.boostDragMul; }
  if (car.offTrack) { accel *= CONFIG.offAccelMul; drag *= CONFIG.offDragMul; }
  accel *= 1 - CONFIG.damageAccelLoss * car.damage;   // a bent car is a slow car
  if (car.fail && car.fail.power) accel *= car.fail.power;   // ...and a sick one slower still

  fwd += ctrl.throttle * accel * dt;
  if (ctrl.brake) {
    const bf = CONFIG.brakeForce * D.brakes * (car.fail && car.fail.brakes ? car.fail.brakes : 1);
    if (fwd > 0) fwd = Math.max(0, fwd - bf * dt);
    else fwd = Math.max(-CONFIG.reverseSpeed, fwd - CONFIG.accel * 0.6 * dt);
  }
  fwd *= Math.exp(-drag * dt);

  // Safety car. Applied HERE, in the one function the player and the AI both
  // go through, so "nobody can pass" is a property of the physics rather than
  // a rule the AI is trusted to keep and the human is politely asked to. Eased
  // down at braking rate instead of clamped, or the moment of deployment would
  // be a wall rather than a lift.
  const scCap = safetyCap(car);
  if (fwd > scCap) fwd = Math.max(scCap, fwd - CONFIG.brakeForce * 0.55 * dt);

  // steering: yaw scales with speed, then falls off again so it stays stable flat out
  const sp = Math.abs(fwd);
  const turnScale = Math.min(1, sp / 55) * (1 - CONFIG.turnFalloff * Math.min(1, sp / CONFIG.maxSpeed));
  const tyreTurn = CONFIG.tyreTurnFloor + (1 - CONFIG.tyreTurnFloor) * car.tyre;
  car.a += car.steer * CONFIG.turnRate * hand * tyreTurn * turnScale * dt * (fwd < -1 ? -1 : 1);

  // grip converts the slide back into forward motion — and worn tyres do it
  // worse. The compound scales the whole curve rather than the floor, so a
  // soft is better than a medium when it is new AND when it is ruined; what
  // it does not do is stay new for as long.
  const cmp = compoundBy(car.compound);
  const tyreGrip = (CONFIG.tyreGripFloor + (1 - CONFIG.tyreGripFloor) * car.tyre) * cmp.grip;
  // Downforce is grip: the aero project lands here, where it is worth exactly
  // as much to a human as it is to the AI chasing the same speed profile.
  let grip = (car.offTrack ? CONFIG.gripOff : CONFIG.gripOn) * tyreGrip * D.aero * hand;
  if (car.fail && car.fail.grip) grip *= car.fail.grip;   // a deflating tyre finds no purchase
  if (car.lockup) grip *= 0.30;          // locked wheels do not steer
  const latBefore = lat;
  lat *= Math.exp(-grip * dt);
  car.slipTimer = Math.abs(latBefore);

  // Tyres wear from sliding, not from distance. Drive smoothly and they last.
  // The tyre programme scales the whole rate, grass included — the point of it
  // is a car that is kinder to its rubber wherever the rubber happens to be.
  // The compound scales the whole rate the same way the tyre programme does —
  // grass included, because a soft dragged through the runoff should not
  // survive it any better than it survives the road.
  // ...but NOT in qualifying. The rate is calibrated against a race distance,
  // and a segment is a run on fresh rubber rather than a stint: left switched on
  // it took a set from full to a fifth of its life inside one sixty-second Q1,
  // which is about seven percent of pace. That made every lap slower than the
  // one before it — so the first flying lap was always the quickest, nobody
  // could ever improve, and whoever went fastest first had pole for the session.
  // updateQuali switches off failures, stops and team orders for exactly this
  // reason; wear belonged on that list and was missed.
  const wear = session !== "race" ? 0
             : (CONFIG.tyreWearBase
             + CONFIG.tyreWearSlip * Math.abs(latBefore)
             + (car.offTrack ? CONFIG.tyreWearOff : 0)) * D.tyres * cmp.wear
             * (safety ? CONFIG.safety.wear : 1);
  car.tyre = Math.max(CONFIG.tyreMin, car.tyre - wear * dt);

  /* Braking the road did not ask for — the stewards' brake-check rule, and the
     one place in the file where it can be measured honestly.

     It is done HERE, inside the physics, because `fwd` at the top of this
     function and `fwd` now differ by exactly what the driving did to the car
     and by nothing else. Take the same difference outside stepCar and it would
     include the collision impulse, which is the one contribution that must not
     count: a car rear-ended hard decelerates violently, and reading that as
     braking would let a car earn this excuse FROM the shunt it is being judged
     for, retrospectively, at the moment the judging happens.

     The road test is asked second and only of a car already braking hard,
     because it is a loop over the braking distance and the cheap half of the
     condition throws out all but a handful of frames before it runs.

     The reference is paceWant — the speed the car is steering to — and getting
     that reference wrong is what broke the two attempts before this one. Both
     failed the same way and it is worth knowing the shape of it: measured
     against anything the car is normally UNDER, ordinary braking looks
     identical to a brake-check, the test fires on seven car-frames in ten, and
     the stewards quietly stop calling rear-ends at all. */
  const B = CONFIG.stewards.brakeCheck;
  if (car.oddBrake > 0) car.oddBrake -= dt;
  if (B.on) {
    const decel = (fwd0 - fwd) / dt;
    const want = paceWant(car, fwd);
    // Kept on the car so the harness can read the distribution back off a
    // finished race, the way penaltyLog keeps `rel` for the same reason.
    car.bcDecel = decel; car.bcRatio = fwd / want;
    if (decel >= B.decel && fwd < want * B.slack) {
      /* ...and WHY, which is wanted for two different reasons. The stewards say
         it on the radio, because a rule the player never hears is a rule he
         does not know he has — the same mistake the mode exemption made when
         penalties shipped invisible to the default player. And the harness
         reads it back to check the rule is firing on real events rather than on
         its own false positives, which is the only ground truth available: no
         headless run can be asked whether a call was FAIR, but it can be asked
         whether the car it excused was actually doing anything.

         `null` means nothing was wrong that this can name, and it is kept as an
         excuse rather than thrown out: a HUMAN brake-checking somebody has no
         cause flag to find — there is no errType on a player — so throwing the
         nameless case away would quietly exempt the player from the one version
         of this the player can actually commit on purpose. */
      const cause = car.errType ? "mistake"
                  : car.fail ? "failure"
                  : safety ? "safetycar"
                  : car.blueTimer > 0 ? "blue"
                  : car.yieldTimer > 0 ? "orders"
                  : car.offTrack ? "offtrack"
                  : car.followBound ? "traffic"
                  : null;

      /* ...except traffic, which is not abnormal braking at all and is the one
         cause that does NOT excuse the car behind. MEASURED: it was 40% of
         everything this rule waved away, which is what prompted looking at it.

         A car backing off behind another car is doing the most ordinary thing
         in racing, it is visible for as long as the queue has existed, and
         running into the back of a concertina is the textbook rear-end the
         stewards exist to call. Excusing it would have meant no penalty for
         following too closely anywhere in a queue — which is most of a lap at
         somewhere like the Red Bull Ring. The distinction the rule is drawing
         is between a car that slowed UNPREDICTABLY and a car that slowed for
         something the driver behind could see coming. */
      if (cause !== "traffic") { car.oddBrake = B.hold; car.oddCause = cause; }
    }
  }

  const ca2 = Math.cos(car.a), sa2 = Math.sin(car.a);
  car.vx = ca2 * fwd - sa2 * lat;
  car.vy = sa2 * fwd + ca2 * lat;

  car.x += car.vx * dt;
  car.y += car.vy * dt;

  // boost energy — the fuel efficiency drive spends it slower and recovers it
  // faster, which is the whole of what "efficient" means to a car with a
  // limited amount of energy and a straight to use it on
  if (boosting) car.boost = Math.max(0, car.boost - (CONFIG.boostDrain / D.boost) * dt);
  else car.boost = Math.min(CONFIG.boostMax, car.boost + CONFIG.boostRegen * D.boost * dt);

  // locked-up tyres make smoke, which is how the player reads the mistake
  if (car.lockup && sp > 50 && Math.random() < dt * 40) {
    addParticle(car.x - ca2 * 7, car.y - sa2 * 7, "#e6e9ee", 0.5, 4.0, 30);
  }

  // a damaged car trails smoke
  if (car.damage > 0.2 && Math.random() < dt * car.damage * 30) {
    addParticle(car.x - ca2 * 8, car.y - sa2 * 8, "#59616d", 0.7, 3.4, 35);
  }

  // dust off track, smoke under heavy slip
  if (car.offTrack && sp > 40 && Math.random() < dt * 26) {
    addParticle(car.x, car.y, "#c8b17a", 0.5, 3.5);
  } else if (Math.abs(latBefore) > 70 && Math.random() < dt * 18) {
    addParticle(car.x, car.y, "#d7dde6", 0.35, 3);
  }

  // skid marks for anyone sliding hard on tarmac
  if (!car.offTrack && (Math.abs(latBefore) > 62 || (car.lockup && sp > 50)) && marksCtx) {
    marksCtx.globalAlpha = 0.16;
    marksCtx.fillStyle = "#0c0f13";
    marksCtx.beginPath();
    const mk = track.pit.k;
    marksCtx.arc(car.x - ca2 * 6 * mk, car.y - sa2 * 6 * mk, 2.6 * mk, 0, TAU);
    marksCtx.fill();
    marksCtx.globalAlpha = 1;
  }
}

function barriers(car) {
  const s = track.pts[car.si];
  const lateral = (car.x - s.x) * s.nx + (car.y - s.y) * s.ny;
  const lim = track.halfWidth + track.runoff;
  if (Math.abs(lateral) <= lim) return;

  const sgn = Math.sign(lateral);
  const over = Math.abs(lateral) - lim;
  car.x -= s.nx * over * sgn;
  car.y -= s.ny * over * sgn;

  const vlat = car.vx * s.nx + car.vy * s.ny;
  // Damage comes from how hard you hit the wall square-on. Brushing it at a
  // shallow angle scrubs speed but shouldn't wreck the car.
  const impact = vlat * sgn > 0 ? Math.abs(vlat) : 0;
  if (vlat * sgn > 0) { car.vx -= s.nx * vlat * 1.35; car.vy -= s.ny * vlat * 1.35; }
  car.vx *= 0.70; car.vy *= 0.70;

  if (impact > 22) {
    car.damage = Math.min(CONFIG.damageMax, car.damage + impact * CONFIG.damagePerImpact * dmgMul(car));
    car.tyre = Math.max(CONFIG.tyreMin, car.tyre - impact * 0.0009);
    for (let i = 0; i < 5; i++) addParticle(car.x, car.y, "#ffd88a", 0.35, 2.5, 220);
    if (car.isPlayer) {
      shake = Math.min(1, shake + impact / 260);
      noiseHit(0.2, 0.09, 1100);
    }
    crashOut(car, impact);
  }
}

// Semi-Pro halves what an impact costs the player. The rivals are untouched —
// the assist is a concession to the keyboard, not a handicap on the field.
function dmgMul(car) {
  return car.isPlayer && assisted() ? CONFIG.assist.damageMul : 1;
}

// The two retirements you earn rather than draw: a shunt big enough to hurt
// the driver, or one more heavy hit on a car that is already at its limit.
function crashOut(car, impact) {
  if (car.out || state !== State.RACING) return;
  /* Semi-Pro protects the driver, not the car. A big enough shunt no longer
     hurts you on the assisted difficulty — a career should not end on a
     barrier while the game is holding the wheel — but a car already at maximum
     damage can still be finished off, and now is. The hit has to be harder
     than it would in Pro, and it takes twice as much abuse to get the car to
     the limit in the first place, so this is the end of a bad afternoon rather
     than the end of a good one. */
  const soft = car.isPlayer && assisted();
  if (!soft && impact > CONFIG.injuryImpact && Math.random() < CONFIG.injuryOdds) { retire(car, INJURY); return; }
  const wreckAt = CONFIG.wreckImpact * (soft ? CONFIG.assist.crashOutMul : 1);
  if (impact > wreckAt && car.damage >= CONFIG.damageMax * 0.995) retire(car, CRASH_OUT);
}

/* Two circles the width of the car, set far enough apart to span its length.
   A single circle cannot represent something three times longer than it is
   wide: sized to the length it forbids side-by-side racing on a road with
   room for three, and sized to the width it lets a car drive halfway into the
   gearbox in front. A capsule costs four distance checks per pair and gets
   both right — and it rotates with the car, so a sideways car is genuinely
   wider to hit than a straight one. */
function carNodes(car, k) {
  const off = (CONFIG.carHalfL - CONFIG.carHalfW) * k;
  const cx = Math.cos(car.a) * off, cy = Math.sin(car.a) * off;
  return [car.x + cx, car.y + cy, car.x - cx, car.y - cy];
}

/* =========================================================================
   THE STEWARDS

   Whether anybody is watching at all.

   SEMI-PRO IS POLICED. It was exempt when this shipped, on the reasoning that
   the stewards belonged with the rest of the assists — and that turned out to
   be the wrong call for a reason that had nothing to do with fairness: `mode`
   defaults to "semi", so the exemption meant the DEFAULT player never met the
   feature at all. An assist that helps you drive is not an argument for
   removing the consequences of driving badly, and Semi-Pro already protects
   what it means to protect (half damage, no injury). So the only exemption left
   is the difficulty one below.

   What IS exempt is anything below `fromLevel`. The low AI settings run into
   people as a feature — they lock up and run wide by design, see aiLevels.err —
   and penalising the player for that would be punishing him for the difficulty
   he chose. Qualifying is exempt too: `updateQuali` already switches off
   failures, stops and team orders because there is nothing to manage in a
   sixty-second segment, and blame belongs on that list.
   ========================================================================= */
function stewardsOn() {
  if (session !== "race") return false;
  const levels = CONFIG.aiLevels;
  return levels.indexOf(aiLevel) >= levels.findIndex(l => l.key === CONFIG.stewards.fromLevel);
}

/* Who caused it — or nobody, which has to be the commonest answer of the three
   or the feature is a nuisance. Called with the two cars and the closing speed
   the collision resolver just measured along the contact normal.

   The car BEHIND is the one with something to answer for in a rear-end, and
   working out which one that is has to be done on the ROAD, not on race
   progress. It used to read `a.progF <= b.progF`, which is right for a pair
   either side of the start line and wrong for a pair a lap apart: a lapped car
   has less progress than the car lapping it however far up the road it
   physically is, so a leader rear-ending a backmarker was judged as the
   backmarker rear-ending the leader, and the blame came out backwards. Whoever
   reaches the other first going forward is behind — true across the start line
   and true across a lap, which is the case this whole file cared about least
   until blue flags made it the common one. */
function judgeContact(a, b, rel) {
  const S = CONFIG.stewards;
  const speed = Math.abs(rel);
  if (speed < S.reviewFrom) return null;

  const chase = roadGap(a, b) <= roadGap(b, a) ? a : b;
  const lead  = chase === a ? b : a;

  // A car that cannot slow down or cannot turn is not being judged on its
  // driving — that is the car's fault, and it has already cost the driver a
  // retirement he did not earn either.
  const helpless = c => S.excuseFailed && c.fail &&
                        (c.fail.brakes !== undefined || c.fail.grip !== undefined);

  /* --- a car that was shown the flag and stayed there ---------------------
     This is checked BEFORE any of the geometry, and it overrules all of it.
     A car under a blue flag has been told the pass is coming and told which
     way to go; if it is still in the way when the two of them touch, the
     geometry of who hit whom is beside the point, and the ordinary rear-end
     test would hand the penalty to the car doing the lapping — which is the
     opposite of the answer. A driver whose car has stopped answering the
     controls is excused this as he is excused the rest. */
  if (CONFIG.blue.blame) {
    if (underBlue(a, b)) return helpless(a) ? null : a;
    if (underBlue(b, a)) return helpless(b) ? null : b;
  }

  /* --- the car in front braked for nothing the road asked for -------------
     Nobody is penalised. See CONFIG.stewards.brakeCheck for what counts and
     why the answer is "nobody" rather than the car in front.

     Placed AFTER the blue-flag test on purpose, and the order is load-bearing.
     A lapped car under blue lifts to be passed, which is odd braking by this
     test's definition — so asking this first would hand every lapped car an
     excuse and quietly undo the blue-flag rule, whose whole point is that the
     car in the way answers for being in the way. Blue decides first; this
     catches everything blue does not cover.

     Read off `lead` alone. The chasing car's own braking is not interesting:
     hard braking behind a car is what a driver is supposed to be doing. */
  if (S.brakeCheck.on && lead.oddBrake > 0) {
    lead.bcExcused.push({ cause: lead.oddCause, rel: Math.round(speed) });
    // Said only to the player, and only when he was the one who would have got
    // it. Being told "no further action" for a shunt two laps down the road
    // that never involved you is noise; being told it for the one you just had
    // is the difference between a rule and an absence of one.
    if (chase.isPlayer) {
      const why = { mistake: "he locked up in front of you", failure: "he's got a problem with that car",
                    safetycar: "the field was slowing for the safety car", blue: "he was moving over for the leaders",
                    orders: "he was letting his team-mate through", offtrack: "he'd run off the road",
                    traffic: "he was backing off behind traffic" }[lead.oddCause];
      radio(`No further action — ${why || `${lead.name} slowed in front of you`}.`, 4, 1);
    }
    return null;
  }

  // --- a plain rear-end -------------------------------------------------
  // Is the car it hit simply in front of it? One dot product: the chasing car's
  // heading against the direction to the other car.
  const dx = lead.x - chase.x, dy = lead.y - chase.y;
  const d = Math.hypot(dx, dy) || 1e-4;
  const align = (dx / d) * Math.cos(chase.a) + (dy / d) * Math.sin(chase.a);
  if (align >= S.noseCone) return helpless(chase) ? null : chase;

  /* --- side by side ------------------------------------------------------
     Neither is behind the other in any meaningful sense, so the question is
     who moved across. Measured against the TRACK normal and not against the
     cars' own headings, which matters more than it looks: in a corner both
     cars are turning and both have a large lateral velocity in their own
     frame, so judging on heading blames whoever is on the inside of every
     bend. Against the track normal, a car holding its line through a corner
     reads as zero. */
  const s = track.pts[chase.si];
  const across = c => c.vx * s.nx + c.vy * s.ny;      // speed ACROSS the ribbon
  const side = Math.sign((lead.x - chase.x) * s.nx + (lead.y - chase.y) * s.ny) || 1;
  const chaseInto = across(chase) * side;    // chasing car moving toward the other
  const leadInto  = -across(lead) * side;    // ...and the other moving back into it
  // Both went for the same piece of road: a racing incident, and nobody is
  // penalised for one.
  if (Math.abs(chaseInto - leadInto) < S.sideTol) return null;
  const off = chaseInto > leadInto ? chase : lead;
  return helpless(off) ? null : off;
}

/* The call itself. One incident produces one penalty however many frames the
   two cars spend inside each other. */
function stewardsCall(off, victim, rel) {
  const S = CONFIG.stewards;
  // The opening laps are not judged — see CONFIG.stewards.graceLaps. Placed
  // here rather than at the contact test so that everything else the collision
  // does still happens: the cars still hit each other, still take the damage
  // and still lose the time. It is the penalty that is waived, not the crash.
  if (off.lapsDone < S.graceLaps) return;
  if (raceTime - off.lastJudged < S.incidentGap) return;
  off.lastJudged = raceTime;
  off.offences++;

  const speed = Math.abs(rel);
  // A shunt, or a third offence from a driver who has stopped being unlucky.
  let kind = (speed >= S.stopGoFrom || off.offences >= S.thirdOffence) ? "stopgo" : "time";
  let secs = 0;
  // Two stop-gos cannot be served in any useful sense — the second becomes the
  // heavier time penalty instead, which still lands and still hurts.
  if (kind === "stopgo" && off.stopGo) kind = "time";
  if (kind === "stopgo") { off.stopGo = true; off.stopGoLap = off.lapsDone; }
  else { secs = speed >= S.tenFrom || off.offences >= S.thirdOffence ? S.secsHigh : S.secsLow; off.timePenalty += secs; }
  /* Was this a car that had been shown the flag? Read here rather than passed
     in, so it cannot disagree with what judgeContact decided a moment ago. It
     changes no arithmetic — the ladder is the ladder — it changes only what the
     driver is told, which matters: "you have a penalty" and "you have a penalty
     because you sat in the leader's way for half a lap" are different messages
     and only one of them can be learned from. */
  const blue = underBlue(off, victim);
  if (blue) off.blueIgnored++;
  // `rel` is kept on the entry purely so the thing can be MEASURED —
  // tools/stewards.js reads it back off the field to check the ladder is
  // cutting the distribution where the config claims it does.
  off.penaltyLog.push({ kind, secs, lap: off.lapsDone + 1, victim: victim.name,
                        rel: Math.round(speed), blue });

  if (off.isPlayer) {
    radio(blue
      ? (kind === "stopgo"
          ? `Stop-go — you were under blue flags and you put ${victim.name} in the wall. Box within ${S.serveLaps} laps.`
          : `${secs} seconds — you were under blue flags. You have to let them through.`)
      : (kind === "stopgo"
          ? `Stop-go penalty for that contact with ${victim.name} — box within ${S.serveLaps} laps.`
          : `${secs}-second penalty — contact with ${victim.name}.`), 5.5, 2);
    beep(220, 0.22, "square", 0.05);
  } else if (victim.isPlayer) {
    radio(blue
      ? (kind === "stopgo"
          ? `${off.name} gets a stop-go — he was under blue flags. He'll have to box.`
          : `${off.name} has ${secs} seconds — he ignored the blue flags.`)
      : (kind === "stopgo"
          ? `${off.name} has a stop-go for that — he'll have to box.`
          : `They've given ${off.name} ${secs} seconds for that.`), 3.6, 1);
  }
}

/* A stop-go handed out and not served inside the deadline is a black flag.
   Checked once a lap from the line-crossing code rather than every frame,
   because the deadline is quoted in laps and nothing changes between them. */
function checkBlackFlag(car) {
  if (!car.stopGo || car.out || car.finished) return;
  if (car.lapsDone - car.stopGoLap <= CONFIG.stewards.serveLaps) return;
  retire(car, BLACK_FLAG);
}

function carCollisions() {
  const k = track.carScale;
  const r = CONFIG.carHalfW * k;               // one node's radius
  const reject = (CONFIG.carHalfL * 2 * k) ** 2;  // cheap early-out, squared
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      if (a.inPit || b.inPit) continue;   // cars in the lane are not on the track
      if (a.gone || b.gone) continue;     // already recovered by the marshals
      const gx = b.x - a.x, gy = b.y - a.y;
      if (gx * gx + gy * gy > reject) continue;

      // Deepest overlapping pair of nodes wins — that is the contact that
      // actually happened, and pushing along any other normal would slide the
      // cars through each other instead of apart.
      const A = carNodes(a, k), B = carNodes(b, k);
      const min = r * 2;
      let dx = 0, dy = 0, dist = 0, depth = 0;
      for (let p = 0; p < 4; p += 2) {
        for (let q = 0; q < 4; q += 2) {
          const ex = B[q] - A[p], ey = B[q + 1] - A[p + 1];
          const d = Math.hypot(ex, ey) || 0.001;
          if (min - d > depth) { depth = min - d; dx = ex; dy = ey; dist = d; }
        }
      }
      if (depth <= 0) continue;

      const C = CONFIG.contact;
      const nx = dx / dist, ny = dy / dist;
      // Two cars nose to tail are overlapping along their own length, and
      // shoving them apart that way is what turned every touch into a shunt:
      // the car behind is slowed, the car ahead is fired forward, and both
      // arrive at the next corner out of shape. Redirecting part of the push
      // ACROSS the pair instead separates them sideways — which is how two
      // cars that touch actually come apart, and leaves the racing intact.
      const tx = -ny, ty = nx;
      const side = ((b.x - a.x) * tx + (b.y - a.y) * ty) >= 0 ? 1 : -1;
      const push = depth / 2 * C.separate;
      const pn = push * (1 - C.slide), pt = push * C.slide * side;
      a.x -= nx * pn + tx * pt; a.y -= ny * pn + ty * pt;
      b.x += nx * pn + tx * pt; b.y += ny * pn + ty * pt;

      // exchange a little momentum along the contact normal
      const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rel < 0) {
        const imp = rel * C.restitution;
        a.vx += nx * imp; a.vy += ny * imp;
        b.vx -= nx * imp; b.vy -= ny * imp;

        /* The stewards sit OUTSIDE the damage test rather than inside it,
           because they start looking at contact softer than the contact that
           bends anything: reviewFrom is well under damageFrom. What a move
           cost your own bodywork is not the measure of whether it was fair.
           RACING only — the formation lap and the in-lap after the flag both
           run this same resolver, and neither is a race. */
        if (state === State.RACING && stewardsOn()) {
          const off = judgeContact(a, b, rel);
          if (off) stewardsCall(off, off === a ? b : a, rel);
        }

        if (Math.abs(rel) > C.damageFrom) {
          const d = Math.abs(rel) * CONFIG.damagePerImpact * C.damageMul;
          a.damage = Math.min(CONFIG.damageMax, a.damage + d * dmgMul(a));
          b.damage = Math.min(CONFIG.damageMax, b.damage + d * dmgMul(b));
          for (let k = 0; k < 3; k++) addParticle((a.x + b.x) / 2, (a.y + b.y) / 2, "#ffffff", 0.3, 2.2, 160);
          if (a.isPlayer || b.isPlayer) { shake = Math.min(1, shake + 0.22); noiseHit(0.14, 0.06, 900); }
          crashOut(a, Math.abs(rel)); crashOut(b, Math.abs(rel));
        }
      }
    }
  }
}

/* =========================================================================
   Particles
   ========================================================================= */
function addParticle(x, y, colour, life, size, speed = 70) {
  if (particles.length > 260) return;
  // Sizes and speeds are quoted at the reference scale; a circuit drawn small
  // and magnified by the camera needs them shrunk to match, or its dust and
  // smoke come out enormous.
  const k = track ? track.pit.k : 1;
  const a = Math.random() * TAU, s = speed * k * (0.3 + Math.random() * 0.9);
  particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, colour,
                   size: size * k * (0.6 + Math.random() * 0.8) });
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.exp(-3 * dt); p.vy *= Math.exp(-3 * dt);
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

/* =========================================================================
   Race order + finishing
   ========================================================================= */
// DRS opens only inside a marked zone, and in a race only if you were within
// drsGapSeconds of the car ahead when you crossed the detection line before it.
// The leader gets nothing on Sunday — which is exactly the point: it is an
// overtaking tool, not a permanent top-speed bonus. Qualifying is the other
// half of the real rule: the zones are simply open, so a lap has three places
