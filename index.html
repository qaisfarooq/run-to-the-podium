/* --- A person -------------------------------------------------------------
   `base` is raw ability before age is applied; `rep` is reputation, which is
   what teams actually shop on — a slow driver in a quick car looks better on
   paper than he is, and reputation is the thing that lags reality. -------- */
function makePerson(o) {
  return Object.assign({
    pid: 0,
    name: "Driver",
    age: 24,
    peak: 29,
    base: 0.95,          // ability at the plateau
    mistakeBase: 0.25,
    aggro: 0.8,
    seat: -1,            // index into DRIVERS, or -1 for no drive
    status: "racing",    // racing | reserve | retired
    isPlayer: false,
    rookie: false,
    debut: 1,            // career year they first raced
    retiredIn: null,
    endedBy: null,       // why they stopped — see CAREER_END
    rep: 0.5,            // 0..1, what the paddock thinks of them
    warnings: 0,         // objective misses with the current team, this spell
    hurt: 0,             // seasons of injury still to sit out
    // The record that follows them for life.
    stats: { seasons: 0, starts: 0, wins: 0, podiums: 0, poles: 0, points: 0,
             fl: 0, dnf: 0, titles: 0, cTitles: 0, best: 0, elite: [] },
    // ...and the same again for the season in progress, which is what the
    // drivers' championship and every objective are actually counted from.
    year: { starts: 0, wins: 0, podiums: 0, poles: 0, points: 0, fl: 0, dnf: 0 },
    // Last six results, newest last — the form teams judge a block on.
    form: [],
  }, o);
}

const blankYear = () => ({ starts: 0, wins: 0, podiums: 0, poles: 0, points: 0, fl: 0, dnf: 0 });

/* --- Reaching the person in a seat ----------------------------------------
   Every lookup goes through here rather than indexing career.roster directly,
   so an empty seat — which exists for a few seconds during the silly season —
   returns null instead of throwing halfway through a redraw. -------------- */
function roster()          { return (career && career.roster) || []; }
function personById(pid)   { return roster().find(p => p.pid === pid) || null; }
function personAt(seat)    { return roster().find(p => p.seat === seat) || null; }
function playerPerson()    { return roster().find(p => p.isPlayer) || null; }
function playerSeated()    { const p = playerPerson(); return !!p && p.seat === 0; }
function freeAgents()      { return roster().filter(p => p.status !== "retired" && p.seat < 0 && !p.hurt); }
function racingDrivers()   { return roster().filter(p => p.seat >= 0); }

// The drivers' championship counts PEOPLE, not cars — a driver who changes
// seats mid-season takes their points with them, and the rookie who replaces
// them starts from nothing, which is the whole point of scoring it this way.
function driverPoints(seat) { const p = personAt(seat); return p ? p.year.points : 0; }

/* --- Putting a person in a seat -------------------------------------------
   The one place DRIVERS is written to. Name and ability are copied onto the
   seat so every existing consumer keeps reading DRIVERS[i].name and .skill
   exactly as it did when those were constants. --------------------------- */
function syncSeat(i) {
  const p = personAt(i);
  const d = DRIVERS[i];
  if (!p) return;
  d.name    = p.name;
  d.skill   = abilityOf(p);
  d.mistake = mistakeOf(p);
  d.aggro   = p.aggro;
  d.pid     = p.pid;
}
function syncSeats() { DRIVERS.forEach((d, i) => syncSeat(i)); reseatTeams(); }

// Move a person into a seat, evicting whoever is there. The evicted driver is
// left seatless rather than deleted — they are still a person, and the market
// may well put them somewhere else this afternoon.
function seatPerson(p, seat) {
  const sitting = personAt(seat);
  if (sitting && sitting !== p) { sitting.seat = -1; if (sitting.status === "racing") sitting.status = "reserve"; }
  if (p) {
    p.seat = seat;
    p.status = "racing";
    p.warnings = 0;
  }
  syncSeats();
}

/* The player changing teams. Rather than move the player off index 0 — which
   `isPlayer: di === 0` and myTeam() and half the screens would have to be
   rewritten for — the two seats swap the CAR they represent. The player keeps
   index 0 and inherits the new team's livery, camera pod and place in the
   order; the seat they left keeps its old identity for whoever fills it. */
function swapSeatIdentity(a, b) {
  if (a === b) return;
  const A = DRIVERS[a], B = DRIVERS[b];
  ["team", "colour", "accent", "cam"].forEach(k => { const t = A[k]; A[k] = B[k]; B[k] = t; });
  reseatTeams();
}

/* Move the player into the car currently numbered `target`.

   Both seats are emptied FIRST and only then swapped, which matters more than
   it looks: personAt() finds the first person holding a seat index, and the
   player is first in the roster, so leaving the player pointed at the target
   while asking who is sitting in it returns the player and quietly loses the
   driver being displaced. Empty, swap, re-seat — in that order.

   This leaves the target seat empty and two objectives belonging to teams that
   no longer own those cars. Callers therefore fill the grid and then call
   rerollObjectives([0, target]); the one caller that does not, seatTheRookie,
   runs before there are any objectives to be wrong. */
function movePlayerToSeat(target) {
  const me = playerPerson();
  if (!me) return 0;
  if (target === 0) { me.seat = 0; me.status = "racing"; syncSeats(); return 0; }
  const displaced = personAt(target);
  if (displaced && displaced !== me) { displaced.seat = -1; displaced.status = "reserve"; }
  const inOldCar = personAt(0);
  if (inOldCar && inOldCar !== me) { inOldCar.seat = -1; inOldCar.status = "reserve"; }
  me.seat = -1;
  // Now nobody holds either seat, and the cars can trade places safely.
  swapSeatIdentity(0, target);
  me.seat = 0;
  me.status = "racing";
  me.warnings = 0;
  syncSeats();
  return target;
}

/* --- How a driving career ends -------------------------------------------
   Five ways out, four of them involuntary. Each carries the line the record
   books print against the driver's last season, which is the only place most
   of them are ever read. -------------------------------------------------- */
const CAREER_END = {
  dropped: { key: "dropped", label: "Lost his drive",
             blurb: "Released on results, and no team came for him." },
  injury:  { key: "injury",  label: "Forced out by injury",
             blurb: "A heavy accident he was never cleared to race after." },
  age:     { key: "age",     label: "Retired",
             blurb: "Stepped out of the car with nothing left to prove." },
  folded:  { key: "folded",  label: "Team folded",
             blurb: "His team ran out of money, and the market had already closed." },
  full:    { key: "full",    label: "Retired on his own terms", short: "retired",
             blurb: "Walked away with nothing left to prove." },
};

/* --- Making people --------------------------------------------------------
   A rookie is a gamble expressed as three numbers: how good they will ever be,
   how long it takes them to get there, and how much they will bin it on the
   way. Most are ordinary. A few are quicker at nineteen than the man they are
   replacing has ever been, and there is no way to tell which from the outside,
   which is exactly why teams get this wrong so often. ---------------------- */
function takeName(pool) {
  const used = new Set((pool || roster()).map(p => p.name));
  const free = NAME_POOL.filter(n => !used.has(n));
  if (free.length) return free[Math.floor(Math.random() * free.length)];
  // Pool exhausted after a very long career — fall back to a numbered name
  // rather than fielding two drivers who answer to the same thing.
  return `Rookie ${Math.floor(Math.random() * 900) + 100}`;
}

function makeRookie(year, nextPid, pool) {
  // Most rookies land in the middle. The tails are what make a season's intake
  // worth reading: three rolls averaged gives a bell rather than a flat line.
  const roll = (Math.random() + Math.random() + Math.random()) / 3;
  const base = 0.895 + roll * 0.115;          // 0.895 .. 1.010 at their peak
  return makePerson({
    pid: nextPid,
    name: takeName(pool),
    age: AGE.debutMin + Math.floor(Math.random() * (AGE.debutMax - AGE.debutMin + 1)),
    peak: AGE.peakMin + Math.floor(Math.random() * (AGE.peakMax - AGE.peakMin + 1)),
    base,
    mistakeBase: clamp(0.46 - (base - 0.895) * 1.7 + (Math.random() - 0.5) * 0.1, 0.12, 0.58),
    aggro: 0.66 + Math.random() * 0.3,
    status: "reserve",
    rookie: true,
    debut: year,
    // Nobody has any idea yet, so the paddock rates every rookie the same
    // middling amount and finds out the hard way.
    rep: 0.40 + Math.random() * 0.12,
  });
}

/* The grid as it stands on day one of a career. The twenty-two drivers the
   game already ships with become the year-one roster — same names, same
   abilities — but they are people now, with ages spread so the field does not
   all get old and retire in the same winter. The quick ones are given their
   peak years; the slower ones are either on the way up or on the way out,
   which is a truer picture of a midfield than twenty-two drivers all at 29. */
function freshRoster() {
  let pid = 1;
  // Names come from the garage if the player has renamed anybody, abilities
  // always from the factory — exactly the split the livery system already
  // promises, and the reason renaming a team cannot hand it a championship.
  const L = store.get(K_LIVERY, null);
  const nameFor = i => cleanName(
    (L && Array.isArray(L.drivers) && L.drivers[i]) ? L.drivers[i].name : null,
    DRIVER_STOCK[i].name);
  const people = DRIVER_STOCK.map((d, i) => {
    const quick = d.skill >= 0.97;
    const age = i === 0 ? 22                                   // the player starts young
              : quick ? 26 + Math.floor(Math.random() * 6)     // established, in their prime
                      : 21 + Math.floor(Math.random() * 15);   // anywhere in a career
    return makePerson({
      pid: pid++,
      name: nameFor(i),
      age,
      peak: AGE.peakMin + Math.floor(Math.random() * (AGE.peakMax - AGE.peakMin + 1)),
      // The shipped skill is what they are worth NOW, so their peak ability has
      // to be back-solved from where they are on the curve — otherwise a 34
      // year old would be handed his 29-year-old self's pace.
      base: d.skill,
      mistakeBase: d.mistake,
      aggro: d.aggro,
      seat: i,
      status: "racing",
      isPlayer: i === 0,
      debut: 1,
      rep: clamp((d.skill - 0.89) / 0.12, 0.15, 0.95),
    });
  });
  // Back-solve base from the shipped number: skill = base * ageFactor.
  people.forEach(p => { const f = ageFactor(p) || 1; p.base = clamp(p.base / f, 0.86, 1.02); });
  // The player is a known quantity to themselves and an unknown to everyone
  // else — a rookie with a seat, which is exactly the position they are in.
  const me = people[0];
  me.rookie = true;
  me.rep = 0.42;
  me.peak = 29;
  me.base = 1.0;
  // Three reserves waiting for a phone call, so the very first sacking of the
  // career has somebody to hand the seat to.
  const bench = [];
  for (let n = 0; n < CONFIG.career.benchMin; n++) {
    const r = makeRookie(1, pid++, people.concat(bench));
    r.rookie = false; r.age += 3;      // reserves have been around a bit
    bench.push(r);
  }
  return { people: people.concat(bench), nextPid: pid };
}

/* --- Where a rookie actually starts ---------------------------------------
   Nobody's first drive is the lead car of a works team. The grid data has the
   player in seat 0 — Solaris, funded, reliable, and joint quickest on it —
   because that is the sensible default for a one-off race from the menu. For a
   twenty-year CAREER it is the wrong story entirely: there is nowhere to climb
   to, and the first championship is a formality rather than an ambition.

   So a career opens by putting the player in a seat somebody would really
   offer a 22-year-old with no results to his name: the JUNIOR car of the worst
   team on the grid. Every career starts in the same place, and everything above
   it is earned through the market.

   Ranked on the CAR — money and reliability — and deliberately not on
   preSeasonRank, which the objectives use. preSeasonRank is three-quarters
   driver skill, and driver skill is the one thing about to be shuffled: the
   player is a 22-year-old some way short of his peak, so with him in it Solaris
   reads as the seventh best team on the grid despite having the third biggest
   budget and the most reliable car on it. Rank the machinery instead and the
   answer holds however the seats are dealt. */
function carStrength(ti) {
  return TEAMS[ti].funding / 400 + TEAMS[ti].reliability * 0.12;
}
/* How far down the grid a career can begin. Ranks are 1 = best car, 11 = worst,
   and the window is inclusive at both ends.

   It has been narrowed twice. The bottom half (7..11) let some careers start
   too comfortably — the 7th car, Zenith on 105, is close enough to the midfield
   to be no handicap at all. The bottom four (8..11) fixed that but still rolled
   a die: Aurora on 88 and a reliable car is a different life from Umbra on 58
   and a fragile one, and which you got was luck before you had turned a wheel.

   It is now a window of one. Every career starts in the worst car on the grid,
   so the climb is the same climb every time and the only variable is you.
   Nothing else reads these; widen or move the window here and rookieSeat
   follows — { from: 8, to: 11 } restores the roll. */
const ROOKIE_RANKS = { from: 11, to: 11 };

/* The teams a career can begin at, worst car first in the window. Split out of
   rookieSeat so the title screen can ask the same question without rolling the
   dice — the menu has to describe where a career WOULD start, and describing
   it from a second copy of this logic is how the two drift apart. */
function rookieCandidates() {
  const order = TEAMS.map((t, i) => i).sort((a, b) => carStrength(b) - carStrength(a));
  // Ranks are 1-based; slice indices are not.
  return order.slice(ROOKIE_RANKS.from - 1, ROOKIE_RANKS.to);
}

// The junior car of a team — the slower of its two, which is the one a team
// hands to somebody unproven.
function juniorSeatOf(ti) {
  const seats = (TEAMS[ti].drivers || []).slice()
    .sort((a, b) => DRIVERS[a].skill - DRIVERS[b].skill);
  return seats.length ? seats[0] : 0;
}

function rookieSeat() {
  // Anywhere in the window is fair game and no team inside it is weighted, so
  // every team in it comes up evenly. ROOKIE_RANKS is currently one team wide,
  // which makes this deterministic — see startingSeatPreview, which relies on
  // exactly that to tell the menu where a career begins.
  const candidates = rookieCandidates();
  return juniorSeatOf(candidates.length ? pick(candidates) : TEAMS.length - 1);
}

/* --- Where the player sits, or would sit ----------------------------------
   The one question the title screen kept getting wrong, in three places, in
   three different ways. Before a career exists driver zero is still in the
   FACTORY seat the source ships — a front-running team — and every screen that
   asked "which team is the player's" by reading that seat answered with a car
   the game has never once handed anybody: it named the wrong team, listed YOU
   in the wrong team's driver line-up, and quoted the wrong budget as yours.

   So nothing on the menu reads the seat directly any more; it asks here.

   Returns { team, seat, started }. `started` false means this is a prediction
   about a career that has not begun. Null means the rookie window covers more
   than one team and there is no single honest answer — unreachable while
   ROOKIE_RANKS is one team wide, and callers fall back to saying nothing
   specific rather than guessing. ----------------------------------------- */
function startingSeatPreview() {
  if (career) return { team: myTeam(), seat: 0, started: true };
  const candidates = rookieCandidates();
  if (candidates.length !== 1) return null;
  const ti = candidates[0];
  return { team: ti, seat: juniorSeatOf(ti), started: false };
}

/* Sit the player in it. Called once, on the first day of a new career, and
   never again — after that the market decides where they drive.

   movePlayerToSeat swaps the two CARS rather than moving the player off index
   zero, so the works seat the player did not get is left empty with the driver
   who was in the rookie car now out of a drive. fillAllSeats puts him — or
   whoever the market rates highest — into it, which is exactly right: the good
   seat goes to somebody, and it is somebody the player now has to beat. */
function seatTheRookie() {
  const target = rookieSeat();
  if (target === 0) return;
  movePlayerToSeat(target);
  fillAllSeats();
}

/* --- What a team expects --------------------------------------------------
   An objective is only meaningful relative to what the team believes it is.
   Last season's constructors' finish is the honest measure and is used the
   moment there is one; before that, a pre-season guess off money, reliability
   and the two drivers in the seats. ---------------------------------------- */
function preSeasonRank(ti) {
  const score = t => TEAMS[t].funding / 400 + TEAMS[t].reliability * 0.12 +
                     TEAMS[t].drivers.reduce((s, i) => s + DRIVERS[i].skill, 0) * 0.5;
  return TEAMS.map((t, i) => i).sort((a, b) => score(b) - score(a)).indexOf(ti);
}
function teamRank(ti) {
  const h = career && career.history.length ? career.history[career.history.length - 1] : null;
  const pos = h && Array.isArray(h.constructors) ? h.constructors.indexOf(ti) : -1;
  return pos >= 0 ? pos : preSeasonRank(ti);
}
function teamTier(ti) { const r = teamRank(ti); return r <= 2 ? "front" : r <= 6 ? "mid" : "back"; }

// Which of a team's two cars is the one being backed — the same lead-driver
// test the pit wall already uses for team orders, so a driver is never told he
// is the number two on one screen and the number one on another.
function isLeadSeat(seat) {
  const t = TEAMS[DRIVERS[seat].team];
  if (!t || t.drivers.length < 2) return true;
  const rank = []; championshipOrder().forEach((id, i) => { rank[id] = i; });
  return t.drivers.slice().sort((a, b) => rank[a] - rank[b])[0] === seat;
}

/* --- Objectives -----------------------------------------------------------
   Four blocks of six races a season, landing on the same rounds the factory
   opens on, because a team reviews its drivers when it reviews everything
   else. What is asked for scales to what the team is: a front-runner wants
   wins and does not care how hard they were, a backmarker wants you to bring
   it home and beat the other car. Every objective is countable off the race
   log — nothing is judged on vibes. --------------------------------------- */
const OBJ_KINDS = {
  wins:    { verb: "Win",            unit: n => `${n} race${n > 1 ? "s" : ""}` },
  podiums: { verb: "Finish on the podium in", unit: n => `${n} race${n > 1 ? "s" : ""}` },
  points:  { verb: "Score points in", unit: n => `${n} of 6 races` },
  finish:  { verb: "See the flag in", unit: n => `${n} of 6 races` },
  beat:    { verb: "Out-score",      unit: () => "your team-mate over the block" },
};

function makeObjective(seat, block) {
  const tier = teamTier(DRIVERS[seat].team);
  const lead = isLeadSeat(seat);
  const p = personAt(seat);
  const rookie = p && p.rookie;
  let kind, target;
  if (tier === "front") {
    if (lead && !rookie) { kind = "wins";    target = 1 + (Math.random() < 0.35 ? 1 : 0); }
    else                 { kind = "podiums"; target = rookie ? 1 : 2; }
  } else if (tier === "mid") {
    if (Math.random() < 0.30) { kind = "beat"; target = 1; }
    else { kind = "points"; target = rookie ? 2 : lead ? 3 : 2; }
  } else {
    /* A car at the back cannot be asked for points it has no way of scoring —
       there are ten scoring places and twenty-two cars, and the last four rows
       will not see one all year without a wet race and three retirements. So
       what a struggling team actually asks for is the two things its driver
       genuinely controls: beat the sister car, and bring it home. */
    const r = Math.random();
    if (r < 0.50)      { kind = "beat";   target = 1; }
    else if (r < 0.85) { kind = "finish"; target = 5; }
    else               { kind = "points"; target = 1; }
  }
  return { block, seat, pid: p ? p.pid : 0, team: DRIVERS[seat].team,
           kind, target, met: null, tally: 0, judged: false };
}

// Every objective on the grid for a block, set the moment the block begins.
function setObjectives(block) {
  return DRIVERS.map((d, i) => makeObjective(i, block));
}

/* Which team is asking. Derived from the seat every time rather than read back
   off the objective, because a team change hands the two CARS over: the player
   never leaves seat zero, swapSeatIdentity trades the teams between seat zero
   and the seat being signed for, and so any team cached when the objective was
   rolled names the team the player has just LEFT. That is exactly what the
   results screen was reporting — "Umbra want you to score points" to a driver
   who had signed for Vortex over the winter — and the same stale number picked
   the wrong car for a "beat your team-mate" count, judging the player against
   the old team's number two for the rest of the season. `team` is kept on the
   objective as the record of who set it, and as the answer for a seat that has
   somehow gone. */
function objectiveTeam(o) {
  return DRIVERS[o.seat] ? DRIVERS[o.seat].team : o.team;
}

/* The cars that have just changed hands need the objectives their NEW teams
   would have set. Deriving the name is not enough on its own: what is ASKED
   for is rolled against what the team believes it is — a backmarker asks its
   driver to see the flag and beat the sister car, a front-runner asks for wins
   — so a carried-over objective has a title contender asking for two points
   finishes, or a team at the back asking for a win it cannot produce.

   Never over a block the review has already judged. Those objectives are the
   record of what was decided, closeReview is about to replace them all anyway,
   and re-rolling one would rewrite a verdict the player has just been shown.
   A seat standing momentarily empty is left alone rather than handed an
   objective belonging to nobody, so call this once the grid is full again. */
function rerollObjectives(seats) {
  if (!season || !Array.isArray(season.objectives) || !season.objectives.length) return;
  if (season.objectives.some(o => o.judged)) return;
  const block = season.objectives[0].block;
  seats.forEach(seat => {
    const i = season.objectives.findIndex(o => o.seat === seat);
    if (i >= 0 && personAt(seat)) season.objectives[i] = makeObjective(seat, block);
  });
}

/* Saves written before any of this carry an objective stamped with a team that
   has since let go of the car. Naming the team is fixed for them the moment the
   screen is drawn, because that is derived now — but what is being ASKED for
   was still rolled against a team the driver has left, so a career mid-block at
   the wrong end of the grid is repaired on the way back in rather than left to
   read wrong until the next review. The stamp only ever disagrees with the seat
   on a save that predates the re-roll, so this fires once and then never
   again. */
function healStaleObjectives() {
  if (!season || !Array.isArray(season.objectives)) return;
  rerollObjectives(season.objectives.filter(o => o.team !== objectiveTeam(o)).map(o => o.seat));
}

/* Count an objective off the race log. Reading the log rather than a running
   counter means a block can be re-judged after a save is reloaded and get the
   same answer, and that a driver who arrived mid-block is judged only on the
   races he actually started.

   This COUNTS and nothing else — it writes nothing, decides nothing, and is
   safe to call from a screen that merely wants to show somebody how they are
   getting on. That separation is not tidiness. The progress line used to be
   drawn by calling judgeObjective(), which set `judged` as a side effect, and
   `judged` is exactly the flag reviewOwed() reads to decide the review has
   already happened — so looking at the round preview quietly cancelled the
   review for that block, for good. Counting must never be a verdict. */
function countObjective(o) {
  const from = o.block * CONFIG.devEvery, to = from + CONFIG.devEvery;
  const rounds = season.log.filter(r => r.round >= from && r.round < to);
  const mine = rounds.map(r => ({ r, e: r.results.find(x => x.pid === o.pid) }))
                     .filter(x => x.e);
  if (o.kind === "beat") {
    const mate = TEAMS[objectiveTeam(o)].drivers.find(s => s !== o.seat);
    const matePid = mate != null && personAt(mate) ? personAt(mate).pid : null;
    const mine2  = mine.reduce((s, x) => s + x.e.pts, 0);
    const theirs = rounds.reduce((s, r) => {
      const e = r.results.find(x => x.pid === matePid); return s + (e ? e.pts : 0);
    }, 0);
    // Out-scoring means being AHEAD. A dead heat — nil-nil at the back of the
    // grid most often — is not out-scoring anybody, and counting it as met was
    // handing the two hardest seats on the grid a free pass every block.
    return { tally: mine2, mateTally: theirs, started: mine.length,
             met: mine.length === 0 ? null : mine2 > theirs };
  }
  let tally = 0;
  mine.forEach(({ e }) => {
    if (o.kind === "wins"    && e.pos === 1)          tally++;
    if (o.kind === "podiums" && e.pos && e.pos <= 3)  tally++;
    if (o.kind === "points"  && e.pts > 0)            tally++;
    if (o.kind === "finish"  && !e.dnf)               tally++;
  });
  // A driver who started fewer than half the block — because he was hired
  // into it, or hurt — is not judged on it. Sacking a man for races he was
  // never entered in would be daft.
  return { tally, mateTally: null, started: mine.length,
           met: mine.length < Math.ceil(CONFIG.devEvery / 2) ? null : tally >= o.target };
}

// The verdict. Counts, then writes the answer onto the objective and stamps it
// judged — which is what makes a block finished with, so this is called from
// the review and from nowhere else.
function judgeObjective(o) {
  const c = countObjective(o);
  o.tally = c.tally;
  if (c.mateTally != null) o.mateTally = c.mateTally;
  o.met = c.met;
  o.judged = true;
  /* How badly it was missed decides whether it is a warning or the sack.

     Severity 2 is the "you are gone this afternoon" verdict and it has to stay
     rare, so it needs the objective to have been askable in the first place: a
     target of one is either met or not, and failing it is a warning, never an
     execution. Only a driver who was asked for two or more of something and
     produced none of it has done badly enough to skip the warning. */
  o.severity = o.met === false
    ? (o.kind === "beat"  ? 1
     : o.target >= 2 && o.tally === 0 ? 2
     : 1)
    : 0;
  return o;
}

function objectiveText(o) {
  const K = OBJ_KINDS[o.kind];
  return o.kind === "beat" ? "Out-score your team-mate over the six"
                           : `${K.verb} ${K.unit(o.target)}`;
}
/* Live while the block is running, historical once it is over. A judged
   objective reads back what the review decided rather than being recounted:
   the review reshuffles seats, so recounting a "beat" afterwards could resolve
   a different team-mate and quietly contradict the verdict the player was just
   shown — including in the line announcing the sacking. */
function objectiveProgress(o) {
  const c = o.judged ? o : countObjective(o);
  if (o.kind === "beat") return `${c.tally} v ${c.mateTally != null ? c.mateTally : 0}`;
  return `${c.tally} of ${o.target}`;
}

/* =========================================================================
   LIVERIES — the names and colours are yours.

   The arrays above are the factory setting. Anything you change in the garage
   is stored as a thin overlay of names and hex colours and painted back onto
   those same objects at boot, which is why nothing else in the game needs to
   know that customisation exists: every screen, the board, the cars on track
   and the tables all read TEAMS[i].name and DRIVERS[i].colour exactly as they
   did before. The overlay is deliberately only names and colours — skill,
   reliability and budget stay as designed, so renaming a team cannot
   accidentally hand it a championship.
   ========================================================================= */
const K_LIVERY = KP + "livery";

// The factory setting, captured before anything is allowed to touch it.
const DEFAULT_LIVERY = {
  teams:   TEAMS.map(t => ({ name: t.name, colour: t.colour, badge: t.badge })),
  drivers: DRIVERS.map(d => ({ name: d.name, colour: d.colour })),
};

const isHex = v => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v);
// Names are trimmed and capped rather than rejected: an over-long name would
// not break anything, it would just quietly wreck the board and the tables.
const cleanName = (v, fallback) => {
  const s = typeof v === "string" ? v.trim().slice(0, 14) : "";
  return s || fallback;
};

/* Teams five upwards once shipped as Team 05, Team 06 and so on, waiting for
   the player to name them in the garage. They have real names now — but a
   livery saved under the old build still holds the placeholders, and a livery
   outranks the grid, so those saves would show Team 05 for ever and the names
   below would never be seen.

   A placeholder is not a name anybody chose, so it is treated as no name at
   all and the team falls back to whatever the grid calls it today. Anything
   the player actually typed is untouched, as are all the colours and badges —
   and currentLivery() writes the real names back on the next save, so this
   corrects itself once and then never does anything again. */
const PLACEHOLDER_TEAM = /^team\s*0*\d{1,2}$/i;

function applyLivery(L) {
  if (!L || typeof L !== "object") return;
  (Array.isArray(L.teams) ? L.teams : []).forEach((t, i) => {
    if (!TEAMS[i] || !t) return;
    const saved = typeof t.name === "string" && PLACEHOLDER_TEAM.test(t.name.trim())
                ? null : t.name;
    TEAMS[i].name   = cleanName(saved, DEFAULT_LIVERY.teams[i].name);
    if (isHex(t.colour)) TEAMS[i].colour = t.colour;
    if (typeof t.badge === "string" && t.badge.trim()) TEAMS[i].badge = t.badge.trim().slice(0, 4);
  });
  (Array.isArray(L.drivers) ? L.drivers : []).forEach((d, i) => {
    if (!DRIVERS[i] || !d) return;
    DRIVERS[i].name = cleanName(d.name, DEFAULT_LIVERY.drivers[i].name);
    if (isHex(d.colour)) DRIVERS[i].colour = d.colour;
  });
}

// Read the live state back out — this is what gets saved, so what you see on
// the garage screen and what lands in storage can never disagree.
function currentLivery() {
  return {
    teams:   TEAMS.map(t => ({ name: t.name, colour: t.colour, badge: t.badge })),
    drivers: DRIVERS.map(d => ({ name: d.name, colour: d.colour })),
  };
}
function saveLivery() { store.set(K_LIVERY, currentLivery()); }
function resetLivery() {
  applyLivery(JSON.parse(JSON.stringify(DEFAULT_LIVERY)));
  store.del(K_LIVERY);
}

/* Typing is allowed to leave a field empty — stopping you mid-word to complain
   would be worse than the blank. It is only on the way out of the garage that
   anything empty is put back to the name it shipped with. */
function normaliseLivery() {
  TEAMS.forEach((t, i)   => { t.name = cleanName(t.name, DEFAULT_LIVERY.teams[i].name); });
  DRIVERS.forEach((d, i) => {
    const p = personAt(i);
    // With a career loaded the fallback is the PERSON's name, not the factory
    // one — blanking the field should give you back whoever is in the car, not
    // whoever shipped in that seat fifteen seasons ago.
    d.name = cleanName(d.name, p ? p.name : DEFAULT_LIVERY.drivers[i].name);
    if (p) p.name = d.name;
  });
  saveLivery();
  if (career) saveSeason();
}

/* =========================================================================
   DEVELOPMENT — what money buys, and why it so often buys nothing.

   A team's development is stored as a handful of multipliers on numbers the
   physics already uses, so an upgrade is never a special case bolted onto the
   simulation: an aero project raises `grip` in stepCar, an engine project
   raises `accel`, a reliability drive divides the same failure roll every car
   on the grid is subject to. Nothing here can affect a car in a way the game
   could not already express.

   The gains are deliberately tiny — a successful project is worth well under
   one percent. That is the honest number: real teams spend a season's budget
   chasing three tenths of a lap. You are not meant to feel an upgrade in the
   seat on the lap after you buy it. You are meant to look at the standings in
   November and see that the car you started the year with is gone.

   And there is no guarantee at all. Fifteen percent of projects make the car
   worse, and another fifteen never reach the track because the governing body
   says no — which is the part that makes a development window a decision
   rather than a shopping list.
   ========================================================================= */

// Every stat starts neutral. `pit` is seconds taken OFF a stop, so it is the
// one that accumulates additively — the rest are multipliers.
function newDev() {
  return { aero: 1, power: 1, brakes: 1, tyres: 1, boost: 1, reliability: 1,
           pit: 0, driverSkill: 1, driverMistake: 1 };
}
const NEUTRAL_DEV = newDev();

/* The projects a team can fund. `stat` names the multiplier it moves and
   `gain` is what a full success is worth — read those two together and you
   have the whole effect of the upgrade; there is no hidden second effect.

   `reject` and `backfire` are the reasons it went wrong, written per project
   so the pit wall never tells you your pit crew failed a wing deflection
   test. Two of each, picked at random, so a long season does not repeat. */
const PROJECTS = [
  { key: "aero", icon: "🪽", name: "Aerodynamic package", cost: 26, stat: "aero", gain: 0.006,
    brief: "A new floor and front wing concept. More downforce, more speed carried through the corners.",
    effect: "cornering grip",
    reject: ["the front wing failed the deflection test",
             "the floor edge was ruled outside the legality box"],
    backfire: ["it gains in the tunnel and loses on track — the correlation is gone",
               "it added downforce and a balance problem nobody can dial out"] },

  { key: "power", icon: "⚙️", name: "Power unit upgrade", cost: 32, stat: "power", gain: 0.008,
    brief: "A revised combustion chamber and turbo. Worth something at every circuit, not just the fast ones.",
    effect: "engine",
    reject: ["the homologation window had already closed for the year",
             "the fuel it needs is outside the permitted specification"],
    backfire: ["it makes more power and runs too hot to use it",
               "the extra power came with a vibration through the whole car"] },

  { key: "brakes", icon: "🛑", name: "Brake package", cost: 18, stat: "brakes", gain: 0.010,
    brief: "Better carbon, better cooling. Stronger stopping power that holds up to the end of a race.",
    effect: "braking",
    reject: ["the new ducts were judged to be aerodynamic devices",
             "the material failed its mandatory bench certification"],
    backfire: ["they stop harder cold and glaze the moment they get hot",
               "the pedal feel went with it and both drivers are locking up"] },

  { key: "tyres", icon: "🛞", name: "Tyre programme", cost: 20, stat: "tyres", gain: 0.012,
    brief: "Suspension geometry and set-up work aimed squarely at keeping the rubber alive to the flag.",
    effect: "tyre wear",
    reject: ["the suspension design was ruled a moveable aerodynamic device",
             "the test days needed for it were not granted"],
    backfire: ["the tyres last longer and never reach temperature",
               "it saves the rears by destroying the fronts"] },

  { key: "fuel", icon: "⛽", name: "Fuel efficiency drive", cost: 16, stat: "boost", gain: 0.030,
    brief: "Leaner combustion and smarter deployment — more energy in hand for when you are chasing someone.",
    effect: "energy recovery",
    reject: ["the fuel blend was not on the approved list",
             "the deployment map breached the energy flow regulations"],
    backfire: ["the engine is thirstier in race trim than it was on the dyno",
               "the recovery system now cuts out exactly when it is needed"] },

  { key: "pit", icon: "🔧", name: "Pit crew programme", cost: 14, stat: "pit", gain: 0.15,
    brief: "Thousands of practice stops, new wheelguns and a crew who have done it in their sleep.",
    effect: "pit stops",
    reject: ["the new gun exceeded the permitted torque",
             "the rehearsed procedure was ruled an unsafe release risk"],
    backfire: ["the crew are quicker and cross-threading nuts doing it",
               "the new routine works right up until anything goes wrong"] },

  { key: "rel", icon: "🧰", name: "Reliability drive", cost: 22, stat: "reliability", gain: 0.060,
    brief: "Bench testing and quality control aimed at the parts that keep letting go on Sunday afternoons.",
    effect: "reliability",
    reject: ["the revised parts missed the homologation deadline",
             "the supplier could not certify them in time"],
    backfire: ["the fix cured one failure mode and introduced two more",
               "the heavier parts survive and cost lap time doing it"] },

  { key: "driver", icon: "🎓", name: "Driver programme", cost: 24, stat: "driver", gain: 0.004,
    brief: "Simulator time and race craft coaching for both cars. You already drive at your own limit, " +
           "so this one shows up in your team-mate's results — and in the constructors' championship.",
    effect: "team-mate's pace",
    reject: ["the simulator hours went over the permitted allocation",
             "the private test it needed was refused"],
    backfire: ["the coaching has him thinking instead of driving",
               "he came back quicker over one lap and wilder in traffic"] },
];

/* The dice. Weighted to success, because a system where most spending is
   wasted teaches the player to hoard rather than to choose — but not so far
   that a plan can be relied on. A rejected project is the only outcome that
   gives anything back, and it gives back well under half. */
const OUTCOMES = [
  { key: "breakthrough", weight: 45, mul:  1.00, refund: 0,    icon: "✅", cls: "ok",
    label: "Breakthrough" },
  { key: "marginal",     weight: 25, mul:  0.35, refund: 0,    icon: "➖", cls: "",
    label: "Marginal gain" },
  { key: "backfire",     weight: 15, mul: -0.60, refund: 0,    icon: "❌", cls: "bad",
    label: "Backfired" },
  { key: "rejected",     weight: 15, mul:  0.00, refund: 0.40, icon: "🚫", cls: "warn",
    label: "Rejected" },
];
const OUT_TOTAL = OUTCOMES.reduce((s, o) => s + o.weight, 0);

function rollOutcome() {
  let r = Math.random() * OUT_TOTAL;
  for (const o of OUTCOMES) { r -= o.weight; if (r <= 0) return o; }
  return OUTCOMES[0];
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* --- Reading the season's money, safely ------------------------------------
   These are the only way anything else touches a bank balance or a multiplier,
   so a season saved before money existed — or read before one is loaded —
   answers with a neutral car and its starting budget instead of throwing.
   -------------------------------------------------------------------------*/
function dev(ti)  { return (season && season.dev && season.dev[ti]) || NEUTRAL_DEV; }
function bank(ti) {
  return (season && season.bank && season.bank[ti] != null) ? season.bank[ti] : TEAMS[ti].funding;
}
// The one number the failure roll asks for: the car it was built with, times
// whatever the factory has managed to do to it since.
function teamReliability(ti) { return TEAMS[ti].reliability * dev(ti).reliability; }

// A decimal only when it says something: "$8m" reads as a prize, "$8.0m"
// reads as a spreadsheet. Small balances keep the tenth because at that point
// it is the difference between affording the next project and not.
function money(m) {
  const v = Math.max(0, m);
  if (v >= 10 || Number.isInteger(v)) return `$${Math.round(v)}m`;
  return `$${v.toFixed(1)}m`;
}

// A development window cannot run away with the car: a season of perfect luck
// is still only worth a few percent, and a season of terrible luck cannot
// leave a team undriveable.
function clampDev(D) {
  D.aero        = clamp(D.aero,        0.94, 1.06);
  D.power       = clamp(D.power,       0.94, 1.06);
  D.brakes      = clamp(D.brakes,      0.93, 1.07);
  D.tyres       = clamp(D.tyres,       0.90, 1.10);
  D.boost       = clamp(D.boost,       0.88, 1.14);
  D.reliability = clamp(D.reliability, 0.70, 1.45);
  D.pit         = clamp(D.pit,        -0.70, 0.95);
  D.driverSkill   = clamp(D.driverSkill,   0.97, 1.03);
  D.driverMistake = clamp(D.driverMistake, 0.72, 1.30);
}

/* --- The development stats, as something that can be charted ---------------
   Every number the charts draw comes from here, and every field in it is
   derived from the clamps directly above: `up` and `dn` are how far a stat can
   move in each direction, so a bar drawn as gain/up is honestly "this much of
   what was available", not an arbitrary scale that flatters whoever leads.

   `w` is how much the stat is worth to a race result, weighted off how the
   physics actually uses it — aero is grip in every corner AND the whole of
   qualifying pace, so it leads; energy recovery only decides a handful of
   overtakes, so it does not. These weights are a judgement, not a measurement,
   and they exist only to rank the overall chart. Nothing in the simulation
   reads them.

   `invert` marks the stat where a smaller multiplier is the improvement, and
   `secs` the one that is seconds rather than a multiplier — the same two
   special cases pctCell and pitCell already carry.
   -------------------------------------------------------------------------*/
const DEV_STATS = [
  { key: "aero",        icon: "🪽", label: "Aero",    effect: "cornering grip", up: 0.060, dn: 0.060, w: 1.00 },
  { key: "power",       icon: "⚙️", label: "Engine",  effect: "top speed",      up: 0.060, dn: 0.060, w: 0.85 },
  { key: "brakes",      icon: "🛑", label: "Brakes",  effect: "braking",        up: 0.070, dn: 0.070, w: 0.50 },
  { key: "tyres",       icon: "🛞", label: "Tyres",   effect: "tyre life",      up: 0.111, dn: 0.091, w: 0.50, invert: true },
  { key: "boost",       icon: "⛽", label: "Energy",  effect: "energy recovery",up: 0.140, dn: 0.120, w: 0.35 },
  { key: "reliability", icon: "🧰", label: "Reliab.", effect: "reliability",    up: 0.450, dn: 0.300, w: 0.70 },
  { key: "pit",         icon: "🔧", label: "Pit",     effect: "stop time",      up: 0.950, dn: 0.700, w: 0.40, secs: true },
  { key: "driverSkill", icon: "🎓", label: "Drivers", effect: "driver pace",    up: 0.030, dn: 0.030, w: 0.30 },
];

// One stat, for one team, as a signed number where positive is always better —
// which is the only reason a chart can draw all eight of them the same way.
function devGain(ti, s) {
  const v = dev(ti)[s.key];
  if (s.secs)   return v || 0;                 // seconds off a stop, already signed
  if (s.invert) return (1 / (v || 1)) - 1;     // less wear is the gain
  return (v || 1) - 1;
}

// ...and the same number as a share of how far it could possibly have moved,
// so −1 is the worst season available and +1 the best. Asymmetric on purpose:
// several of the clamps are not the same distance up as they are down.
function devShare(ti, s) {
  const g = devGain(ti, s);
  return clamp(g / (g >= 0 ? s.up : s.dn), -1, 1);
}

/* One number for the whole car: every stat's share of what it could have been,
   weighted by what that stat is worth on a Sunday. Reported on a −100…+100
   scale, where 100 would mean a team that maxed out every clamp on the grid.
   Nobody ever gets near it — a good season is somewhere in the twenties. */
function devIndex(ti) {
  let sum = 0, wt = 0;
  DEV_STATS.forEach(s => { sum += devShare(ti, s) * s.w; wt += s.w; });
  return wt ? (sum / wt) * 100 : 0;
}

// Apply one project's result to one team's car.
function applyProject(ti, proj, out) {
  const D = season.dev[ti];
  const g = proj.gain * out.mul;
  if (!g) return;
  switch (proj.stat) {
    // less wear is the improvement, so a gain divides the wear rate
    case "tyres":  D.tyres *= (1 - g); break;
    // seconds off a pit stop — the only additive one
    case "pit":    D.pit   += g;       break;
    // a programme sharpens the driver and calms them down in about equal measure
    case "driver": D.driverSkill *= (1 + g); D.driverMistake *= (1 - g * 8); break;
    default:       D[proj.stat] *= (1 + g);
  }
  clampDev(D);
}

/* Fund a list of projects for one team and roll for each. Returns a log entry
   per project — the screens read that back rather than recomputing anything,
   so what you are told happened is exactly what happened. */
function fundProjects(ti, keys) {
  const entries = [];
  for (const k of keys) {
    const p = PROJECTS.find(x => x.key === k);
    // Affordability is re-checked here and not only in the UI: an AI team
    // picks its list before spending, and the player's list is built against a
    // balance that prize money could have changed underneath it.
    if (!p || season.bank[ti] < p.cost) continue;
    season.bank[ti] -= p.cost;
    const out = rollOutcome();
    const back = p.cost * out.refund;
    season.bank[ti] += back;
    applyProject(ti, p, out);
    entries.push({
      team: ti, project: p.key, outcome: out.key, spent: p.cost, back,
      note: out.key === "rejected" ? pick(p.reject)
          : out.key === "backfire" ? pick(p.backfire)
          : out.key === "marginal" ? `some of it works — ${p.effect} improved a little`
          : `${p.effect} improved`,
    });
  }
  return entries;
}

/* What a rival team does with its money. It spends down to its reserve on
   whatever it is currently worst at, with enough randomness that two seasons
   never develop the same way — so the pecking order genuinely moves, and it
   does not move in a direction the player can predict and plan around. */
function aiChoose(ti) {
  const D = dev(ti);
  let left = bank(ti) * (1 - CONFIG.aiReserve);
  const ranked = PROJECTS.map(p => {
    let need;
    if (p.stat === "reliability")   need = 1.5 / Math.max(0.4, teamReliability(ti));
    else if (p.stat === "tyres")    need = D.tyres;              // above 1 means bad tyres
    else if (p.stat === "pit")      need = 1 - D.pit;            // pit above 0 is good
    else if (p.stat === "driver")   need = 2 - D.driverSkill;
    else                            need = 2 - (D[p.stat] || 1);
    return { p, score: need * (0.55 + Math.random() * 0.95) };
  }).sort((a, b) => b.score - a.score);

  const picks = [];
  for (const r of ranked) {
    if (r.p.cost <= left) { picks.push(r.p.key); left -= r.p.cost; }
  }
  return picks;
}

CONFIG.seasonRounds = CIRCUITS.length;

/* A round clamped to a circuit that actually exists.

   `season.round` is allowed to equal CIRCUITS.length: that is what "the season
   has run out of races" IS, and the game sits in exactly that state while the
   champion screen waits to be read. Screens that merely want a circuit to
   describe — the settings screen quoting a lap count, the career browser
   naming where a save has got to — were indexing CIRCUITS[round] straight and
   getting undefined for their trouble, which took the whole screen down rather
   than the one line. The demo build makes it routine rather than rare: its
   calendar is six long and it deliberately stops with the season on its last
   flag, so every one of those screens is reachable in that state. */
function circuitAt(round) {
  return CIRCUITS[Math.min(Math.max(0, Math.floor(round) || 0), CIRCUITS.length - 1)];
}

/* =========================================================================
   THE ELITE EVENTS — four races that are not part of anybody's championship.

   Drive well enough for long enough and other paddocks come asking. These are
   the one-offs a grand prix driver gets invited to: a speedway, a tri-oval, a
   sports car classic and a twelve-hour on an airfield. No championship points,
   no development money, no bearing on your seat — just a trophy, and a line on
   your record that stays there after everything else has been forgotten.

   Unlike the twenty-four rounds, these layouts are DRAWN rather than traced.
   The two ovals are generated from a superellipse, which is genuinely what
   those shapes are: long straights joined by constant-radius banking, with a
   tri-oval bowing the front stretch outward. The two road courses are careful
   approximations from memory of the real thing rather than lifted from a map —
   recognisable, correctly proportioned, and nobody's copyright.

   The events are named for the place rather than the promoter, the same way
   every circuit in this game already is.
   ========================================================================= */

/* A superellipse: |x/a|^p + |y/b|^p = 1. At p = 2 it is an ellipse, and as p
   climbs the corners tighten and the straights lengthen, which is exactly the
   difference between a sweeping tri-oval and a rectangular speedway. `tri`
   bows the front stretch outward to make the third "corner" a real one. */
function superOval(n, a, b, p, tri) {
  const pts = [];
  const k = 2 / p;
  const sgn = v => (v < 0 ? -1 : 1);
  for (let i = 0; i < n; i++) {
    const t = (i / n) * TAU;
    const ct = Math.cos(t), st = Math.sin(t);
    let x = a * sgn(ct) * Math.pow(Math.abs(ct), k);
    let y = b * sgn(st) * Math.pow(Math.abs(st), k);
    // The bow, applied only to the near side and strongest at its middle.
    if (tri && st > 0) y += tri * Math.pow(Math.max(0, 1 - Math.abs(ct) * 1.5), 1.6);
    pts.push([0.5 + x, 0.5 + y]);
  }
  return pts;
}

/* =========================================================================
   THE ELITE FIELDS — who you are actually racing at one of these.

   Not the grand prix grid. That was the first thing wrong with these events:
   turning up at Indianapolis to race the same twenty-two cars you race every
   other Sunday is not a one-off, it is round twenty-five.

   So each event fields its own entry list, at something close to its real
   size — thirty-three at the Speedway, forty stock cars at Daytona, a proper
   endurance field at La Sarthe — made up of people who do THIS for a living
   and have never sat in a grand prix car. Against them, a handful of
   crossover entries from our own championship: the drivers in the best form
   over the last six races, whoever they happen to be. The player is one of
   them only by earning it, and quite often is not one of them at all, which
   is the entire point of an invitation being worth something.

   Mechanically this swaps DRIVERS and TEAMS wholesale for the duration of the
   race and puts them back afterwards. Everything downstream — makeCar, the
   board, the grid layout, the classification — is already written against
   "however many cars there are", so none of it had to change.
   ========================================================================= */

  "Okafor","Renn","Sandoval","Kirby","Halloran","Byrne","Tanaka","Moretti","Vasquez","Fenwick",

// A guest team's colour, spread evenly round the wheel so forty cars stay
// distinguishable at twenty pixels.
function guestColour(i, n) {
  const hue = (i * 360 / Math.max(1, n) + 17) % 360;
  const light = 55 + ((i % 3) * 7);
  return hslHex(hue, 62, light);
}
function hslHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("");
}

/* Which of our own drivers get the call. Form over the block just finished,
   counted off the race log like everything else — so it is the drivers who
   have actually been quick lately, not the ones highest in a championship
   they have been coasting in. Returns SEAT indices, best first. */
function eliteCrossover(n, block) {
  /* The block just FINISHED, not the one about to start. By the time an
     invitation is handed out the review has already closed and rolled the
     counter on, so reading season.block here would judge form off six races
     nobody has driven yet and invite nobody at all. */
  const b = Math.max(0, block != null ? block : season.block - 1);
  const from = b * CONFIG.devEvery, to = from + CONFIG.devEvery;
  const rounds = season.log.filter(r => r.round >= from && r.round < to);
  const score = new Map();
  rounds.forEach(r => r.results.forEach(e => {
    // Points, plus a bonus for winning — the events want winners, not
    // accumulators of eighth places.
    score.set(e.pid, (score.get(e.pid) || 0) + e.pts + (e.pos === 1 ? 8 : 0));
  }));
  return racingDrivers()
    .filter(p => (score.get(p.pid) || 0) > 0)
    .sort((a, b) => (score.get(b.pid) || 0) - (score.get(a.pid) || 0))
    .slice(0, n);
}

/* Build the field and swap the world over to it. The championship's DRIVERS
   and TEAMS are put aside intact and restored by leaveEliteField(); nothing
   is mutated in place, so a crash mid-race cannot leave the season holding a
   grid full of stock car drivers. */
let eliteSaved = null;

function enterEliteField(ev, invited) {
  const F = ELITE_FIELDS[ev.key];
  eliteSaved = { drivers: DRIVERS.slice(), teams: TEAMS.slice() };

  const teams = [], drivers = [];
  const used = new Set();

  // The crossover entries go in first, and the player — if invited — is entry
  // zero, because `isPlayer: di === 0` is how the whole game knows which car
  // is being driven by a human.
  const ordered = invited.slice().sort((a, b) => (a.isPlayer ? -1 : b.isPlayer ? 1 : 0));
  ordered.forEach((p, i) => {
    const home = eliteSaved.teams[eliteSaved.drivers[p.seat].team];
    teams.push({ name: home.name, badge: home.badge, colour: home.colour,
                 reliability: home.reliability, funding: home.funding,
                 status: "Grand prix crossover entry", guestOf: p.pid, drivers: [] });
    drivers.push({ name: p.name, team: teams.length - 1, colour: home.colour,
                   accent: eliteSaved.drivers[p.seat].accent, cam: "light",
                   skill: abilityOf(p), mistake: mistakeOf(p), aggro: p.aggro,
                   guestPid: p.pid, crossover: true });
    used.add(p.name);
  });

  // ...then the specialists, two to a team, filling the entry list out.
  const guests = F.entries - drivers.length;
  const nTeams = Math.ceil(guests / 2);
  const pool = GUEST_NAMES.filter(n => !used.has(n));
  let gi = 0;
  for (let t = 0; t < nTeams; t++) {
    const colour = guestColour(t, nTeams);
    const tn = F.teamNames[t % F.teamNames.length] + (t >= F.teamNames.length ? " II" : "");
    teams.push({ name: tn, badge: "🔧", colour, reliability: 0.92 + Math.random() * 0.28,
                 funding: 0, status: `${F.discipline} specialist`, drivers: [] });
    for (let c = 0; c < 2 && gi < guests; c++, gi++) {
      const name = pool[gi % pool.length] + (gi >= pool.length ? " " + (Math.floor(gi / pool.length) + 1) : "");
      /* A specialist is very good at this and only this. They sit around the
         pace of a decent grand prix driver, with a wide spread — the field has
         genuine front-runners in it and genuine makeweights, which is what a
         thirty-three car entry list actually looks like. */
      const base = 0.900 + Math.random() * 0.105;
      drivers.push({ name, team: teams.length - 1, colour,
                     accent: c ? "#101820" : "#ffffff", cam: c ? "dark" : "light",
                     skill: base, mistake: clamp(0.44 - (base - 0.9) * 1.6, 0.10, 0.55),
                     aggro: 0.66 + Math.random() * 0.32, guest: true });
    }
  }

  DRIVERS.length = 0; DRIVERS.push(...drivers);
  TEAMS.length   = 0; TEAMS.push(...teams);
  reseatTeams();
  return drivers.length;
}

function leaveEliteField() {
  if (!eliteSaved) return;
  DRIVERS.length = 0; DRIVERS.push(...eliteSaved.drivers);
  TEAMS.length   = 0; TEAMS.push(...eliteSaved.teams);
  eliteSaved = null;
  reseatTeams();
  syncSeats();
}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  if (!rect.width) return;
  canvas.width  = Math.round(rect.width  * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const s = canvas.width / CONFIG.canvasW;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  // the DOM HUD is authored in canvas units and scaled to match
  document.documentElement.style.setProperty("--hs", (rect.width / CONFIG.canvasW).toFixed(5));
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
}
window.addEventListener("resize", resize);
// Belt and braces: on first paint the wrap may still measure 0, which would
// leave the canvas unsized and the screen blank.
try { new ResizeObserver(resize).observe(document.getElementById("wrap")); } catch (_) {}

const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const UI_FONT = 'ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

/* =========================================================================
   Geometry: Catmull-Rom spline -> uniform samples -> speed profile
   ========================================================================= */
function catmullRomClosed(pts, perSeg) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let j = 0; j < perSeg; j++) {
      const t = j / perSeg, t2 = t * t, t3 = t2 * t;
      out.push({
        x: 0.5 * ((2*p1.x) + (-p0.x + p2.x)*t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x)*t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x)*t3),
        y: 0.5 * ((2*p1.y) + (-p0.y + p2.y)*t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y)*t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y)*t3),
      });
    }
  }
  return out;
}

// Re-space a closed polyline so every sample is the same distance apart.
// This is what makes "look 14 samples ahead" mean a fixed number of metres.
function resampleClosed(poly, targetStep) {
  const n = poly.length, cum = [0];
  for (let i = 1; i <= n; i++) {
    const a = poly[i - 1], b = poly[i % n];
    cum.push(cum[i - 1] + Math.hypot(b.x - a.x, b.y - a.y));
  }
  const L = cum[n];
  const M = Math.max(32, Math.round(L / targetStep));
  const step = L / M;
  const out = [];
  let j = 0;
  for (let m = 0; m < M; m++) {
    const d = m * step;
    while (j < n - 1 && cum[j + 1] < d) j++;
    const a = poly[j], b = poly[(j + 1) % n];
    const segLen = (cum[j + 1] - cum[j]) || 1;
    const t = (d - cum[j]) / segLen;
    out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
  return { pts: out, step, length: L };
}

// Laplacian smoothing on a closed polyline. Catmull-Rom happily produces
// corners far tighter than the track is wide, which folds the inside edge over
// itself and gives the AI a corner nothing can physically take. This rounds
// those off — the tighter the corner, the more it relaxes.
function smoothClosed(pts, passes, strength) {
  let cur = pts;
  for (let p = 0; p < passes; p++) {
    const n = cur.length, out = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = cur[(i - 1 + n) % n], b = cur[i], c = cur[(i + 1) % n];
      out[i] = { x: b.x + ((a.x + c.x) / 2 - b.x) * strength,
                 y: b.y + ((a.y + c.y) / 2 - b.y) * strength };
    }
    cur = out;
  }
  return cur;
}

// Relax ONLY the points whose local radius is under the limit. Blanket
// smoothing would flatten the whole layout to fix two hairpins; this leaves the
// sweepers alone and opens up just the corners that are physically impossible.
function limitCurvature(pts, minR, step, iters) {
  const n = pts.length;
  // Measure at the same window the game uses for vmax, or the kinks that
  // actually slow the AI down survive the relaxation untouched.
  const W = CONFIG.curvWindow;
  let cur = pts.map(p => ({ x: p.x, y: p.y }));
  for (let it = 0; it < iters; it++) {
    const out = cur.map(p => ({ x: p.x, y: p.y }));
    let worst = Infinity;
    for (let i = 0; i < n; i++) {
      const a = cur[(i - W + n) % n], b = cur[i], c = cur[(i + W) % n];
      const A = Math.hypot(b.x - a.x, b.y - a.y);
      const B = Math.hypot(c.x - b.x, c.y - b.y);
      const C = Math.hypot(c.x - a.x, c.y - a.y);
      const area = Math.abs((b.x - a.x) * (c.y - a.y) - (c.x - a.x) * (b.y - a.y)) / 2;
      const R = area < 1e-9 ? Infinity : (A * B * C) / (4 * area);  // circumradius
      if (R < worst) worst = R;
      if (R < minR) {
        const w = CONFIG.curvWeight * Math.min(1, 1 - R / minR + 0.2);
        out[i].x = b.x + ((a.x + c.x) / 2 - b.x) * w;
        out[i].y = b.y + ((a.y + c.y) / 2 - b.y) * w;
      }
    }
    cur = out;
    if (worst >= minR) break;
  }
  return cur;
}

/* The box a layout is fitted into, before the pit border is added around it.

   `scale` magnifies the box without touching the cars, the road width or
   anything else measured in world units — which is the whole point of it. A
   circuit built at scale 1.3 is the same shape with thirty per cent more of
   everything the cars have to share: longer straights, wider corner radii, and
   a lap that takes correspondingly longer to drive. The padding is left out of
   the magnification so the result is an exact uniform enlargement of the same
   layout at scale 1, which is what lets a replay recorded before a rescale be
   mapped onto the circuit afterwards. */
function layoutBox(pad, scale) {
  return { w: (CONFIG.width - pad * 2) * scale + pad * 2,
           h: (CONFIG.height - pad * 2) * scale + pad * 2 };
}

// Scale a polyline to fill the canvas, allowing a capped stretch on one axis —
// a purely uniform fit leaves these squarish layouts floating in a 1000x640 frame.
// Traced layouts pass stretch 1: a real circuit must keep its real proportions.
function fitToCanvas(poly, pad, stretch, scale) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of poly) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }
  const box = layoutBox(pad, scale);
  const availW = box.w - pad * 2, availH = box.h - pad * 2;
  const sx0 = availW / (maxX - minX), sy0 = availH / (maxY - minY);
  const base = Math.min(sx0, sy0);
  const sx = Math.min(sx0, base * stretch);
  const sy = Math.min(sy0, base * stretch);
  const offX = (box.w - (maxX - minX) * sx) / 2 - minX * sx;
  const offY = (box.h - (maxY - minY) * sy) / 2 - minY * sy;
  return poly.map(p => ({ x: p.x * sx + offX, y: p.y * sy + offY }));
}

// Every geometry knob may be overridden per circuit. A traced layout needs a
// narrower track, tighter corners and far less smoothing than a hand-drawn one,
// and there is no single set of numbers that suits both.
function trackOpts(circuit) {
  return {
    halfWidth: circuit.halfWidth,
    runoff:    circuit.runoff    ?? CONFIG.runoff,
    margin:    circuit.margin    ?? CONFIG.margin,
    stretch:   circuit.stretch   ?? CONFIG.stretchCap,
    // How much bigger the layout is built than the frame it is fitted to. The
    // corner-opening radius goes with it so a magnified circuit is the same
    // shape rather than a smoother one.
    scale:     circuit.layoutScale ?? 1,
    minR:      circuit.minCornerRadius ?? CONFIG.minCornerRadius,
    passes:    circuit.smoothPasses    ?? CONFIG.smoothPasses,
    strength:  circuit.smoothStrength  ?? CONFIG.smoothStrength,
    carScale:  circuit.carScale  ?? CONFIG.carScale,
    // A narrow layout gives the AI no room to recover a misjudged entry, so
    // its cornering ceiling and overall pace are tunable per circuit too.
    latAccel:  circuit.aiLatAccel ?? CONFIG.aiLatAccel,
    pace:      circuit.aiPace     ?? CONFIG.aiPace,
    lookTime:  circuit.aiLookTime ?? CONFIG.aiLookTime,
  };
}

/* The best place to put the start/finish line: the end of the longest straight.
   The grid is laid out backwards from the line, so ending a straight there puts
   as much of the field on it as the circuit can hold, and leaves the run to
   turn one exactly where a real one is.

   "Straight" is a windowed radius, the same measure the speed profile uses.
   Runs are searched circularly, so a straight that happens to span the traced
   outline's own seam is found like any other. */
function startLineIndex(pts, step) {
  const M = pts.length, W = 3;
  const R = CONFIG.grid.straightR;
  const straight = new Uint8Array(M);
  for (let i = 0; i < M; i++) {
    const d = Math.abs(angDiff(pts[(i + W) % M].ang, pts[((i - W) % M + M) % M].ang));
    straight[i] = (2 * W * step) / Math.max(d, 1e-5) >= R ? 1 : 0;
  }
  // Longest circular run of straight samples. Walk two laps so a run crossing
  // index 0 is measured whole rather than as two short ones.
  let best = 0, bestEnd = -1, run = 0;
  for (let k = 0; k < M * 2; k++) {
    if (straight[k % M]) {
      run++;
      if (run > best) { best = run; bestEnd = k % M; }
    } else run = 0;
  }
  // No straight worth the name — leave the line where the trace put it rather
  // than moving it somewhere arbitrary.
  if (bestEnd < 0 || best * step < CONFIG.grid.minStraight) return 0;
  // Stop a little short of the corner the straight runs into, so pole is on the
  // straight rather than on the brakes for turn one.
  const back = Math.round(CONFIG.grid.lineBefore / step);
  return ((bestEnd - back) % M + M) % M;
}

/* DRS zones, found from the speed profile the AI already drives to.

   A zone is a run of the lap that vmax says is quick — which picks up the long
   straights and the flat-out sweeps together, since vmax is the speed a car can
   actually hold there rather than a measure of how bent the road is. The
   backward braking pass has already pulled vmax down before the corner at the
   end of a straight, so a run closes where the braking begins rather than half
   way round the following hairpin, and nothing extra is needed to end a zone in
   a sensible place.

   Returns the zones themselves plus two per-sample lookups: `at` is the zone a
   sample is inside, `appr` the zone whose detection window it is in. Both hold
   zone index + 1 so that 0 means "neither".  */
function findDrsZones(pts, vmax, step, M) {
  const at = new Uint8Array(M), appr = new Uint8Array(M);
  const idx = i => ((i % M) + M) % M;
  const zones = [];

  // 1. which samples are quick. A circuit with no real slow corner would come
  //    back all-fast, and a lap-long zone is not a zone — tighten until
  //    something is left out.
  let fast = null;
  for (const f of [CONFIG.drsZoneSpeed, 0.90, 0.94, 0.97]) {
    const thr = CONFIG.maxSpeed * f;
    const a = new Uint8Array(M);
    let slow = 0;
    for (let i = 0; i < M; i++) { a[i] = vmax[i] >= thr ? 1 : 0; if (!a[i]) slow++; }
    fast = a;
    if (slow > M * 0.06) break;
  }

  // 2. runs of quick samples. The scan starts from a sample that is NOT quick,
  //    so a straight lying across the seam of the sample array — which the
  //    start/finish straight always does — is found whole rather than as two.
  let s0 = 0;
  while (s0 < M && fast[s0]) s0++;
  if (s0 >= M) return { zones, at, appr };
  const runs = [];
  let open = -1;
  for (let k = 0; k < M; k++) {
    const i = idx(s0 + k);
    if (fast[i]) { if (open < 0) open = i; }
    else if (open >= 0) { runs.push({ a: open, b: idx(i - 1) }); open = -1; }
  }
  if (open >= 0) runs.push({ a: open, b: idx(s0 - 1) });
  const runLen = r => idx(r.b - r.a) + 1;

  // 3. a light kink in the middle of a straight is still one straight: join two
  //    runs across a short gap, but only if the speed barely dropped through it.
  const joinS = Math.round(CONFIG.drsZoneJoin / step);
  for (let guard = 0; guard < runs.length * 2 && runs.length > 1; guard++) {
    let did = false;
    for (let i = 0; i < runs.length; i++) {
      const j = (i + 1) % runs.length;
      const a = runs[i], b = runs[j];
      const gap = idx(b.a - a.b) - 1;
      if (gap <= 0 || gap > joinS) continue;
      let dip = Infinity;
      for (let k = 1; k <= gap; k++) dip = Math.min(dip, vmax[idx(a.b + k)]);
      if (dip < CONFIG.maxSpeed * CONFIG.drsZoneDip) continue;
      a.b = b.b; runs.splice(j, 1); did = true; break;
    }
    if (!did) break;
  }

  // 4. the longest few, then back into lap order. Every circuit gets at least
  //    one even if nothing clears the length bar — a race with no DRS at all
  //    would read as a broken feature rather than a tight track.
  const minS = Math.round(CONFIG.drsZoneMin / step);
  const byLen = runs.slice().sort((p, q) => runLen(q) - runLen(p));
  let picked = byLen.filter(r => runLen(r) >= minS).slice(0, CONFIG.drsZoneMax);
  if (!picked.length && byLen.length) picked = [byLen[0]];
  picked.sort((p, q) => p.a - q.a);

  // 5. where the zone actually opens. A run can be half a lap long on the more
  //    open layouts, and a lap spent with the wing open is not a zone, it is a
  //    faster car — so a zone is capped at a share of the lap and anchored to
  //    the END of the run, which puts it where the overtake happens: the run
  //    down to the braking point. Only a run shorter than the cap keeps its own
  //    start, nudged in so the line is on the straight and not on the exit kerb
  //    of the corner before it.
  const inS = Math.round(CONFIG.drsZoneStartIn / step);
  const capS = Math.max(minS, Math.round(CONFIG.drsZoneCap * M));
  for (const r of picked) {
    const len = runLen(r);
    let start;
    if (len > capS) start = idx(r.b - capS + 1);
    else {
      const trim = Math.max(0, Math.min(inS, len - minS, Math.floor(len / 3)));
      start = idx(r.a + trim);
    }
    zones.push({ start, end: r.b, len: idx(r.b - start) + 1 });
  }
  zones.forEach((z, n) => {
    for (let k = 0, n2 = idx(z.end - z.start); k <= n2; k++) at[idx(z.start + k)] = n + 1;
  });

  // 6. the detection window: everything from the detection line up to the
  //    activation line. It stops short of another zone rather than running
  //    through it, which on a circuit with two zones nose to tail just means a
  //    shorter look at the gap.
  const backS = Math.round(CONFIG.drsDetectBack / step);
  zones.forEach((z, n) => {
    let back = 0;
    while (back < backS && !at[idx(z.start - back - 1)]) back++;
    z.detect = idx(z.start - back);
    for (let k = 0; k < back; k++) appr[idx(z.detect + k)] = n + 1;
  });

  return { zones, at, appr };
}

function buildTrack(circuit) {
  const o = trackOpts(circuit);
  const pad = o.margin + o.halfWidth + o.runoff;

  // 1. spline through the control points, gently relaxed
  let poly = catmullRomClosed(circuit.pts.map(p => ({ x: p[0], y: p[1] })), 22);
  poly = smoothClosed(poly, o.passes, o.strength);

  // 2. into world units, then open up the impossible corners
  poly = fitToCanvas(poly, pad, o.stretch, o.scale);
  const pass1 = resampleClosed(poly, CONFIG.sampleStep);
  poly = limitCurvature(pass1.pts, o.minR * o.scale, pass1.step, CONFIG.curvatureIters);

  // 3. opening the corners pulls the layout in, so refit and re-space
  poly = fitToCanvas(poly, pad, o.stretch, o.scale);
  // The world is the layout box plus a border. The pit lane used to be squeezed
  // into the same rectangle as the track, which is why it ended up laid over
  // another part of the lap on ten circuits; given a border it can sit outside
  // the layout instead. The camera never shows the whole world at once, so the
  // extra room costs nothing on screen and the layout itself is untouched.
  const border = Math.round(CONFIG.pitBorder * o.halfWidth / CONFIG.refHalfWidth);
  const box = layoutBox(pad, o.scale);
  const worldW = box.w + border * 2, worldH = box.h + border * 2;
  for (const p of poly) { p.x += border; p.y += border; }
  const { pts, step, length } = resampleClosed(poly, CONFIG.sampleStep);
  const M = pts.length;

  // 4. tangent + normal per sample
  for (let i = 0; i < M; i++) {
    const a = pts[(i - 1 + M) % M], b = pts[(i + 1) % M];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    pts[i].ang = ang;
    pts[i].nx = -Math.sin(ang);
    pts[i].ny =  Math.cos(ang);
  }

  // 4b. Put the start/finish line at the end of the longest straight.
  //
  //     Sample 0 is wherever the traced outline happened to begin, which on
  //     nineteen of these twenty-four circuits is in or just after a corner.
  //     That was fine while nothing cared where the line was — but a grid is
  //     laid out BACKWARDS from it, and eleven staggered rows through a
  //     thirty-unit-radius hairpin is not a grid, it is a scrapyard.
  //
  //     Rotating the sample array is the whole fix: the speed profile, the pit
  //     complex, the grid and lap counting are all derived from `pts` further
  //     down, so every one of them follows the line to its new home. The
  //     geometry itself is untouched — same layout, same length, same lap
  //     times, just measured from a sensible place.
  const startAt = startLineIndex(pts, step);
  if (startAt) pts.push(...pts.splice(0, startAt));

  // 5. curvature -> a corner-speed ceiling per sample
  const W = 3;
  const vmax = new Float32Array(M);
  for (let i = 0; i < M; i++) {
    const d = Math.abs(angDiff(pts[(i + W) % M].ang, pts[(i - W + M) % M].ang));
    const k = d / (2 * W * step);
    // Grip is not the only ceiling: a car can only yaw so fast, so the tightest
    // radius it can hold at speed v is v/omega(v). On a fast sweep the two
    // limits coincide, but in a hairpin the steering binds long before grip
    // does — without this the AI aims at a speed it cannot physically steer and
    // understeers into the barrier. Converges in a few passes.
    const r = 1 / Math.max(k, 1e-5);
    const vGrip = Math.sqrt(o.latAccel * r);
    let v = vGrip;
    for (let it = 0; it < 4; it++) {
      const omega = CONFIG.turnRate * Math.min(1, v / 55)
                  * (1 - CONFIG.turnFalloff * Math.min(1, v / CONFIG.maxSpeed));
      v = Math.min(vGrip, omega * r);
    }
    vmax[i] = Math.min(CONFIG.maxSpeed, v);
  }

  // 6. backward pass so the AI brakes BEFORE the corner, not in it.
  //    Two laps of the loop lets the constraint propagate across index 0.
  for (let pass = 0; pass < 2; pass++) {
    for (let i = M - 1; i >= 0; i--) {
      const nxt = (i + 1) % M;
      vmax[i] = Math.min(vmax[i], Math.sqrt(vmax[nxt] * vmax[nxt] + 2 * CONFIG.aiBrake * step));
    }
  }

  // 6b. DRS zones fall straight out of the finished speed profile.
  const drs = findDrsZones(pts, vmax, step, M);

  // 7. put the pit lane on whichever side of the start straight has room.
  //    The old test probed a single point beside the start line and then ran
  //    the lane 330 units forward on faith, which laid it straight over another
  //    part of the lap on ten of the twenty-four circuits — and since barriers
  //    are derived from the same corridor, that put invisible walls on the
  //    racing line. Measure the whole lane instead, garage wall included, and
  //    keep it inside the world.
  const pitK    = o.halfWidth / CONFIG.refHalfWidth;   // pit complex scales with the road
  const laneHalf = CONFIG.pitLaneHalf * pitK;
  const wallOut  = CONFIG.pitWall * pitK;
  const needClear = laneHalf + o.halfWidth + o.runoff;  // lane road + the track it passes
  const ignoreAlong = Math.max(30, Math.round(200 * pitK / step));
  // How much of the lap the lane covers. Full length is what every circuit is
  // offered; a cramped one is allowed to take less rather than run its complex
  // through the next corner but one.
  const laneNFor = lenMul => Math.max(20, Math.round(CONFIG.pitLaneLength * pitK * lenMul / step));
  const rampFor  = n => Math.max(5, Math.round(n * 0.22));

  /* Worst clearance along a candidate lane, or null if it leaves the world.
     Both the lane road and the garage wall behind it are measured, because the
     wall is the widest part of the complex and is perfectly capable of standing
     in the middle of a straight the lane itself misses.

     Samples where the offset has turned inside out are SKIPPED. Pushing a curve
     sideways by more than its radius does not move that piece of road further
     out, it reflects it through the centre of the bend — so the point being
     measured is on the wrong side of the circuit, the wall standing off it
     points into the infield, and neither is anywhere the finished lane goes.
     Judging a candidate on those samples condemned circuits whose lane comes
     out perfectly well once reshaped. The test is the offset's own stretch
     factor: 1 - offset x curvature, which passes through zero exactly where the
     fold begins. */
  const laneClearance = (side, offMul, lenMul) => {
    const mag = o.halfWidth + o.runoff + CONFIG.pitLaneOffset * pitK * offMul;
    const off = mag * side;
    const n = laneNFor(lenMul), rmp = rampFor(n), W2 = 3;
    let worst = Infinity;
    for (let k = 0; k <= n; k++) {
      const i = k % M;
      const t = k < rmp ? k / rmp : k > n - rmp ? (n - k) / rmp : 1;
      const e = t * t * (3 - 2 * t);
      if (e < 0.35) continue;                     // the ramps still hug the track
      const kappa = angDiff(pts[(i + W2) % M].ang, pts[(i - W2 + M) % M].ang) * side / (2 * W2 * step);
      if (1 - mag * e * kappa <= 0.1) continue;   // folded: this point is not on the lane
      const s0 = pts[i];
      const x = s0.x + s0.nx * off * e,  y = s0.y + s0.ny * off * e;
      const wx = s0.x + s0.nx * (off + (laneHalf + wallOut) * side) * e;
      const wy = s0.y + s0.ny * (off + (laneHalf + wallOut) * side) * e;
      if (Math.min(x, wx) < 0 || Math.max(x, wx) > worldW ||
          Math.min(y, wy) < 0 || Math.max(y, wy) > worldH) return null;
      for (const q of [{ x, y }, { x: wx, y: wy }]) {
        for (let j = 0; j < M; j++) {
          const along = Math.min(Math.abs(j - i), M - Math.abs(j - i));
          if (along < ignoreAlong) continue;      // ignore the straight it runs beside
          const d = Math.hypot(pts[j].x - q.x, pts[j].y - q.y);
          if (d < worst) worst = d;
        }
      }
    }
    return worst;
  };

  /* Which side of the road the lane can be pushed onto without turning inside
     out. An offset curve survives on the OUTSIDE of a bend — the arc it is
     drawn on only grows — and dies on the inside, where it shrinks by the
     offset and inverts the moment the offset passes the radius. So the number
     that matters is the tightest bend curving TOWARD a candidate side: any
     offset shorter than that radius is safe, and anything longer folds.

     Brazil is the case that made this necessary. Its lane sat on the inside of
     a hairpin, which is a corner an offset cannot survive at any width, and no
     amount of reshaping afterwards could rescue it — the pits have to go on the
     other side of the road, which is where a real circuit would have put them. */
  const bendRadius = (side, lenMul) => {
    const W2 = 3, n = laneNFor(lenMul);
    let worst = Infinity;
