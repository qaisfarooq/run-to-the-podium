// where the wing is worth having and the corners between them still have to be
// taken with it shut.
function updateDrs() {
  const order = raceOrder();
  const racing = session === "race";
  const drs = track.drs;
  for (let i = 0; i < order.length; i++) {
    const c = order[i];
    const ahead = i > 0 ? order[i - 1] : null;
    const wasArmed = c.drsArmed;

    // The gap is wanted whether or not DRS is: team orders read it too.
    if (ahead) {
      const gapUnits = (ahead.progF - c.progF) * track.step;
      c.drsGap = gapUnits / Math.max(80, Math.abs(forwardSpeed(c)));
    } else c.drsGap = Infinity;

    // No wing under the safety car — the gap it would be measured on is an
    // artefact of the queue rather than anything anybody drove for.
    const eligible = !c.finished && !c.inPit && !c.out && !safety &&
                     (!racing || c.lapsDone >= CONFIG.drsFromLap);
    if (!drs || !drs.zones.length || !eligible) {
      c.drsZone = 0; c.drsAppr = 0; c.drsDetected = false; c.drsArmed = false;
      continue;
    }

    const zn = drs.at[c.si], ap = drs.appr[c.si];
    if (!racing) {
      c.drsDetected = true;                 // qualifying: the zones are open
    } else if (ap) {
      // Latch on the way in. Reading the gap once, at the line, is what makes
      // the detection point matter: lose the tow through the corner before and
      // you keep the wing anyway, drop back after it and you have lost it.
      if (c.drsAppr !== ap) {
        c.drsDetected = !!ahead && !ahead.finished && !ahead.inPit && !ahead.out &&
                        c.drsGap < CONFIG.drsGapSeconds;
      }
    } else if (!zn) {
      c.drsDetected = false;                // out the far end, wing shut again
    }
    c.drsAppr = ap;
    c.drsZone = zn;
    c.drsArmed = !!zn && c.drsDetected;

    // A short blip when it opens, so you are not reading the HUD at 240.
    if (c.isPlayer && c.drsArmed && !wasArmed && !simRun) beep(1180, 0.06, "square", 0.03);
  }
  // Someone filling your mirrors makes you more likely to get it wrong.
  for (let i = 0; i < order.length; i++) {
    const c = order[i], behind = order[i + 1];
    c.pressured = !!(behind && !behind.finished && !behind.inPit && !behind.out &&
      ((c.progF - behind.progF) * track.step) / Math.max(80, Math.abs(forwardSpeed(c))) < 0.8);
  }
}

/* =========================================================================
   Retirements

   Two ways out of a race: the dice, and the barrier. The dice are rolled per
   car per second — no scripting, no "the player is due one", and the same
   numbers for the AI as for you. What the roll picks decides whether you get a
   bang with no warning or a problem to manage for the next twenty seconds.

   A retired car coasts, pulls off the racing line, stops, and is recovered by
   the marshals a few seconds later so it never becomes a permanent obstacle on
   the apex of turn one.
   ========================================================================= */
function pickFailure() {
  let r = Math.random() * FAIL_TOTAL;
  for (const f of FAILURES) { r -= f.weight; if (r <= 0) return f; }
  return FAILURES[0];
}

function retire(car, fail) {
  if (car.out) return;
  car.out = true;
  car.outFail = fail;
  car.outTime = raceTime;
  car.recover = 4.5;
  car.fail = null; car.failLeft = 0;
  car.boosting = false;
  car.pitArmed = false;
  retireOrder.push(car.id);

  // pick a side to coast to — whichever edge is nearer
  const s = track.pts[car.si];
  car.outSide = ((car.x - s.x) * s.nx + (car.y - s.y) * s.ny) >= 0 ? 1 : -1;

  for (let i = 0; i < 16; i++) addParticle(car.x, car.y, i % 3 ? "#7d8794" : "#2b3038", 0.9, 4, 70);
  if (car.isPlayer) {
    radio(fail.radio, 6, 3);
    shake = Math.min(1, shake + 0.5);
    noiseHit(0.4, 0.11, 700);
    stopEngine();
  } else {
    radio(`${car.name} is out — ${fail.label.toLowerCase()}`, 3.6, 1);
    noiseHit(0.22, 0.05, 800);
  }

  // A car in the pit lane that expires there simply stays in its box.
  if (car.inPit) { car.pitPhase = "stopped"; car.pitStopLeft = Infinity; }
  // ...and a car abandoned on the road is what brings the safety car out. The
  // marshals do not need to close the circuit to collect one already parked
  // behind the pit wall.
  else considerSafetyCar(car);

  // The player's race ends the moment they stop: classify everyone now.
  if (car.isPlayer) finishRace();
}

/* =========================================================================
   THE SAFETY CAR

   Deployment is caused, never rolled out of nowhere: something the player
   watched stop on the road is what sends it out. Everything below then hangs
   off one number — the speed ceiling in safetyCap — because the field being
   held in order and the field being bunched up are the same mechanism seen
   from two ends. A car further behind than it should be is allowed to close;
   a car up against the one in front is pegged to that car's speed and can
   never come through it.
   ========================================================================= */
function considerSafetyCar(stricken) {
  if (session !== "race" || state !== State.RACING) return;
  if (safety || safetyUsed) return;
  // The player stopping ends the race outright, so there is nothing to
  // neutralise and nobody left to watch it.
  if (stricken.isPlayer) return;

  const leader = raceOrder().find(c => !c.out && !c.finished);
  if (!leader || leader.lapsDone < CONFIG.safety.fromLap) return;
  // Not worth deploying if it would still be out at the flag, or leave so
  // little racing afterwards that the restart never happens.
  const left = raceLaps() - leader.lapsDone;
  if (left < CONFIG.safety.minLeft + 1) return;
  if (Math.random() >= CONFIG.safety.chance) return;

  deploySafetyCar();
}

function deploySafetyCar() {
  safety = { left: CONFIG.safety.secs, ahead: new Map(), warned: false };
  safetyUsed = true;
  paceCar = { x: 0, y: 0, a: 0, arc: 0, gone: false };
  // Everything that only makes sense while racing stops now: an open wing, a
  // boost button, and a mistake nobody is under any pressure to make.
  for (const c of cars) {
    c.boosting = false; c.drsArmed = false; c.drsDetected = false;
    c.errType = null; c.errTimer = 0; c.lockup = false;
    c.yieldTimer = 0;                 // team orders are off under a neutralised race
    // ...and so are blue flags: the field is held in the order it is in, so
    // there is nobody to let past and nothing to be penalised for not doing.
    c.blueTimer = 0; c.blueHeld = 0; c.blueSeen = -1; c.blueAlso = [];
  }
  shake = Math.min(1, shake + 0.22);
  radio("Safety car, safety car — hold position, and box if you want it.", 5.5, 3);
  beep(300, 0.35, "square", 0.05);
}

// Rebuilt every frame rather than snapshotted, so a car that pits genuinely
// loses its place in the queue and rejoins wherever the lane spits it out —
// which is the only way places are meant to change while this is out.
function updateSafety(dt) {
  const queue = raceOrder().filter(c => !c.out && !c.finished && !c.inPit);
  safety.ahead = new Map();
  for (let i = 1; i < queue.length; i++) safety.ahead.set(queue[i].id, queue[i - 1]);

  const leader = queue[0];
  if (!leader) { endSafetyCar(); return; }

  safety.left -= dt;
  if (!safety.warned && safety.left <= CONFIG.safety.warnAt) {
    safety.warned = true;
    radio("Safety car in at the end of this sector — get ready.", 3.5, 2);
  }
  if (safety.left <= 0) { endSafetyCar(); return; }

  /* The pace car is PLACED just ahead of the leader rather than driven. It has
     no race of its own and the queue behind it is already pegged to safety-car
     pace, so anything it could do under its own power it does here anyway —
     and this way it can never drift out of step with the field it is supposed
     to be leading, which a second driven car absolutely would. */
  const M = track.M;
  const arc = leader.progF + CONFIG.safety.leadGap / track.step;
  const pi = ((Math.round(arc) % M) + M) % M;
  const ps = track.pts[pi];
  paceCar.x = ps.x; paceCar.y = ps.y; paceCar.a = ps.ang;
  paceCar.arc = arc; paceCar.gone = false;
}

function endSafetyCar() {
  safety = null;
  paceCar = null;
  goFlashTimer = 1.1;
  radio("Green flag, green flag — go!", 3.5, 3);
  beep(660, 0.3, "square", 0.06);
}

/* The one ceiling everything else is built on. Returns the fastest this car
   may go right now, or Infinity when the race is green.

   A car with clear air to the one ahead may run quicker than safety-car pace
   to close it up — that is the bunching. A car already up against the one
   ahead is pegged just under ITS speed, which is what makes passing
   impossible rather than merely discouraged: you can arrive at the gearbox in
   front of you and no further. */
function safetyCap(car) {
  // Only a race can be neutralised. Qualifying is timed laps against nobody, so
  // whatever `safety` happens to hold, it has no business capping a lap here.
  if (!safety || session !== "race") return Infinity;
  if (car.inPit || car.out || car.finished) return Infinity;
  const base = Math.max(CONFIG.safety.minPace, CONFIG.maxSpeed * CONFIG.safety.pace);
  const ahead = safety.ahead.get(car.id);
  if (!ahead) return base;                       // the leader simply runs to pace
  const gapUnits = (ahead.progF - car.progF) * track.step;
  if (gapUnits > CONFIG.safety.gap) return base * CONFIG.safety.catchUp;
  return Math.max(CONFIG.safety.minPace,
                  Math.min(base, Math.abs(forwardSpeed(ahead)) * 0.94));
}

// Roll for trouble, and run down any problem already developing.
function updateFailures(dt) {
  for (const car of cars) {
    if (car.out || car.finished) continue;

    // A problem already under way: count it down, then it lets go. The clock
    // stops while the crew actually have their hands on a fixable car —
    // otherwise pitting for a repair can still lose you the race in the box,
    // which makes the whole decision a trap.
    if (car.fail) {
      const beingFixed = car.inPit && car.pitPhase === "stopped" && car.fail.fixable;
      if (!beingFixed) car.failLeft -= dt;
      if (car.fail.smoke && Math.random() < 0.45)
        addParticle(car.x - Math.cos(car.a) * 12, car.y - Math.sin(car.a) * 12,
                    Math.random() < 0.5 ? "#59606d" : "#20242c", 0.7, 3, 40);
      if (car.failLeft <= 0) retire(car, car.fail);
      continue;                       // one problem at a time is plenty
    }

    if (raceTime < CONFIG.failQuiet || car.inPit) continue;

    /* Tyres run into the ground, checked before anything else and on its own
       terms rather than through the general failure dice. This one is EARNED:
       it only happens to a car whose tyres are past the danger threshold, the
       odds climb the closer to the floor they are, and it is entirely within
       the driver's control right up until it isn't. Applies to the player and
       the AI alike, on both difficulties. */
    if (car.tyre < CONFIG.tyreDangerFrom) {
      const gone = (CONFIG.tyreDangerFrom - car.tyre) /
                   Math.max(0.001, CONFIG.tyreDangerFrom - CONFIG.tyreMin);
      if (Math.random() < CONFIG.tyreBlowRate * gone * gone * dt) {
        car.fail = TYRE_GONE;
        car.failLeft = TYRE_GONE.warn * (0.75 + Math.random() * 0.5);
        if (car.isPlayer) radio(TYRE_GONE.radio, 5.5, 2);
        else if (!car.pitArmed && (raceLaps() - car.lapsDone) > CONFIG.aiFixPitLaps) car.pitArmed = true;
        continue;
      }
    }

    // Everything that makes a car more likely to break, in one number.
    const frac = clamp(car.lapsDone / Math.max(1, raceLaps()), 0, 1);
    const risk = CONFIG.failBase * lengthReliability()
               / Math.max(0.3, teamReliability(car.team))
               * (1 + frac * CONFIG.failLateHeat)
               * (car.boosting ? CONFIG.failBoostHeat : 1)
               * (1 + (car.damage / CONFIG.damageMax) * CONFIG.failDamageHeat)
               * (1 + (1 - car.tyre) * CONFIG.failWornHeat);

    if (Math.random() >= risk * dt) continue;

    const f = pickFailure();
    if (f.warn <= 0) { retire(car, f); continue; }

    car.fail = f;
    car.failLeft = f.warn * (0.75 + Math.random() * 0.5);   // never the same twice
    if (car.isPlayer) radio(f.radio, 5.5, 2);
    // An AI with something it can fix books a stop straight away.
    if (!car.isPlayer && f.fixable && !car.inPit &&
        (raceLaps() - car.lapsDone) > CONFIG.aiFixPitLaps) car.pitArmed = true;
  }
}

// A retired car coasts to the side of the road, then gets recovered.
function updateRetired(car, dt) {
  if (car.gone) return;
  car.recover -= dt;

  const speed = Math.hypot(car.vx, car.vy);
  if (speed > 3) {
    // Steer for the edge while it is still rolling. The nudge has to fade with
    // speed: a constant sideways push balances the damping and the car creeps
    // sideways for ever instead of stopping.
    const s = track.pts[car.si], roll = Math.min(1, speed / 60);
    car.vx += s.nx * car.outSide * 30 * roll * dt;
    car.vy += s.ny * car.outSide * 30 * roll * dt;
    const k = Math.exp(-1.8 * dt);
    car.vx *= k; car.vy *= k;
    car.x += car.vx * dt; car.y += car.vy * dt;
    car.a += angDiff(Math.atan2(car.vy, car.vx), car.a) * Math.min(1, 3 * dt);
  } else { car.vx = 0; car.vy = 0; }

  if (car.outFail && car.outFail.smoke && !car.gone && Math.random() < 0.25 * (car.recover > 0 ? 1 : 0))
    addParticle(car.x, car.y, "#4a5260", 1.0, 3.4, 26);

  if (car.recover <= 0 && speed <= 3) car.gone = true;   // marshals take it away
}

/* =========================================================================
   Team orders

   If a team's priority car is stuck behind its own team-mate for long enough
   to be obviously quicker, the pit wall asks the team-mate to move aside. It
   applies to all four teams equally, so the AI teams optimise their own
   constructors' haul too — you will see Fang wave Vega past whether you are
   near them or not.

   The player is never driven for. When the order would fall on the player's
   car it is only ever a request on the radio, which they are free to ignore
   exactly as real drivers do.
   ========================================================================= */
/* =========================================================================
   BLUE FLAGS

   A car about to be lapped is shown a blue flag and has to let the car that is
   lapping it through. Three things had to be true for this to be worth having
   rather than a decoration:

   1. It has to fire. Measured over a full calendar of AI races before any of
      this was written, so the thresholds below are sized against how much
      lapping the race lengths in this game actually produce.
   2. It has to be the SAME movement team orders make. A blue flag arms
      `yieldSide` and nothing else, so a car getting out of the leader's way
      behaves like a car getting out of its team-mate's way, and there is one
      set of yielding behaviour in the game rather than two that disagree.
   3. It has to cost something to ignore. See judgeContact: while the flag
      stands, contact between those two cars is the lapped car's, whatever the
      geometry says. That is the whole point of the flag.

   The player is not driven for here either. When the flag is theirs it is a
   radio call and a light on the pit board, and they are free to ignore it and
   collect the penalty, exactly as a real driver is.
   ========================================================================= */

// Where a car is round the lap, in track samples, 0..M. `progF` is cumulative,
// so this is the part of it that repeats.
function lapPos(car) {
  const M = track.M;
  return ((car.progF % M) + M) % M;
}

// Metres from `a` FORWARD along the road to `b`. Always positive: a car two
// metres behind you is very nearly a full lap ahead of you by this measure,
// which is exactly the distinction a blue flag turns on.
function roadGap(a, b) {
  const M = track.M;
  let d = lapPos(b) - lapPos(a);
  if (d < 0) d += M;
  return d * track.step;
}

/* How many whole laps `a` is ahead of `b`. ROUND, not floor, and the difference
   is the whole point: a car that has just caught the tail of the field is one
   lap up and a few metres back, so the raw progress difference is a shade UNDER
   a lap and floor answers zero — which is precisely the moment a blue flag
   exists for. Rounding is only safe because this is never asked in isolation:
   the caller has already established the two cars are within a second or so of
   each other on the road, and two cars that close share a lap position, so the
   ratio being rounded is always near a whole number and never near the halfway
   point where rounding would be a guess. */
function lapsUpOn(a, b) {
  return Math.round((a.progF - b.progF) / track.M);
}

function updateBlueFlags(dt) {
  const B = CONFIG.blue;
  // The flag fades on its own. Everything below only ever re-arms it, so a
  // lapping car that retires, pits or drops back withdraws the flag by simply
  // not renewing it — no case anywhere has to remember to clear one.
  for (const c of cars) if (c.blueTimer > 0) c.blueTimer -= dt;

  const racing = c => !c.out && !c.finished && !c.inPit && !c.parking;
  const live = cars.filter(racing);

  for (const back of live) {
    if (back.lapsDone < B.fromLap) { back.blueHeld = 0; continue; }
    /* Who, if anyone, is about to lap this car. Nearest one wins the flag —
       being caught by two cars at once is one flag, shown for the one that gets
       there first, because there is only one way to move and one car to move
       out of the way of.

       But EVERY car in that window is being held up, so they are all collected.
       `by` decides the yielding and the radio; `also` is what the stewards read,
       and without it the second car in a lapping train is judged as though the
       car in front of it were racing him. That is the pit-exit case: you rejoin
       into a queue, the backmarker ahead is already under blue for the car in
       front of you, and the contact you have with him comes back as yours. */
    let by = null, byGap = Infinity, freshOut = false;
    const also = [];
    for (const lapper of live) {
      if (lapper === back) continue;
      /* roadGap is measured FORWARD, which is what makes "still behind" and
         "already past" different numbers rather than a sign to get wrong: a car
         ten metres back reads as ten, and the moment it is ten metres up the
         road the same measurement reads as a lap minus ten. So there is no
         separate withdrawal test — the pass completing fails the window below
         all by itself, and `linger` holds the flag just long enough for the
         lapped car to stay out of the way while it happens. */
      const gap = roadGap(lapper, back);
      // Seconds, not metres — a car length at Monza is not a car length at
      // Monaco, and the regulation this models is written in seconds.
      const closing = Math.max(40, Math.abs(forwardSpeed(lapper)));
      if (gap / closing > B.within) continue;
      // Asked LAST, and only of a car already known to be right behind, which
      // is the condition lapsUpOn's rounding depends on.
      if (lapsUpOn(lapper, back) < 1) continue;
      also.push(lapper.id);
      if (raceTime - lapper.leftPit <= B.pitGrace) freshOut = true;
      if (gap < byGap) { by = lapper; byGap = gap; }
    }
    if (!by) { back.blueHeld = 0; continue; }

    back.blueHeld += dt;
    // ...unless one of them has just come out of the pit lane, in which case
    // there was no approach for `hold` to watch and the wait is the whole
    // problem. See CONFIG.blue.pitGrace.
    if (back.blueHeld < B.hold && !freshOut) continue;

    back.blueTimer = B.linger;
    back.blueFor = by.id;
    back.blueAlso = B.queue ? also : [];
    // Move to the side the lapping car is NOT on, read off where it actually
    // is — the same calculation team orders make, for the same reason.
    const s = track.pts[back.si];
    const lat = (by.x - s.x) * s.nx + (by.y - s.y) * s.ny;
    back.yieldSide = lat >= 0 ? -1 : 1;

    // Say it once per pass. blueSeen holds the id it was last announced for, so
    // being lapped by the same car again next time round says it again.
    if (back.blueSeen !== by.id) {
      back.blueSeen = by.id;
      if (back.isPlayer) {
        radio(`🔵 Blue flags — ${by.name} is lapping you. Let him through.`, 4.5, 2);
        beep(520, 0.1, "sine", 0.045, 640);
      } else if (by.isPlayer) {
        radio(`Blue flags for ${back.name} — he has to let you by.`, 3.2);
      }
    }
  }

  // A pass completed, or the flag never shown: forget who it was for, so the
  // next time these two meet it is announced again.
  for (const c of cars) if (c.blueTimer <= 0 && c.blueSeen >= 0) c.blueSeen = -1;
}

// Is this car currently being shown a blue flag for that one?
function underBlue(back, lapper) {
  if (back.blueTimer <= 0) return false;
  // blueFor first: it is the common case and it is one comparison. blueAlso
  // catches the rest of the queue — see the field's note for why they count.
  return back.blueFor === lapper.id || back.blueAlso.includes(lapper.id);
}

function updateTeamOrders(dt) {
  const order = raceOrder();

  // Run the clock down on every car, not just the ones still ahead of someone:
  // a car that has been passed drops down the order and would otherwise be left
  // lifting for the rest of the race.
  for (const c of cars) if (c.yieldTimer > 0) c.yieldTimer -= dt;

  for (let i = 1; i < order.length; i++) {
    const chaser = order[i], ahead = order[i - 1];

    const pairUp = ahead.team === chaser.team && chaser.priority && !ahead.priority &&
                   !chaser.finished && !ahead.finished && !chaser.inPit && !ahead.inPit &&
                   !chaser.out && !ahead.out &&
                   chaser.lapsDone >= CONFIG.orderFromLap;

    if (!pairUp || chaser.drsGap > CONFIG.orderGap) { ahead.heldUp = 0; continue; }

    ahead.heldUp += dt;
    if (ahead.heldUp < CONFIG.orderHold || ahead.ordersLeft <= 0 || ahead.yieldTimer > 0) continue;

    ahead.ordersLeft--;
    ahead.heldUp = 0;

    // Move to the side the chaser is NOT on, worked out where the yielding car
    // actually is rather than from a fixed hand.
    const s = track.pts[ahead.si];
    const chaserLat = (chaser.x - s.x) * s.nx + (chaser.y - s.y) * s.ny;
    ahead.yieldSide = chaserLat >= 0 ? -1 : 1;

    if (ahead.isPlayer) {
      // the player is the one being asked — a request, not a command
      radio(`Let ${chaser.name} through — he's our lead car today`, 5);
    } else {
      ahead.yieldTimer = CONFIG.orderYieldFor;
      if (chaser.isPlayer) radio(`${ahead.name} has been told to let you by`, 4.5);
    }
  }

  // Being stuck behind your own team-mate with no order coming is worth
  // explaining once, or losing the favoured-driver status just feels like a bug.
  const you = cars.find(c => c.isPlayer);
  if (you && !you.priority && !you.toldOnce && !you.out && you.lapsDone >= CONFIG.orderFromLap) {
    const idx = order.indexOf(you), ahead = order[idx - 1];
    if (ahead && !ahead.out && ahead.team === you.team && you.drsGap < CONFIG.orderGap) {
      you.behindMate += dt;
      if (you.behindMate > CONFIG.orderHold + 1.5) {
        you.toldOnce = true;
        radio(`${ahead.name} leads us on points — no orders, race him`, 5);
      }
    } else you.behindMate = 0;
  }
}

// Pick an error. Weighted so the cheap, common ones dominate and a full spin
// stays rare — a field that spins every lap reads as broken, not human.
function startMistake(car, fwd) {
  car.errors++;
  const M = track.M;
  const turn = angDiff(track.pts[(car.si + 6) % M].ang, track.pts[car.si].ang);
  const outside = Math.abs(turn) > 0.02 ? -Math.sign(turn) : (Math.random() < 0.5 ? -1 : 1);
  const r = Math.random();
  if (r < 0.40) {                      // locked brakes: understeers straight on
    car.errType = "lock"; car.errTimer = 0.35 + Math.random() * 0.35; car.lockup = true;
  } else if (r < 0.70) {               // ran wide on the exit, onto the kerb or grass
    car.errType = "wide"; car.errTimer = 0.6 + Math.random() * 0.6;
    car.errLine = outside * (18 + Math.random() * 16) * (laneRoom(track) / LANE_REF);
  } else if (r < 0.88) {               // missed the braking point, has to gather it up
    car.errType = "slow"; car.errTimer = 0.7 + Math.random() * 0.6;
  } else if (Math.abs(fwd) > 130) {    // proper spin
    car.errType = "spin"; car.errTimer = 1.0 + Math.random() * 0.6;
    car.errDir = outside || 1;
  } else {
    car.errType = "lock"; car.errTimer = 0.4; car.lockup = true;
  }
}

/* =========================================================================
   Pit lane

   A car in the lane is driven along the lane's own path rather than by free
   physics: it cannot be shoved into a barrier by someone else's mistake, and
   the time it loses is exactly the time the lane costs. It still shares the
   centreline's samples, so lap counting and the running order need no special
   case while it is in there.
   ========================================================================= */

// How long the crew take. Most stops are a tenth or two either side of normal;
// occasionally the gun cross-threads a nut and the driver sits there watching
// the race go past. That, not the driving, is the human error worth modelling.
// A trained crew is quicker AND drops it less often — `pit` seconds off the
// base stop, and the same figure shaving proportionally off the odds of a
// fumble. A backfired programme runs the whole thing the other way, which is
// why a stop can end up slower than the crew you started the season with.
function rollPitStop(car) {
  const gained = dev(car.team).pit;                    // seconds; negative if it backfired
  const base   = Math.max(1.1, CONFIG.pitStopBase - gained);
  const fumble = clamp(CONFIG.pitFumbleOdds * (1 - gained * 0.55), 0.02, 0.35);
  const r = Math.random();
  if (r < fumble) {
    car.pitFumble = true;
    return base + 0.5 + Math.random() * CONFIG.pitFumbleCost;
  }
  car.pitFumble = false;
  if (r > 1 - CONFIG.pitPerfectOdds) return base - 0.45;
  return base + Math.random() * CONFIG.pitStopVary;
}

function enterPitLane(car) {
  car.inPit = true;
  car.pitS = 0;
  car.pitSpeed = Math.min(Math.abs(forwardSpeed(car)), CONFIG.pitLimiter);
  car.pitPhase = "in";
  car.pitBox = track.pit.boxes[car.team % track.pit.boxes.length];

  /* A debt owed to the stewards is paid the moment the car reaches its box, and
     paying it is the ONLY thing that happens on that visit: no tyres, no
     repairs, no crew over the wall. That is what makes a stop-go worse than a
     normal stop despite being shorter — you leave with the car you arrived in,
     and if you needed rubber you now need a second stop to get it. The rule is
     enforced here rather than trusted to the caller, so an AI that books a stop
     for tyres while owing a penalty serves the penalty instead and works the
     tyres out again next lap. */
  car.servingStopGo = !car.parking && car.stopGo;

  car.pitStopTime = car.parking       ? Infinity
                  : car.servingStopGo ? CONFIG.stewards.stopGoSecs
                  : rollPitStop(car);
  // A penalty is a fixed length by definition — the crew cannot fumble a stop
  // they are not allowed to touch the car during.
  if (car.servingStopGo) car.pitFumble = false;
  /* What is going on the car, decided here rather than at the moment the stop
     was booked — a lap is a long time and the race can change inside it. The
     player has been choosing theirs on the fly; everyone else reads the race
     and calls it now. A car parking at the end has nothing fitted at all. */
  if (!car.parking && !car.servingStopGo) car.nextCompound = car.isPlayer ? nextTyre : aiPitCompound(car);
  // Fixing a fault costs time on top of the tyres — the whole point of the
  // decision is that it isn't free.
  if (car.fail && car.fail.fixable && !car.servingStopGo) car.pitStopTime += CONFIG.fixTime;
  car.pitStopLeft = car.pitStopTime;
  // A penalty is not a pit stop and is not counted as one — the results screen
  // reports stops as strategy, and a stop-go is the opposite of strategy.
  car.pitsDone += (car.parking || car.servingStopGo) ? 0 : 1;
  if (!car.parking && !car.servingStopGo) car.slowestStop = Math.max(car.slowestStop, car.pitStopTime);
  car.boosting = false;
  if (car.isPlayer) beep(car.servingStopGo ? 200 : 300, 0.16, "triangle", 0.05);
}

function leavePitLane(car) {
  car.inPit = false;
  car.pitPhase = null;
  car.leftPit = raceTime;
  const s = track.pts[car.si];
  car.x = s.x + s.nx * track.halfWidth * 0.55 * track.pitSide;
  car.y = s.y + s.ny * track.halfWidth * 0.55 * track.pitSide;
  car.a = s.ang;
  car.vx = Math.cos(s.ang) * car.pitSpeed;
  car.vy = Math.sin(s.ang) * car.pitSpeed;
  if (car.isPlayer) beep(760, 0.14, "square", 0.05, 1140);
}

function updatePitLane(car, dt) {
  const pit = track.pit;

  if (car.pitPhase === "stopped") {
    car.pitStopLeft -= dt;
    car.pitSpeed = 0;
    if (car.pitStopLeft <= 0) {
      car.pitPhase = "out";
      // Debt paid, and that is the whole of it: the car leaves on the rubber it
      // came in on, with the damage it came in with and an empty boost tank.
      // Everything in the else branch is work on the car, and none of it is
      // allowed during a stop-go.
      if (car.servingStopGo) {
        car.servingStopGo = false;
        car.stopGo = false;
        for (let i = 0; i < 6; i++) addParticle(car.x, car.y, "#fb923c", 0.4, 3, 90);
        if (car.isPlayer) { radio("Penalty served — go, go, go.", 3.2, 2); beep(520, 0.12, "square", 0.05); }
      } else {
      car.tyre = 1;
      // The set that was called for on the way in goes on now, and the stint
      // clock restarts — that is what the next call will be read from.
      if (car.nextCompound) car.compound = car.nextCompound;
      car.nextCompound = null;
      car.stintStart = Math.max(0, car.lapsDone);
      car.damage *= 0.25;
      car.boost = CONFIG.boostMax;
      // The crew can cure some of what ails it — that is what the extra time
      // in the box was for.
      if (car.fail && car.fail.fixable) {
        car.fail = null; car.failLeft = 0;
        if (car.isPlayer) radio("That's it fixed — go racing.", 3.5, 2);
      }
      for (let i = 0; i < 8; i++) addParticle(car.x, car.y, "#9fe8ff", 0.4, 3, 90);
      if (car.isPlayer) beep(660, 0.1, "square", 0.05);
      }
    }
  } else {
    // ease down for the box on the way in, then wind back up to the limiter
    let target = CONFIG.pitLimiter;
    if (car.pitPhase === "in") {
      const toBox = car.pitBox - car.pitS;
      if (toBox < 60) target = Math.max(0, CONFIG.pitLimiter * (toBox / 60));
      if (toBox <= 0.8) {
        car.pitS = car.pitBox;
        car.pitSpeed = 0;
        car.pitPhase = "stopped";
        target = 0;
      }
    }
    const rate = target > car.pitSpeed ? 150 : 320;
    car.pitSpeed += clamp(target - car.pitSpeed, -rate * dt, rate * dt);
    car.pitS += car.pitSpeed * dt;
  }

  const lp = laneAt(track, car.pitS);
  car.x = lp.x; car.y = lp.y; car.a = lp.ang;
  car.vx = Math.cos(lp.ang) * car.pitSpeed;
  car.vy = Math.sin(lp.ang) * car.pitSpeed;
  car.steer = 0;
  car.offTrack = false;

  // Parked for good after the flag — sit in the box, do not rejoin.
  if (car.parking && car.pitPhase === "stopped") { car.pitSpeed = 0; return; }
  if (car.pitS >= pit.length - 0.5 && car.pitPhase === "out") leavePitLane(car);
}

function raceOrder() {
  return cars.slice().sort((a, b) => {
    // Retirements go to the back, the last car to stop ahead of the first —
    // getting further into the race is worth something even when you don't
    // reach the flag.
    if (a.out && b.out) return retireOrder.indexOf(b.id) - retireOrder.indexOf(a.id);
    if (a.out) return 1;
    if (b.out) return -1;
    if (a.finished && b.finished) return finishOrder.indexOf(a.id) - finishOrder.indexOf(b.id);
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.progF - a.progF;
  });
}

function finishRace() {
  // The race ends the moment the player crosses the line — everyone else is
  // classified where they are. Nobody waits around watching AI finish.
  const order = raceOrder();
  order.forEach((c, i) => { c.place = i + 1; });
  classification = order.map(c => c.id);

  // The interval to the winner, worked out here rather than on the result
  // screen: the moment the flag falls is the only moment the numbers are true.
  // Afterwards the cars coast, and a gap read off a decaying speed would drift
  // while the player is still looking at it.
  //
  // Two kinds of car end up in the same column. One that crossed the line has a
  // real race time, so its interval is a subtraction and nothing more. The rest
  // of the field is still out on the road — the race stops when the PLAYER
  // finishes, not when the last car does — so theirs has to be projected: the
  // time already on the clock, plus the run they still have to the flag at the
  // speed they are doing. Measuring them against the leader's POSITION instead
  // would be wrong twice over, since the leader parked at the line some seconds
  // ago and has not moved since. Anything more than a lap down is quoted in
  // laps: a car the leader has passed is not "+18.4s" behind in any sense worth
  // printing.
  //
  // Distance becomes time at ONE reference pace — a lap of this circuit at the
  // best lap anybody managed — and not at each car's own speed. Whether a given
  // car happens to be braking for a corner at the moment the flag falls says
  // nothing about the race it has had, and reading each one at its own speed
  // produced a classification whose intervals did not run in order. One pace for
  // the lot keeps the column monotonic, as the positions beside it already are.
  // Both columns come off the SAME number — every car's own gap to the winner —
  // so the interval to the car ahead is a subtraction between neighbours rather
  // than a second measurement that could disagree with the first. Add the
  // intervals down the classification and you arrive at the gap to the leader,
  // which is the one thing a timing screen must never get wrong.
  lastGaps = DRIVERS.map(() => null);
  lastInts = DRIVERS.map(() => null);
  const lead = order[0];
  const finishProg = raceLaps() * track.M;      // progF of the final line crossing
  const refLap = lead.bestLap ||
                 cars.reduce((a, c) => (c.bestLap && (!a || c.bestLap < a) ? c.bestLap : a), null);
  const speed = refLap ? track.length / refLap : CONFIG.maxSpeed * 0.7;
  const sec = [], down = [];                    // seconds behind the winner, and laps down
  order.forEach((c, i) => {
    if (c.out) { sec[i] = null; down[i] = null; return; }   // a retirement has no interval
    if (i === 0) { sec[i] = 0; down[i] = 0; return; }
    if (c.finished && lead.finished) {
      sec[i] = c.finishTime - lead.finishTime; down[i] = 0; return;
    }
    // Nobody has taken the flag at all — the player retired out of the lead, so
    // there is no finishing time to be behind and the road gap is the best there
    // is.
    const behind = lead.finished ? finishProg - c.progF : lead.progF - c.progF;
    down[i] = Math.floor(behind / track.M);
    const run = (behind * track.step) / speed;
    sec[i] = lead.finished ? (raceTime - lead.finishTime) + run : run;
  });
  /* --- the stewards' arithmetic -------------------------------------------
     Time penalties land HERE and nowhere earlier, which is most of the point of
     them: a driver on the road does not know what he has been given, so neither
     does the player, and a race can be lost after it has been won. They are
     applied before the gaps are printed and before anything is paid out, so the
     points, the prize money and the career log all read the corrected order
     without any of them having to know a penalty exists.

     `sec` is already a common currency across cars that took the flag and cars
     still out on the road, so adding to it is the whole of the arithmetic. The
     re-sort then keeps the invariant the block above insists on — the intervals
     are subtractions between neighbours in a list sorted by the same number, so
     they still add up to the gap to the leader.

     `down` (laps down) travels with its car rather than being recomputed. It
     was measured against the provisional leader, and a penalty is seconds: no
     realistic penalty moves a car across a whole lap of the circuit, and the
     winner is never a lapped car. */
  if (order.some(c => !c.out && (c.timePenalty > 0 || c.stopGo))) {
    // A stop-go the flag fell before anyone could serve is not a black flag —
    // there were never the laps to serve it in, and hanging a driver for a
    // deadline the race denied him is the one call with no defence. It becomes
    // the heaviest time penalty instead, which still decides races.
    for (const c of order) {
      if (c.out || !c.stopGo) continue;
      c.timePenalty += CONFIG.stewards.unservedSecs;
      c.penaltyLog.push({ kind: "unserved", secs: CONFIG.stewards.unservedSecs,
                          lap: c.lapsDone, victim: null });
      c.stopGo = false;
    }
    // Retirements keep their own order at the back: a car that stopped cannot
    // be demoted by seconds it never ran.
    const runners = [], retired = [];
    order.forEach((c, i) => (c.out ? retired : runners).push({ c, sec: sec[i], down: down[i] }));
    runners.forEach(r => { r.sec += r.c.timePenalty; });
    runners.sort((p, q) => p.sec - q.sec);
    // Everything downstream is quoted against the winner, and the winner is
    // exactly what a penalty is allowed to change.
    const base = runners.length ? runners[0].sec : 0;
    order.length = 0; sec.length = 0; down.length = 0;
    runners.forEach(r => { order.push(r.c); sec.push(r.sec - base); down.push(r.down); });
    retired.forEach(r => { order.push(r.c); sec.push(null); down.push(null); });
    order.forEach((c, i) => { c.place = i + 1; });
    classification = order.map(c => c.id);
  }

  const laps = n => `+${n} lap${n > 1 ? "s" : ""}`;
  order.forEach((c, i) => {
    if (c.out) return;
    if (i === 0) { lastGaps[c.id] = "—"; lastInts[c.id] = "—"; return; }
    lastGaps[c.id] = down[i] >= 1 ? laps(down[i]) : "+" + sec[i].toFixed(2);
    // A car the one ahead of it has lapped is not some number of seconds behind
    // it in any sense worth printing, so the interval says so in laps too.
    const lost = down[i] - down[i - 1];
    lastInts[c.id] = lost >= 1 ? laps(lost) : "+" + (sec[i] - sec[i - 1]).toFixed(2);
  });

  lastPoints = DRIVERS.map(() => 0);
  // A car that didn't make it scores nothing, and doesn't consume a scoring
  // place either: if three cars break, only five drivers come away with points.
  // An invitation race pays nothing at all — no points, no money, no bearing on
  // anybody's season. That is what makes it a bonus rather than another round.
  let paid = 0;
  if (!eliteRun) order.forEach(c => {
    const p = c.out ? 0 : (CONFIG.points[paid++] || 0);
    lastPoints[c.id] = p;
    season.points[c.id] += p;
  });

  // The fastest lap of the race, worth a point — but only to a car that
  // finished in the points, so it cannot be stolen by a driver who set one
  // flying lap on fresh tyres and then parked it.
  fastestLap = null;
  const eligible = order.filter((c, i) => !c.out && i < CONFIG.points.length && c.bestLap != null);
  if (eligible.length && CONFIG.fastestLapPoint) {
    const best = eligible.reduce((a, b) => (b.bestLap < a.bestLap ? b : a));
    fastestLap = { id: best.id, time: best.bestLap };
    if (!eliteRun) {
      lastPoints[best.id]   += CONFIG.fastestLapPoint;
      season.points[best.id] += CONFIG.fastestLapPoint;
    }
  }

  // Prize money. The podium pays, and it pays the team rather than the driver —
  // which is why your team-mate's third place is worth something to you even
  // when it costs you a place in the drivers' championship. A retirement is
  // read off `c.out` rather than trusted to the ordering, so a race where five
  // cars break cannot pay a parked one.
  lastPrize = TEAMS.map(() => 0);
  if (!eliteRun) order.forEach(c => {
    if (c.out) return;
    const cash = CONFIG.prize[c.place - 1];
    if (!cash) return;
    season.bank[c.team]   += cash;
    season.earned[c.team] += cash;
    lastPrize[c.team]     += cash;
  });

  /* --- The race, written into the record ---------------------------------
     Everything the career reasons about is counted off this log rather than
     off running totals: objectives, form, reputation, the honours board. One
     entry per driver per round, keyed by PERSON, so a mid-season replacement
     is judged on his own races and nobody inherits anybody else's.

     An elite one-off is deliberately excluded — it is not a championship
     round, it does not advance the calendar, and counting it here would let a
     win at Indianapolis satisfy a team objective it has nothing to do with. */
  if (!eliteRun) {
    const results = order.map((c, i) => {
      const p = personAt(c.id);
      return { pid: p ? p.pid : 0, seat: c.id, pos: c.out ? null : c.place,
               pts: lastPoints[c.id] || 0, dnf: !!c.out,
               pole: !!(qual && qual.grid && qual.grid[0] === c.id) };
    });
    season.log.push({ round: season.round, circuit: CIRCUITS[season.round].name, results });

    results.forEach(r => {
      const p = personById(r.pid);
      if (!p) return;
      const y = p.year;
      y.starts  += 1;
      y.points  += r.pts;
      if (r.pos === 1)              y.wins    += 1;
      if (r.pos && r.pos <= 3)      y.podiums += 1;
      if (r.dnf)                    y.dnf     += 1;
      if (r.pole)                   y.poles   += 1;
      if (fastestLap && fastestLap.id === r.seat) y.fl += 1;
      p.form.push(r.pos || 0);
      if (p.form.length > CONFIG.devEvery) p.form.shift();
    });

    // A trip to the medical centre is usually a bruise and a fortnight. A few
    // are the end of a season, and a very few are the end of everything.
    order.forEach(c => {
      if (!c.out || !c.outFail || c.outFail.key !== "injury") return;
      const p = personAt(c.id);
      if (!p) return;
      const K = CONFIG.career;
      const roll = Math.random();
      if (roll < K.endingInjury) {
        if (p.isPlayer) { career.pendingEnd = CAREER_END.injury; }
        else            { endDriverCareer(p, CAREER_END.injury); }
      } else if (roll < K.endingInjury + K.seasonInjury) {
        p.hurt = 1;
        const seat = p.seat;
        p.seat = -1; p.status = "reserve";
        syncSeats();
        if (!p.isPlayer) {
          newsAdd(`${p.name} is out for the season — ${TEAMS[DRIVERS[seat].team].name} need a driver.`, "injury");
          fillSeat(seat, 0);
        }
      }
    });
  }

  /* An invitation does not advance the calendar. It gets written onto the
     driver's permanent record instead, which is the only place it ever counts
     — and the only place anybody will still be able to read it in fifteen
     seasons' time. */
  if (eliteRun) {
    const ev = eliteRun.ev;
    const mine = order.find(c => c.isPlayer);
    // The result goes on the record of EVERY crossover entry, not just the
    // player's — an AI driver who wins the 500 has won the 500, and it has to
    // be there on the honours board fifteen seasons later saying so.
    const crossovers = [];
    order.forEach(c => {
      const pid = DRIVERS[c.id] && DRIVERS[c.id].guestPid;
      if (!pid) return;
      const p = personById(pid);
      if (!p) return;
      const rec = { key: ev.key, name: ev.gp, place: ev.name, year: career.year,
                    pos: c.out ? null : c.place, dnf: !!c.out };
      p.stats.elite = p.stats.elite || [];
      p.stats.elite.push(rec);
      // Winning one of these is the kind of thing that follows a driver about.
      if (rec.pos === 1)     p.rep = clamp(p.rep + 0.06, 0.05, 1);
      else if (rec.pos <= 3) p.rep = clamp(p.rep + 0.03, 0.05, 1);
      crossovers.push({ name: p.name, isPlayer: !!p.isPlayer, pos: rec.pos, dnf: rec.dnf });
    });
    const won = crossovers.find(x => x.pos === 1);
    if (won) newsAdd(`${won.isPlayer ? "You win" : won.name + " wins"} ${ev.gp} at ${ev.name}.`, "elite");
    eliteResult = { ev,
                    pos: mine && !mine.out ? mine.place : null,
                    dnf: !!(mine && mine.out),
                    playerIn: !!mine,
                    field: cars.length,
                    crossovers,
                    winner: order[0] ? order[0].name : "—",
                    winnerTeam: order[0] ? TEAMS[order[0].team].name : "" };
    saveSeason();
  } else {
    season.round += 1;
    saveSeason();
  }
  // A weekend the player is not entered for has no car of theirs to report on:
  // they have lost their drive and are watching from the pit wall. Everything
  // above this line still happened — it is a real grand prix either way.
  const you = order.find(c => c.isPlayer) || null;
  // Your own race ending, unless you are the one who just took the flag — in
  // which case it is the same moment and already has a clip. A retirement gets
  // one too: the run-up to it is why the car stopped.
  if (you && finishOrder[0] !== you.id) reelMoment("yours", you.id, -1, 0);
  // The flag ends the conversation — but not the message telling you why your
  // own car has just stopped.
  if (!you || !you.out) radioTimer = 0;
  if (you && you.out) {
    you.finishTime = you.outTime;
    beep(220, 0.5, "sawtooth", 0.04, 110);
  }
  else if (you && you.place === 1) { beep(523, 0.14, "square", 0.05); setTimeout(() => beep(659, 0.14, "square", 0.05), 130); setTimeout(() => beep(784, 0.3, "square", 0.05), 260); }
  else beep(392, 0.25, "triangle", 0.045, 330);

  // The result is locked in at the flag, but the cars still have to get home.
  // Everyone cools down and comes into the pit lane to park.
  // A shorter in-lap when the player is parked at the side of the road: they
  // have no reason to watch the others tour round.
  coolTimer = (!you || you.out) ? 14 : 36;   // simulated seconds — about 12 on the clock at worst
  flagTime = 0;
  track.pace = racePace * 0.88;   // cruising, not racing, but still getting home
  for (const car of cars) {
    if (car.out) continue;        // it isn't going anywhere
    car.parking = true;
    car.pitArmed = false;
    car.boosting = false;
    car.yieldTimer = 0;   // orders are over; nobody is lifting on the in-lap
    car.blueTimer = 0;    // ...and there is no lap left for anyone to be down
    // anyone already serving a stop simply stays in the box rather than
    // rejoining to complete a lap nobody is racing
    if (car.inPit) { car.pitPhase = "stopped"; car.pitStopLeft = Infinity; }
  }
  go(State.COOLDOWN);
}

// Cool-down lap: nobody is racing any more, they are all just driving back to
// the pit lane. A car peels in the moment it next passes the line, and stays
// in its box. Skipped with SPACE, and capped so the stragglers never hold up
// the results.
function updateCooldown(dt) {
  coolTimer -= dt;
  flagTime += dt;
  raceTime += dt;

  for (const car of cars) {
    if (car.out) { updateRetired(car, dt); continue; }
    if (car.inPit) { updatePitLane(car, dt); continue; }
    const ctrl = aiControls(car, dt);
    ctrl.boost = false;
    stepCar(car, ctrl, dt);
    barriers(car);
    const before = car.si;
    updateProgress(car);
    // crossing the line: index wraps from near M back to near 0
    if (before > track.M * 0.75 && car.si < track.M * 0.25) enterPitLane(car);
  }
  carCollisions();
  // Still recording, but no longer looking for moves: the race is over and the
  // order churns as twenty-two cars peel into the lane. This is here purely so
  // the last clip gets its aftermath.
  reelSample(dt, false);
  updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.6);

  // A retired car is already home as far as the in-lap is concerned.
  const parked = cars.every(c => c.out || (c.inPit && c.pitPhase === "stopped"));
  if (parked || coolTimer <= 0) endCooldown();
  else {
    const you = cars.find(c => c.isPlayer);
    if (you) engineUpdate(Math.abs(forwardSpeed(you)), false);
    updateHud();
  }
}

/* The one way out of a race — driven, simulated or skipped — which is why the
   auto-save lives here and nowhere else. */
function endCooldown() {
  track.pace = racePace;
  stopEngine();
  reelFinish();
  reelAuto();
  go(State.RESULT);
}

// How much lateral room the AI has, and how that compares with the wide
// permanent circuits every sideways magnitude was tuned against.
// The room available at the reference circuit, derived from the same formula
// rather than written out — so `lane` stays 1.0 at Albert Park and every
// steering amount tuned against it keeps its meaning if the car changes size.
const LANE_REF = 26 - (CONFIG.carHalfW + 2.5);
// How far off the centreline a car may run and still have all four wheels on
// the road. Measured from the car's half-WIDTH — a narrower car has more of
// the track available to it, which is most of the point of narrowing it.
function laneRoom(tr) { return Math.max(2, tr.halfWidth - (CONFIG.carHalfW * tr.carScale + 2.5)); }

/* =========================================================================
   HIGHLIGHTS — recording

   A rolling buffer of everybody's position, and a set of rules for noticing
   that something just happened. When one fires, the buffer behind it becomes
   the run-up to a clip and the next few seconds are appended as they are
   driven. Nothing between the moments is kept.

   The recorder is deliberately a PASSIVE READER of the race. It never writes
   to a car, never rolls a die, and never branches the simulation — so a race
   with the recorder running is the same race to the last decimal, and a
   simulated race (which is the real race stepped at speed, see simulateRace)
   produces a reel exactly as a driven one does. That is worth having: the
   highlights of the weekend you skipped are the only way to see it at all.
   ========================================================================= */
const H = CONFIG.highlights;

/* What kinds of moment there are, and what each is worth when there are more
   of them than will fit. The two ends of the race and a change of leader are
   never dropped; ordinary overtakes compete for what is left. */
const MOMENTS = {
  start: { pri: 100, icon: "🚦", name: "LIGHTS OUT" },
  flag:  { pri: 100, icon: "🏁", name: "THE FLAG" },
  yours: { pri:  95, icon: "🏆", name: "YOUR RACE" },
  lead:  { pri:  88, icon: "👑", name: "FOR THE LEAD" },
  pass:  { pri:  40, icon: "⚔️", name: "OVERTAKE" },
};
const PASS_YOURS = 70;   // an overtake you were part of, either way round
/* A lead inherited rather than taken — the car in front stopped on the road or
   took the flag. Still worth a clip, because the new leader has just come into
   a race he was not leading, but below an on-track pass for the lead.

   A lead that changes because the leader PITTED gets no clip at all. That is
   not the lead changing hands, it is the pit cycle: measured, twenty-two cars
   stopping produced up to twelve "lead changes" in a twelve-lap race, and at
   Jeddah and Monaco they filled the entire reel and left no room for a single
   overtake. The change is still recorded so it does not fire again — it just
   is not a moment. */
const LEAD_INHERITED = 60;

// Positions are quantised to a tenth of a world unit and angles to about a
// fiftieth of a degree, which is far finer than a car eleven units long can
// show. Both are chosen so a signed 16-bit integer covers the whole world.
const POSE_Q = 10, ANG_Q = 5000;

let reel  = null;   // the race being recorded, or the one just finished
let reels = loadReels();

function loadReels() {
  const r = store.get(K_REELS, []);
  return Array.isArray(r) ? r.filter(x => x && x.clips && x.cars) : [];
}

/* Base64 both ways. The typed arrays are read back through a view on the same
   buffer, so the byte order is whatever this machine uses — which is safe only
   because a reel never leaves the browser that recorded it. Anything that ever
   exports one has to write the bytes out explicitly. */
function b64From(u8) {
  let s = "";
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64To(s) {
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

// Racing, as the overtake rule means it: on the road, still going, not in the
// pit lane. A place changing hands because somebody stopped or retired is a
// change in the classification, not a move.
function reelRacing(c) { return !c.out && !c.finished && !c.inPit; }

/* Was x following y a moment ago? The first half of the hysteresis that defines
   an overtake — see CONFIG.highlights.clear. Read off the progress histories
   rather than off the order, because the order is exactly the thing that is
   not to be trusted. A pair with no history yet (the opening seconds, or a car
   that has just come out of the pit lane) is not a pass: there is nothing to
   have come through from. */
function reelWasBehind(x, y) {
  const hx = reel.hist[x.id], hy = reel.hist[y.id];
  if (!hx || !hy || hx.length <= reel.look || hy.length <= reel.look) return false;
  const then = (hy[0] - hx[0]) * track.step;   // y ahead of x, that far back
  return then >= H.clear && then <= H.gap;
}

/* Begin recording. Called from setupRace, so every race gets a reel whether it
   is driven, simulated or run for a player who has no seat — and the identity
   of every car is copied in HERE rather than read at playback, because the
   roster ages, seats change hands and the liveries can be repainted. A reel
   watched in year nineteen must still show the grid it was recorded from. */
function reelBegin() {
  const circuit = track.circuit;
  reel = {
    when: 0,
    ck: circuit.name, elite: !!eliteRun,
    // The size the layout was built at. A clip is world coordinates, so a
    // circuit rescaled after this race was recorded would draw the field
    // driving somewhere the road no longer is — repEnter maps them across.
    ls: circuit.layoutScale ?? 1,
    flag: circuit.flag, gp: circuit.gp, loc: circuit.loc,
    laps: raceLaps(),
    round: eliteRun ? 0 : season.round + 1,
    year: career ? career.year : 1,
    who: career ? career.name : "",
    hz: H.hz, n: cars.length,
    cars: cars.map(c => ({ id: c.id, name: c.name, colour: c.colour, accent: c.accent,
                           cam: c.cam, team: TEAMS[c.team].name, badge: TEAMS[c.team].badge,
                           grid: c.gridSlot + 1, you: !!c.isPlayer })),
    you: (cars.find(c => c.isPlayer) || { id: -1 }).id,
    t: 0, acc: 0, started: false, done: false,
    ring: [], ringCap: Math.ceil(H.pre * H.hz) + 2,
    clips: [], open: null,
    pos: null, leader: -1, leadCand: null,
    // Cars by driver index rather than by grid slot. The rules talk in ids —
    // that is what the order, the pending swaps and the clips all carry — and
    // `cars` is indexed by starting position.
    byId: cars.reduce((m, c) => { m[c.id] = c; return m; }, []),
    // Progress history, by id, `look` samples deep — see reelWasBehind.
    hist: [], look: Math.max(1, Math.round(H.look * H.hz)),
    pending: new Map(), cooldown: new Map(),
    /* Measurement only, read by tools/highlights.js off a finished race — how
       many order changes each filter threw away. Kept for the same reason the
       stewards keep `bcExcused`: the thresholds above are only defensible
       against the count of what they actually rejected. */
    stat: { swap: 0, apart: 0, wide: 0, level: 0, taken: 0, close: 0,
            cooled: 0, held: 0, lead: 0, leadPit: 0, leadClose: 0, leadOut: 0 },
  };
}

/* One sample of the whole field. `scan` is off during the cool-down lap: the
   race is over, everyone is peeling into the pit lane, and the order churns as
   they do — none of which is an overtake. The frames are still wanted, because
   they are the aftermath of the last clip. */
function reelSample(dt, scan) {
  if (!reel || reel.done) return;
  reel.t += dt;
  reel.acc += dt;
  const step = 1 / H.hz;
  if (reel.acc > step * 4) reel.acc = step;   // a stalled tab does not spool frames
  while (reel.acc >= step) { reel.acc -= step; reelFrame(scan); }
}

function reelFrame(scan) {
  const n = reel.n;
  const p = new Int16Array(n * 3), f = new Uint8Array(n);
  for (let k = 0; k < n; k++) {
    const c = cars[k];
    const o = k * 3;
    p[o]     = Math.round(clamp(c.x, -3200, 3200) * POSE_Q);
    p[o + 1] = Math.round(clamp(c.y, -3200, 3200) * POSE_Q);
    p[o + 2] = Math.round(angDiff(c.a, 0) * ANG_Q);
    let b = 0;
    if (c.out)      b |= 1;
    if (c.gone)     b |= 2;
    if (c.inPit)    b |= 4;
    if (c.inPit && c.pitPhase === "stopped") b |= 8;
    if (c.pitFumble) b |= 16;
    if (c.finished)  b |= 32;
    if (c.boosting)  b |= 64;
    f[k] = b;
  }
  const frame = { t: reel.t, p, f };

  reel.ring.push(frame);
  if (reel.ring.length > reel.ringCap) reel.ring.shift();

  // The start is not an event anybody detects — it is simply the first thing
  // that happens, and it is worth watching every time.
  if (!reel.started) {
    reel.started = true;
    const you = cars.find(c => c.isPlayer);
    const pole = raceOrder()[0];
    reelMoment("start", (you || pole || cars[0]).id, -1, H.startLen);
  }

  const open = reel.open;
  if (open) {
    open.frames.push(frame);
    if (reel.t >= open.end) reel.open = null;
  }

  if (scan) reelScan();
}

/* The rules. Everything here is read off raceOrder(), which is the same order
   the timing board shows — so a moment the reel captures is a moment the
   player could have watched happen on the screen in front of them. */
function reelScan() {
  const order = raceOrder();
  const pos = [];
  order.forEach((c, i) => { pos[c.id] = i; });
  const prev = reel.pos;
  reel.pos = pos;

  /* How far along each car was, a moment ago. This is the whole of the "was it
     actually behind" half of an overtake, and it is one number per car rather
     than one per pair — a gap is a difference of two of these, so 22 histories
     answer all 231 pairs. */
  const look = reel.look;
  for (const c of cars) {
    const h = reel.hist[c.id] || (reel.hist[c.id] = []);
    h.push(c.progF);
    if (h.length > look + 1) h.shift();
  }

  if (!prev) { reel.leader = order.length ? order[0].id : -1; return; }

  /* Swaps that have held long enough to be real, and swaps that were taken
     straight back. A pass is only a pass once it has stuck: two cars side by
     side trade the timing screen several times a second and none of those is a
     move. The same is what keeps a car being sorted past a pit stop out. */
  for (const [key, sw] of reel.pending) {
    if (pos[sw.a] > pos[sw.b]) { reel.pending.delete(key); reel.stat.taken++; continue; }
    if (reel.t < sw.due) continue;
    reel.pending.delete(key);
    // Ahead is not through. See CONFIG.highlights.clear — this is the test that
    // separates an overtake from two cars that have been nose to tail for a lap
    // and a half, and it throws away more than every other test put together.
    const x = reel.byId[sw.a], y = reel.byId[sw.b];
    if (!x || !y || !reelRacing(x) || !reelRacing(y) ||
        lapsUpOn(x, y) !== 0 || roadGap(y, x) > H.gap || roadGap(y, x) < H.clear) {
      reel.stat.close++;
      continue;
    }
    /* One pair trading places lap after lap is one battle, not eight clips —
       and the key is deliberately unordered, because A coming back at B is the
       same battle as B having just passed A and must not reset the clock. */
    const pair = Math.min(sw.a, sw.b) + "-" + Math.max(sw.a, sw.b);
    if (reel.t - (reel.cooldown.get(pair) || -99) < H.cool) { reel.stat.cooled++; continue; }
    reel.cooldown.set(pair, reel.t);
    reel.stat.held++;
    reelMoment("pass", sw.a, sw.b, 0);
  }

  // Under the safety car nobody can pass anybody — the field is held in order
  // by a speed ceiling — so anything that looks like a move is a pit cycle.
  if (!safety) {
    for (let i = 0; i < cars.length; i++) {
      const a = cars[i];
      if (!reelRacing(a)) continue;
      for (let j = i + 1; j < cars.length; j++) {
        const b = cars[j];
        if (!reelRacing(b)) continue;
        const now = pos[a.id] < pos[b.id];
        if (now === (prev[a.id] < prev[b.id])) continue;
        const x = now ? a : b, y = now ? b : a;          // x has come through on y
        reel.stat.swap++;
        if (lapsUpOn(x, y) !== 0) { reel.stat.apart++; continue; }   // ...not a lap apart
        if (Math.min(roadGap(x, y), roadGap(y, x)) > H.gap) { reel.stat.wide++; continue; }
        // The first half of the hysteresis: `look` seconds ago x had to be
        // genuinely behind y, not alongside. Skipped for the first second and a
        // half of the race, when there is no history to read.
        if (!reelWasBehind(x, y)) { reel.stat.level++; continue; }
        const key = x.id + ">" + y.id;
        if (!reel.pending.has(key)) reel.pending.set(key, { a: x.id, b: y.id, due: reel.t + H.hold });
      }
    }
  }

  /* The lead, checked separately rather than falling out of the pass rule.
     Most changes of leader ARE a pass and merge into that clip a moment later,
     but the ones that are not — the leader retiring, or pitting out of it —
     are exactly the ones a reel would otherwise miss. */
  const lead = order.length ? order[0].id : -1;
  if (lead === reel.leader) reel.leadCand = null;
  else if (!reel.leadCand || reel.leadCand.id !== lead) reel.leadCand = { id: lead, due: reel.t + H.leadHold };
  else if (reel.t >= reel.leadCand.due) {
    const from = reel.leader, was = reel.byId[from], now = reel.byId[lead];
    /* The same "ahead is not through" test as a pass, and for the same reason:
       the two leaders nose to tail would otherwise report a change of leader
       every few tenths for a whole lap. It applies only while the old leader is
       still racing — one that has retired or pitted out of the lead is not
       going to pull clear of anybody, and that is precisely the change of
       leader nothing else would catch. */
    const onRoad = !!(was && now && reelRacing(was) && reelRacing(now) && lapsUpOn(now, was) === 0);
    if (onRoad && roadGap(was, now) < H.clear) { reel.stat.leadClose++; }
    else {
      reel.leader = lead;
      reel.leadCand = null;
      reel.stat.lead++;
      if (onRoad) reelMoment("lead", lead, from, 0);
      else if (was && (was.out || was.finished)) {
        reel.stat.leadOut++;
        reelMoment("lead", lead, from, 0, LEAD_INHERITED);
      }
      else reel.stat.leadPit++;   // the pit cycle — noted, not filmed
    }
  }
}

/* Something happened. Either it extends the clip already running — a scrap
   that produces four moves in six seconds is one piece of film, not four — or
   it opens a new one, taking the buffer behind it as the run-up. */
function reelMoment(kind, subject, other, len, force) {
  if (!reel || reel.done) return;
  const base = MOMENTS[kind];
  if (!base) return;
  let pri = force || base.pri;
  if (kind === "pass" && reel.you >= 0 && (subject === reel.you || other === reel.you)) pri = PASS_YOURS;

  const lead = raceOrder()[0];
  const mark = { kind, subject, other, at: reel.t, lap: lead ? clamp(lead.lapsDone + 1, 1, reel.laps) : 1 };
  const open = reel.open;

  if (open && reel.t < open.end) {
    open.marks.push(mark);
    // Extend, but only up to maxLen — a clip that kept growing with the fight
    // would eventually be the race.
    open.end = Math.min(open.t0 + H.maxLen, reel.t + (len || H.post));
    if (pri > open.pri) { open.pri = pri; open.kind = kind; open.subject = subject; open.other = other; }
    return;
  }

  const clip = {
    kind, pri, subject, other,
    at: reel.t, lap: mark.lap,
    t0: reel.ring.length ? reel.ring[0].t : reel.t,
    end: reel.t + (len || H.post),
    marks: [mark],
    frames: reel.ring.slice(),
  };
  reel.clips.push(clip);
  reel.open = clip;

  // A chaotic race must not fill memory before the reel is pruned at the flag.
  if (reel.clips.length > H.live) {
    let wi = -1;
    for (let i = 0; i < reel.clips.length; i++) {
      const c = reel.clips[i];
      if (c === reel.open) continue;
      if (wi < 0 || c.pri < reel.clips[wi].pri) wi = i;
    }
    if (wi >= 0) reel.clips.splice(wi, 1);
  }
}

/* Which clips survive. The two ends of the race, your own race ending and
   every change of leader are kept outright; the ordinary overtakes then fill
   what is left, best first but pulled apart in time — six clips of one scrappy
   lap is a worse reel than six spread across the race, even if that lap
   produced the six best moves. */
function reelPrune(clips) {
  if (clips.length <= H.maxClips) return clips.slice().sort((a, b) => a.at - b.at);
  const keep = [], rest = [];
  for (const c of clips) (c.pri >= PASS_YOURS ? keep : rest).push(c);

  if (keep.length >= H.maxClips) {
    keep.sort((a, b) => b.pri - a.pri || a.at - b.at);
    return keep.slice(0, H.maxClips).sort((a, b) => a.at - b.at);
  }
  rest.sort((a, b) => b.pri - a.pri || a.at - b.at);
  while (keep.length < H.maxClips && rest.length) {
    let bi = 0, best = -Infinity;
    for (let i = 0; i < rest.length; i++) {
      const near = keep.reduce((m, k) => Math.min(m, Math.abs(k.at - rest[i].at)), Infinity);
      const s = rest[i].pri + Math.min(near, 60) * 0.6;
      if (s > best) { best = s; bi = i; }
    }
    keep.push(rest.splice(bi, 1)[0]);
  }
  return keep.sort((a, b) => a.at - b.at);
}

// A clip's frames, flattened into one pair of arrays and encoded. This is the
// only place the in-memory shape and the stored shape meet.
function reelPack(clip, n) {
  const F = clip.frames.length;
  const p = new Int16Array(F * n * 3), f = new Uint8Array(F * n);
  for (let i = 0; i < F; i++) { p.set(clip.frames[i].p, i * n * 3); f.set(clip.frames[i].f, i * n); }
  return {
    kind: clip.kind, pri: clip.pri, subject: clip.subject, other: clip.other,
    at: clip.at, lap: clip.lap, F,
    marks: clip.marks.map(m => ({ kind: m.kind, subject: m.subject, other: m.other,
                                  at: Math.max(0, m.at - clip.t0), lap: m.lap })),
    p: b64From(new Uint8Array(p.buffer, p.byteOffset, p.byteLength)),
    f: b64From(f),
  };
}

// Close the reel at the end of the race. It is held in memory from here — it
// is watchable straight away, and only written to storage if asked for.
function reelFinish() {
  if (!reel || reel.done) return;
  reel.done = true;
  reel.open = null;
  reel.when = Date.now();
  reel.stat.made = reel.clips.length;   // ...before pruning, for tools/highlights.js
  const kept = reelPrune(reel.clips);
  reel.clips = kept.map(c => reelPack(c, reel.n));
  // The raw frames are the bulk of it and nothing reads them again.
  reel.ring = []; reel.pending = new Map(); reel.cooldown = new Map(); reel.pos = null;
}

// The circuit a reel was recorded on, found by name across both calendars.
function reelCircuit(r) {
  return (r.elite ? ELITE : CIRCUITS).find(c => c.name === r.ck) ||
         CIRCUITS.find(c => c.name === r.ck) || ELITE.find(c => c.name === r.ck) || null;
}

function reelTitle(r) {
  return `${r.flag} ${r.gp}`;
}

function reelSize(r) { return JSON.stringify(r).length; }

/* Which reel goes when the room runs out.

   An AUTOMATIC reel is the game keeping a race in case it turns out to have
   been worth keeping. A KEPT one is somebody having pressed S to say that it
   was. So the automatic ones are given up first — oldest of them before newest
   — and a kept reel is only ever dropped once there are no automatic ones left
   to drop instead. The new reel is at the head of the list, so a fresh
   automatic save arriving into a library of nothing but kept reels finds
   itself the oldest automatic one there is and stands aside, which is the
   right answer: what was asked for beats what was merely offered. */
function reelEvict(auto) {
  for (let i = reels.length - 1; i >= 0; i--) if (reels[i].auto) { reels.splice(i, 1); return true; }
  // Nothing automatic left to give up. A save somebody asked for may now take a
  // kept reel — it is a deliberate act and the oldest goes, as it always did.
  // A save nobody asked for may not, and says so instead by failing here.
  if (auto) return false;
  reels.pop();
  return true;
}

/* Keep this one. Newest first, and bounded by BOTH a count and a total size —
   twenty years of careers live in the same localStorage, and a replay must
   never be the thing that costs somebody a championship. Every write is
   attempted, and if the browser refuses it the oldest reel is dropped and it
   is tried again; if it will not fit even alone, the attempt is abandoned and
   what was already saved is left exactly as it was.

   `auto` marks a reel the game saved by itself at the flag rather than one
   asked for by name. It changes nothing about the reel and everything about
   how long it lives — see reelEvict. */
function reelSave(r, auto) {
  const rec = {
    v: 1, when: r.when || Date.now(), auto: !!auto,
    ck: r.ck, elite: r.elite, ls: r.ls, flag: r.flag, gp: r.gp, loc: r.loc,
    laps: r.laps, round: r.round, year: r.year, who: r.who,
    hz: r.hz, n: r.n, you: r.you, cars: r.cars, clips: r.clips,
  };
  const before = reels.slice();
  reels.unshift(rec);
  let room = true;
  while (room && reels.length > H.keep) room = reelEvict(auto);
  while (room && reels.length > 1 && reels.reduce((s, x) => s + reelSize(x), 0) > H.budget) room = reelEvict(auto);

  /* Either the room ran out, or making it cost the very reel being saved — the
     new one is the oldest automatic reel there is the moment it arrives among
     kept ones. Both mean this save does not happen, and a save that does not
     happen must leave the library exactly as it found it: an automatic save
     losing somebody two rounds of highlights on its way to not being saved is
     the one outcome none of this is allowed to have. */
  if (!room || !reels.includes(rec)) {
    reels = before;
    return { ok: true, held: false, kept: reels.length, dropped: 0 };
  }

  for (;;) {
    try {
      localStorage.setItem(K_REELS, JSON.stringify(reels));
      // `held` is false when the reel that was being saved is the one that had
      // to stand aside — a library full of reels asked for by name has nowhere
      // to put another. Silent for an automatic save, told for a deliberate one.
      return { ok: true, held: reels.includes(rec), kept: reels.length,
               dropped: Math.max(0, before.length + 1 - reels.length) };
    } catch (_) {
      if (reels.length <= 1) { reels = before; return { ok: false, held: false, kept: reels.length, dropped: 0 }; }
      reelEvict();
    }
  }
}

/* Save it because the race has ended, not because anybody asked.

   This is the whole of the auto-save: a race is over, the reel is closed and
   watchable, so it goes into storage like any other. Everything that made
   saving a deliberate act still exists — S now marks a reel as one to keep
   rather than being the only thing that writes it at all — and the difference
   between the two is one flag read by reelEvict when the shelf is full. */
function reelAuto() {
  // A demo build still records — the recorder is threaded through the race loop
  // and is not worth unpicking for a strip — but it has no library screen to
  // open, so filling one would be writing a megabyte and a half of storage
  // nobody in that build can ever reach.
  if (DEMO) return;
  if (!reelWatchable(reel) || reelIsSaved(reel)) return;
  reelSave(reel, true);
}

/* Promote an automatic reel to one kept on purpose. Nothing about the film
   changes; it simply stops being first in the queue to be thrown away. */
function reelPin(r) {
  const i = reels.findIndex(x => x.when === r.when && x.ck === r.ck);
  if (i < 0 || !reels[i].auto) return false;
  reels[i].auto = false;
  store.set(K_REELS, reels);
  return true;
}

function reelDelete(i) {
  reels.splice(i, 1);
  store.set(K_REELS, reels);
}

// Is the reel in memory the same race as one already saved? Two writes of one
// race would be a confusing thing to be allowed to do.
function reelIsSaved(r) {
  return !!r && reels.some(x => x.when === r.when && x.ck === r.ck);
}

function reelWatchable(r) { return !!r && r.done !== false && r.clips && r.clips.length > 0; }

/* =========================================================================
   Update
   ========================================================================= */
function update(dt) {
  if (state === State.QUALI)     { updateQuali(dt); return; }
  if (state === State.FORMATION) { updateFormation(dt); return; }

  if (state === State.COUNT) {
    countdown -= dt;
    const lit = clamp(5 - Math.ceil((countdown - 0.6) / 0.72), 0, 5);
    if (lit > lightsLit) { lightsLit = lit; beep(330, 0.11, "square", 0.05); }
    if (countdown <= 0) {
      state = State.RACING;
      goFlashTimer = 1.1;
      raceTime = 0;
      for (const c of cars) c.lapStart = 0;
      beep(660, 0.3, "square", 0.06);
      startEngine();
      hud.classList.add("on");
    }
    return;
  }

  if (state === State.COOLDOWN) {
    // The in-lap is a whole lap, which at these lap times is twenty seconds of
    // watching cars cruise. Run it at triple rate — as sub-steps, so the step
    // size the physics sees is unchanged — and it reads as a time-lapse.
    for (let k = 0; k < 3 && state === State.COOLDOWN; k++) updateCooldown(dt);
    return;
  }

  if (state !== State.RACING) return;

  if (hitstop > 0) { hitstop -= dt; return; }

  raceTime += dt;
  flagTime += dt;
  if (goFlashTimer > 0) goFlashTimer -= dt;

  if (radioTimer > 0) radioTimer -= dt;

  updateDrs();
  updateTeamOrders(dt);   // reads drsGap, so it has to follow updateDrs
  // ...and blue flags follow team orders, so that when a car is both being
  // lapped and doing its team a favour, the mandatory one is the one that
  // decides which way it moves and how much it lifts.
  if (!safety) updateBlueFlags(dt);
  updateFailures(dt);     // ...and can deploy the safety car, so it comes first
  if (safety) updateSafety(dt);

  for (const car of cars) {
    if (car.out) { updateRetired(car, dt); continue; }
    if (car.finished) { car.vx *= Math.exp(-1.4 * dt); car.vy *= Math.exp(-1.4 * dt); car.x += car.vx * dt; car.y += car.vy * dt; continue; }
    if (car.inPit) { updatePitLane(car, dt); continue; }
    const ctrl = (car.isPlayer && !simRun) ? playerControls(car) : aiControls(car, dt);
    stepCar(car, ctrl, dt);
    barriers(car);
  }
  carCollisions();
  // A car in the lane still gets its progress read off the centreline it runs
  // beside, so it keeps counting laps and holds its place in the order.
  for (const car of cars) if (!car.finished && !car.out) updateProgress(car);

  // Last, so a sample is of the field as it finished the step rather than as
  // it was halfway through one.
  reelSample(dt, true);

  updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.6);

  const you = cars.find(c => c.isPlayer);
  if (you) engineUpdate(Math.abs(forwardSpeed(you)), you.boosting);
  updateHud();
}

/* =========================================================================
   HUD
   ========================================================================= */
let boardRows = [];
// Two columns of four. The bottom band cannot grow — anything taller would be
// drawn over the track — so the board is a fixed eight rows however many cars
// are entered, and boardSlice decides which eight are worth the space.
const BOARD_ROWS = 8;

/* Which slice of the order to show. The leaders are always worth seeing and so
   is the fight you are actually in; the cars between them are having somebody
   else's race. On a grid that fits, this returns the whole thing unchanged. */
function boardSlice(order, yi) {
  const n = Math.min(BOARD_ROWS, order.length);
  if (order.length <= n) return order.map((c, i) => i);
  const idx = new Set([0, 1, 2]);                       // the podium places
  for (let k = -2; k <= 2; k++) {                       // ...and your own fight
    const j = yi + k;
    if (j >= 0 && j < order.length) idx.add(j);
  }
  // If that came to fewer than the board holds — you are running near the
  // front, so the two ranges overlap — top it up from the places behind P3.
  for (let j = 3; idx.size < n && j < order.length; j++) idx.add(j);
  return [...idx].sort((a, b) => a - b).slice(0, n);
}

function buildBoard() {
  el.board.innerHTML = "";
  boardRows = [];
  for (let i = 0; i < Math.min(BOARD_ROWS, cars.length); i++) {
    const line = document.createElement("div");
    line.className = "bl";
    const base = ["r", "", "", "g"];
    const row = base.map(cls => {
      const d = document.createElement("div");
      d.className = cls;
      line.appendChild(d);
      return d;
    });
    // Remember the class each cell started with: the row is repainted every
    // frame from scratch, so the separators and the OUT/FIN states cannot
    // accumulate on a cell that has since been reused for another driver.
    row.__base = base;
    el.board.appendChild(line);
    boardRows.push(row);
  }
}

const fmtClock = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, "0")}`;

/* One line of DRS state, shared by both HUDs. There are five things it can be
   telling you and an empty energy bar is not one of them, so each gets words:
   where the zones are, whether the detection point gave you anything, and
   whether the wing is open right now. */
function drsLabel(you) {
  if (session === "race" && you.lapsDone < CONFIG.drsFromLap) return ["⚡ Lap 1 — DRS closed", false];
  if (you.drsArmed) return ["⚡ DRS OPEN — hold SPACE", true];
  if (you.drsZone)  return ["⚡ In zone — not detected", false];
  if (you.drsAppr)  return you.drsDetected ? ["⚡ Detected — zone next", true]
                                           : ["⚡ Detection — too far back", false];
  return ["⚡ Between zones", false];
}

/* The qualifying HUD. Same panels, different meanings: there is no race
   position, no lap count and no gap to the car in front — only a timesheet, a
   session clock and the line six cars are about to fall the wrong side of. */
function updateQualiHud() {
  const you = viewCar();
  if (!you) return;
  const T = qual.times[qual.seg];
  // The board reads live off what the cars have actually set, so a lap that
  // comes in moves somebody up it the moment they cross the line.
  const live = {};
  for (const c of cars) live[c.id] = c.bestLap != null ? c.bestLap : T[c.id];
  const order = bySegmentTime(cars.map(c => c.id), live).map(id => cars.find(c => c.id === id));
  const yi = order.indexOf(you);
  const cutAt = qual.entrants.length - (qual.seg < 2 ? CONFIG.quali.cut : 0);

  el.pos.innerHTML = `${yi + 1}<span style="font-size:13px;color:var(--muted)">/${cars.length}</span>`;
  el.lap.innerHTML = `${qual.flagged ? "FLAG" : fmtClock(qual.clock)}` +
    `<span style="font-size:13px;color:var(--muted)">${segName(qual.seg)}</span>`;
  el.time.textContent = fmtTime(Math.max(0, raceTime - you.lapStart));
  el.best.textContent = you.bestLap != null ? fmtTime(you.bestLap) : "—";
  el.mode.textContent = assisted() ? "🛟 SEMI-PRO" : "PRO";
  el.mode.style.color = assisted() ? "var(--accent)" : "var(--muted)";
