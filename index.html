  el.boost.style.width = (you.boost / CONFIG.boostMax) * 100 + "%";
  el.boost.className = "bFill " + (you.boosting ? "on" : you.drsArmed ? "armed" : "");
  const [qTxt, qLit] = drsLabel(you);
  el.drsLbl.textContent = qTxt;
  el.drsLbl.className = "bLbl" + (qLit ? " armed" : "");
  paintTyreBar(you);
  el.dmg.style.width = (you.damage / CONFIG.damageMax) * 100 + "%";
  el.dmg.className = "bFill " + (you.damage > 0.02 ? "hurt" : "");

  el.pitLbl.textContent = qual.flagged
    ? "🏁 Flag out — finish the lap"
    : `⏱️ ${segName(qual.seg)} — ${yi + 1 <= cutAt ? "through" : "OUT"} · X to end`;
  el.pitLbl.className = "lbl" + (qual.flagged || yi + 1 > cutAt ? " armed" : "");
  el.fault.textContent = "";
  el.blue.textContent = "";   // nobody is a lap down in a sixty-second segment

  if (radioTimer > 0) { el.radioMsg.textContent = `📻 ${radioText}`; el.radio.classList.add("show"); }
  else el.radio.classList.remove("show");

  const slice = boardSlice(order, yi);
  const leader = order[0] && live[order[0].id];
  for (let r = 0; r < boardRows.length; r++) {
    const row = boardRows[r];
    const i = slice[r];
    if (i === undefined) {
      row.forEach((d, k) => { d.textContent = ""; d.className = row.__base[k]; });
      row.__driver = null;
      continue;
    }
    const c = order[i];
    const skipped = r > 0 && slice[r - 1] !== undefined && i > slice[r - 1] + 1;
    row.forEach((d, k) => {
      d.className = row.__base[k];
      d.classList.toggle("nopts", i >= cutAt);      // below the line goes grey
      d.classList.toggle("cut", i === cutAt);       // ...and the line itself is drawn
      d.classList.toggle("gapAbove", skipped && i !== cutAt);
    });
    row[0].textContent = i + 1;
    if (row.__driver !== c.id) { row[1].innerHTML = carGlyph(c.colour, c.accent, 20, c.cam); row.__driver = c.id; }
    row[2].style.color = c.isPlayer ? "var(--accent)" : c.colour;
    row[2].style.fontWeight = c.isPlayer ? "800" : "600";
    row[2].textContent = c.name;
    const t = live[c.id];
    if (t == null) { row[3].textContent = "—"; }
    else if (i === 0) { row[3].textContent = fmtTime(t); }
    else { row[3].textContent = "+" + (t - leader).toFixed(2); }
  }
}

/* The bar says how much is left; the label says WHAT it is. Both matter once
   the two are no longer the same question — a bar half gone on a hard is a
   different race to a bar half gone on a soft. */
function paintTyreBar(you) {
  const c = compoundBy(you.compound);
  el.tyre.style.width = you.tyre * 100 + "%";
  el.tyre.className = "bFill " + (you.tyre < 0.4 ? "gone" : you.tyre < 0.65 ? "worn" : "");
  el.tyreLbl.textContent = `🛞 ${c.label}`;
  el.tyreLbl.style.color = c.colour;
}

function updateHud() {
  if (simRun) return;   // behind the progress overlay, and repainted thousands of times a second
  const order = raceOrder();
  const you = viewCar();
  if (!you) return;
  const laps = raceLaps();

  el.pos.innerHTML = `${order.indexOf(you) + 1}<span style="font-size:13px;color:var(--muted)">/${cars.length}</span>`;
  el.lap.innerHTML = `${clamp(you.lapsDone + 1, 1, laps)}<span style="font-size:13px;color:var(--muted)">/${laps}</span>`;
  el.time.textContent = fmtTime(Math.max(0, raceTime - you.lapStart));
  el.mode.textContent = assisted() ? "🛟 SEMI-PRO" : "PRO";
  el.mode.style.color = assisted() ? "var(--accent)" : "var(--muted)";

  // DRS state has to be legible at a glance or an empty bar reads as a bug
  el.boost.style.width = (you.boost / CONFIG.boostMax) * 100 + "%";
  el.boost.className = "bFill " + (you.boosting ? "on" : you.drsArmed ? "armed" : "");
  const [dTxt, dLit] = drsLabel(you);
  el.drsLbl.textContent = dTxt;
  el.drsLbl.className = "bLbl" + (dLit ? " armed" : "");

  paintTyreBar(you);

  el.dmg.style.width = (you.damage / CONFIG.damageMax) * 100 + "%";
  el.dmg.className = "bFill " + (you.damage > 0.02 ? "hurt" : "");

  if (you.inPit) {
    el.pitLbl.textContent = you.pitPhase === "stopped"
      ? (you.servingStopGo
          ? `🏴 Serving stop-go… ${Math.max(0, you.pitStopLeft).toFixed(1)}s — no work on the car`
          : `🔧 Stationary… ${Math.max(0, you.pitStopLeft).toFixed(1)}s${you.pitFumble ? " — PROBLEM!" : ""}`)
      : you.servingStopGo ? "🏴 Pit lane — serving the penalty"
      : "🔧 Pit lane — limiter on";
    el.pitLbl.className = "lbl armed";
  }
  else if (state === State.FORMATION) { el.pitLbl.textContent = "🚨 Formation lap — SPACE to skip"; el.pitLbl.className = "lbl armed"; }
  /* A penalty owed outranks everything else the pit board could be saying,
     including the safety car — it is the only message with a deadline on it,
     and the deadline is a black flag. Counted down in laps rather than stated
     once, because a driver told "within three laps" four corners ago has no way
     to work out what is left. */
  else if (you.stopGo) {
    const left = Math.max(0, CONFIG.stewards.serveLaps - (you.lapsDone - you.stopGoLap));
    el.pitLbl.textContent = you.isPlayer
      ? `🏴 STOP-GO — box ${left === 0 ? "THIS LAP" : `within ${left} lap${left === 1 ? "" : "s"}`} · no work done`
      : `🏴 ${you.name} has a stop-go to serve`;
    el.pitLbl.className = "lbl armed";
  }
  // Under the safety car the pit board's job changes: the only decision left
  // is whether to take the cheap stop, so that is what it says.
  else if (safety && you.isPlayer) {
    el.pitLbl.textContent = you.pitArmed
      ? `🚨 Safety car — boxing for ${compoundBy(nextTyre).label}`
      : `🚨 Safety car — ENTER to box cheap · C: ${compoundBy(nextTyre).label}`;
    el.pitLbl.className = "lbl armed";
  }
  // What the crew has ready is only the player's business — a spectator with no
  // seat is watching somebody else's race and cannot call for anything.
  else if (you.pitArmed) {
    el.pitLbl.textContent = "🔧 Pitting this lap" +
      (you.isPlayer ? ` — ${compoundBy(nextTyre).label} ready` : "");
    el.pitLbl.className = "lbl armed";
  }
  else {
    el.pitLbl.textContent = you.isPlayer
      ? `ENTER to pit · C: ${compoundBy(nextTyre).label}` + (muted ? " · muted (M)" : "")
      : (muted ? "Watching · muted (M)" : "Watching");
    el.pitLbl.className = "lbl";
  }

  if (radioTimer > 0) {
    el.radioMsg.textContent = `📻 ${radioText}`;
    el.radio.classList.add("show");
  } else el.radio.classList.remove("show");

  /* A fault is only fair if the driver can see it developing — and so is a
     penalty. Time penalties are shown as a running total rather than one
     message at the moment they are given: they are not served, they are simply
     owed, and a driver deciding whether to attack the car in front wants to
     know he is already five seconds down on it. Appended to the fault line
     rather than competing with it, so a car that is both broken and penalised
     reports both. */
  const owed = you.timePenalty > 0 ? ` ⚖️ +${you.timePenalty}s` : "";
  if (you.out) {
    el.fault.textContent = `🏳️ OUT — ${you.outFail.label}`;
    el.fault.className = "lbl";
  } else if (you.fail) {
    el.fault.textContent = `⚠️ ${you.fail.label} — ${Math.max(0, you.failLeft).toFixed(0)}s` +
                           (you.fail.fixable ? " · PIT TO FIX" : "") + owed;
    el.fault.className = "lbl" + (you.fail.fixable ? " fixable" : "");
  } else if (owed) {
    el.fault.textContent = `⚖️ +${you.timePenalty}s penalty — added at the flag`;
    el.fault.className = "lbl fixable";
  } else el.fault.textContent = "";

  /* The blue flag gets its own line rather than sharing the fault board's,
     because the two can be true at once and the flag is the one with a
     deadline. Both directions are shown: being lapped is an instruction, and
     lapping somebody is worth knowing about too, since the car in front is
     about to do something unusual and the player should not read it as a
     move on him. */
  const lapper = you.blueTimer > 0 ? cars.find(c => c.id === you.blueFor) : null;
  const letting = !you.out && !you.finished
    ? cars.find(c => c.blueTimer > 0 && c.blueFor === you.id) : null;
  if (lapper) {
    el.blue.textContent = `🔵 BLUE FLAG — ${lapper.name} is lapping you · LET HIM THROUGH`;
    el.blue.className = "lbl";
  } else if (letting) {
    el.blue.textContent = `🔵 ${letting.name} is being shown blue flags — he should move over`;
    el.blue.className = "lbl passing";
  } else el.blue.textContent = "";

  const scoring = CONFIG.points.length;
  const slice = boardSlice(order, order.indexOf(you));
  for (let r = 0; r < boardRows.length; r++) {
    const row = boardRows[r];
    const i = slice[r];
    // A field of twenty-two never fills fewer rows than the board has, but a
    // shorter grid can — blank the leftovers rather than leaving stale names.
    if (i === undefined) {
      row.forEach((d, k) => { d.textContent = ""; d.className = row.__base[k]; });
      row.__driver = null;
      continue;
    }
    const c = order[i];
    // The dashed line is where the points stop; the dotted one is where the
    // board has skipped somebody, so a jump from P3 to P14 cannot be misread
    // as the field actually running in that order.
    const skipped = r > 0 && slice[r - 1] !== undefined && i > slice[r - 1] + 1;
    row.forEach((d, k) => {
      d.className = row.__base[k];
      d.classList.toggle("nopts", i >= scoring);
      d.classList.toggle("cut", i === scoring);
      d.classList.toggle("gapAbove", skipped && i !== scoring);
    });
    row[0].textContent = i + 1;
    if (row.__driver !== c.id) { row[1].innerHTML = carGlyph(c.colour, c.accent, 20, c.cam); row.__driver = c.id; }
    // a car with a problem goes amber, whatever colour it is painted
    row[2].style.color = c.out ? "var(--muted)" : c.fail ? "#fb923c" : c.isPlayer ? "var(--accent)" : c.colour;
    row[2].style.fontWeight = c.isPlayer ? "800" : "600";
    // The compound letter is what makes somebody else's strategy legible from
    // the board: two cars on the same lap on different rubber are not running
    // the same race, and without this the player cannot tell.
    // A penalty outranks the rest of the tags: a car owing a stop-go is about
    // to lose ten seconds and the places that go with them, which is the single
    // most useful thing the board can tell you about somebody else's race. The
    // scales are the quieter version — seconds owed, invisible until the flag.
    const tag = c.stopGo ? " 🏴" : c.fail ? " ⚠" : c.inPit ? " 🔧"
              : c.timePenalty > 0 ? " ⚖" : c.tyre < 0.4 ? " ▪" : "";
    row[2].textContent = c.out ? c.name
                               : `${c.name} ${compoundBy(c.compound).letter}${tag}`;
    if (c.out) { row[3].textContent = "OUT"; row[3].classList.add("out"); }
    else if (c.finished) { row[3].textContent = "FIN"; row[3].classList.add("fin"); }
    else if (i === 0) { row[3].textContent = "LEAD"; }
    else {
      // Gap to the car genuinely ahead on the road, not to the row above —
      // those differ the moment the board skips a chunk of the field.
      const ahead = order[i - 1];
      const gapUnits = (ahead.progF - c.progF) * track.step;
      const ref = Math.max(70, Math.abs(forwardSpeed(c)));
      row[3].textContent = "+" + (gapUnits / ref).toFixed(1);
    }
  }
}

/* =========================================================================
   Draw
   ========================================================================= */
/* =========================================================================
   Chequered flag — a cloth of squares pushed through a travelling wave, so it
   ripples rather than just sliding about. Drawn on the marshal's post for the
   last lap, then across the screen once the flag is out.
   ========================================================================= */
function drawChequeredFlag(cx, cy, w, h, t, cell, alpha) {
  const cols = Math.max(2, Math.round(w / cell)), rows = Math.max(2, Math.round(h / cell));
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  for (let i = 0; i < cols; i++) {
    const phase = i * 0.5 - t * 8;
    const grip = i / cols;                       // held at the left, free at the right
    const lift = Math.sin(phase) * h * 0.16 * grip;
    const squeeze = 1 - Math.abs(Math.sin(phase)) * 0.16 * grip;
    const shade = 0.72 + 0.28 * Math.cos(phase);
    for (let j = 0; j < rows; j++) {
      const dark = (i + j) % 2 === 0;
      const v = dark ? 22 * shade : 244 * shade;
      ctx.fillStyle = `rgb(${v | 0},${v | 0},${(v * 1.02) | 0})`;
      ctx.fillRect(cx - w / 2 + i * cell,
                   cy + lift + (-h / 2 + j * cell) * squeeze,
                   cell + 0.7, cell * squeeze + 0.7);
    }
  }
  ctx.restore();
}

// The marshal's flag, waved trackside at the line once the leader is on the
// final lap — the first warning you get that the race is nearly done.
function drawMarshalFlag() {
  const s0 = track.pts[0], k = track.pit.k;
  const side = -track.pitSide;
  const px = s0.x + s0.nx * (track.halfWidth + track.runoff + 14 * k) * side;
  const py = s0.y + s0.ny * (track.halfWidth + track.runoff + 14 * k) * side;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(s0.ang + Math.PI / 2);
  ctx.strokeStyle = "#d8dee6"; ctx.lineWidth = 1.6 * k;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -16 * k); ctx.stroke();
  drawChequeredFlag(13 * k, -18 * k, 24 * k, 15 * k, flagTime, 3.7 * k, 0.95);
  ctx.restore();
}

function drawFlagBanner() {
  const t = clamp(flagTime / 0.45, 0, 1);
  const ease = 1 - Math.pow(1 - t, 3);
  const h = 74;
  const y = -h + (h + 10) * ease;
  const cx = CONFIG.viewW / 2, top = CONFIG.bandTop;
  drawChequeredFlag(cx, top + y + h / 2, CONFIG.viewW + 40, h, flagTime, 13, 0.97);

  ctx.save();
  ctx.globalAlpha = clamp((flagTime - 0.3) * 2, 0, 1);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `900 30px ${UI_FONT}`;
  ctx.fillStyle = "rgba(8,12,17,.72)";
  ctx.fillRect(cx - 210, top + y + h + 12, 420, 44);
  ctx.fillStyle = "#ffd23f";
  ctx.fillText("CHEQUERED FLAG", cx, top + y + h + 34);
  ctx.font = `700 14px ${UI_FONT}`;
  ctx.fillStyle = "rgba(233,240,248,.8)";
  ctx.fillText("cool-down lap — cars returning to the pits · SPACE to skip", cx, top + y + h + 70);
  ctx.restore();
}

/* =========================================================================
   Camera — a window onto the world, centred on your car
   ========================================================================= */
let camX = 0, camY = 0;

// World units per canvas unit for the circuit in play.
function camScale() { return track ? track.zoom * CONFIG.camZoom : 1; }

/* The car the screen is about: yours if you are in one, and otherwise the car
   that used to be yours. A driver who has lost his seat still watches the race,
   and what he watches is somebody else driving his old car — which is both the
   most interesting camera in that situation and the one that stops every HUD
   panel having to ask whether it has anything to display. */
function viewCar() {
  return cars.find(c => c.isPlayer) || cars.find(c => c.id === 0) || cars[0] || null;
}

function updateCamera(dt, snap) {
  if (!track) return;
  const you = viewCar();
  if (!you) return;

  const z = camScale();
  const halfW = CONFIG.viewW / (2 * z), halfH = CONFIG.viewH / (2 * z);

  // Lead the car a little so you see where you are going rather than where you
  // have been — but only forwards, or reversing would swing the view around.
  let tx = you.x + you.vx * CONFIG.camLook;
  let ty = you.y + you.vy * CONFIG.camLook;

  // Never show beyond the world: a circuit narrower than the view is centred.
  tx = track.W <= halfW * 2 ? track.W / 2 : clamp(tx, halfW - CONFIG.camEdge, track.W - halfW + CONFIG.camEdge);
  ty = track.H <= halfH * 2 ? track.H / 2 : clamp(ty, halfH - CONFIG.camEdge, track.H - halfH + CONFIG.camEdge);

  if (snap) { camX = tx; camY = ty; return; }
  const a = 1 - Math.exp(-CONFIG.camLerp * dt);   // frame-rate independent easing
  camX += (tx - camX) * a;
  camY += (ty - camY) * a;
}

/* =========================================================================
   Minimap — the whole circuit at a glance, since the main view no longer
   shows it. Track and panel are drawn once per race; only the cars move.
   ========================================================================= */
const MINI = { w: 210, h: CONFIG.bandBottom - 26, pad: 12 };

function buildMinimap(tr) {
  const SS = 2;
  const s = Math.min((MINI.w - MINI.pad * 2) / tr.W, (MINI.h - MINI.pad * 2) / tr.H);
  const ox = (MINI.w - tr.W * s) / 2, oy = (MINI.h - tr.H * s) / 2;
  const cv = document.createElement("canvas");
  cv.width = MINI.w * SS; cv.height = MINI.h * SS;
  const g = cv.getContext("2d");
  g.scale(SS, SS);

  g.fillStyle = "rgba(9,13,19,.72)";
  g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 1;
  g.beginPath(); g.roundRect(0.5, 0.5, MINI.w - 1, MINI.h - 1, 10); g.fill(); g.stroke();

  g.save();
  g.translate(ox, oy); g.scale(s, s);
  g.beginPath();
  g.moveTo(tr.pts[0].x, tr.pts[0].y);
  for (let i = 1; i < tr.M; i++) g.lineTo(tr.pts[i].x, tr.pts[i].y);
  g.closePath();
  g.lineJoin = "round"; g.lineCap = "round";
  g.strokeStyle = "rgba(233,240,248,.24)";
  g.lineWidth = Math.max(2.5 / s, tr.halfWidth * 2);
  g.stroke();
  // the DRS zones, so you can see where the next one is without knowing the
  // circuit — same green as the road markings
  if (tr.drs) for (const z of tr.drs.zones) {
    const span = ((z.end - z.start) % tr.M + tr.M) % tr.M;
    g.beginPath();
    g.moveTo(tr.pts[z.start].x, tr.pts[z.start].y);
    for (let t = 1; t <= span; t++) { const p = tr.pts[(z.start + t) % tr.M]; g.lineTo(p.x, p.y); }
    g.strokeStyle = "rgba(61,220,132,.75)";
    g.lineWidth = Math.max(2.5 / s, tr.halfWidth * 2);
    g.stroke();
  }

  const s0 = tr.pts[0], tick = tr.halfWidth * 1.5;
  g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 2 / s;
  g.beginPath();
  g.moveTo(s0.x + s0.nx * tick, s0.y + s0.ny * tick);
  g.lineTo(s0.x - s0.nx * tick, s0.y - s0.ny * tick);
  g.stroke();
  g.restore();

  miniCanvas = cv;
  tr.mini = { s, ox, oy };
}

function drawMinimap() {
  if (!miniCanvas || !track.mini) return;
  const x0 = (CONFIG.canvasW - MINI.w) / 2;
  const y0 = CONFIG.bandTop + CONFIG.viewH + (CONFIG.bandBottom - MINI.h) / 2;
  ctx.drawImage(miniCanvas, x0, y0, MINI.w, MINI.h);

  const { s, ox, oy } = track.mini;
  const mx = x => x0 + ox + x * s, my = y => y0 + oy + y * s;
  ctx.save();

  // the slice of the world the main view is showing
  const z = camScale();
  const vw = CONFIG.viewW / z * s, vh = CONFIG.viewH / z * s;
  ctx.strokeStyle = "rgba(255,255,255,.20)"; ctx.lineWidth = 1;
  ctx.strokeRect(mx(camX) - vw / 2, my(camY) - vh / 2, vw, vh);

  for (const car of cars) {
    ctx.globalAlpha = car.out ? 0.35 : 1;
    ctx.fillStyle = car.colour;
    ctx.beginPath(); ctx.arc(mx(car.x), my(car.y), car.isPlayer ? 3.6 : 2.6, 0, TAU); ctx.fill();
    if (car.isPlayer) { ctx.strokeStyle = "#0b0f14"; ctx.lineWidth = 1.3; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function draw() {
  const z = camScale();

  // ---- the bands the HUD sits in, so no panel is ever over the road ----
  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);

  ctx.save();
  // clip to the track window; everything inside is drawn in world coordinates
  ctx.beginPath();
  ctx.rect(0, CONFIG.bandTop, CONFIG.viewW, CONFIG.viewH);
  ctx.clip();
  ctx.translate(0, CONFIG.bandTop);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 13, (Math.random() - 0.5) * shake * 13);
  ctx.translate(CONFIG.viewW / 2, CONFIG.viewH / 2);
  ctx.scale(z, z);
  ctx.translate(-camX, -camY);

  /* No track means no world. Between two races — an invitation handing the
     season back its own geometry, most of all — `track` is null for as long as
     it takes the next one to be built, and everything below reads it: the cars,
     the safety car and the marshal's flag are all sized off track.carScale.
     Drawing them against a null track is what used to throw, and a throw in
     here kills the animation frame for good. */
  if (!track) {
    ctx.fillStyle = "#132018";
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
  } else {
    if (trackCanvas) ctx.drawImage(trackCanvas, 0, 0, track.W, track.H);
    else { ctx.fillStyle = "#132018"; ctx.fillRect(0, 0, CONFIG.width, CONFIG.height); }
    if (marksCanvas) ctx.drawImage(marksCanvas, 0, 0, track.W, track.H);

    // particles
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1) * 0.85;
      ctx.fillStyle = p.colour;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (paceCar && !paceCar.gone) drawSafetyCar(paceCar);

    // cars, player last so they're never buried
    const drawList = cars.slice().sort((a, b) => (a.isPlayer ? 1 : 0) - (b.isPlayer ? 1 : 0));
    for (const car of drawList) drawCar(car);

    if (state === State.RACING) {
      // waved from the moment the leader starts the last lap
      const lead = cars.reduce((a, c) => (c.progF > (a ? a.progF : -1e9) ? c : a), null);
      if (lead && lead.lapsDone >= raceLaps() - 1) drawMarshalFlag();
    }
    if (state === State.COOLDOWN) drawMarshalFlag();
  }

  ctx.restore();

  if (track && (state === State.RACING || state === State.COOLDOWN ||
                state === State.QUALI || state === State.FORMATION ||
                state === State.REPLAY)) drawMinimap();
  if (state === State.COUNT) drawLights();
  if (goFlashTimer > 0 && state === State.RACING) drawGo();
  if (state === State.COOLDOWN) drawFlagBanner();
  if (state === State.QUALI) drawQualiClock();
  if (state === State.FORMATION) drawFlagBanner("🚨 FORMATION LAP", "SPACE TO SKIP");
  else if (safety) drawFlagBanner("🚨 SAFETY CAR",
    safety.left <= CONFIG.safety.warnAt
      ? `GREEN IN ${Math.max(0, Math.ceil(safety.left))}s — GET READY`
      : `${Math.ceil(safety.left)}s · PIT STOPS ARE CHEAP`);
}

/* A safety car, from above — a saloon rather than a single-seater, which is
   the whole point of it being recognisable at a glance: wider body, no exposed
   wheels, and a light bar across the roof that actually flashes. */
function drawSafetyCar(pc) {
  const k = track.carScale * 1.05;
  ctx.save();
  ctx.translate(pc.x, pc.y);
  ctx.rotate(pc.a);
  ctx.scale(k, k);

  ctx.fillStyle = "rgba(0,0,0,.30)";
  ctx.beginPath();
  ctx.ellipse(-0.6, 1.6, 11.5, 6.2, 0, 0, TAU);
  ctx.fill();

  // tyres, tucked under the arches rather than standing out in the air
  ctx.fillStyle = "#15181d";
  ctx.fillRect(-7.4, -5.6, 3.4, 1.9);
  ctx.fillRect(-7.4,  3.7, 3.4, 1.9);
  ctx.fillRect( 4.4, -5.6, 3.4, 1.9);
  ctx.fillRect( 4.4,  3.7, 3.4, 1.9);

  // body
  ctx.fillStyle = "#e8ecf2";
  ctx.beginPath();
  ctx.roundRect(-11, -5.2, 22, 10.4, 3.2);
  ctx.fill();
  // windscreen and rear glass
  ctx.fillStyle = "#2c3946";
  ctx.beginPath(); ctx.roundRect(-1.2, -4.1, 4.6, 8.2, 1.4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-6.8, -3.8, 3.0, 7.6, 1.2); ctx.fill();
  // the orange stripe every safety car has ever worn
  ctx.fillStyle = "#ff8f1f";
  ctx.fillRect(-11, -1.0, 22, 2.0);

  // light bar — the two halves alternate, so it reads as flashing rather than
  // blinking on and off
  const phase = Math.floor(performance.now() / 130) % 2;
  ctx.fillStyle = phase ? "#ff3b3b" : "#5a1414";
  ctx.fillRect(-4.4, -5.9, 3.4, 1.5);
  ctx.fillStyle = phase ? "#2b2f66" : "#4a7bff";
  ctx.fillRect(-4.4,  4.4, 3.4, 1.5);
  ctx.restore();
}

function drawQualiClock() {
  const cx = CONFIG.viewW / 2, cy = CONFIG.bandTop + 34;
  const urgent = !qual.flagged && qual.clock <= 10;
  ctx.save();
  ctx.fillStyle = "rgba(8,11,16,.80)";
  ctx.beginPath(); ctx.roundRect(cx - 96, cy - 24, 192, 48, 12); ctx.fill();
  ctx.textAlign = "center";
  ctx.fillStyle = qual.flagged ? "#ffffff" : urgent ? "#ff5a4d" : "#4ade80";
  ctx.font = `800 26px ${UI_FONT}`;
  ctx.fillText(qual.flagged ? "CHEQUERED" : fmtClock(qual.clock), cx, cy + 4);
  ctx.fillStyle = "#8fa0b8";
  ctx.font = `700 11px ${UI_FONT}`;
  ctx.fillText(`${segName(qual.seg)} · ${qual.entrants.length} CARS` +
               (qual.seg < 2 ? ` · ${CONFIG.quali.cut} ELIMINATED` : " · SHOOT-OUT"), cx, cy + 19);
  ctx.restore();
}

// The flashing board at the top of the screen. Shared by the formation lap and
// the safety car because they are the same message — the race is not on — and
// showing it two different ways would only invite reading them as two states.
function drawFlagBanner(title, sub) {
  const cx = CONFIG.viewW / 2, cy = CONFIG.bandTop + 34;
  ctx.save();
  ctx.fillStyle = "rgba(8,11,16,.80)";
  ctx.beginPath(); ctx.roundRect(cx - 118, cy - 22, 236, 44, 12); ctx.fill();
  ctx.textAlign = "center";
  ctx.fillStyle = Math.floor(performance.now() / 320) % 2 ? "#ff8f1f" : "#ffd23f";
  ctx.font = `800 17px ${UI_FONT}`;
  ctx.fillText(title, cx, cy + 1);
  ctx.fillStyle = "#8fa0b8";
  ctx.font = `700 10.5px ${UI_FONT}`;
  ctx.fillText(sub, cx, cy + 15);
  ctx.restore();
}

// Darken/lighten a #rrggbb by a fraction, for panel shading.
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * (1 + amt)), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * (1 + amt)), 0, 255);
  const b = clamp(Math.round((n & 255) * (1 + amt)), 0, 255);
  return `rgb(${r},${g},${b})`;
}

// A top-down open-wheel car, drawn nose-first along +x so it only has to be
// rotated to the heading. Vehicle emoji are side-on views and look wrong from
// above no matter how you spin them, so the whole car is canvas primitives.
/* =========================================================================
   The car, from above.

   Every measurement is the real one, converted at roughly 0.24m per world
   unit, laid out around the same axes the collision capsule uses. Nose points
   +x, so the car runs from x = +11.8 (front wing) to x = -11.8 (rear wing).

     overall            5.63 m long, 2.00 m wide
     wheelbase          3.60 m
     front track        1.60 m      rear track   1.55 m
     tyres              0.72 m across, 0.305 front / 0.405 rear wide
     front wing         1.80 m span — very nearly the full width of the car
     rear wing          1.05 m span — barely half of that

   That last pair is what makes the silhouette recognisable: an F1 car is wide
   at the front wing, narrow at the rear wing, and has visibly fatter rear
   tyres than fronts. Get those three right and it reads correctly at 30px.
   ========================================================================= */
function drawF1Car(car) {
  const col = car.colour;
  const dark = shade(col, -0.34);

  // ---- floor, the full-length plank everything else sits on ----
  ctx.fillStyle = "rgba(10,13,18,.55)";
  ctx.beginPath();
  ctx.moveTo(  6.4, -1.7); ctx.lineTo( 2.0, -3.3); ctx.lineTo(-8.6, -3.3);
  ctx.lineTo(-8.6,  3.3);  ctx.lineTo( 2.0,  3.3); ctx.lineTo( 6.4,  1.7);
  ctx.closePath(); ctx.fill();

  // ---- tyres: rears are visibly fatter than fronts, as they really are ----
  ctx.fillStyle = "#15181d";
  ctx.fillRect(-9.7, -4.2, 3.1, 1.75);   // rear left   (0.405 m wide)
  ctx.fillRect(-9.7,  2.45, 3.1, 1.75);  // rear right
  ctx.fillRect( 5.9, -4.2, 3.1, 1.35);   // front left  (0.305 m wide)
  ctx.fillRect( 5.9,  2.85, 3.1, 1.35);  // front right
  // a lighter band across each tyre so rotation is legible at speed
  ctx.fillStyle = "rgba(255,255,255,.10)";
  ctx.fillRect(-8.6, -4.2, 0.7, 1.75); ctx.fillRect(-8.6, 2.45, 0.7, 1.75);
  ctx.fillRect( 7.1, -4.2, 0.7, 1.35); ctx.fillRect( 7.1, 2.85, 0.7, 1.35);

  // ---- suspension: wishbones out to each wheel ----
  ctx.strokeStyle = "rgba(20,24,30,.85)";
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(6.2, -1.5); ctx.lineTo(7.4, -3.0);
  ctx.moveTo(6.2,  1.5); ctx.lineTo(7.4,  3.0);
  ctx.moveTo(-7.4, -1.9); ctx.lineTo(-8.2, -3.0);
  ctx.moveTo(-7.4,  1.9); ctx.lineTo(-8.2,  3.0);
  ctx.stroke();

  // ---- rear wing: narrow, and the giveaway that this is an F1 car ----
  ctx.fillStyle = dark;
  ctx.fillRect(-11.8, -2.3, 0.9, 4.6);            // endplate-to-endplate beam
  ctx.fillStyle = col;
  ctx.fillRect(-11.3, -2.3, 1.5, 4.6);            // the wing itself
  ctx.fillStyle = "rgba(255,255,255,.22)";
  ctx.fillRect(-11.3, -2.3, 0.6, 4.6);            // DRS slot, catching the light
  ctx.fillStyle = dark;                            // endplates
  ctx.fillRect(-11.8, -2.5, 2.0, 0.55);
  ctx.fillRect(-11.8,  1.95, 2.0, 0.55);

  // ---- diffuser, under the rear crash structure ----
  ctx.fillStyle = "rgba(8,10,14,.7)";
  ctx.fillRect(-10.9, -1.8, 1.6, 3.6);

  // ---- bodywork: engine cover, sidepods, chassis, nose, in one outline ----
  // Widest at the sidepods, waisted in hard toward the rear axle ("coke
  // bottle"), then a long narrow nose to the front wing.
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-9.6,  0);      // tail of the engine cover
  ctx.lineTo(-9.0, -1.25);
  ctx.lineTo(-6.2, -1.9);    // the waist
  ctx.lineTo(-4.0, -3.2);    // sidepod shoulder
  ctx.lineTo(-0.2, -3.35);   // sidepod at its widest
  ctx.lineTo( 1.6, -2.5);    // in toward the cockpit
  ctx.lineTo( 3.6, -1.55);
  ctx.lineTo( 8.2, -0.85);   // the nose, long and narrow
  ctx.lineTo(10.6, -0.72);
  ctx.lineTo(10.6,  0.72);
  ctx.lineTo( 8.2,  0.85);
  ctx.lineTo( 3.6,  1.55);
  ctx.lineTo( 1.6,  2.5);
  ctx.lineTo(-0.2,  3.35);
  ctx.lineTo(-4.0,  3.2);
  ctx.lineTo(-6.2,  1.9);
  ctx.lineTo(-9.0,  1.25);
  ctx.closePath();
  ctx.fill();

  // sidepod inlets, darker so the shoulders read as a separate surface
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(1.5, -2.6); ctx.lineTo(-0.3, -3.4); ctx.lineTo(-4.0, -3.25);
  ctx.lineTo(-4.0, -2.2); ctx.lineTo(0.6, -2.1);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(1.5,  2.6); ctx.lineTo(-0.3,  3.4); ctx.lineTo(-4.0,  3.25);
  ctx.lineTo(-4.0,  2.2); ctx.lineTo(0.6,  2.1);
  ctx.closePath(); ctx.fill();

  // ---- front wing: the widest thing on the car ----
  ctx.fillStyle = col;
  ctx.fillRect( 9.5, -3.9, 1.6, 7.8);
  ctx.fillStyle = "rgba(255,255,255,.20)";
  ctx.fillRect(10.6, -3.9, 0.7, 7.8);             // the upper flap
  ctx.fillStyle = dark;                            // endplates, turned in
  ctx.fillRect( 9.2, -4.25, 2.6, 0.55);
  ctx.fillRect( 9.2,  3.7,  2.6, 0.55);

  // ---- engine cover stripe: the camera pod. This is the cue that separates
  // two cars in the same livery — light for the lead car, dark for the second,
  // exactly as the real thing does it. ----
  ctx.fillStyle = car.cam === "dark" ? "rgba(10,14,20,.66)" : "rgba(255,255,255,.46)";
  ctx.beginPath();
  ctx.moveTo(-9.4, 0); ctx.lineTo(-8.4, -0.75); ctx.lineTo(-1.2, -0.95);
  ctx.lineTo(-1.2, 0.95); ctx.lineTo(-8.4, 0.75);
  ctx.closePath(); ctx.fill();

  // ---- airbox, right behind the driver's head ----
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(-1.4, -1.15); ctx.lineTo(0.5, -1.35); ctx.lineTo(0.5, 1.35);
  ctx.lineTo(-1.4, 1.15);
  ctx.closePath(); ctx.fill();

  // ---- cockpit opening ----
  ctx.fillStyle = "#10131a";
  ctx.beginPath(); ctx.ellipse(1.5, 0, 2.1, 1.35, 0, 0, TAU); ctx.fill();

  // ---- helmet — the second identity cue after body colour ----
  ctx.fillStyle = car.accent || "#ffffff";
  ctx.beginPath(); ctx.ellipse(1.3, 0, 1.15, 0.95, 0, 0, TAU); ctx.fill();

  // ---- halo: the hoop over the cockpit, with its forward strut ----
  ctx.strokeStyle = "rgba(226,232,240,.75)";
  ctx.lineWidth = 0.45;
  ctx.beginPath(); ctx.ellipse(1.5, 0, 2.5, 1.7, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4.0, 0); ctx.lineTo(3.0, 0); ctx.stroke();
}

function drawCar(car) {
  if (car.gone) return;               // recovered — off the circuit entirely

  // Traced street circuits are drawn narrow, so the cars scale with the track
  // rather than the track being widened to suit one fixed car size.
  const k = track.carScale;
  ctx.save();
  ctx.translate(car.x, car.y);

  if (car.out) {
    // stopped, hazard lights on, fading as the marshals get to it
    ctx.globalAlpha = clamp(0.35 + car.recover / 6, 0.35, 0.95);
    ctx.font = `${(15 * k).toFixed(1)}px ${EMOJI_FONT}`;
    ctx.textAlign = "center";
    ctx.fillText(Math.floor(raceTime * 3) % 2 ? "🏳️" : "💨", 0, -21 * k);
  }

  if (car.isPlayer && !car.out) {
    // Sized off the car so a narrower car gets a tighter ring — at the old
    // radius it would now be a hoop with a lot of tarmac inside it.
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.7 * k;
    const rr = (CONFIG.carHalfL + 2.2 + Math.sin(performance.now() / 240) * 1.4) * k;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.stroke();
  }

  if (car.inPit && car.pitPhase === "stopped") {
    ctx.font = `${(15 * k).toFixed(1)}px ${EMOJI_FONT}`;
    ctx.fillText(car.pitFumble ? "😤" : "🔧", 0, -21 * k);
  }

  ctx.rotate(car.a);
  ctx.scale(k, k);

  if (car.boosting) {
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = "#9fe8ff";
    ctx.beginPath(); ctx.arc(-13.5, 0, 3.6 + Math.random() * 2.4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Shadow follows the car's own footprint — a round one under a car three
  // times longer than it is wide is the giveaway that nothing is to scale.
  ctx.fillStyle = "rgba(0,0,0,.30)";
  ctx.beginPath();
  ctx.ellipse(-0.6, 1.4, CONFIG.carHalfL * 0.92, CONFIG.carHalfW * 1.12, 0, 0, TAU);
  ctx.fill();

  drawF1Car(car);
  ctx.restore();
}

function drawLights() {
  const cx = CONFIG.viewW / 2, cy = CONFIG.bandTop + 96;
  ctx.save();
  ctx.fillStyle = "rgba(8,11,16,.82)";
  ctx.beginPath(); ctx.roundRect(cx - 152, cy - 34, 304, 68, 14); ctx.fill();
  for (let i = 0; i < 5; i++) {
    const on = i < lightsLit;
    ctx.fillStyle = on ? "#e2483f" : "#2a3038";
    ctx.beginPath(); ctx.arc(cx - 116 + i * 58, cy, 20, 0, TAU); ctx.fill();
    if (on) { ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(cx - 116 + i * 58, cy, 27, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  }
  ctx.fillStyle = "#ffffff";
  ctx.font = `700 15px ${UI_FONT}`;
  ctx.fillText(`${track.circuit.flag}  ${track.circuit.name.toUpperCase()}  ·  ${raceLaps()} LAPS`, cx, cy + 52);
  ctx.restore();
}

function drawGo() {
  const t = clamp(goFlashTimer / 1.1, 0, 1);
  ctx.save();
  ctx.globalAlpha = t;
  ctx.fillStyle = "#4ade80";
  ctx.font = `900 ${72 + (1 - t) * 26}px ${UI_FONT}`;
  ctx.fillText("GO!", CONFIG.viewW / 2, CONFIG.bandTop + 110);
  ctx.restore();
}

/* =========================================================================
   Screens
   ========================================================================= */
// Every state in which there are cars on the road and the overlay is down.
/* =========================================================================
   HIGHLIGHTS — playback

   A clip is a list of poses, so playing one is not a simulation: nothing is
   stepped, nothing is decided, the cars are simply put where they were. That
   is what makes it safe to watch a replay from the result screen and come back
   to a result screen that has not changed underneath you.

   It draws through the ordinary draw() rather than through a second renderer.
   The globals draw() reads — the track, its three canvases, the field — are
   swapped for the replay's on the way in and swapped back on the way out, so
   there is exactly one piece of code that knows how a car looks on a circuit,
   and a clip is drawn by it.
   ========================================================================= */
let rep = null;

function repEnter(r, ci, from) {
  const circuit = reelCircuit(r);
  if (!circuit || !r.clips.length) return false;

  /* A clip holds world coordinates, and a circuit that has been magnified since
     is a bigger world — so the poses have to be mapped across or the field
     drives round a lap that is no longer there. The magnification is a uniform
     one about the centre of the world, which is what makes this three numbers
     rather than a re-simulation. A reel from before scales were recorded at all
     was necessarily recorded at scale 1. */
  const was = r.ls ?? 1, now = circuit.layoutScale ?? 1;
  let warp = null;
  if (was !== now) {
    const a = worldFor(circuit, was), b = worldFor(circuit, now);
    warp = { s: now / was, ox: b.W / 2 - (a.W / 2) * (now / was), oy: b.H / 2 - (a.H / 2) * (now / was) };
  }

  rep = {
    r, ci: -1, clip: null, dec: null, warp,
    t: 0, playing: true, speed: 1, follow: 0, hint: 0,
    note: "", noteT: 0,
    from,
    // Everything draw() and the camera read, put back exactly on the way out.
    saved: { track, trackCanvas, marksCanvas, marksCtx, marksSS, miniCanvas,
             cars, particles, paceCar, safety, raceTime, session, camX, camY },
  };

  track = buildTrack(circuit);
  renderTrack(track);          // ...which is what writes the three canvases
  particles = [];
  paceCar = null;
  safety = null;
  session = "race";
  // A stand-in for each car: everything drawCar reads and nothing else. These
  // are never stepped — repApply writes a pose straight onto them.
  cars = r.cars.map(m => ({
    id: m.id, name: m.name, colour: m.colour, accent: m.accent, cam: m.cam,
    isPlayer: !!m.you, x: 0, y: 0, a: 0, vx: 0, vy: 0,
    out: false, gone: false, inPit: false, pitPhase: null, pitFumble: false,
    finished: false, boosting: false, recover: 0,
  }));

  repGo(clamp(ci, 0, r.clips.length - 1));
  go(State.REPLAY);
  return true;
}

/* =========================================================================
   HIGHLIGHTS — writing a reel out as a video

   A reel is not a video. It is twenty-two poses ten times a second and a list
   of what happened, which is what makes it small enough to keep a season of
   them in a browser — and also what makes it unwatchable anywhere except in
   this game. So the way out is not a converter but the replay itself: the reel
   is played from its first moment to its last while the canvas is recorded,
   and what comes out the other end is an ordinary .webm anybody can open.

   That means it happens in real time. A twelve-moment reel takes as long to
   record as it takes to watch, and there is no way round that short of
   rendering offscreen at speed — which the browser's recorder, being wired to
   a live stream rather than to frames, will not do.

   The HUD is drawn on the canvas, so the captions, the running order and the
   moment bar are all in the film. The two things that must NOT be are the
   keyboard hints and the recording light: the first is instructions to
   somebody sitting at the game, the second is a lie about the film it appears
   in. The hints are suppressed for the duration and the light is a DOM element
   floating over the canvas, out of the recorder's reach.

   There is no sound. The game's audio is engine note and tyre scrub generated
   from a car's state as it is stepped, and a replay steps nothing — there is
   no engine running to record. A silent film of the actual race is honest;
   a soundtrack invented for it afterwards would not be.
   ========================================================================= */
const REC_FPS   = 60;
const REC_BPS   = 12_000_000;   // ~12 Mbit for a 1000×790 canvas — generous on purpose
const REC_TYPES = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
let repRec = null;

function recType() {
  if (typeof MediaRecorder !== "function" || typeof canvas.captureStream !== "function") return null;
  return REC_TYPES.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (_) { return false; } }) || null;
}

// Something a person would recognise in a downloads folder six months later.
function recName(r) {
  const slug = s => String(s || "").replace(/[^\w]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase();
  const where = slug(r.gp) || slug(r.ck) || "race";
  const when  = r.year ? `-year-${r.year}${r.round ? `-round-${r.round}` : ""}` : "";
  return `run-to-the-podium-${where}${when}.webm`;
}

// A line on the replay HUD, for the few seconds after something has happened
// that the player asked for and cannot otherwise see the result of.
function repNote(text) {
  if (!rep) return;
  rep.note = text;
  rep.noteT = 6;
}

function recBar(on, text) {
  if (!el.rec) return;
  el.rec.classList.toggle("on", !!on);
  if (text && el.recTxt) el.recTxt.textContent = text;
}

/* Start recording the reel currently open, from its first moment.

   Playback is forced back to the top and to normal speed first. A recording
   that began halfway through at half speed because that is where the player
   happened to be would be a surprising thing to be handed. */
function repRecordStart() {
  if (!rep || repRec) return;
  if (!reelWatchable(rep.r)) { beep(240, 0.08, "sine", 0.04); return; }

  const type = recType();
  if (!type) {
    repNote("This browser will not record video — try Chrome or Edge.");
    beep(240, 0.08, "sine", 0.04);
    return;
  }

  const rec = { chunks: [], type, name: recName(rep.r), save: true };
  let mr;
  try {
    mr = new MediaRecorder(canvas.captureStream(REC_FPS), { mimeType: type, videoBitsPerSecond: REC_BPS });
  } catch (_) {
    repNote("This browser would not start a recording.");
    beep(240, 0.08, "sine", 0.04);
    return;
  }
  rec.mr = mr;
  mr.ondataavailable = (e) => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  /* The file is written here rather than where stop() is called, because the
     recorder keeps producing data for a moment after being told to stop and
     the last chunk of the reel is in it. */
  mr.onstop = () => {
    recBar(false);
    if (!rec.save || !rec.chunks.length) { repNote("Recording stopped — nothing written."); return; }
    try {
      const blob = new Blob(rec.chunks, { type: rec.type.split(";")[0] });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = rec.name;
      a.click();
      // Released on a timer, not in this tick: revoking immediately can beat
      // the download to the URL. See exportSave, which learned it first.
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      repNote(`📥 ${rec.name} — ${(blob.size / 1048576).toFixed(1)} MB, in your downloads.`);
      beep(720, 0.12, "sine", 0.05);
    } catch (_) {
      repNote("The video would not be written to a file.");
      beep(240, 0.08, "sine", 0.04);
    }
  };

  repRec = rec;
  rep.speed = 1;
  rep.note = "";
  repGo(0);
  rep.t = 0;
  rep.playing = true;

  try { mr.start(); } catch (_) {
    repRec = null;
    repNote("This browser would not start a recording.");
    beep(240, 0.08, "sine", 0.04);
    return;
  }
  recBar(true, `● RECORDING — ${rep.r.clips.length} moment${rep.r.clips.length === 1 ? "" : "s"} · ESC to stop early`);
  beep(620, 0.06, "sine", 0.035);
}

/* Stop it. `save` false throws the film away; anything else writes out what
   was captured, which is why stopping early still gives you a usable clip of
   however much of the reel had played. */
function repRecordStop(save) {
  if (!repRec) return;
  const rec = repRec;
  repRec = null;
  rec.save = save !== false;
  recBar(false);
  try { rec.mr.stop(); } catch (_) { }
}

function repExit() {
  if (!rep) return;
  // Leaving mid-recording keeps what was filmed — the reel played is the reel
  // recorded, and half a reel asked for is worth more than none.
  repRecordStop(true);
  const s = rep.saved, back = rep.from;
  track = s.track; trackCanvas = s.trackCanvas; marksCanvas = s.marksCanvas;
  marksCtx = s.marksCtx; marksSS = s.marksSS; miniCanvas = s.miniCanvas;
  cars = s.cars; particles = s.particles; paceCar = s.paceCar; safety = s.safety;
  raceTime = s.raceTime; session = s.session; camX = s.camX; camY = s.camY;
  rep = null;
  go(back);
}

// Unpack one clip. The two arrays are views on the decoded bytes, so this
// costs one allocation each rather than one per frame per car.
function repDecode(clip) {
  const pb = b64To(clip.p);
  return {
    p: new Int16Array(pb.buffer, pb.byteOffset, pb.byteLength >> 1),
    f: b64To(clip.f),
    F: clip.F,
  };
}

function repGo(i) {
  const clip = rep.r.clips[i];
  if (!clip) return;
  rep.ci = i;
  rep.clip = clip;
  rep.dec = repDecode(clip);
  rep.t = 0;
  // The camera starts on whoever the moment is about, and F cycles from there
  // through the other car involved, the leader and your own.
  rep.follow = Math.max(0, rep.r.cars.findIndex(m => m.id === clip.subject));
  repApply(0);
  repCamera(0, true);
}

function repDur() { return rep.dec ? Math.max(0.001, (rep.dec.F - 1) / rep.r.hz) : 0.001; }

/* Put the field where it was at time t. Positions are interpolated between the
   two samples either side, which is what lets ten samples a second play back
   at sixty frames without stepping — and the velocity the camera leads the car
   by is DERIVED from the same two samples rather than recorded, because a
   difference between two positions is exactly what a velocity is. */
function repApply(t) {
  const { p, f, F } = rep.dec, n = rep.r.n, hz = rep.r.hz;
  const w = rep.warp;
  const wx = w ? v => v * w.s + w.ox : v => v;
  const wy = w ? v => v * w.s + w.oy : v => v;
  const x = clamp(t * hz, 0, F - 1);
  const i0 = Math.floor(x), i1 = Math.min(F - 1, i0 + 1), u = x - i0;
  for (let k = 0; k < n; k++) {
    const c = cars[k];
    if (!c) continue;
    const o0 = (i0 * n + k) * 3, o1 = (i1 * n + k) * 3;
    const x0 = wx(p[o0] / POSE_Q), y0 = wy(p[o0 + 1] / POSE_Q);
    const x1 = wx(p[o1] / POSE_Q), y1 = wy(p[o1 + 1] / POSE_Q);
    c.x = lerp(x0, x1, u);
    c.y = lerp(y0, y1, u);
    const a0 = p[o0 + 2] / ANG_Q;
    c.a = a0 + angDiff(p[o1 + 2] / ANG_Q, a0) * u;   // the short way round
    c.vx = (x1 - x0) * hz;
    c.vy = (y1 - y0) * hz;
    const b = f[i0 * n + k];
    c.out = !!(b & 1); c.gone = !!(b & 2); c.inPit = !!(b & 4);
    c.pitPhase = (b & 8) ? "stopped" : null;
    c.pitFumble = !!(b & 16); c.finished = !!(b & 32); c.boosting = !!(b & 64);
    c.recover = c.out ? 3 : 0;     // hazard lights at full brightness, not fading
  }
}

// The race camera, aimed at the followed car rather than at the player's.
function repCamera(dt, snap) {
  const you = cars[rep.follow] || cars[0];
  if (!track || !you) return;
  const z = camScale();
  const halfW = CONFIG.viewW / (2 * z), halfH = CONFIG.viewH / (2 * z);
  let tx = you.x + you.vx * CONFIG.camLook;
  let ty = you.y + you.vy * CONFIG.camLook;
  tx = track.W <= halfW * 2 ? track.W / 2 : clamp(tx, halfW - CONFIG.camEdge, track.W - halfW + CONFIG.camEdge);
  ty = track.H <= halfH * 2 ? track.H / 2 : clamp(ty, halfH - CONFIG.camEdge, track.H - halfH + CONFIG.camEdge);
  if (snap) { camX = tx; camY = ty; return; }
  const a = 1 - Math.exp(-CONFIG.camLerp * dt);
  camX += (tx - camX) * a;
  camY += (ty - camY) * a;
}

function repUpdate(dt) {
  if (!rep) return;
  if (rep.hint > 0) rep.hint -= dt;
  if (rep.noteT > 0) rep.noteT -= dt;
  const dur = repDur();
  if (rep.playing) {
    rep.t += dt * rep.speed;
    if (rep.t >= dur) {
      // Clip to clip without asking — a highlights reel that stopped between
      // every moment would be a menu with film in it.
      if (rep.ci + 1 < rep.r.clips.length) { repGo(rep.ci + 1); return; }
      rep.t = dur;
      rep.playing = false;
      // The last moment has played out, so the film is complete: close it here
      // rather than waiting to be told, since being told is the one thing a
      // recording that runs to the end never needs.
      repRecordStop(true);
    }
  }
  repApply(rep.t);
  repCamera(dt, false);
}

// Step to another clip, or off either end of the reel.
function repStep(d) {
  const i = rep.ci + d;
  if (i < 0 || i >= rep.r.clips.length) { beep(240, 0.07, "sine", 0.04); return; }
  repGo(i);
  rep.playing = true;
  beep(560, 0.05, "sine", 0.035);
}

// Whose race the camera is on. The moment's own cars first, then the leader of
// the reel and your own car, skipping any that are the same entry twice.
function repFollowList() {
  const c = rep.clip, ids = [c.subject];
  if (c.other >= 0) ids.push(c.other);
  if (rep.r.cars[0]) ids.push(rep.r.cars[0].id);
  if (rep.r.you >= 0) ids.push(rep.r.you);
  const ks = [];
  for (const id of ids) {
    const k = rep.r.cars.findIndex(m => m.id === id);
    if (k >= 0 && !ks.includes(k)) ks.push(k);
  }
  return ks.length ? ks : [0];
}

function repCycleFollow() {
  const ks = repFollowList();
  const at = ks.indexOf(rep.follow);
  rep.follow = ks[(at + 1) % ks.length];
  rep.hint = 1.6;
  beep(620, 0.05, "sine", 0.035);
}

const REP_SPEEDS = [0.35, 0.6, 1, 1.6];
function repCycleSpeed() {
  const i = REP_SPEEDS.indexOf(rep.speed);
  rep.speed = REP_SPEEDS[(i + 1) % REP_SPEEDS.length];
  beep(500, 0.05, "sine", 0.035);
}

// What a moment says on the screen. Two cars named the way a commentator would
// name them — the one coming through first.
function repCaption(clip) {
  const r = rep.r;
  const nameOf = id => { const m = r.cars.find(c => c.id === id); return m ? m.name : "—"; };
  const colOf  = id => { const m = r.cars.find(c => c.id === id); return m ? m.colour : "#e9f0f8"; };
  const base = MOMENTS[clip.kind] || MOMENTS.pass;
  if (clip.kind === "pass" || clip.kind === "lead") {
    return { icon: base.icon, name: base.name,
             a: nameOf(clip.subject), ac: colOf(clip.subject),
             b: clip.other >= 0 ? nameOf(clip.other) : "", bc: colOf(clip.other) };
  }
  return { icon: base.icon, name: base.name, a: nameOf(clip.subject), ac: colOf(clip.subject), b: "", bc: "" };
}

/* The chrome, painted into the two HUD bands — the same bands the timing board
   and the minimap live in during a race, so the road is never drawn over. */
function repHud() {
  const r = rep.r, clip = rep.clip, cap = repCaption(clip);
  const cx = CONFIG.canvasW / 2;
  ctx.save();
  ctx.textBaseline = "middle";

  // ---- top band: which race, which moment, and how far through the reel ----
  ctx.textAlign = "left";
  ctx.fillStyle = "#8fa0b8";
  ctx.font = `800 11px ${UI_FONT}`;
  ctx.fillText("HIGHLIGHTS", 18, 20);
  ctx.fillStyle = "#e9f0f8";
  ctx.font = `800 15px ${UI_FONT}`;
  ctx.fillText(`${r.flag} ${r.gp}`, 18, 40);
  ctx.fillStyle = "#8fa0b8";
  ctx.font = `700 11px ${UI_FONT}`;
  ctx.fillText(`${r.loc ? `${r.loc} · ` : ""}${r.laps} laps${r.round ? ` · round ${r.round}` : " · one-off"}${r.who ? ` · ${r.who}` : ""}`, 18, 57);

  // the moment itself, centred and coloured by whoever it is about
  ctx.textAlign = "center";
  ctx.font = `800 13px ${EMOJI_FONT}`;
  ctx.fillStyle = "#ffd23f";
  ctx.fillText(`${cap.icon} ${cap.name}`, cx, 20);
  ctx.font = `800 17px ${UI_FONT}`;
  if (cap.b) {
    const wa = ctx.measureText(cap.a).width, wb = ctx.measureText(cap.b).width;
    const wArrow = ctx.measureText("  ▸  ").width;
    const left = cx - (wa + wArrow + wb) / 2;
    ctx.textAlign = "left";
    ctx.fillStyle = cap.ac; ctx.fillText(cap.a, left, 41);
    ctx.fillStyle = "#8fa0b8"; ctx.fillText("  ▸  ", left + wa, 41);
    ctx.fillStyle = cap.bc; ctx.fillText(cap.b, left + wa + wArrow, 41);
    ctx.textAlign = "center";
  } else {
    ctx.fillStyle = cap.ac;
    ctx.fillText(cap.a, cx, 41);
  }
  ctx.fillStyle = "#8fa0b8";
  ctx.font = `700 11px ${UI_FONT}`;
  ctx.fillText(`LAP ${clip.lap} OF ${r.laps} · MOMENT ${rep.ci + 1} OF ${r.clips.length}`, cx, 57);

  // ---- top right: the reel as a row of pips, one per clip ----
  const pipR = 4.5, gap = 13;
  const total = r.clips.length;
  const px0 = CONFIG.canvasW - 18 - (total - 1) * gap;
  for (let i = 0; i < total; i++) {
    const on = i === rep.ci;
    ctx.beginPath();
    ctx.arc(px0 + i * gap, 30, on ? pipR + 1.5 : pipR - 1, 0, TAU);
    ctx.fillStyle = on ? "#ffd23f" : (MOMENTS[r.clips[i].kind] || MOMENTS.pass).pri >= PASS_YOURS
      ? "rgba(233,240,248,.55)" : "rgba(233,240,248,.22)";
    ctx.fill();
  }

  // ---- bottom band: the scrub bar for this clip, then the keys ----
  const by = CONFIG.canvasH - 74;
  const bw = 420, bx = cx - bw / 2;
  ctx.fillStyle = "rgba(255,255,255,.12)";
  ctx.beginPath(); ctx.roundRect(bx, by, bw, 5, 3); ctx.fill();
  const dur = repDur();
  ctx.fillStyle = "#ffd23f";
  ctx.beginPath(); ctx.roundRect(bx, by, bw * clamp(rep.t / dur, 0, 1), 5, 3); ctx.fill();
  // where inside the clip each thing actually happened
  for (const m of clip.marks || []) {
    const mx = bx + bw * clamp(m.at / dur, 0, 1);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.fillRect(mx - 1, by - 4, 2, 13);
  }

  ctx.textAlign = "center";
  ctx.font = `700 11px ${UI_FONT}`;
  ctx.fillStyle = "#8fa0b8";
  const followName = (rep.r.cars[rep.follow] || {}).name || "";
  /* Everything below this point is for somebody sitting at the keyboard, and
     the canvas below this point is what is being written into a video file.
     While a recording is running, none of it is drawn — see the note at the
     top of the recorder. */
  if (!repRec) {
    ctx.fillText(
      `SPACE ${rep.playing ? "pause" : "play"}  ·  ← → moment  ·  F camera (${followName})  ·  ` +
      `X speed (${rep.speed}×)  ·  R replay this one  ·  D download  ·  ESC out`, cx, by + 26);

    if (rep.hint > 0) {
      ctx.globalAlpha = clamp(rep.hint, 0, 1);
      ctx.fillStyle = "#ffd23f";
      ctx.font = `800 12px ${UI_FONT}`;
      ctx.fillText(`CAMERA ON ${followName.toUpperCase()}`, cx, by + 44);
      ctx.globalAlpha = 1;
    }

    if (rep.note && rep.noteT > 0) {
      ctx.globalAlpha = clamp(rep.noteT, 0, 1);
      ctx.fillStyle = "#ffd23f";
      ctx.font = `800 12px ${UI_FONT}`;
      ctx.fillText(rep.note, cx, by + 44);
      ctx.globalAlpha = 1;
    } else if (!rep.playing && rep.t >= dur - 0.01 && rep.ci === r.clips.length - 1) {
      ctx.fillStyle = "#ffd23f";
      ctx.font = `800 13px ${UI_FONT}`;
      ctx.fillText("END OF THE REEL — R to watch it again, D to download it, ESC to come out", cx, by + 44);
    }
  }
  ctx.restore();
}

/* Draw the replay through the race renderer. state is REPLAY throughout, which
   every branch inside draw() is written to ignore — the one exception is the
   minimap, which is wanted and says so. */
function drawReplay() {
  const rt = raceTime;
  raceTime = rep.t;         // the only thing drawCar reads off the clock
  draw();
  raceTime = rt;
  repHud();
}

const ON_TRACK = new Set([State.RACING, State.COUNT, State.COOLDOWN,
                          State.QUALI, State.FORMATION]);

function go(s) {
  const prev = state;
  state = s;
  // A new round is a new weekend: last weekend's qualifying result must not be
  // left standing as this one's grid.
  if (s === State.GRID) qual = null;
  /* A replay is neither a session nor a screen: the canvas is showing the road
     so the overlay has to be out of the way, but the timing board belongs to a
     race that is not running and would be reading a field that is not there.
     Everything the player sees during one is painted by repHud. */
  if (s === State.REPLAY) {
    overlay.classList.add("hidden");
    hud.classList.remove("on");
    shutUp();
    stopEngine();
    return;
  }
  if (ON_TRACK.has(s)) {
    overlay.classList.add("hidden");
    // on during the countdown too, or the bands sit empty behind the lights
    hud.classList.add("on");
    if ((s === State.RACING && prev === State.PAUSED) ||
        s === State.QUALI || s === State.FORMATION) { if (!engine) startEngine(); }
  } else {
    overlay.classList.remove("hidden");
    // Leaving the track cuts the radio mid-sentence, pause included — a message
    // that carried on talking over a paused game would be reading the past.
    shutUp();
    if (s !== State.PAUSED) hud.classList.remove("on");
    if (s !== State.PAUSED) stopEngine();
    else if (engine && actx) engine.g.gain.setTargetAtTime(0, actx.currentTime, 0.05);
  }
  drawScreen();
}

function driverRow(id, cells, isMe) {
  return `<tr class="${isMe ? "me" : ""}">${cells.map(c => `<td class="${c.n ? "num" : ""}">${c.v}</td>`).join("")}</tr>`;
}

/* Places gained or lost, as one cell. The arrow carries the sign so the number
   beside it is always a magnitude — "▼3" is unambiguous in a way that "-3"
   next to a column of positions is not. A car that finished where it started
   gets a dash rather than a zero, because holding position is a result and
   nought is not a number anybody wants to read eleven times. */
function moveCell(d) {
  if (!d) return `<span class="mv lvl">—</span>`;
  return `<span class="mv ${d > 0 ? "up" : "dn"}">${d > 0 ? "▲" : "▼"}${Math.abs(d)}</span>`;
}

// A driver's name with their team under it — cheaper on width than a whole
// extra column, and the team is the thing you now want to read at a glance.
/* What the stewards did to this car, in the fewest words that still explain the
   result. Returns "" for the overwhelming majority of cars, which is the point:
   a table where every row carries a penalty note is a table where the sideTol
   figure is wrong. */
function penaltyNote(car) {
  if (!car) return "";
  // Read off the seconds owed rather than off the log, so the note can never
  // disagree with the classification the seconds produced — the log is the
  // detail, the total is the fact.
  const log = car.penaltyLog || [];
  if (!log.length && !(car.timePenalty > 0)) return "";
  const sg = log.filter(p => p.kind === "stopgo").length;
  const unserved = log.some(p => p.kind === "unserved");
  const bits = [];
  if (sg) bits.push(sg > 1 ? `${sg}× stop-go` : "stop-go");
  if (car.timePenalty > 0) bits.push(`+${car.timePenalty}s${unserved ? " (not served)" : ""}`);
  // Why is worth one word when the why is a blue flag: a driver who lost two
  // places for holding up the leader has learned something a bare "+5s" does
  // not teach him.
  if (log.some(p => p.blue)) bits.push("🔵 blue flags");
  return bits.length ? `⚖️ ${bits.join(" · ")}` : "";
}

function nameCell(id, car) {
  /* In a classification the reason a car stopped is more use than its team —
     and so is the reason a car finished two places lower than it ran, which is
     the one thing on the table the road order cannot explain by itself. A
     retirement still wins the line: it is the bigger fact, and a black-flagged
     car says so in `outFail.label` anyway. */
  const pen = car && !car.out ? penaltyNote(car) : "";
  const sub = car && car.out
    ? `<span class="tm dnf">🏳️ ${car.outFail.label}</span>`
    : pen
    ? `<span class="tm pen">${pen}</span>`
    : `<span class="tm" style="color:${TEAMS[DRIVERS[id].team].colour}">${TEAMS[DRIVERS[id].team].name}</span>`;
  return `${DRIVERS[id].name}${sub}`;
}

function standingsTable() {
  const order = championshipOrder();
  const rows = order.map((id, i) => driverRow(id, [
    { v: i + 1, n: true },
    { v: glyph(id, 22) },
    { v: nameCell(id) },
    { v: driverPoints(id) + (lastPoints[id] ? ` <span class="gain">+${lastPoints[id]}</span>` : ""), n: true },
  ], id === 0)).join("");
  return `<table><thead><tr><th></th><th></th><th>Driver</th><th style="text-align:right">Pts</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function constructorsTable() {
  const order = constructorOrder();
  const rows = order.map((ti, i) => {
    const t = TEAMS[ti];
    const gain = teamGain(ti);
    const won  = lastPrize[ti] || 0;
    return driverRow(ti, [
      { v: i + 1, n: true },
      { v: `<span style="white-space:nowrap">${t.drivers.map(di => glyph(di, 20)).join("")}</span>` },
      { v: `${t.badge} ${t.name}<span class="tm">${t.drivers.map(di => DRIVERS[di].name).join(" · ")}</span>` },
      { v: teamPoints(ti) + (gain ? ` <span class="gain">+${gain}</span>` : ""), n: true },
      // The bank sits beside the points because the two are the same story
      // told twice: podiums pay, and what they pay for is next year's car.
      { v: `<span class="cash">${money(bank(ti))}</span>` +
           (won ? ` <span class="gain">+${money(won)}</span>` : ""), n: true },
    ], ti === myTeam());
  }).join("");
  return `<table><thead><tr><th></th><th></th><th>Team</th><th style="text-align:right">Pts</th>
          <th style="text-align:right">Bank</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* --- Reading a development stat back out ----------------------------------
   One formatter for every multiplier, so a gain is shown the same way on every
   screen. `invert` is for the stats where a smaller number is the improvement.
   -------------------------------------------------------------------------*/
function pctCell(v, invert) {
  const d = (invert ? 1 / (v || 1) : (v || 1)) - 1;
  if (Math.abs(d) < 0.0005) return `<span class="flat">—</span>`;
  return `<span class="${d > 0 ? "up" : "dn"}">${d > 0 ? "+" : "−"}${(Math.abs(d) * 100).toFixed(1)}%</span>`;
}
// Pit development is seconds off a stop, so it reads as time, not percent.
function pitCell(p) {
  if (Math.abs(p) < 0.005) return `<span class="flat">—</span>`;
  return `<span class="${p > 0 ? "up" : "dn"}">${p > 0 ? "−" : "+"}${Math.abs(p).toFixed(2)}s</span>`;
}
function stopTime(ti) { return Math.max(1.1, CONFIG.pitStopBase - dev(ti).pit).toFixed(2); }

// Where a team's money has actually got it, for the project cards.
function devStatLine(ti, p) {
  const D = dev(ti);
  switch (p.stat) {
    case "tyres":  return `tyre wear ${pctCell(D.tyres, true)}`;
    case "pit":    return `stops ${pitCell(D.pit)} · around ${stopTime(ti)}s`;
    case "driver": return `team-mate ${pctCell(D.driverSkill)}`;
    default:       return `${p.effect} ${pctCell(D[p.stat])}`;
  }
}

/* The arms race in one table: what every team has managed to build, and what
   it has left to build with. Shown to the player in full rather than hidden,
   because a development race you cannot see is just the difficulty changing
   for no stated reason. */
function devTable() {
  const rows = constructorOrder().map(ti => {
    const D = dev(ti), t = TEAMS[ti];
    const cells = [
      pctCell(D.aero), pctCell(D.power), pctCell(D.brakes), pctCell(D.tyres, true),
      pctCell(D.boost), pctCell(D.reliability), pitCell(D.pit), pctCell(D.driverSkill),
    ].map(c => `<td class="d">${c}</td>`).join("");
    return `<tr class="${ti === myTeam() ? "me" : ""}">
      <td style="white-space:nowrap">${t.badge} ${t.name}</td>${cells}
      <td class="d"><span class="cash">${money(bank(ti))}</span></td></tr>`;
  }).join("");
  // Ten columns is wider than a narrow window: let the table scroll inside its
  // own box rather than pushing the screen sideways.
  return `<div class="scrollx"><table class="devgrid"><thead><tr><th>Team</th>
      <th class="d">Aero</th><th class="d">Engine</th><th class="d">Brakes</th><th class="d">Tyres</th>
      <th class="d">Energy</th><th class="d">Reliab.</th><th class="d">Pit</th><th class="d">Drivers</th>
      <th class="d">Bank</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* =========================================================================
   THE ARMS RACE, DRAWN

   The table above is the exact numbers. These are the shape of them, which is
   a different question and the one you actually ask after a race: is my car
   still the one to have, and if it is not, what is the car that beat me
   better at? A column of percentages cannot answer that at a glance and a
   chart can.

   Both charts scale to the widest bar on the grid rather than to the clamps,
   so the spread is always visible — but never below a floor, or a grid where
   nobody has developed anything would draw a dramatic-looking chart out of
   three hundredths of a percent.
   ========================================================================= */

// A diverging bar, centred on where the car started the season. `f` is the
// signed fill, −1..1, of the half-width available to it.
function divBar(f, colour) {
  const w = Math.min(1, Math.abs(f)) * 50;
  if (w < 0.35) return `<div class="tk"></div>`;   // nothing built: the rule alone
  const side = f > 0 ? `left:50%` : `left:${50 - w}%`;
  return `<div class="tk"><i style="${side};width:${w}%;background:${colour}"></i></div>`;
}

// How a stat reads as text, in the units it is actually measured in.
function devStatText(ti, s) {
  const D = dev(ti);
  return s.secs ? pitCell(D.pit) : pctCell(D[s.key], s.invert);
}

/* Chart one — every car against every other, development by development.
   One row per team, one small track per stat, ordered by the constructors'
   championship so the row order matches the table above it. */
function devMatrix() {
  // Scale each COLUMN to its own widest bar. A stat nobody has touched should
  // not make its neighbour's genuine gain look small.
  const peak = DEV_STATS.map(s =>
    Math.max(0.12, ...TEAMS.map((t, ti) => Math.abs(devShare(ti, s)))));
  const rows = constructorOrder().map(ti => {
    const t = TEAMS[ti];
    const cells = DEV_STATS.map((s, si) => {
      const share = devShare(ti, s);
      // Team names are the player's to type, so a quote in one would otherwise
      // close the attribute it is sitting in.
      return `<td class="s" title="${t.name.replace(/"/g, "&quot;")} · ${s.label}: ${
        stripTags(devStatText(ti, s))} ${s.effect}">${
        divBar(share / peak[si], share >= 0 ? t.colour : "var(--danger)")}</td>`;
    }).join("");
    return `<tr class="${ti === myTeam() ? "me" : ""}"><td class="t">${t.badge} ${t.name}</td>${cells}</tr>`;
  }).join("");
  const heads = DEV_STATS.map(s =>
    `<th class="s"><em>${s.icon}</em>${s.label}</th>`).join("");
  return `<div class="scrollx dmx"><table><thead><tr><th></th>${heads}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* Chart two — the same eight numbers folded into one, ranked. This is the
   only place in the game that says outright which car is the best car. */
function devOverall() {
  const idx = TEAMS.map((t, ti) => ({ ti, v: devIndex(ti) }));
  const peak = Math.max(4, ...idx.map(o => Math.abs(o.v)));
  const rows = idx.slice().sort((a, b) => b.v - a.v).map(o => {
    const t = TEAMS[o.ti], sign = o.v >= 0.05 ? "up" : o.v <= -0.05 ? "dn" : "";
    return `<div class="rw${o.ti === myTeam() ? " me" : ""}">
      <span class="tn">${t.badge} ${t.name}</span>
      ${divBar(o.v / peak, o.v >= 0 ? t.colour : "var(--danger)")}
      <span class="pv ${sign}">${o.v > 0 ? "+" : o.v < 0 ? "−" : ""}${Math.abs(o.v).toFixed(1)}</span></div>`;
  }).join("");
  return `<div class="chart"><div class="hd"><span></span>
      <span class="ax"><span>worse than it started</span><span>better</span></span>
      <span class="pv">Index</span></div>${rows}</div>`;
}

// Titles are plain text, so the percentage helpers' markup has to come off
// before it goes in one.
function stripTags(html) { return String(html).replace(/<[^>]*>/g, ""); }

/* Both charts and the sentence that says how to read them. Used on the result
   screen after every race and in the factory, which are the two places the
   question "where does my car stand" is actually being asked. */
function devCharts(heading) {
  const mine = devIndex(myTeam());
  const rank = TEAMS.map((t, ti) => devIndex(ti)).filter(v => v > mine).length + 1;
  return `
    <h2 style="margin-top:22px">${heading || "The arms race"}</h2>
    <p class="c" style="font-size:12px;margin-bottom:2px">Every bar is a change from the car
      the team started the season in — right of the line is better, left is a season that
      went backwards.</p>
    ${devMatrix()}
    <h2 style="margin-top:20px">Overall</h2>
    <p class="c" style="font-size:12px;margin-bottom:2px">All eight weighted by what they are
      worth on a Sunday, on a scale where 100 is every development a season can produce.
      ${playerSeated() ? `Your car is <b style="color:var(--ink)">${rank}${ordinalSuffix(rank)}
      of ${TEAMS.length}</b>.` : ""}</p>
    ${devOverall()}`;
}

function ordinalSuffix(n) {
  const t = n % 100;
  if (t >= 11 && t <= 13) return "th";
  return ["th", "st", "nd", "rd"][n % 10] || "th";
}

// The odds, stated up front on the screen where they are gambled with.
function oddsBlock() {
  return `<div class="odds">${OUTCOMES.map(o =>
    `<span>${o.icon} <b>${o.weight}%</b> ${o.label.toLowerCase()}</span>`).join("")}</div>`;
}

// The eight things a budget can be spent on, numbered so they can be funded
// from the keyboard. A project already funded stays selectable so it can be
// turned back off; one that no longer fits the remaining budget greys out.
function projectCards() {
  const left = devLeft();
  return `<div class="projects">${PROJECTS.map((p, i) => {
    const on = devPicks.has(p.key);
    const afford = on || p.cost <= left;
    return `<div class="pj${on ? " on" : ""}${afford ? "" : " no"}">
      <i class="n">${i + 1}</i>
      <b><span class="cost">${money(p.cost)}</span>${p.icon} ${p.name}</b>
      <span>${p.brief}</span>
      <span class="lv">Currently: ${devStatLine(myTeam(), p)}</span>
    </div>`;
  }).join("")}</div>`;
}

// What every team got for its money, one panel each.
function devLogPanels(win) {
  return `<div class="devlog">${constructorOrder().map(ti => {
    const t = TEAMS[ti], mine = ti === myTeam();
    const es = win.entries.filter(e => e.team === ti);
    const net = es.reduce((s, e) => s + e.spent - e.back, 0);
    const lines = es.length ? es.map(e => {
      const p = PROJECTS.find(x => x.key === e.project);
      const o = OUTCOMES.find(x => x.key === e.outcome);
      return `<div class="ln"><span>${o.icon}</span><span><em>${p.name}</em> —
        <span class="${o.cls}">${o.label}</span>: ${e.note}${e.back
          ? ` <span class="warn">(${money(e.back)} recovered)</span>` : ""}</span></div>`;
    }).join("") : `<div class="none">Nothing funded — the money stays in the bank.</div>`;
    return `<div class="tl${mine ? " mine" : ""}" style="border-left-color:${t.colour}">
      <b>${t.badge} ${t.name}${mine ? ' <span style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)">you</span>' : ""}
         <span class="spend">${net > 0 ? `spent ${money(net)} · ` : ""}${money(bank(ti))} left</span></b>
      ${lines}</div>`;
  }).join("")}</div>`;
}

// Pre-season line-up, for the menu — mostly so a new player finds out who is
// scoring points alongside them before the first race rather than after it.
/* The grid, shown as it will actually be raced.

   Before a career starts, seat zero — YOU — is still parked in the factory's
   front-running team, so this panel listed YOU alongside that team's driver
   and badged it as yours. Pressing SPACE then dropped you at the back of the
   grid with a different team-mate, which is not a detail a title screen is
   allowed to get wrong.

   seatTheRookie SWAPS the two cars, so previewing it is a swap of two names.
   Only the names move: `glyph` is drawn from the seat's own driver, whose
   colour is the team's, so leaving the glyphs where they are keeps every card
   in its own livery — which is exactly what the swap does to them anyway. */
function teamRoster() {
  const pv = startingSeatPreview();
  const preview = pv && !pv.started ? pv : null;
  const shown = di => !preview ? di : di === 0 ? preview.seat : di === preview.seat ? 0 : di;
  return `<div class="teams">${TEAMS.map((t, ti) => `
    <div class="tc" style="border-left-color:${t.colour}">
      <b>${t.badge} ${t.name}${
        pv && ti === pv.team ? ` <i class="yours">${pv.started ? "your team" : "you start here"}</i>` : ""}</b>
      ${t.drivers.map(di => `<span>${glyph(di, 20)}${DRIVERS[shown(di)].name}</span>`).join("")}
      <span class="fund"><b>${money(t.funding)}</b> · ${t.status}</span>
    </div>`).join("")}</div>`;
}

// The season at a glance. `upto` marks the round about to be raced, so the
// menu can show a saved season's progress without a second code path.
function calendarGrid(upto) {
  return `<div class="cal">${CIRCUITS.map((c, i) => `
    <div class="rd ${i < upto ? "done" : i === upto ? "now" : ""}">
      <i>${String(i + 1).padStart(2, "0")}</i>${c.flag} <b>${c.name}</b>
      <span class="dt">${c.date}</span>
    </div>`).join("")}</div>`;
}

// Attribution, read back out of the layouts themselves so it cannot drift from
// what actually shipped: each circuit's `traced` field names its source, and
// the MIT one is the only licence here that requires a notice to be carried.
// Retracing a round onto a different source updates this line by itself.
function creditsBlock() {
  const mit = CIRCUITS.filter(c => /^f1-circuits \(MIT\)/.test(c.traced));
  const free = CIRCUITS.length - mit.length;
  return `
    <p class="credits" style="margin-top:26px">
      <b>Run to the Podium — created, designed and written by Qais &amp; Hamdan Farooq.
      Copyright © 2026 Qais &amp; Hamdan Farooq. All rights reserved.</b>
      The code, design, teams, drivers, liveries and artwork are the authors' own work.
      The circuit centreline data credited below is used under its own licence and is not
      covered by that reservation.
    </p>
    <p class="credits">
      <b>Circuit layouts.</b> ${mit.length} of the ${CIRCUITS.length} rounds —
      ${mit.map(c => c.name).join(", ")} — are traced from centrelines in the
      f1-circuits dataset, <b>Copyright © 2019–2025 Tomislav Bacinger</b>, used under the
      <b>MIT License</b> · github.com/bacinger/f1-circuits.
      The other ${free} are traced from Wikimedia Commons diagrams released under CC0 or into
      the public domain. Every layout is redrawn as a racing line and is not the source artwork.
    </p>
    <p class="credits">
      <b>Everything else is invented.</b> All ${TEAMS.length} teams,
